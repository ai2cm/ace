# arg: --dataset 01M3ANP7EMVFZ7Q737B9XD2ZJ5:/weights
#
# Deterministic arm, stage 2: the paper model's 3-step DETACHED fine-tune
# recipe (configs/baselines/era5/ace-train-config-ft3-detached-daily-fg16-
# sr0p125-no-corr-mean.yaml on experiment/no-corr-mean-outputs at d90cd549)
# applied to the deterministic pretrain from ace2s-pretrain-deterministic.yaml
# (beaker 01M37WRTKTBPXBR6QFZ11SE0Z3, wandb btjpu9j2; result dataset mounted
# at /weights), with that arm's loss: MSE on a single member with the ACE2
# per-variable weight table instead of the EnsembleLoss on 2 members, and
# inline inference with 1 member per IC (members would be identical; the
# plain-SFNO architecture, noise_embed_dim 0, comes from the checkpoint).
# 10 epochs (the ablation fine-tune length; the paper model is the epoch-10 EMA
# checkpoint of its fine-tune); full and EMA checkpoints at epochs 5 and 10.
# Architecture, normalization and the corrector come from the donor checkpoint
# via stepper.checkpoint_path; parameter_init warm-starts from the same
# best_ckpt.tar (best validation loss), as every paper fine-tune does.
# Evaluation as the pretrains: 5-year inline inference every epoch and the
# 81-year rollout (8 ICs, weight 0) at epochs 5 and 10.
seed: 0
experiment_dir: /results
save_checkpoint: true
checkpoint_save_epochs:
  step: 5
ema_checkpoint_save_epochs:
  step: 5
validate_using_ema: true
max_epochs: 10
ema:
  decay: 0.999
inference:
  - name: inference
    n_forward_steps: 1825
    forward_steps_in_memory: 40
    n_ensemble_per_ic: 1
    loader:
      start_indices:
        times:
          - '1996-01-01T00:00:00'
          - '1996-02-15T00:00:00'
          - '1996-04-01T00:00:00'
          - '1996-05-15T00:00:00'
          - '1996-07-01T00:00:00'
          - '1996-08-15T00:00:00'
          - '1996-10-01T00:00:00'
          - '1996-11-15T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default/
          file_pattern: 2026-08-13-era5-1deg-8layer-daily-1940-2025.zarr
          engine: zarr
        - data_path: /climate-default/
          file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 5
          target: denorm
        - step: 5
          target: norm
      ensembles:
        - step: 5
      histogram:
        enabled: true
      time_mean_reference_data: /climate-default/2026-08-21-era5-1deg-8layer-daily-stats-1990-2019-merged/time-mean.nc
  - name: long_81year
    weight: 0.0
    epochs:
      start: 4
      step: 5
    n_forward_steps: 29565
    forward_steps_in_memory: 20
    loader:
      start_indices:
        times:
          - '1940-01-03T00:00:00'
          - '1940-01-04T00:00:00'
          - '1940-01-05T00:00:00'
          - '1940-01-06T00:00:00'
          - '1940-01-07T00:00:00'
          - '1940-01-08T00:00:00'
          - '1940-01-09T00:00:00'
          - '1940-01-10T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default/
          file_pattern: 2026-08-13-era5-1deg-8layer-daily-1940-2025.zarr
          engine: zarr
        - data_path: /climate-default/
          file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      step_means: []
      ensembles: []
      histogram:
        enabled: true
      time_mean_reference_data: /climate-default/2026-08-21-era5-1deg-8layer-daily-stats-1990-2019-merged/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  dataset:
    merge:
    - concat:
      - data_path: /climate-default/
        file_pattern: 2026-08-13-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          stop_time: '1995-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-08-13-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2011-01-01'
          stop_time: '2019-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-08-13-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2021-01-01'
    - concat:
      - data_path: /climate-default/
        file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          stop_time: '1995-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2011-01-01'
          stop_time: '2019-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2021-01-01'
validation:
  loader:
    batch_size: 64
    num_data_workers: 4
    prefetch_factor: 2
    dataset:
      merge:
      - data_path: /climate-default/
        file_pattern: 2026-08-13-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1996-01-01'
          stop_time: '1997-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1996-01-01'
          stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 3
  optimize_last_step_only: false
  parameter_init:
    weights_path: /weights/training_checkpoints/best_ckpt.tar
  loss:
    type: MSE
    weights:
      air_temperature_0: 0.5
      air_temperature_1: 0.5
      eastward_wind_0: 0.5
      northward_wind_0: 0.5
      specific_total_water_0: 0.5
      specific_total_water_1: 0.25
      specific_total_water_2: 0.5
      PRATEsfc: 0.5
      h500: 10
      TMP850: 5
      Q2m: 0.5
      DLWRFsfc: 2
      ULWRFsfc: 5
      USWRFsfc: 2
      DSWRFsfc: 2
      USWRFtoa: 2
      tendency_of_total_water_path_due_to_advection: 0.5
stepper:
  checkpoint_path: /weights/training_checkpoints/best_ckpt.tar
