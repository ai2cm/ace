# arg: --dataset andrep/2026-03-19-era5-4deg-8layer-stats-1990-2019:/statsdata
# arg: --dataset PRETRAIN_RESULT_DATASET:/weights
#
# 4-degree 6-hourly arm, stage 2: the paper model's 3-step DETACHED fine-tune
# recipe applied to the 4-degree 6-hourly pretrain from
# ace2s-pretrain-4deg-6hourly.yaml. Fill in PRETRAIN_RESULT_DATASET with the
# pretrain's result dataset id once it finishes. The horizon stays 3 STEPS
# (18 h at 6-hourly, matching the 1-degree 6h fine-tune); everything else is
# the recipe. Data, stats and the 54-output variable set are the 6-hourly
# pretrain's (the 2026-03-19 4-degree store; stats at /statsdata for the
# time-mean references). Seed 0 throughout.
# 10 epochs; full and EMA checkpoints at epochs 5 and 10. Architecture,
# normalization and the corrector come from the donor checkpoint via
# stepper.checkpoint_path; parameter_init warm-starts from the same
# best_ckpt.tar (best validation loss), as every paper fine-tune does.
# Evaluation as the 6-hourly pretrain: 5-year inline inference (7300 steps)
# every epoch and the 81-year rollout (118260 steps, 8 ICs, weight 0) at
# epochs 5 and 10.
seed: 0
experiment_dir: /results
save_checkpoint: true
checkpoint_save_epochs:
  step: 5
ema_checkpoint_save_epochs:
  step: 5
validate_using_ema: true
max_epochs: 10
ema:
  decay: 0.999
inference:
  - name: inference
    n_forward_steps: 7300
    forward_steps_in_memory: 73
    n_ensemble_per_ic: 3
    loader:
      start_indices:
        times:
          - '1996-01-01T00:00:00'
          - '1996-02-15T00:00:00'
          - '1996-04-01T00:00:00'
          - '1996-05-15T00:00:00'
          - '1996-07-01T00:00:00'
          - '1996-08-15T00:00:00'
          - '1996-10-01T00:00:00'
          - '1996-11-15T00:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-4deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 8
    aggregator:
      step_means:
        - step: 20
          target: denorm
        - step: 20
          target: norm
      ensembles:
        - step: 20
      histogram:
        enabled: true
      time_mean_reference_data: /statsdata/time-mean.nc
  - name: long_81year
    weight: 0.0
    epochs:
      start: 4
      step: 5
    n_forward_steps: 118260
    forward_steps_in_memory: 73
    loader:
      start_indices:
        times:
          - '1940-01-03T00:00:00'
          - '1940-01-04T00:00:00'
          - '1940-01-05T00:00:00'
          - '1940-01-06T00:00:00'
          - '1940-01-07T00:00:00'
          - '1940-01-08T00:00:00'
          - '1940-01-09T00:00:00'
          - '1940-01-10T00:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-4deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 8
    aggregator:
      step_means: []
      ensembles: []
      zonal_mean:
        enabled: false
      histogram:
        enabled: true
      time_mean_reference_data: /statsdata/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 4
  time_buffer: 8
  time_buffer_pool_size: 32
  dataset:
    concat:
    - data_path: /climate-default/
      file_pattern: 2026-03-19-era5-4deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        stop_time: '1995-12-31'
    - data_path: /climate-default/
      file_pattern: 2026-03-19-era5-4deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2011-01-01'
        stop_time: '2019-12-31'
    - data_path: /climate-default/
      file_pattern: 2026-03-19-era5-4deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2021-01-01'
validation:
  loader:
    batch_size: 32
    num_data_workers: 8
    prefetch_factor: 2
    time_buffer: 16
    dataset:
      data_path: /climate-default/
      file_pattern: 2026-03-19-era5-4deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1996-01-01'
        stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps: 3
  optimize_last_step_only: false
  parameter_init:
    weights_path: /weights/training_checkpoints/best_ckpt.tar
  loss:
    type: EnsembleLoss
    weights:
      h500: 5.0
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  checkpoint_path: /weights/training_checkpoints/best_ckpt.tar
