checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
loader:
  start_indices:
    first: 29219
    interval: 7
    n_initial_conditions: 48
  dataset:
    data_path: /climate-default/
    file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
