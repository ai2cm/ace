# 4-degree daily equivalent of ace-train-config-1-step-pretrain-daily-fg16-sr0p125.yaml.
# Same architecture, corrector, loss, and training recipe; only data paths
# and resolution-dependent settings differ. Three output variables absent
# from the 4-deg ERA5 dataset are dropped: PRMSL, eastward_surface_stress,
# northward_surface_stress.
#
# Inline evaluation differs from the 1-degree file in two ways, both on the
# evaluation side only (training and checkpoint selection are unchanged):
# - The 5-year `inference` entry logs its step-mean/ensemble metrics at step 5
#   (5 days at the daily timestep) instead of the schema default of step 20,
#   which is 5 days only at the 6-hourly timestep.
# - A `long_46year` entry (1979-2024, 8 ICs, weight 0) runs every 5 epochs
#   (epochs 5, 10, ..., 40) for the paper's resolution comparison.
seed: 0
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
max_epochs: 40
ema:
  decay: 0.999
inference:
  - name: inference
    n_forward_steps: 1825
    forward_steps_in_memory: 73
    loader:
      start_indices:
        times:
          - '1996-01-01T00:00:00'
          - '1996-02-15T00:00:00'
          - '1996-04-01T00:00:00'
          - '1996-05-15T00:00:00'
          - '1996-07-01T00:00:00'
          - '1996-08-15T00:00:00'
          - '1996-10-01T00:00:00'
          - '1996-11-15T00:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 5
          target: denorm
        - step: 5
          target: norm
      ensembles:
        - step: 5
      histogram:
        enabled: true
      time_mean_reference_data: /climate-default/2026-08-13-era5-4deg-8layer-daily-stats-1990-2019/2026-08-13-era5-4deg-8layer-daily-1940-2025/time-mean.nc
  - name: long_46year
    weight: 0.0
    epochs:
      start: 4
      step: 5
    n_forward_steps: 16794
    forward_steps_in_memory: 73
    loader:
      start_indices:
        times:
          - '1979-01-01T00:00:00'
          - '1979-01-02T00:00:00'
          - '1979-01-03T00:00:00'
          - '1979-01-04T00:00:00'
          - '1979-01-05T00:00:00'
          - '1979-01-06T00:00:00'
          - '1979-01-07T00:00:00'
          - '1979-01-08T00:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means: []
      ensembles: []
      histogram:
        enabled: true
      time_mean_reference_data: /climate-default/2026-08-13-era5-4deg-8layer-daily-stats-1990-2019/2026-08-13-era5-4deg-8layer-daily-1940-2025/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  dataset:
    concat:
    - data_path: /climate-default/
      file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        stop_time: '1995-12-31'
    - data_path: /climate-default/
      file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2011-01-01'
        stop_time: '2019-12-31'
    - data_path: /climate-default/
      file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2021-01-01'
validation:
  loader:
    batch_size: 64
    num_data_workers: 4
    prefetch_factor: 2
    dataset:
      data_path: /climate-default/
      file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1996-01-01'
        stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps: 1
  loss:
    type: EnsembleLoss
    weights:
      h500: 5.0
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
      normalization:
        network:
          global_means_path: /climate-default/2026-08-13-era5-4deg-8layer-daily-stats-1990-2019/2026-08-13-era5-4deg-8layer-daily-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-08-13-era5-4deg-8layer-daily-stats-1990-2019/2026-08-13-era5-4deg-8layer-daily-1940-2025/scaling-full-field.nc
        residual:
          global_means_path: /climate-default/2026-08-13-era5-4deg-8layer-daily-stats-1990-2019/2026-08-13-era5-4deg-8layer-daily-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-08-13-era5-4deg-8layer-daily-stats-1990-2019/2026-08-13-era5-4deg-8layer-daily-1940-2025/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        clip_frozen_precipitation: true
        total_energy_budget_correction:
          method: constant_temperature
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - total_frozen_precipitation_rate
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
      next_step_forcing_names:
      - DSWRFtoa
      - global_mean_co2
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      out_names:
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      - ULWRFsfc
      - ULWRFtoa
      - DLWRFsfc
