# arg: --dataset 01M1M516FYYPJ70752BBQJWG0S:/weights
#
# 4-degree daily equivalent of ace-train-config-ft3-bptt-daily-fg16-sr0p125.yaml
# (branch experiment/2026-08-10-cost-reduction-bptt-ft): the 3-step BPTT fine-tune
# stage of the paper recipe, applied to the 4-degree 1-step pretrain on the
# 2026-08-13 4-deg store (wandb wkl65ep3, ckpt dataset 01M1M516FYYPJ70752BBQJWG0S,
# trained from ace-train-config-1-step-pretrain-4deg-daily-fg16-sr0p125.yaml).
# Sibling of ace-train-config-ft3-bptt-4deg-daily-fg16-sr0p125.yaml, which
# fine-tunes the 2026-04-17-store pretrain (wandb 9bdu05j5) instead.
#
# Same fine-tune knobs as the 1-degree file: n_forward_steps 3, loss on all 3
# steps, BPTT (use_gradient_accumulation: false), 0.9/0.1 CRPS/ES EnsembleLoss,
# n_ensemble 2, 40 epochs, lr 1e-4, EMA 0.999. Architecture (incl.
# filter_num_groups 16 / spectral_ratio 0.125), normalization and the recipe
# come from the donor checkpoint via stepper.checkpoint_path, so they cannot
# drift from the donor. Data paths, forward_steps_in_memory 73 and
# num_data_workers 4 are the 4-deg pretrain's (the 4-deg stats are on weka, so
# there is no /statsdata mount).
#
# Inline evaluation matches the 4-degree pretrain rather than the 1-degree
# fine-tune, on the evaluation side only (training and checkpoint selection
# are unchanged): the 5-year `inference` entry logs its step-mean/ensemble
# metrics at step 5 (5 days at the daily timestep), and a weight-0
# `long_46year` entry (1979-2024, 8 ICs) runs at epochs 5, 10, ..., 40.
seed: 0
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
max_epochs: 40
ema:
  decay: 0.999
inference:
  - name: inference
    n_forward_steps: 1825
    forward_steps_in_memory: 73
    loader:
      start_indices:
        times:
          - '1996-01-01T00:00:00'
          - '1996-02-15T00:00:00'
          - '1996-04-01T00:00:00'
          - '1996-05-15T00:00:00'
          - '1996-07-01T00:00:00'
          - '1996-08-15T00:00:00'
          - '1996-10-01T00:00:00'
          - '1996-11-15T00:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 5
          target: denorm
        - step: 5
          target: norm
      ensembles:
        - step: 5
      histogram:
        enabled: true
      time_mean_reference_data: /climate-default/2026-08-13-era5-4deg-8layer-daily-stats-1990-2019/2026-08-13-era5-4deg-8layer-daily-1940-2025/time-mean.nc
  - name: long_46year
    weight: 0.0
    epochs:
      start: 4
      step: 5
    n_forward_steps: 16794
    forward_steps_in_memory: 73
    loader:
      start_indices:
        times:
          - '1979-01-01T00:00:00'
          - '1979-01-02T00:00:00'
          - '1979-01-03T00:00:00'
          - '1979-01-04T00:00:00'
          - '1979-01-05T00:00:00'
          - '1979-01-06T00:00:00'
          - '1979-01-07T00:00:00'
          - '1979-01-08T00:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means: []
      ensembles: []
      histogram:
        enabled: true
      time_mean_reference_data: /climate-default/2026-08-13-era5-4deg-8layer-daily-stats-1990-2019/2026-08-13-era5-4deg-8layer-daily-1940-2025/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  dataset:
    concat:
    - data_path: /climate-default/
      file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        stop_time: '1995-12-31'
    - data_path: /climate-default/
      file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2011-01-01'
        stop_time: '2019-12-31'
    - data_path: /climate-default/
      file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2021-01-01'
validation:
  loader:
    batch_size: 64
    num_data_workers: 4
    prefetch_factor: 2
    dataset:
      data_path: /climate-default/
      file_pattern: 2026-08-13-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1996-01-01'
        stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: false   # BPTT: keep the graph across the 3-step rollout
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps: 3
  optimize_last_step_only: false   # take the loss on all 3 steps
  parameter_init:
    weights_path: /weights/training_checkpoints/best_ckpt.tar
  loss:
    type: EnsembleLoss
    weights:
      h500: 5.0
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  checkpoint_path: /weights/training_checkpoints/best_ckpt.tar
