# arg: --dataset troya/2026-07-24-era5-1deg-8layer-daily-stats-1990-2019:/statsdata
# arg: --dataset 01KZTA4P87A6AGDQQNNDAXKD4V:/weights
#
# Cross-donor patch energy score fine-tune: the 0.9 patch-ES (3x3) / 0.1
# spectral-ES loss (no CRPS; reworked per Jeremy 2026-08-26 from the canceled
# 0.9 CRPS / 0.1 patch-ES cut) fine-tuning the CRPS-led 90/10 pretrain
# checkpoint (donor r95iprjt, best_ckpt.tar in dataset
# 01KZTA4P87A6AGDQQNNDAXKD4V -- the same donor as the c8hp09jm fine-tune).
# Identical to ace-train-config-ft3-bptt-daily-fg16-sr0p125.yaml except the
# loss kwargs. Gives a fast viability read on the patch ES before its own
# pretrain finishes. Sibling ...-pes100-from-es.yaml is the 100% patch-ES arm.
seed: 0
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
max_epochs: 40
ema:
  decay: 0.999
inference:
  - n_forward_steps: 1825
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          - '1996-01-01T00:00:00'
          - '1996-02-15T00:00:00'
          - '1996-04-01T00:00:00'
          - '1996-05-15T00:00:00'
          - '1996-07-01T00:00:00'
          - '1996-08-15T00:00:00'
          - '1996-10-01T00:00:00'
          - '1996-11-15T00:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
      num_data_workers: 8
    aggregator:
      histogram:
        enabled: true
      time_mean_reference_data: /statsdata/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 8
  prefetch_factor: 2
  dataset:
    concat:
    - data_path: /climate-default/
      file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        stop_time: '1995-12-31'
    - data_path: /climate-default/
      file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2011-01-01'
        stop_time: '2019-12-31'
    - data_path: /climate-default/
      file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2021-01-01'
validation:
  loader:
    batch_size: 64
    num_data_workers: 8
    prefetch_factor: 2
    dataset:
      data_path: /climate-default/
      file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1996-01-01'
        stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: false   # BPTT: keep the graph across the 3-step rollout
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps: 3
  optimize_last_step_only: false   # take the loss on all 3 steps
  parameter_init:
    weights_path: /weights/training_checkpoints/best_ckpt.tar
  loss:
    type: EnsembleLoss
    weights:
      h500: 5.0
    kwargs:
      crps_weight: 0.0
      energy_score_weight: 0.1
      patch_energy_score_weight: 0.9
      patch_energy_score_size: 3
stepper:
  checkpoint_path: /weights/training_checkpoints/best_ckpt.tar
