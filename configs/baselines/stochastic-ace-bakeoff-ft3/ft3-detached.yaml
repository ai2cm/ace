# arg: --dataset 01KZEEJN9Q34KZF280K91NZNZZ:/weights
#
# 3-step fine-tune of the daily bake-off residual ablation
# (wandb t91wu5rg, beaker 01KZEEJN9FDJWKJ7ZZHQBMSZP6 -- residual_prediction:
# false, no global_mean_removal). Architecture, normalization and the
# no-residual/no-GMR recipe are inherited from the donor checkpoint via
# stepper.checkpoint_path, so they cannot drift from the donor.
# Loss is taken on ALL 3 steps (optimize_last_step_only: false).
# ARM A -- detached. use_gradient_accumulation: true detaches the state
# between steps and calls backward() per step: all 3 steps are optimized,
# but no gradient flows across steps (no BPTT).
seed: 0
experiment_dir: /results
save_checkpoint: true
checkpoint_every_n_batches: 5000
validate_using_ema: true
ema_checkpoint_save_epochs:
  start: 5
  step: 5
max_epochs: 40
ema:
  decay: 0.999
inference:
  - name: 10year
    weight: 0.0
    epochs:
      start: 1
      step: 2
    n_forward_steps: 3652
    forward_steps_in_memory: 40
    n_ensemble_per_ic: 1
    loader:
      start_indices:
        times:
          - '2015-01-01T06:00:00'
          - '2015-01-02T06:00:00'
          - '2015-01-03T06:00:00'
          - '2015-01-04T06:00:00'
          - '2015-01-05T06:00:00'
          - '2015-01-06T06:00:00'
          - '2015-01-07T06:00:00'
          - '2015-01-08T06:00:00'
      dataset:
        data_path: /climate-default/2026-03-19-era5-1deg-8layer-daily-1940-2025.zarr
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 8
    aggregator:
      step_means:
        - step: 5
          target: denorm
          name: day_5
          variables: &inference_variables
            - PRATEsfc
            - TMP2m
            - Q2m
            - UGRD10m
            - VGRD10m
            - h500
            - TMP850
            - PRESsfc
            - surface_temperature
            - ULWRFsfc
            - DLWRFsfc
            - USWRFsfc
            - DSWRFsfc
            - ULWRFtoa
            - USWRFtoa
            - LHTFLsfc
            - SHTFLsfc
            - tendency_of_total_water_path_due_to_advection
            - air_temperature_0
            - air_temperature_1
            - air_temperature_3
            - air_temperature_7
            - specific_total_water_0
            - specific_total_water_1
            - specific_total_water_3
            - specific_total_water_7
            - eastward_wind_0
            - eastward_wind_1
            - eastward_wind_3
            - eastward_wind_7
            - northward_wind_0
            - northward_wind_1
            - northward_wind_3
            - northward_wind_7
            - total_water_path
        - step: 5
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles: []
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      histogram:
        enabled: true
