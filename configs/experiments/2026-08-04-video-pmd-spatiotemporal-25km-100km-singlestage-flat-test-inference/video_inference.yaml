# Test-set inference for global-25km-100km-spatiotemporal-singlestage-5ch-flat-v1
# (single-stage: joint spatial+temporal in one UNet call, no separate
# endpoint-super-resolution sub-model -- see
# ../2026-07-31-video-pmd-spatiotemporal-25km-100km-single-stage/video_train.yaml's
# header for the full baseline-formula rationale). Region 1 of 4 needed to
# tile the full modeled domain (lat -88..88, lon 0..360) -- same OOM
# constraint as the two-stage models (the video UNet's spatial attention at
# attention_levels [3,4] on the full 720x1440 fine grid does not fit no
# matter batch_size, see
# ../2026-07-24-video-pmd-spatiotemporal-25km-100km-test-inference/video_inference.yaml's
# header for the full accounting) -- going straight to the validated 4-region
# tiling this time instead of re-discovering the OOM with a single-region
# probe first. Region boundaries are IDENTICAL to the two-stage models' tiling
# (same fine/coarse coordinate arrays, same downscale_factor=4): this region
# is lat -44..44, lon 0..180 (fine lat/lon [-43.7533,43.7533]/[0.125,179.875],
# verified against the real coordinate arrays for the two-stage configs and
# unchanged here since the grid doesn't depend on the model).
#
# Checkpoint: /checkpoint/checkpoints/latest.ckpt, mounted from training
# experiment 01KYXJ16PFKK0BJEX78M9W9GGT's own result dataset
# (01KYXJ16PKMQJN965WWTSFAQ09) -- this run was never resumed into a separate
# experiment (unlike the two-stage models), it ran once and was interrupted
# (SIGINT, not a crash) on 2026-08-03 after ~2.5 days; latest.ckpt was last
# written 2026-08-03T11:46 (best.ckpt also present, both plausible choices --
# using latest per user request "use latest ckpt").
#
# n_ensemble/ensemble_chunk_size: same reasoning and values as the two-stage
# models' test-inference configs (4 / 1) -- for like-for-like comparison
# budget, even though single-stage is actually cheaper per-sample (no
# stage-A network at all).
#
# model:/test_data: pasted verbatim from
# ../2026-07-31-video-pmd-spatiotemporal-25km-100km-single-stage/video_train.yaml's
# own model:/test_data: blocks -- do not hand-edit them out of sync with that
# file. Note NO endpoint_super_resolution block (optional field, left unset).
checkpoint_path: /checkpoint/checkpoints/latest.ckpt
experiment_dir: /results
output_path: /climate-default/2026-06-25-temporal-diffusion/inference/global-25km-100km-spatiotemporal-singlestage-5ch-flat-v1/test-2023-2024-ens4-region-lat-44to44-lon0to180.zarr
n_ensemble: 4
ensemble_chunk_size: 1
use_ema: true
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: global-25km-100km-spatiotemporal-singlestage-5ch-flat-v1-test-inference
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -44
    stop: 44
  lon_extent:
    start: 0
    stop: 180
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  endpoints_observed: true
  temporal_noise_correlation: independent
  log_transform_channels:
    PRATEsfc: 86400.0
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
