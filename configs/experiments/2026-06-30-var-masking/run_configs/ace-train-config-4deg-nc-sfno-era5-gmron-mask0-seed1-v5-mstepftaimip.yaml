# arg: --dataset 01KZSAQJD15697SFFCTJ1SRSA0:/weights
# source pre-training run: ace2-var-mask-nc-sfno-era5-gmron-mask0-seed1-v5
# = that run's 1-step pre-training config, with only: n_forward_steps swapped for the
#   multi-step schedule, parameter_init added, max_epochs capped at 20, and
#   input_dropout_optimized_steps_only set (see generate_finetune_configs.py).
# fine-tuning starts from training_checkpoints/best_inference_ckpt.tar
seed: 1
experiment_dir: /results
save_checkpoint: true
checkpoint_every_n_batches: 5000
validate_using_ema: true
ema_checkpoint_save_epochs:
  start: 10
  step: 10
max_epochs: 20
ema:
  decay: 0.999
train_aggregator:
  ensemble_metrics: true
inference:
- name: aimip_checkpoint
  weight: 1.0
  epochs:
    start: 0
    step: 1
  n_forward_steps: 7300
  forward_steps_in_memory: 40
  n_ensemble_per_ic: 1
  loader:
    start_indices:
      times:
      - '2009-01-01T00:00:00'
      - '2009-02-15T00:00:00'
      - '2009-04-01T00:00:00'
      - '2009-05-15T00:00:00'
      - '2009-07-01T00:00:00'
      - '2009-08-15T00:00:00'
      - '2009-10-01T00:00:00'
      - '2009-11-15T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
    num_data_workers: 4
  aggregator:
    step_means:
    - step: 20
      target: denorm
      name: day_5
      variables: &id001
      - PRATEsfc
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - h500
      - TMP850
      - PRESsfc
      - surface_temperature
      - ULWRFsfc
      - DLWRFsfc
      - USWRFsfc
      - DSWRFsfc
      - ULWRFtoa
      - USWRFtoa
      - LHTFLsfc
      - SHTFLsfc
      - tendency_of_total_water_path_due_to_advection
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      - total_water_path
    - step: 20
      target: norm
      name: day_5_norm
      variables: *id001
    ensembles: []
    mean_denorm:
      enabled: true
      target: denorm
    mean_norm:
      enabled: true
      target: norm
    enso_index:
      enabled: false
    enso_coefficient:
      enabled: false
    histogram:
      enabled: true
- name: weather_2024
  weight: 0.0
  epochs:
    start: 0
    step: 10
  n_forward_steps: 20
  forward_steps_in_memory: 20
  n_ensemble_per_ic: 8
  loader:
    start_indices:
      times:
      - '2024-06-01T00:00:00'
      - '2024-06-02T00:00:00'
      - '2024-06-03T00:00:00'
      - '2024-06-04T00:00:00'
