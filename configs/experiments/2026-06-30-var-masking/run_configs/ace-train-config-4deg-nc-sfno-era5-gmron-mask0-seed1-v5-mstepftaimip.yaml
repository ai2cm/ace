    dataset:
      data_path: /climate-default
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
    num_data_workers: 4
  aggregator:
    step_means:
    - step: 20
      target: denorm
      name: day_5
      variables: *id001
    - step: 20
      target: norm
      name: day_5_norm
      variables: *id001
    ensembles:
    - step: 20
      name: day_5_ensemble
    mean_denorm:
      enabled: false
      target: denorm
    mean_norm:
      enabled: false
      target: norm
    power_spectrum:
      enabled: false
    zonal_mean:
      enabled: false
    time_mean_denorm:
