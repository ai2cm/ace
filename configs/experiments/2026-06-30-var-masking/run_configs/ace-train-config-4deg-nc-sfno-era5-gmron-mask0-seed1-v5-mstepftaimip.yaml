      - '1994-06-08T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
    num_data_workers: 4
  aggregator:
    step_means:
    - step: 20
      target: denorm
      name: day_5
      variables: *id001
    - step: 20
      target: norm
      name: day_5_norm
      variables: *id001
    ensembles:
    - step: 20
      name: day_5_ensemble
    mean_denorm:
      enabled: false
      target: denorm
    mean_norm:
      enabled: false
      target: norm
    power_spectrum:
      enabled: false
    zonal_mean:
      enabled: false
    time_mean_denorm:
      enabled: false
      target: denorm
    time_mean_norm:
      enabled: false
      target: norm
    annual:
      enabled: false
    enso_index:
      enabled: false
    enso_coefficient:
      enabled: false
    ipo_index:
      enabled: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: VarMasking8
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 4
  time_buffer: 8
  time_buffer_pool_size: 32
  dataset:
    strict: false
    concat:
    - data_path: /climate-default
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1979-01-01'
        stop_time: '1986-03-31'
    - data_path: /climate-default
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1986-04-01'
        stop_time: '1993-07-31'
    - data_path: /climate-default
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1993-08-01'
        stop_time: '1993-12-31'
    - data_path: /climate-default
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1994-01-01'
        stop_time: '1999-12-31'
    - data_path: /climate-default
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2000-01-01'
        stop_time: '2008-12-31'
validation:
  loader:
    batch_size: 32
    num_data_workers: 4
    prefetch_factor: 2
    time_buffer: 16
    dataset:
      strict: false
      concat:
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1994-01-01'
          stop_time: '1994-12-31'
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2014-01-01'
          stop_time: '2014-12-31'
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps:
    outcomes:
    - steps: 1
      probability: 0.6
    - steps: 2
      probability: 0.2
    - steps: 4
      probability: 0.1
    - steps: 12
      probability: 0.05
    - steps: 20
      probability: 0.05
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
  parameter_init:
    weights_path: /weights/training_checkpoints/best_inference_ckpt.tar
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          affine_norms: true
          normalize_big_skip: true
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          clip_latent_global_means: false
      normalization:
        network:
          global_means_path: /climate-default/2026-03-19-era5-1deg-8layer-stats-1990-2019/2026-03-19-era5-1deg-8layer-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-03-19-era5-1deg-8layer-stats-1990-2019/2026-03-19-era5-1deg-8layer-1940-2025/scaling-full-field.nc
        residual:
          global_means_path: /climate-default/2026-03-19-era5-1deg-8layer-stats-1990-2019/2026-03-19-era5-1deg-8layer-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-03-19-era5-1deg-8layer-stats-1990-2019/2026-03-19-era5-1deg-8layer-1940-2025/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
      next_step_forcing_names:
      - DSWRFtoa
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - PRESsfc
      - surface_temperature
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      out_names:
      - PRESsfc
