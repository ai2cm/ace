# Test-set inference for
# video-pmd-spatiotemporal-25km-100km-global-5ch-two-block-coarse-endpoints-flat
# (TWO-BLOCK mode: pinned coarse-temporal residual r, brownian_bridge
# kernel + unpinned fine-detail residual d, independent kernel -- see
# idea/spatiotemoral/twoblock_theory.md and
# ../2026-08-26-video-pmd-spatiotemporal-25km-100km-two-block/video_train.yaml),
# GLOBAL DOMAIN IN ONE JOB, via divide_generation -- same pattern as
# ../2026-08-11-video-pmd-spatiotemporal-25km-100km-singlestage-coarse-endpoints-flat-test-inference-global/,
# which this config directly mirrors (same LR-endpoints-in/HR-full-out
# setting: endpoints_observed=false, coarse_endpoints_only=true).
#
# divide_generation tiles the requested domain into coarse_patch_extent
# ([44, 72], matching this model's OWN training patch size -- see the
# train config's coarse_patch_extent_lat/lon) patches, generates each
# independently, and composites the fine-resolution results back together
# with coarse_horizontal_overlap=1 pixel of overlap averaged away at patch
# boundaries. video_composite.py's VideoPatchPredictor operates purely on
# the model's already-assembled fine-resolution output, so it is agnostic
# to the two_block internals (r/d split, Pi-projection, etc.).
#
# CHECKPOINT CAVEAT: training (experiment 01M100MWQ7FSFX9SECZCYEKC6N,
# "global-25km-100km-spatiotemporal-two-block-5ch-coarse-endpoints-flat")
# was manually stopped 2026-08-31 at epoch 58/200 (max_epochs=200) --
# NOT converged in the max_epochs sense, stopped early by request.
# checkpoints/latest.ckpt reflects the last checkpoint saved before that
# (~epoch 54); loss was still trending down with no sign of instability at
# stop time (see out.log in the checkpoint dataset).
#
# Checkpoint dataset: 01M100MWQDFSZHWAQW1ZTJZFJ4 (result of task
# 01M100MWQCAEBJ70S31376YC47 / job 01M100MWTT6E69FQXT9EWC7EMG)
#
# SMOKE VARIANT (2026-09-02): the full 4-GPU DDP global-domain run
# (video_inference.yaml) hung with an NCCL ALLREDUCE watchdog timeout
# (ranks 1-3 stuck waiting ~30min on collective seq 6; rank 0's own
# progress unclear from logs) after only ~1.5 min of visible progress --
# see run.sh's job history/notes. This variant isolates whether that's a
# DDP-rank desync (the exact failure class flagged in train.py's
# _get_batch_generator docstring, "silent NCCL ALLREDUCE watchdog timeout")
# vs. a plain single-process hang/slowness in the new divide_generation
# path: single GPU (run_smoke.sh uses N_GPUS=1, so no cross-rank
# collective can block), one batch, one ensemble member.
checkpoint_path: /checkpoint/checkpoints/latest.ckpt
experiment_dir: /results
output_path: /climate-default/2026-06-25-temporal-diffusion/inference/video-pmd-spatiotemporal-25km-100km-global-5ch-two-block-coarse-endpoints-flat/SMOKE-test-ens1-global.zarr
n_ensemble: 1
max_batches: 1
ensemble_chunk_size: 1
use_ema: true
overwrite: true
divide_generation: true
coarse_patch_extent: [44, 72]
coarse_horizontal_overlap: 1
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: video-pmd-spatiotemporal-25km-100km-global-5ch-two-block-coarse-endpoints-flat-test-inference-global-SMOKE
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 1
  num_data_workers: 2
  strict_ensemble: false
  # Full global domain -- no manual region split needed with divide_generation.
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Coarse (LR) is only available at the two endpoint frames -- masked to
  # zero at interior frames, with its own mask channel. Nothing is pinned
  # to fine truth at inference time (endpoints_observed=false): every
  # frame, including the two endpoints, is diffused -- the two-block
  # split governs how r (pinned to the real coarse input at endpoints,
  # zero there) and d (unpinned, present at every frame) are noised and
  # reassembled, not whether ground truth is ever given to the network.
  endpoints_observed: false
  coarse_endpoints_only: true
  two_block: true
  r_kernel: brownian_bridge
  d_kernel: independent
  # temporal_noise_correlation must stay at its "independent" default (not
  # set here) -- two_block uses r_kernel/d_kernel instead (validated in
  # __post_init__).
  # Same calibration as the training config (residual_calibration_diagnostic.py,
  # 2026-08-26) -- must match what the checkpoint was trained with.
  r_sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.3201
    northward_wind_at_ten_meters: 0.4415
    PRMSL: 0.1783
    PRATEsfc: 0.6825
    air_temperature_at_two_meters: 0.1229
  d_sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.1617
    northward_wind_at_ten_meters: 0.1892
    PRMSL: 0.0586
    PRATEsfc: 0.4254
    air_temperature_at_two_meters: 0.0529
  log_transform_channels:
    PRATEsfc: 86400.0
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
