# X8: X6 (coupled_randco2ft_x6) with objective_per_batch ocean 1 : joint 2 : uncoupled_atmosphere 1 (maintainer
# 2026-11-19; X6 has 1:1:2, D11). ocean/joint are per-coupled-batch draw weights; uncoupled_atmosphere sets the
# per-epoch replay share uncoupled_atmosphere / (sum of weights), so batches per epoch and T differ from X6's at
# the same max_epochs. max_epochs is raised to the whole epoch count with T closest to X6's T (D21 (b)), and
# the coupled helical `decay` LR schedules are rebuilt by U30 at X8's T (U57). No other change.
# X6: X4 (coupled_randco2ft_x4) with X5d's coupled helical `decay` LR schedules (coupled_randco2ft_x5d; D12,
# D15 (a)), as SequentialLR of LinearLR segments.
# X1c0: X1 (coupled_randco2ft_x1x2, atmosphere init tb6xf0ju) with the ocean corrector on from epoch 0
# (corrector_disabled_epochs: 0; X1 has 1).
# X1/X2: coupled fine-tuning from uncoupled inits, one joint stage, no FTO.
# Ocean init: jrgclj2f (row ocean_wandb_id). Atmosphere init: row atmos_wandb_id (X1 tb6xf0ju, X2 wgz8np8z).
# Base: no228urh's config (1deg hybrid-residual diagnosed-SST Samudra). Changes:
#   per-component optimization (ace#1631): coupled helical decay; repeat shapes x linear envelope to 0 at the last batch; piecewise linear
#   ACE's coupled-batch gradient comes from joint batches only (joint_pairs, ace#1632); it also trains on
#   random-CO2 sstblend replay batches (ace#1634)
#   replay share uncoupled_atmosphere / (sum of weights); inline piC only, shorter rollouts; inline random-CO2 1x/2x/4x atmosphere entries (ace#1633)
# Launch (maintainer's go only): job_runner/coupled_train.sh configs/experiments/cm4_1pct_46to125_piC_156to235 coupled_randco2ft_x8 --coupled_stats 01KXNT0RA6VX2YTZ8WJ936Q5RS
experiment_dir: /results
save_checkpoint: true
ema_checkpoint_save_epochs:
  step: 1
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 6
inference:
  - name: inference_piC
    weight: 1.0
    n_coupled_steps: 730
    coupled_steps_in_memory: 2
    loader:
      num_data_workers: 4
      start_indices:
        times:
          - '0151-01-06T00:00:00'
          - '0161-01-01T00:00:00'
          - '0171-01-01T00:00:00'
          - '0181-01-01T00:00:00'
          - '0191-01-01T00:00:00'
          - '0201-01-01T00:00:00'
          - '0211-01-01T00:00:00'
          - '0221-01-01T00:00:00'
      dataset:
        ocean:
          merge:
            - data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
              engine: zarr
            - data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
              engine: zarr
        atmosphere:
          merge:
            - data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
              engine: zarr
            - data_path: /climate-default
              file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
              engine: zarr
    aggregator:
      log_zonal_mean_images: false
      log_histograms: false
