# Single-IC 200-year piControl rollout at 1deg: the whole record, years 0151-0350.
#
# One IC at the store's first snapshot, run to the last snapshot of year 0350,
# so the rollout spans every split of the piControl record:
#   years 0151-0155  before the training window (inside the inline inference ICs)
#   years 0156-0235  training window
#   years 0236-0240  val_piC
#   years 0241-0350  holdout -- 110 years, never trained, validated or scored
#
# This is the drift test the 1pctCO2 rollouts cannot be: forcing is stationary,
# so error growth over the rollout is model drift rather than drift confounded
# with a rising-CO2 ramp, and the last 110 years are genuinely out of sample
# without lead time and forcing advancing together.
#
# It does spend the piControl holdout, deliberately and once: settling whether
# the surviving mean-fill recipe eventually loses surface salinity is what the
# holdout was being kept for, and the 1pctCO2 holdout (years 0131-0140) stays
# untouched.
#
# 14598 steps x 5 days = 0151-01-06 -> 0350-12-27 (73 steps/noleap year), the
# last snapshot of year 0350 and the last in the record: 14599 snapshots =
# 200*73 - 1, the same structure as the 1pctCO2 store (which starts 0001-01-06
# and ends 0140-12-27). Step 14599 would be 0351-01-01, past the record.
# `fme.ace.data_loading.inference` rejects a `subset` on an inference loader, so
# the step count is the only bound.
#
# The stepper -- including input_masking.fill_value and
# exclude_names_and_prefixes -- is restored from the checkpoint, so this one
# config serves every cell of the fill-value x masking-scope 2x2 and the Arm B
# ladder unchanged. Keep it identical between the arm directories that use it
# (ocean_precorr/ for the ocean_precorr_clip control seeds,
# ocean_precorr_clip_maskfill/ for the five masking arms).
#
# forward_steps_in_memory (40) comes from this protocol's own train-config
# inference blocks.
experiment_dir: /results
n_forward_steps: 14598
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0151-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  # Kept on: the per-segment read (pre-training / training / val / the 110-year
  # holdout) is done offline from these files and the annual series.
  save_monthly_files: true
aggregator:
  log_histograms: true
  # Both plot a matplotlib *date* axis, and this series starts in year 0151, so
  # the year-0001 autoscale crash (ace #1439, not an ancestor of this branch)
  # does not apply here. They stay off anyway to keep this config readable
  # against its 1pctCO2 twin, which cannot enable them; nothing here needs the
  # ENSO or IPO index.
  log_nino34_index: false
  log_ipo_index: false
