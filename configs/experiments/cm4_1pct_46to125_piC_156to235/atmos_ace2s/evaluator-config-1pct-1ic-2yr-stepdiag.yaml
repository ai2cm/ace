# Step-diagnostics companion to evaluator-config-1pct-8ic-20yr.yaml: same
# checkpoint, forcing and corrector, one initial condition and two years, with the
# per-step corrector deltas and a PRATEsfc prediction file written. The variable
# filter data_writer.names reaches both writers, so it admits the clip's delta
# variable total_frozen_precipitation_rate as well as PRATEsfc.
# The 8ic-20yr rows must not carry the writer flags, hence a separate config.
experiment_dir: /results
n_forward_steps: 2920
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
n_ensemble_per_ic: 1
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace2-cm4-atmos-noLSM
  entity: ai2cm
loader:
  start_indices:
    times:
      - '0041-01-01T00:00:00'
  dataset:
    merge:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-sea_ice.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
        engine: zarr
  num_data_workers: 4
aggregator:
  zonal_mean:
    enabled: false
  power_spectrum:
     enabled: false
  enso_coefficient:
    enabled: false
  step_diagnostics:
    correction_scalars: true
    correction_maps: true
data_writer:
  save_prediction_files: true
  save_monthly_files: false
  save_step_diagnostics: true
  names:
    - PRATEsfc
    - total_frozen_precipitation_rate
