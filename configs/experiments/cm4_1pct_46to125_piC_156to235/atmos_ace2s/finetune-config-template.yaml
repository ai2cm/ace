# job_runner/uncoupled_finetune.sh configs/experiments/cm4_1pct_46to125_piC_156to235/atmos_ace2s . \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
evaluate_before_training: true
max_epochs: 13 # 160 yr x 1460/yr / bs 8 = 29,200 iter/epoch -> ~379,600 iterations
ema:
  decay: 0.999
inference:
  - name: inference_1pct
    weight: 1.0
    n_forward_steps: 7300 # exactly 5 noleap years
    forward_steps_in_memory: 50
    loader:
      start_indices:
        times:
          # 4 ICs each in the validation 1pct_early and 1pct_late periods,
          # 5-year rollouts, never entering the 131-140 holdout
          - '0041-01-01T00:00:00'
          - '0042-01-01T00:00:00'
          - '0043-01-01T00:00:00'
          - '0044-01-01T00:00:00'
          - '0123-01-01T00:00:00'
          - '0124-01-01T00:00:00'
          - '0125-01-01T00:00:00'
          - '0126-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-sea_ice.zarr
            engine: zarr
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
            engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_forward_steps: 7300 # exactly 5 noleap years
    forward_steps_in_memory: 50
    loader:
      start_indices:
        times:
          # 8 ICs on either side of the training period, 5-year rollouts
          - '0151-01-06T00:00:00'
          - '0152-01-01T00:00:00'
          - '0153-01-01T00:00:00'
          - '0154-01-01T00:00:00'
          - '0236-01-01T00:00:00'
          - '0237-01-01T00:00:00'
          - '0238-01-01T00:00:00'
          - '0239-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-sea_ice.zarr
            engine: zarr
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
            engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace2-cm4-atmos-noLSM
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 4
  time_buffer: 10
  dataset:
    # 1pctCO2 years 0046-0125 concatenated with piControl years 0156-0235: 80
    # years each, 160 total. Neither window enters its run's validation years
    # (1pctCO2 0041-0045 and 0126-0130, piControl 0236-0240) or holdout (1pctCO2
    # 0131-0140, piControl 0241-0350). One concat list per store, both in the
    # same simulation order so the merged members share sample start times.
    merge:
      - concat:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0046-01-01T06:00:00'
              stop_time: '0126-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0156-01-01T06:00:00'
              stop_time: '0236-01-01T00:00:00'
      - concat:
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
            engine: zarr
            subset:
              start_time: '0046-01-01T06:00:00'
              stop_time: '0126-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
            engine: zarr
            subset:
              start_time: '0156-01-01T06:00:00'
              stop_time: '0236-01-01T00:00:00'
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 64
      num_data_workers: 4
      prefetch_factor: 4
      time_buffer: 10
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0041-01-01T06:00:00'
              stop_time: '0046-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
            engine: zarr
            subset:
              start_time: '0041-01-01T06:00:00'
              stop_time: '0046-01-01T00:00:00'
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 64
      num_data_workers: 4
      prefetch_factor: 4
      time_buffer: 10
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0126-01-01T06:00:00'
              stop_time: '0131-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
            engine: zarr
            subset:
              start_time: '0126-01-01T06:00:00'
              stop_time: '0131-01-01T00:00:00'
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 64
      num_data_workers: 4
      prefetch_factor: 4
      time_buffer: 10
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0236-01-01T06:00:00'
              stop_time: '0241-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
            engine: zarr
            subset:
              start_time: '0236-01-01T06:00:00'
              stop_time: '0241-01-01T00:00:00'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.00007
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    type: LinearLR
    step_each_iteration: true
    kwargs:
      start_factor: 0.01
      end_factor: 1.0
      total_iters: 29200  # ~1 epoch
stepper_training:
  parameter_init:
    weights_path: /ckpt.tar
  n_ensemble: 2
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
    weights:
      h500: 5.0
stepper:
  derived_forcings:
    insolation:
      insolation_name: DSWRFtoa
      solar_constant:
        value: 1360.782
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
