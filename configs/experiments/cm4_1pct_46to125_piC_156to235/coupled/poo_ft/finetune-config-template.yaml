# POO JOINT FINE-TUNE (FT after FTO): starts from the open-ocean-only coupled
# fine-tune (coupled_poo-owc_a2s-fto: wandb ook5crci, beaker
# 01M49PMA3W39S6D083SQX2SXY0, result dataset 01M49PMA47F833YBJNZM5960W8,
# best_inference_ckpt) and trains BOTH the ocean and the ACE2S atmosphere in
# coupled mode, following the FT after FTO recipe of ace-samudra-coupled-cm4
# frrl348q (lr 1e-5, 2000-iteration warmup, atmosphere CRPS 0.9 + energy score
# 0.1 with h500 x5 and one sampled step per batch). Differences from
# ../finetune-config-template.yaml:
#   - max_epochs 12 (12 x 1460 = 17,520 iterations, about frrl348q's 40 x 433);
#   - warmup 2000 iterations (frrl348q's; ~11% of training as there);
#   - atmosphere step sampling 20/40/60/80 -> 21/41/61/81, so each long sample
#     ends one step after an ocean update; 81 needs a 5th coupled step, so
#     n_coupled_steps 5 with the ocean loss still on its first 4 steps (the
#     rollout stops at the sampled horizon and unscored steps run without
#     gradients, so the 5th step costs only on the 1.25% of batches that draw 81).
# The ocean hand-off (prescribed_open_ocean) comes from the checkpoint's stepper.
#
# job_runner/coupled_finetune.sh configs/experiments/cm4_1pct_46to125_piC_156to235/coupled poo_ft \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats
# with WANDB_USERNAME=elynnwu. Titan only.
#
# The source template's header follows unchanged.
# job_runner/coupled_finetune.sh configs/experiments/cm4_1pct_46to125_piC_156to235/coupled . \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 12 # 160 yr x 73/yr (ocean step) / bs 8 = 1,460 iter/epoch -> ~17,520 iterations
inference:
  - name: inference_1pct
    weight: 1.0
    n_coupled_steps: 1460 # exactly 20 noleap years at the 5-day ocean step
    coupled_steps_in_memory: 2
    loader:
      num_data_workers: 4
      start_indices:
        times:
          # 8 ICs at 10-year spacing, 20-year rollouts tiling years 41-130
          # (validation + training), never entering the 131-140 holdout.
          # The first IC label '0041-01-01T00' is the boundary instant of the
          # 1-40 low-CO2 holdout: under issue 03's rule a boundary label
          # belongs to the split ending at it. It is read as a single
          # diagnostic start state and the rollout runs forward into year 41+,
          # so no holdout interval is rolled through; the uncoupled
          # ocean_baseline/atmos_baseline configs use the same IC list.
          - '0041-01-01T00:00:00'
          - '0051-01-01T00:00:00'
          - '0061-01-01T00:00:00'
          - '0071-01-01T00:00:00'
          - '0081-01-01T00:00:00'
          - '0091-01-01T00:00:00'
          - '0101-01-01T00:00:00'
          - '0111-01-01T00:00:00'
      dataset:
        ocean:
          merge:
            - &ocean_1pct_coupled
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
              engine: zarr
            - &ocean_1pct_base
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
              engine: zarr
        atmosphere:
          merge:
            - &atmos_1pct_coupled
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-atmosphere.zarr
              engine: zarr
            - &atmos_1pct_base
              data_path: /climate-default
              file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
              engine: zarr
    aggregator:
      log_zonal_mean_images: false
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_coupled_steps: 1460 # exactly 20 noleap years at the 5-day ocean step
    coupled_steps_in_memory: 2
    loader:
      num_data_workers: 4
      start_indices:
        times:
          # 8 ICs at 10-year spacing, 20-year rollouts tiling relative years
          # 1-90, never entering the relative-year-91+ holdout. The first IC
          # is nudged 5 days past the store start to the first valid coupled
          # timestep (leading all-NaN ffill window in the ocean-sourced
          # fields ends at the first 5-daily ocean snapshot).
          - '0151-01-06T00:00:00'
          - '0161-01-01T00:00:00'
          - '0171-01-01T00:00:00'
          - '0181-01-01T00:00:00'
          - '0191-01-01T00:00:00'
          - '0201-01-01T00:00:00'
          - '0211-01-01T00:00:00'
          - '0221-01-01T00:00:00'
      dataset:
        ocean:
          merge:
            - &ocean_piC_coupled
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
              engine: zarr
            - &ocean_piC_base
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
              engine: zarr
        atmosphere:
          merge:
            - &atmos_piC_coupled
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
              engine: zarr
            - &atmos_piC_base
              data_path: /climate-default
              file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
              engine: zarr
    aggregator:
      log_zonal_mean_images: false
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  dataset:
    # 1pctCO2 years 0046-0125 concatenated with piControl years 0156-0235: 80
    # years each, 160 total. Neither window enters its run's validation years
    # (1pctCO2 0041-0045 and 0126-0130, piControl 0236-0240) or holdout (1pctCO2
    # 0131-0140, piControl 0241-0350). The concat is at the coupled level
    # because a merge may only combine unconcatenated stores.
    #
    # Both realms start at the same instant: CoupledDataset pairs ocean sample
    # i with atmosphere sample i * 20 and rejects a first-time mismatch, so the
    # atmosphere window opens on the 5-day ocean grid rather than at the
    # split's first 6-hourly sample.
    concat:
      - ocean:
          merge:
            - <<: *ocean_1pct_coupled
              subset: &train_window_1pct
                start_time: '0046-01-06T00:00:00'
                stop_time: '0126-01-01T00:00:00'
            - <<: *ocean_1pct_base
              subset: *train_window_1pct
        atmosphere:
          merge:
            - <<: *atmos_1pct_coupled
              subset: *train_window_1pct
            - <<: *atmos_1pct_base
              subset: *train_window_1pct
      - ocean:
          merge:
            - <<: *ocean_piC_coupled
              subset: &train_window_piC
                start_time: '0156-01-06T00:00:00'
                stop_time: '0236-01-01T00:00:00'
            - <<: *ocean_piC_base
              subset: *train_window_piC
        atmosphere:
          merge:
            - <<: *atmos_piC_coupled
              subset: *train_window_piC
            - <<: *atmos_piC_base
              subset: *train_window_piC
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      <<: &validation_loader_settings
        batch_size: 8
        num_data_workers: 2
        prefetch_factor: 2
      dataset:
        ocean:
          merge:
            - <<: *ocean_1pct_coupled
              subset: &val_window_1pct_early
                start_time: '0041-01-06T00:00:00'
                stop_time: '0046-01-01T00:00:00'
            - <<: *ocean_1pct_base
              subset: *val_window_1pct_early
        atmosphere:
          merge:
            - <<: *atmos_1pct_coupled
              subset: *val_window_1pct_early
            - <<: *atmos_1pct_base
              subset: *val_window_1pct_early
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      <<: *validation_loader_settings
      dataset:
        ocean:
          merge:
            - <<: *ocean_1pct_coupled
              subset: &val_window_1pct_late
                start_time: '0126-01-06T00:00:00'
                stop_time: '0131-01-01T00:00:00'
            - <<: *ocean_1pct_base
              subset: *val_window_1pct_late
        atmosphere:
          merge:
            - <<: *atmos_1pct_coupled
              subset: *val_window_1pct_late
            - <<: *atmos_1pct_base
              subset: *val_window_1pct_late
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      <<: *validation_loader_settings
      dataset:
        ocean:
          merge:
            - <<: *ocean_piC_coupled
              subset: &val_window_piC
                start_time: '0236-01-06T00:00:00'
                stop_time: '0241-01-01T00:00:00'
            - <<: *ocean_piC_base
              subset: *val_window_piC
        atmosphere:
          merge:
            - <<: *atmos_piC_coupled
              subset: *val_window_piC
            - <<: *atmos_piC_base
              subset: *val_window_piC
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.00001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    type: LinearLR
    step_each_iteration: true
    kwargs:
      start_factor: 0.01
      end_factor: 1
      total_iters: 2000 # frrl348q's warmup; ~11% of the 17,520 iterations
stepper_training:
  n_coupled_steps: 5 # reaches atmosphere step 81; ocean loss stays on 4 steps
  parameter_init:
    checkpoint_path: /ckpt.tar
  # Required, not incidental: the ocean's stochasticity is supplied by the
  # atmosphere, so the ensemble must run through both realms.
  n_ensemble: 2
  optimize_single_component_per_batch: false
  ocean:
    parameter_init:
      weights_path: null # null required alongside checkpoint_path
    n_steps: 4
    optimize_last_step_only: false
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    parameter_init:
      weights_path: null # null required alongside checkpoint_path
    # Long samples end one atmosphere step after an ocean update (21/41/61/81),
    # so the scored step sees an SST the ocean just produced.
    n_steps:
      outcomes:
        - steps: 1
          probability: 0.6
        - steps: 2
          probability: 0.2
        - steps: 4
          probability: 0.1
        - steps: 12
          probability: 0.05
        - steps: 21
          probability: 0.0125
        - steps: 41
          probability: 0.0125
        - steps: 61
          probability: 0.0125
        - steps: 81
          probability: 0.0125
    optimize_last_step_only: true
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
stepper:
  # job_runner/create_coupled_finetune_config.sh merges this whole block with
  # the loaded checkpoint's winning on conflict, so sst_name and
  # ocean_fraction_prediction arrive from the ocean-only stage's checkpoint and
  # the values here are inert. They are kept so the template loads on its own.
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  sst_name: sst
  ocean:
    timedelta: 5D
    # stepper added by job_runner/create_coupled_finetune_config.sh
  atmosphere:
    timedelta: 6h
    # stepper added by job_runner/create_coupled_finetune_config.sh
