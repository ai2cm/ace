# job_runner/evaluate.sh configs/experiments/cm4_1pct_46to125_piC_156to235/coupled poo_ft
#
# The shared cm4_eval/coupled 1pct-ic0001-130yr config, plus global monthly-mean
# maps of the surface heat budget and sea ice (CM4's alongside), all writers in
# zarr format (default chunks: the monthly zarr writer requires one month per
# chunk) and no log file, so the whole run can be written to a gs://
# experiment_dir. experiment_dir and seed are set per row via the override field.
# Purpose: map the years ~98-115 heat-flux / sea-ice-loss episode of the
# unseeded joint-FT 1pct eval (wandb mbyl8pyn) if it recurs, and count how often.
experiment_dir: /results
n_coupled_steps: 9488
coupled_steps_in_memory: 16
checkpoint_path: /ckpt.tar
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: surface_monthly
        names: [hfds_total_area, ocean_sea_ice_fraction, sea_ice_volume, sst]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: surface_fluxes_monthly
        names: [DSWRFsfc, USWRFsfc, DLWRFsfc, ULWRFsfc, LHTFLsfc, SHTFLsfc, USWRFtoa]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: false
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0001-01-06T00:00:00'
