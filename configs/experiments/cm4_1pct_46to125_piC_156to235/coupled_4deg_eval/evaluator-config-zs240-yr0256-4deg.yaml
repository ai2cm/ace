# 4deg 240-IC coupled ENSO forecast verification (Troy's zs240, reports#176 Figure 6): piControl year 0256, 12 monthly ICs, 24 months.
# Verbatim from ace troya/2026-10-09-4deg-hybrid-ppad @ 18d5f8f1c configs/experiments/2026-10-09-4deg-hybrid-ppad/eval/zs240/yr0256-single.yaml;
# ensemble members are separate jobs with an experiments.txt seed= override.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 146
coupled_steps_in_memory: 1
loader:
  num_data_workers: 4
  dataset:
    ocean:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
        engine: zarr
    atmosphere:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-atmosphere.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
        engine: zarr
  start_indices:
    times:
    - '0256-01-06T00:00:00'
    - '0256-02-05T00:00:00'
    - '0256-03-02T00:00:00'
    - '0256-04-01T00:00:00'
    - '0256-05-01T00:00:00'
    - '0256-06-05T00:00:00'
    - '0256-07-05T00:00:00'
    - '0256-08-04T00:00:00'
    - '0256-09-03T00:00:00'
    - '0256-10-03T00:00:00'
    - '0256-11-02T00:00:00'
    - '0256-12-02T00:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
    - zos
    - thetao_0
    - thetao_1
    - thetao_2
    - thetao_3
    - thetao_4
    - thetao_6
    - thetao_8
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
