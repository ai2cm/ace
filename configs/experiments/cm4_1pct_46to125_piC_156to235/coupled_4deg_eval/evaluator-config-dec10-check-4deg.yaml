# Load-and-match check for the 10-year ensembles: the dec10 config with one start (0241-01-06) and 12 months.
# Run with Troy's deterministic hybrid checkpoint and seed=1, it should match his zs240 member s1-yr0241 to
# within run-to-run floating-point drift (~0.01 K at month 1), well below a seed change (~0.17 K).
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 73
coupled_steps_in_memory: 1
loader:
  num_data_workers: 4
  dataset:
    ocean:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
        engine: zarr
    atmosphere:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-atmosphere.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
        engine: zarr
  start_indices:
    times:
    - '0241-01-06T00:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
    - zos
    - thetao_0
    - thetao_1
    - thetao_2
    - thetao_3
    - thetao_4
    - thetao_6
    - thetao_8
    - ocean_sea_ice_fraction
    - sea_ice_volume
  atmosphere:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - TMP2m
    - PRATEsfc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
