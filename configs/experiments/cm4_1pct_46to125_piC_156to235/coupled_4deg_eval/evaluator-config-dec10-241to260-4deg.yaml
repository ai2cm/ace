# 4deg coupled 10-year ensemble spread (E3SM ask: does stochastic Samudra add decadal spread?).
# 20 January starts, piControl years 0241-0260, 10 years each (730 five-day coupled steps), run as one batch.
# Same data and protocol as the zs240 hindcast configs; adds monthly sea ice and atmosphere TMP2m / PRATEsfc.
# Ensemble members are separate jobs with experiments.txt seed= / ocean_seed= overrides.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 730
coupled_steps_in_memory: 1
loader:
  num_data_workers: 4
  dataset:
    ocean:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
        engine: zarr
    atmosphere:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-atmosphere.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
        engine: zarr
  start_indices:
    times:
    - '0241-01-06T00:00:00'
    - '0242-01-06T00:00:00'
    - '0243-01-06T00:00:00'
    - '0244-01-06T00:00:00'
    - '0245-01-06T00:00:00'
    - '0246-01-06T00:00:00'
    - '0247-01-06T00:00:00'
    - '0248-01-06T00:00:00'
    - '0249-01-06T00:00:00'
    - '0250-01-06T00:00:00'
    - '0251-01-06T00:00:00'
    - '0252-01-06T00:00:00'
    - '0253-01-06T00:00:00'
    - '0254-01-06T00:00:00'
    - '0255-01-06T00:00:00'
    - '0256-01-06T00:00:00'
    - '0257-01-06T00:00:00'
    - '0258-01-06T00:00:00'
    - '0259-01-06T00:00:00'
    - '0260-01-06T00:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
    - zos
    - thetao_0
    - thetao_1
    - thetao_2
    - thetao_3
    - thetao_4
    - thetao_6
    - thetao_8
    - ocean_sea_ice_fraction
    - sea_ice_volume
  atmosphere:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - TMP2m
    - PRATEsfc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
