# 4deg 240-IC coupled ENSO forecast verification (Troy's zs240, reports#176 Figure 6), chunk of piControl years 0251-0255:
# 60 ICs (12 monthly starts per year), 24 months each, run as one batch.
# Troy's ace troya/2026-10-09-4deg-hybrid-ppad @ 18d5f8f1c eval/zs240/yr<YYYY>-single.yaml, with the five years' start times merged;
# ensemble members are separate jobs with an experiments.txt seed= override.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 146
coupled_steps_in_memory: 1
loader:
  num_data_workers: 4
  dataset:
    ocean:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
        engine: zarr
    atmosphere:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-atmosphere.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
        engine: zarr
