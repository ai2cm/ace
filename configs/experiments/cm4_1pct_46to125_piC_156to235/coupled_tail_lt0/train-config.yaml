# COUPLED TAIL SCHEDULE ON A NOISE-CONDITIONED OCEAN (arm `lt0lt_a2s`).
#
# Fork of ../coupled_tail/train-config-template.yaml. Comment-stripped the two
# are IDENTICAL -- the whole arm is the ocean checkpoint mounted at
# /ocean_ckpt.tar, set by pretraining.txt's ocean_wandb_id. Here that is
# jshu3e8a, the stage-2 long-tail all_blocks rs0 stochastic Samudra that
# lt0_a2s used; there it is James's deterministic owc / owc8.
#
# So this arm is a one-variable fork TWICE OVER, which is the point:
#   vs lt0_a2s    (same ocean init, fixed 4)      -> the coupled unroll schedule
#   vs owc8lt_a2s (same schedule, deterministic)  -> the ocean init
# It is the missing cell of {noise-conditioned, deterministic} x {fixed 4, tail}.
#
# The ocean stepper -- FiLM all_blocks conditioning, noise_embed_dim 32,
# norm: layer -- is read out of jshu3e8a's own config.yaml by
# create_coupled_train_config.sh, so no override is needed to switch noise on
# (unlike mae2n_a2s, which had to force it onto a checkpoint that lacked it).
#
# LOSS: CRPS 0.9 + SPECTRAL energy score 0.1, unchanged from coupled_tail and
# from every other coupled arm. Deliberately NOT the 3x3 patch energy score the
# ocean was pretrained against. Changing the loss and the schedule together
# would make either outcome uninterpretable, and the pretrain/coupled loss
# mismatch is tested separately and cleanly by the spectral-ES uncoupled
# lineage (../ocean_wide_stochastic_es on exp/stochastic-samudra-es), which is
# pretrained and coupled against the same score.
#
# job_runner/coupled_train.sh configs/experiments/cm4_1pct_46to125_piC_156to235/coupled_tail_lt0 . \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats
#
# ../coupled/train-config-template.yaml with ONE block changed: stepper_training
# carries the long-tail rollout schedule instead of a fixed 4 coupled steps.
# Everything above it -- inference, train/validation windows, optimization, the
# stepper block -- is byte-identical to that template, so the arms in this
# directory stay forks of crps4/crps8.
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 8 # 160 yr x 73/yr (ocean step) / bs 8 = 1,460 iter/epoch -> ~11,680 iterations
inference:
  - name: inference_1pct
    weight: 1.0
    n_coupled_steps: 1460 # exactly 20 noleap years at the 5-day ocean step
    coupled_steps_in_memory: 2
    loader:
      num_data_workers: 4
      start_indices:
        times:
          # 8 ICs at 10-year spacing, 20-year rollouts tiling years 41-130
          # (validation + training), never entering the 131-140 holdout.
          # The first IC label '0041-01-01T00' is the boundary instant of the
          # 1-40 low-CO2 holdout: under issue 03's rule a boundary label
          # belongs to the split ending at it. It is read as a single
          # diagnostic start state and the rollout runs forward into year 41+,
          # so no holdout interval is rolled through; the uncoupled
          # ocean_baseline/atmos_baseline configs use the same IC list.
          - '0041-01-01T00:00:00'
          - '0051-01-01T00:00:00'
          - '0061-01-01T00:00:00'
          - '0071-01-01T00:00:00'
          - '0081-01-01T00:00:00'
          - '0091-01-01T00:00:00'
          - '0101-01-01T00:00:00'
          - '0111-01-01T00:00:00'
      dataset:
        ocean:
          merge:
            - &ocean_1pct_coupled
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
              engine: zarr
            - &ocean_1pct_base
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
              engine: zarr
        atmosphere:
          merge:
            - &atmos_1pct_coupled
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-atmosphere.zarr
              engine: zarr
            - &atmos_1pct_base
              data_path: /climate-default
              file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
              engine: zarr
    aggregator:
      log_zonal_mean_images: false
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_coupled_steps: 1460 # exactly 20 noleap years at the 5-day ocean step
    coupled_steps_in_memory: 2
    loader:
      num_data_workers: 4
      start_indices:
        times:
          # 8 ICs at 10-year spacing, 20-year rollouts tiling relative years
          # 1-90, never entering the relative-year-91+ holdout. The first IC
          # is nudged 5 days past the store start to the first valid coupled
          # timestep (leading all-NaN ffill window in the ocean-sourced
          # fields ends at the first 5-daily ocean snapshot).
          - '0151-01-06T00:00:00'
          - '0161-01-01T00:00:00'
          - '0171-01-01T00:00:00'
          - '0181-01-01T00:00:00'
          - '0191-01-01T00:00:00'
          - '0201-01-01T00:00:00'
          - '0211-01-01T00:00:00'
          - '0221-01-01T00:00:00'
      dataset:
        ocean:
          merge:
            - &ocean_piC_coupled
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
              engine: zarr
            - &ocean_piC_base
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
              engine: zarr
        atmosphere:
          merge:
            - &atmos_piC_coupled
              data_path: /climate-default
              file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
              engine: zarr
            - &atmos_piC_base
              data_path: /climate-default
              file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
              engine: zarr
    aggregator:
      log_zonal_mean_images: false
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  dataset:
    # 1pctCO2 years 0046-0125 concatenated with piControl years 0156-0235: 80
    # years each, 160 total. Neither window enters its run's validation years
    # (1pctCO2 0041-0045 and 0126-0130, piControl 0236-0240) or holdout (1pctCO2
    # 0131-0140, piControl 0241-0350). The concat is at the coupled level
    # because a merge may only combine unconcatenated stores.
    #
    # Both realms start at the same instant: CoupledDataset pairs ocean sample
    # i with atmosphere sample i * 20 and rejects a first-time mismatch, so the
    # atmosphere window opens on the 5-day ocean grid rather than at the
    # split's first 6-hourly sample.
    concat:
      - ocean:
          merge:
            - !!merge <<: *ocean_1pct_coupled
              subset: &train_window_1pct
                start_time: '0046-01-06T00:00:00'
                stop_time: '0126-01-01T00:00:00'
            - !!merge <<: *ocean_1pct_base
              subset: *train_window_1pct
        atmosphere:
          merge:
            - !!merge <<: *atmos_1pct_coupled
              subset: *train_window_1pct
            - !!merge <<: *atmos_1pct_base
              subset: *train_window_1pct
      - ocean:
          merge:
            - !!merge <<: *ocean_piC_coupled
              subset: &train_window_piC
                start_time: '0156-01-06T00:00:00'
                stop_time: '0236-01-01T00:00:00'
            - !!merge <<: *ocean_piC_base
              subset: *train_window_piC
        atmosphere:
          merge:
            - !!merge <<: *atmos_piC_coupled
              subset: *train_window_piC
            - !!merge <<: *atmos_piC_base
              subset: *train_window_piC
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      !!merge <<: &validation_loader_settings
        batch_size: 8
        num_data_workers: 2
        prefetch_factor: 2
      dataset:
        ocean:
          merge:
            - !!merge <<: *ocean_1pct_coupled
              subset: &val_window_1pct_early
                start_time: '0041-01-06T00:00:00'
                stop_time: '0046-01-01T00:00:00'
            - !!merge <<: *ocean_1pct_base
              subset: *val_window_1pct_early
        atmosphere:
          merge:
            - !!merge <<: *atmos_1pct_coupled
              subset: *val_window_1pct_early
            - !!merge <<: *atmos_1pct_base
              subset: *val_window_1pct_early
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      !!merge <<: *validation_loader_settings
      dataset:
        ocean:
          merge:
            - !!merge <<: *ocean_1pct_coupled
              subset: &val_window_1pct_late
                start_time: '0126-01-06T00:00:00'
                stop_time: '0131-01-01T00:00:00'
            - !!merge <<: *ocean_1pct_base
              subset: *val_window_1pct_late
        atmosphere:
          merge:
            - !!merge <<: *atmos_1pct_coupled
              subset: *val_window_1pct_late
            - !!merge <<: *atmos_1pct_base
              subset: *val_window_1pct_late
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      !!merge <<: *validation_loader_settings
      dataset:
        ocean:
          merge:
            - !!merge <<: *ocean_piC_coupled
              subset: &val_window_piC
                start_time: '0236-01-06T00:00:00'
                stop_time: '0241-01-01T00:00:00'
            - !!merge <<: *ocean_piC_base
              subset: *val_window_piC
        atmosphere:
          merge:
            - !!merge <<: *atmos_piC_coupled
              subset: *val_window_piC
            - !!merge <<: *atmos_piC_base
              subset: *val_window_piC
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.00007
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    type: LinearLR
    step_each_iteration: true
    kwargs:
      start_factor: 0.01
      end_factor: 1
      total_iters: 1460 # ~1 epoch
stepper_training:
  # Cap, not the working depth. The ocean's n_steps is SAMPLED per batch from
  # the schedule below; n_coupled_steps only has to be >= the deepest outcome,
  # because ComponentLossSchedule.n_required_forward_steps clamps the sample to
  # it (fme/coupled/loss.py) and a sample above the cap would silently collapse
  # onto it.
  #
  # 16, not the 20 first attempted. Memory scales with this CAP, not with the
  # sampled depth: the atmosphere's data window is n_coupled_steps*20+1
  # timesteps and is retained and scored on every batch, including the depth-1
  # draws. At 20 both arms OOM'd in the first validation
  # (01M2KGYC6E1QH64KC9RXYQPP4W, 01M2KGYTGM0T3G4RGQRQQ8TZA4).
  n_coupled_steps: 16
  # Required, not incidental: the ocean's stochasticity is supplied by the
  # atmosphere, so the ensemble must run through both realms even while the
  # atmosphere is frozen and contributes no loss.
  n_ensemble: 2
  optimize_single_component_per_batch: false
  ocean:
    parameter_init:
      weights_path: /ocean_ckpt.tar
    # The standalone long-tail schedule re-scoped to a reachable cap. Mean
    # optimised depth 8.05, against the standalone wave's 7.50, crps4's fixed 4
    # and crps8's fixed 8. Shape is preserved: the 1/2/4 anchor keeps the
    # one-step distribution represented, and the tail mass sits on two depths
    # (8 and 16) as the standalone schedule put it on 12 and 20.
    #
    # THIS ARM IS WHY THE SCHEDULE EXISTS HERE. lt0_a2s took the long tail only
    # through its ocean INIT and trained coupled at a fixed 4; over 8 epochs it
    # minimised that 4-step EnsembleLoss monotonically (the lowest of any 4-step
    # arm at every epoch) while its inline 20-yr rollout skill DEGRADED
    # monotonically, 0.0959 -> 0.1089, from the best epoch-0 of any arm in the
    # wave to 2.3x the converged field. A fixed shallow depth lets a CRPS
    # objective buy dispersion that covers the target at short lead while the
    # long rollout drifts; the deep tail is the pressure that stops it. The
    # owclt / owc8lt arms test the schedule on James's DETERMINISTIC ocean
    # lineage, whose spread comes entirely from the atmosphere -- so the lever
    # this failure is blamed on is not even available to them, and crps4 at a
    # fixed 4 converged fine. This arm is the noise-conditioned cell.
    n_steps:
      outcomes:
        - steps: 1
          probability: 0.25
        - steps: 2
          probability: 0.10
        - steps: 4
          probability: 0.10
        - steps: 8
          probability: 0.20
        - steps: 16
          probability: 0.35
    # Required by the schedule. With this true only the sampled step holds a
    # graph; fme/coupled/stepper.py wraps every other ocean step in
    # torch.no_grad(). That bounds the BACKWARD graph, not the retained forward
    # data -- the distinction that made the first launch OOM. It also truncates
    # the gradient: the model learns a calibrated one-step distribution from
    # states its own rollout reached, rather than backpropagating across coupled
    # steps as crps4/crps8 do. That is a second axis against crps8, accepted
    # deliberately.
    optimize_last_step_only: true
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    parameter_init:
      weights_path: /atmos_ckpt.tar
      parameters:
        - frozen:
            include:
              - '*'
    n_steps: 0
    loss_weight: 0.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
stepper:
