# Uncoupled STOCHASTIC LONG-TAIL finetune (stage B twin) from the 1-STEP
# stochastic stage ../ocean_socorr_mae_lnmuon_fm_stoch_1step rs2ep8 (wandb
# k8vh8z49, result dataset 01M597EQC8KB4H4CY7BY536B55) at its best_ckpt
# (epoch 16), the same init as ../ocean_socorr_mae_lnmuon_fm_stoch_1step_lin8.
#
# Why: a hedge on the lin8 stage re-tuning the backbone's drift (the mechanism
# that made lin8-from-the-deterministic-init late). The long tail reaches 20
# steps (mean ~8) where lin8 stops at 8 (mean ~4); in the on-time AdamW
# spectral-ES lineage both schedules melted on time and the long tail was
# ~30% better on century channel_mean. If lin8 goes late here and the long
# tail does not, the schedule is the lever.
#
# Recipe: the lin8 twin's template with the long-tail n_forward_steps
# (verbatim from the stoch2es ftlt runs, 19yl0189 / uj7uu42s, and
# ../ocean_ppad_muon_stoch_lin8_lt6); optimize_last_step_only stays true.
# Everything else identical: AdamW 1e-4, EnsembleLoss crps 0.9 / ES 0.1,
# n_ensemble 2, 24 epochs, EMA 0.999, EMA checkpoints every 8.
#
# job_runner/uncoupled_finetune.sh \
#   configs/experiments/cm4_1pct_46to125_piC_156to235 ocean_socorr_mae_lnmuon_fm_stoch_1step_lt \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats
# with WANDB_USERNAME=elynnwu.

experiment_dir: /results
evaluate_before_training: true # epoch-0 reference: the 1-step stage's best_ckpt
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 24 # as the mu3e-3 lin8 run (ezqzx1z3)
ema_checkpoint_save_epochs:
  step: 8
inference:
  - name: inference_1pct
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
        # 8 ICs at 10-year spacing, 20-year rollouts tiling years 41-130
        # (validation + training), never entering the 131-140 holdout
        - '0041-01-01T00:00:00'
        - '0051-01-01T00:00:00'
        - '0061-01-01T00:00:00'
        - '0071-01-01T00:00:00'
        - '0081-01-01T00:00:00'
        - '0091-01-01T00:00:00'
        - '0101-01-01T00:00:00'
        - '0111-01-01T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
        # 8 ICs at 10-year spacing, 20-year rollouts tiling relative years
        # 1-90, never entering the relative-year-91+ holdout. The first IC
        # is the store's first 5-daily snapshot.
        - '0151-01-06T00:00:00'
        - '0161-01-01T00:00:00'
        - '0171-01-01T00:00:00'
        - '0181-01-01T00:00:00'
        - '0191-01-01T00:00:00'
        - '0201-01-01T00:00:00'
        - '0211-01-01T00:00:00'
        - '0221-01-01T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    # 1pctCO2 years 0046-0125 concatenated with piControl years 0156-0235: 80
    # years each, 160 total. Neither window enters its run's validation years
    # (1pctCO2 0041-0045 and 0126-0130, piControl 0236-0240) or holdout (1pctCO2
    # 0131-0140, piControl 0241-0350). One concat list per store, both in the
    # same simulation order so the merged members share sample start times.
    merge:
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0046-01-06T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0156-01-06T00:00:00'
          stop_time: '0236-01-01T00:00:00'
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
        engine: zarr
        subset:
          start_time: '0046-01-06T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
        engine: zarr
        subset:
          start_time: '0156-01-06T00:00:00'
          stop_time: '0236-01-01T00:00:00'
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
optimization:
  max_grad_norm: 1.0
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001 # stage-2 recipe; AdamW, not the pretrain's Muon (decided 2026-10-12)
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  # long tail, verbatim from the stoch2es ftlt runs (19yl0189, uj7uu42s)
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.3
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.2
      - steps: 20
        probability: 0.2
  optimize_last_step_only: true
  # stepper_training is not merged from the checkpoint: restate the objective.
  n_ensemble: 2
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
  parameter_init:
    # the checkpoint is already the noise-conditioned module (1-step stage)
    weights_path: /ckpt.tar
stepper:
  step:
    config:
      builder:
        config:
          noise_embed_dim: 32
          conditioned_blocks: all_blocks
          # activation checkpointing, as mhaw9t6l. The ocean_ppad pretrain
          # does not set it, and without it this recipe (n_ensemble 2, batch
          # 4/GPU) OOMs a 4xH100 node in the first backward
          # (01M4RVXMQMDE8GYVSY79WD46JY: 73 GiB allocated + 2.16 GiB asked).
          checkpoint_strategy: all
      corrector:
        config:
          # ocean_ppad pretrains with 1; a finetune must not re-disable the
          # corrector for its first epoch
          corrector_disabled_epochs: 0
