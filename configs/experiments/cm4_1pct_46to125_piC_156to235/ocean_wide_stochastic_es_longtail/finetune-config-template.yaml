# STAGE 2 of the SPECTRAL-ENERGY-SCORE ablation, long-tail schedule.
#
# ONE-VARIABLE FORK of ../ocean_wide_stochastic_longtail/finetune-config-template.yaml.
# Comment-stripped, the two files differ in exactly the three loss weights:
# crps 0.9 is unchanged, energy_score_weight 0.0 -> 0.1, and
# patch_energy_score_weight 0.1 -> 0.0 (patch_energy_score_size dropped with
# it) -- plus max_epochs, stated as 24 here rather than 12-then-resumed-to-24.
# The schedule, n_ensemble 2, max_grad_norm 1.0, EMA, data, validation and
# inference blocks are byte-identical, so the two waves are a paired
# comparison with the loss as the only difference.
#
# It resumes ../ocean_wide_stochastic_es's stage-1 best_ckpts, NOT the
# patch-ES wave's: the loss is baked into stage 1, since the noise pathway is
# shaped by whichever score trained it, so a stage-2-only swap would not clear
# the spectral score.
#
# Why the swap is worth a run: crps 0.9 + energy_score 0.1 is ACE2S's
# EnsembleLoss and is already what every coupled finetune in this line trains
# its ocean against. The uncoupled stages are the only place the patch score
# is used. See ../ocean_wide_stochastic_es/train-config.yaml.
#
# Read against the long-tail allblocks patch-ES arm on the pre-registered
# band-variance criterion first (analysis/band_variance_4deg.py on the piC
# 200-yr rollout; that arm reads 0.783 global interannual SST variance ratio
# and ~0.80 in the western boundary currents, against the deterministic
# baseline's 0.631 and 0.465-0.545), then the time-mean guard rail
# (inference/time_mean_norm/rmse/channel_mean: 0.0572 piC 200-yr,
# 0.0502 1pct 130-yr).
#
# Needs its own config directory for the same reason that wave does:
# uncoupled_finetune.sh writes finetune-config.yaml into the directory it
# reads, so two waves launching from one directory clobber each other.
#
# job_runner/uncoupled_finetune.sh \
#   configs/experiments/cm4_1pct_46to125_piC_156to235/ocean_wide_stochastic_es_longtail . \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats

experiment_dir: /results
evaluate_before_training: true # epoch-0 reference for the pretrained checkpoint
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 24 # 24 up front, not the patch-ES wave's 12. That wave was
# still descending monotonically at 12 and was resumed in place to 24, where
# the extra epochs took another 11-12% off the inline time-mean bias. Setting
# the total here matches the comparison arm's final epoch count without the
# resume, whose resume_results.resume_wandb footgun this arm then never faces.
inference:
  - name: inference_1pct
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
        # 8 ICs at 10-year spacing, 20-year rollouts tiling years 41-130
        # (validation + training), never entering the 131-140 holdout
        - '0041-01-01T00:00:00'
        - '0051-01-01T00:00:00'
        - '0061-01-01T00:00:00'
        - '0071-01-01T00:00:00'
        - '0081-01-01T00:00:00'
        - '0091-01-01T00:00:00'
        - '0101-01-01T00:00:00'
        - '0111-01-01T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
        # 8 ICs at 10-year spacing, 20-year rollouts tiling relative years
        # 1-90, never entering the relative-year-91+ holdout. The first IC
        # is the store's first 5-daily snapshot.
        - '0151-01-06T00:00:00'
        - '0161-01-01T00:00:00'
        - '0171-01-01T00:00:00'
        - '0181-01-01T00:00:00'
        - '0191-01-01T00:00:00'
        - '0201-01-01T00:00:00'
        - '0211-01-01T00:00:00'
        - '0221-01-01T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    # 1pctCO2 years 0046-0125 concatenated with piControl years 0156-0235: 80
    # years each, 160 total. Neither window enters its run's validation years
    # (1pctCO2 0041-0045 and 0126-0130, piControl 0236-0240) or holdout (1pctCO2
    # 0131-0140, piControl 0241-0350). One concat list per store, both in the
    # same simulation order so the merged members share sample start times.
    merge:
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0046-01-06T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0156-01-06T00:00:00'
          stop_time: '0236-01-01T00:00:00'
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
        engine: zarr
        subset:
          start_time: '0046-01-06T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
        engine: zarr
        subset:
          start_time: '0156-01-06T00:00:00'
          stop_time: '0236-01-01T00:00:00'
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
optimization:
  # The "clip" of the ocean_wide_ohc_clip arm, which passes it as an
  # override_arg. Stated here so every arm inherits it. This is not
  # optional at 1deg: unclipped, these runs diverge (see the report
  # 'Gradient clipping fixes the 1deg mean-fill training failure').
  max_grad_norm: 1.0
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  # Long-tail schedule. Mean optimised depth 7.5, against 3.0 for the ERA5
  # schedule this forks and 2.5 for the deterministic 4-step pretrain. 0.3 is
  # kept at depth 1 rather than 0 so the one-step distribution stage 1
  # optimised still has an anchor.
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.3   # ERA5: 0.6
      - steps: 2
        probability: 0.2   # unchanged
      - steps: 4
        probability: 0.1   # unchanged
      - steps: 12
        probability: 0.2   # ERA5: 0.05
      - steps: 20
        probability: 0.2   # ERA5: 0.05
  optimize_last_step_only: true
  # The stage-1 objective, restated. create_finetune_config.sh merges only
  # .stepper from the pretraining config, so stepper_training carries nothing
  # over: stage 1 passed these as override_args, and without them here stage 2
  # trains MSE and discards the calibration stage 1 bought. n_ensemble would
  # default to 2 under EnsembleLoss; stated so the ensemble size is visible.
  n_ensemble: 2
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      # THE ABLATION. ../ocean_wide_stochastic_longtail has
      # energy_score_weight 0.0 / patch_energy_score_weight 0.1 /
      # patch_energy_score_size 3. Swapped here to the SPECTRAL energy score,
      # matching this run's own stage 1 (../ocean_wide_stochastic_es) and the
      # coupled stage's ocean loss. The weight must be restated: stage 2
      # merges only .stepper from the pretraining config, so stepper_training
      # carries nothing over and an omitted loss trains MSE.
      energy_score_weight: 0.1
      patch_energy_score_weight: 0.0
      # energy_score_whitening deliberately unset -> None. The land-mask
      # objection to the spectral score is about the whitening reweight
      # amplifying spurious high-degree power; unwhitened, the coastline
      # aliasing is present but not amplified.
  # Loads the stage-1 best_ckpt mounted at /ckpt.tar by uncoupled_finetune.sh.
  # Without it the finetune trains from random init.
  parameter_init:
    weights_path: /ckpt.tar
