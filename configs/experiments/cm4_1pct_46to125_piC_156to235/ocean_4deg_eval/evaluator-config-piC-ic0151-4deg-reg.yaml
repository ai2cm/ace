# piC-ic0151-200yr-4deg plus regional monthly-SST writers (Gulf Stream, Kuroshio, ...), for regional SST spectra.
# Ocean-only 4deg century protocol, copied from Troy's 2026-09-18-residual-anchor-4deg/eval (ace
# troya/2026-08-18-enso-rollout-interventions), which scored qt9gvoti and the anchor arms; only
# save_monthly_files changed (true -> false).
# 200-year piControl rollout at 4deg. Verbatim copy of the config used by Elynn's
# cm4_1pct_46to125_piC_156to235_4deg-ocean_wide_ohc_clip-eval_best_inference_ckpt-piC-ic0151-200yr-4deg
# runs (beaker 01M162C7GH630RRFKDWFDPJ088), so every arm is scored on the identical protocol.
experiment_dir: /results
n_forward_steps: 14598
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0151-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false # off unless an analysis needs gridded monthly output
  # ace#1525's six regional monthly-SST box writers, the boxes of the 1deg regional evals
  files:
    - label: kuroshio_extension_monthly
      names: [sst]
      lat_extent: [30.0, 40.0]
      lon_extent: [140.0, 180.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: gulf_stream_monthly
      names: [sst]
      lat_extent: [35.0, 45.0]
      lon_extent: [285.0, 315.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: n_atlantic_subpolar_monthly
      names: [sst]
      lat_extent: [50.0, 65.0]
      lon_extent: [300.0, 340.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: acc_monthly
      names: [sst]
      lat_extent: [-60.0, -45.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: n_pacific_gyre_monthly
      names: [sst]
      lat_extent: [25.0, 40.0]
      lon_extent: [180.0, 220.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: nino3_nino34_monthly
      names: [sst]
      lat_extent: [-5.0, 5.0]
      lon_extent: [190.0, 270.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
