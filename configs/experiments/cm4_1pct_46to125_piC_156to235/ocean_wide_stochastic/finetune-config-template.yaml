# STAGE 2 of the stochastic Samudra protocol at 1 degree: sampled-rollout finetune.
#
# Resumes stage 1's best checkpoint and trains with the ERA5 rollout schedule
# (60% 1 step, 20% 2, 10% 4, 5% 12, 5% 20) under optimize_last_step_only.
#
# optimize_last_step_only runs every non-optimized step inside torch.no_grad
# (fme/ace/stepper/single_module.py), so peak memory is one step's backward
# whatever the rollout length, and the gradient is TRUNCATED: the model learns
# a calibrated one-step distribution from states its own rollout reached rather
# than backpropagating through the rollout. Measured at 4deg, a pinned 20-step
# rollout costs 1.6x a 4-step one rather than 5x, and the schedule as a whole
# is marginally cheaper than the fixed 4 it replaces.
#
# As with the deterministic finetune the stepper block is dropped:
# uncoupled_finetune.sh merges it in from the pretraining run's saved config,
# so masking, corrector and variable lists carry over verbatim.
#
# job_runner/uncoupled_finetune.sh \
#   configs/experiments/cm4_1pct_46to125_piC_156to235/ocean_wide_stochastic . \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats

experiment_dir: /results
evaluate_before_training: true # epoch-0 reference for the pretrained checkpoint
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 10 # matches the deterministic recipe's finetune stage
inference:
  - name: inference_1pct
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
        # 8 ICs at 10-year spacing, 20-year rollouts tiling years 41-130
        # (validation + training), never entering the 131-140 holdout
        - '0041-01-01T00:00:00'
        - '0051-01-01T00:00:00'
        - '0061-01-01T00:00:00'
        - '0071-01-01T00:00:00'
        - '0081-01-01T00:00:00'
        - '0091-01-01T00:00:00'
        - '0101-01-01T00:00:00'
        - '0111-01-01T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
        # 8 ICs at 10-year spacing, 20-year rollouts tiling relative years
        # 1-90, never entering the relative-year-91+ holdout. The first IC
        # is the store's first 5-daily snapshot.
        - '0151-01-06T00:00:00'
        - '0161-01-01T00:00:00'
        - '0171-01-01T00:00:00'
        - '0181-01-01T00:00:00'
        - '0191-01-01T00:00:00'
        - '0201-01-01T00:00:00'
        - '0211-01-01T00:00:00'
        - '0221-01-01T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    # 1pctCO2 years 0046-0125 concatenated with piControl years 0156-0235: 80
    # years each, 160 total. Neither window enters its run's validation years
    # (1pctCO2 0041-0045 and 0126-0130, piControl 0236-0240) or holdout (1pctCO2
    # 0131-0140, piControl 0241-0350). One concat list per store, both in the
    # same simulation order so the merged members share sample start times.
    merge:
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0046-01-06T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0156-01-06T00:00:00'
          stop_time: '0236-01-01T00:00:00'
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
        engine: zarr
        subset:
          start_time: '0046-01-06T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
        engine: zarr
        subset:
          start_time: '0156-01-06T00:00:00'
          stop_time: '0236-01-01T00:00:00'
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  # The ERA5 stochastic-ACE finetuning schedule. Mean sampled length 3.0, close
  # to the deterministic recipe's fixed 4, but the tail reaches 5x further.
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
  optimize_last_step_only: true
  loss:
    type: MSE
