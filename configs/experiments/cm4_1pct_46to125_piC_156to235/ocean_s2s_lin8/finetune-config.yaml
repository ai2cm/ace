# job_runner/uncoupled_finetune.sh configs/experiments/cm4_1pct_46to125_piC_156to235/ocean_s2s_lin8 . \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats
experiment_dir: /results
evaluate_before_training: true
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 24
inference:
  - name: inference_1pct
    weight: 1.0
    n_forward_steps: 1460
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          - '0041-01-01T00:00:00'
          - '0051-01-01T00:00:00'
          - '0061-01-01T00:00:00'
          - '0071-01-01T00:00:00'
          - '0081-01-01T00:00:00'
          - '0091-01-01T00:00:00'
          - '0101-01-01T00:00:00'
          - '0111-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
            engine: zarr
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
            engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_forward_steps: 1460
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          - '0151-01-06T00:00:00'
          - '0161-01-01T00:00:00'
          - '0171-01-01T00:00:00'
          - '0181-01-01T00:00:00'
          - '0191-01-01T00:00:00'
          - '0201-01-01T00:00:00'
          - '0211-01-01T00:00:00'
          - '0221-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
            engine: zarr
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
            engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    merge:
      - concat:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0046-01-06T00:00:00'
              stop_time: '0126-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0156-01-06T00:00:00'
              stop_time: '0236-01-01T00:00:00'
      - concat:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0046-01-06T00:00:00'
              stop_time: '0126-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0156-01-06T00:00:00'
              stop_time: '0236-01-01T00:00:00'
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0041-01-06T00:00:00'
              stop_time: '0046-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0041-01-06T00:00:00'
              stop_time: '0046-01-01T00:00:00'
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0126-01-06T00:00:00'
              stop_time: '0131-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0126-01-06T00:00:00'
              stop_time: '0131-01-01T00:00:00'
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0236-01-06T00:00:00'
              stop_time: '0241-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0236-01-06T00:00:00'
              stop_time: '0241-01-01T00:00:00'
optimization:
  max_grad_norm: 1.0
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  optimize_last_step_only: true
  n_forward_steps:
    # linear decreasing with E[steps] = 4
    outcomes:
      - steps: 1
        probability: 0.167
      - steps: 2
        probability: 0.155
      - steps: 3
        probability: 0.143
      - steps: 4
        probability: 0.131
      - steps: 5
        probability: 0.119
      - steps: 6
        probability: 0.107
      - steps: 7
        probability: 0.095
      - steps: 8
        probability: 0.083
  n_ensemble: 2
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
  parameter_init:
    weights_path: /ckpt.tar
stepper:
  input_masking:
    mask_value: 0
    fill_value: 0.0
    exclude_names_and_prefixes:
      - land_fraction
      - sea_surface_fraction
      - DLWRFsfc
      - DSWRFsfc
      - ULWRFsfc
      - USWRFsfc
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      - eastward_surface_wind_stress
      - northward_surface_wind_stress
      - total_frozen_precipitation_rate
  step:
    type: single_module
    config:
      builder:
        type: Samudra
        config:
          ch_width:
            - 280
            - 380
            - 480
            - 520
          dilation:
            - 1
            - 2
            - 4
            - 8
          n_layers:
            - 1
            - 1
            - 1
            - 1
          norm: layer
          checkpoint_strategy: all
          zonally_periodic_upsample: true
          conditioned_blocks: all_blocks
          noise_embed_dim: 32
      normalization:
        network:
          global_means_path: /ocean_stats/centering.nc
          global_stds_path: /ocean_stats/scaling-full-field.nc
      corrector:
        type: ocean_corrector
        config:
          ocean_heat_content_correction:
            method: scaled_temperature
          surface_energy_flux_correction:
            method: prescribed
          force_positive_names:
            - so_0
            - so_1
            - so_2
            - so_3
            - so_4
            - so_5
            - so_6
            - so_7
            - so_8
            - so_9
            - so_10
            - so_11
            - so_12
            - so_13
            - so_14
            - so_15
            - so_16
            - so_17
            - so_18
            - sea_ice_volume
          sea_ice_fraction_correction:
            sea_ice_fraction_name: ocean_sea_ice_fraction
            land_fraction_name: land_fraction
            remove_negative_ocean_fraction: false
            zero_where_ice_free_names:
              - sea_ice_volume
              - sfdsi
              - UI
              - VI
      next_step_forcing_names:
        - DLWRFsfc
        - DSWRFsfc
        - ULWRFsfc
        - USWRFsfc
        - LHTFLsfc
        - SHTFLsfc
        - PRATEsfc
        - eastward_surface_wind_stress
        - northward_surface_wind_stress
        - total_frozen_precipitation_rate
      in_names:
