# Uncoupled STOCHASTIC lin8 finetune (stage 2) from the noise-from-scratch
# Muon stage 1 ../ocean_socorr_stoch_lnmuon_fm rs0 (wandb 1v9dg8f0, beaker
# 01M5AKT1CRYHWDK3E0ZVY7R1B2, result dataset 01M5AKT1D7KN11VB8YKSJXT5PN) at its
# best_ckpt (epoch 15, 1-step validation loss; best_inference_ckpt is not
# meaningful for a 1-step stage).
#
# Why: the on-time AdamW spectral-ES lineage had its FiLM noise layers and the
# CRPS/ES objective from epoch 0 of a 1-step stage 1; this replicates that path
# on the socorr mean-fill base recipe (Muon arm).
#
# Recipe: identical to ../ocean_socorr_mae_lnmuon_fm_stoch_1step_lin8 (AdamW
# 1e-4, EnsembleLoss crps 0.9 / ES 0.1, n_ensemble 2, optimize_last_step_only,
# lin8, 40 epochs, EMA 0.999, EMA checkpoints every 8). The init is already a
# NoiseConditionedModel: parameter_init loads the whole module.
#
# job_runner/uncoupled_finetune.sh \
#   configs/experiments/cm4_1pct_46to125_piC_156to235 ocean_socorr_stoch_lnmuon_fm_lin8 \
#   --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats
# with WANDB_USERNAME=elynnwu.

experiment_dir: /results
evaluate_before_training: true # epoch-0 reference: the stage-1 best_ckpt
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 40 # 24 was too short for seeds rs1/rs2 (inline rollouts reach rs0's epoch-24 skill only by ~36)
ema_checkpoint_save_epochs:
  step: 8
inference:
  - name: inference_1pct
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
        # 8 ICs at 10-year spacing, 20-year rollouts tiling years 41-130
        # (validation + training), never entering the 131-140 holdout
        - '0041-01-01T00:00:00'
        - '0051-01-01T00:00:00'
        - '0061-01-01T00:00:00'
        - '0071-01-01T00:00:00'
        - '0081-01-01T00:00:00'
        - '0091-01-01T00:00:00'
        - '0101-01-01T00:00:00'
        - '0111-01-01T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
        # 8 ICs at 10-year spacing, 20-year rollouts tiling relative years
        # 1-90, never entering the relative-year-91+ holdout. The first IC
        # is the store's first 5-daily snapshot.
        - '0151-01-06T00:00:00'
        - '0161-01-01T00:00:00'
        - '0171-01-01T00:00:00'
        - '0181-01-01T00:00:00'
        - '0191-01-01T00:00:00'
        - '0201-01-01T00:00:00'
        - '0211-01-01T00:00:00'
        - '0221-01-01T00:00:00'
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    # 1pctCO2 years 0046-0125 concatenated with piControl years 0156-0235: 80
    # years each, 160 total. Neither window enters its run's validation years
    # (1pctCO2 0041-0045 and 0126-0130, piControl 0236-0240) or holdout (1pctCO2
    # 0131-0140, piControl 0241-0350). One concat list per store, both in the
    # same simulation order so the merged members share sample start times.
    merge:
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0046-01-06T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0156-01-06T00:00:00'
          stop_time: '0236-01-01T00:00:00'
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
        engine: zarr
        subset:
          start_time: '0046-01-06T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
        engine: zarr
        subset:
          start_time: '0156-01-06T00:00:00'
          stop_time: '0236-01-01T00:00:00'
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
optimization:
  max_grad_norm: 1.0
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001 # stage-2 recipe; AdamW, not the pretrain's Muon (decided 2026-10-12)
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  # lin8, verbatim from ../ocean_wide_stochastic_es_lin8_cellmean
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.167
      - steps: 2
        probability: 0.155
      - steps: 3
        probability: 0.143
      - steps: 4
        probability: 0.131
      - steps: 5
        probability: 0.119
      - steps: 6
        probability: 0.107
      - steps: 7
        probability: 0.095
      - steps: 8
        probability: 0.083
  optimize_last_step_only: true
  # stepper_training is not merged from the checkpoint: restate the objective.
  n_ensemble: 2
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
  parameter_init:
    # the checkpoint is already the noise-conditioned module (stage 1)
    weights_path: /ckpt.tar
stepper:
  step:
    config:
      builder:
        config:
          noise_embed_dim: 32
          conditioned_blocks: all_blocks
          # activation checkpointing, as mhaw9t6l. The ocean_ppad pretrain
          # does not set it, and without it this recipe (n_ensemble 2, batch
          # 4/GPU) OOMs a 4xH100 node in the first backward
          # (01M4RVXMQMDE8GYVSY79WD46JY: 73 GiB allocated + 2.16 GiB asked).
          checkpoint_strategy: all
      corrector:
        config:
          # ocean_ppad pretrains with 1; a finetune must not re-disable the
          # corrector for its first epoch
          corrector_disabled_epochs: 0
