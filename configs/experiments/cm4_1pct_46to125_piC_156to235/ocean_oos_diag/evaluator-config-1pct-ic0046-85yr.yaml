# 1pctCO2 rollout from IC 0046-01-06 (inside the 0046-0125 training window) to the
# same end date as 1pct-ic0001-130yr (6203 steps = 9488 - 45*73), ~85 yr.
# Question (research tasks/2026-10-06-stochastic-samudra-oos-diagnostics): is
# stochastic Samudra's 0.1-0.15 K cold surface offset in years 1-40 of the
# ic0001 rollout a spin-up shock after initialization (it reappears in the first
# years after this IC) or a below-CO2-range effect (it does not)?
# Otherwise identical to evaluator-config-1pct-ic0001-130yr.yaml in this dir.
experiment_dir: /results
n_forward_steps: 6203
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0046-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
