# job_runner/evaluate.sh configs/experiments/cm4_1pct_46to125_piC_156to235/coupled_ens_spread .
#
# The 1pctCO2 companion to evaluator-config-piC-ic0151-60yr-ens.yaml. Same
# ensemble construction -- N single-member evaluator runs at distinct `seed`,
# combined offline, because the coupled evaluator has no n_ensemble_per_ic.
#
# Forced rather than stationary forcing is the point: spread under a transient
# scenario is the DECK-relevant case, and piControl does not stand in for it.
# Window and IC match James's single-member eval exactly (9488 steps from
# 0001-01-06, the full 130-yr ramp), so these are directly comparable to it.
experiment_dir: /results
n_coupled_steps: 9488
coupled_steps_in_memory: 16  # divides 9488 (593 chunks)
checkpoint_path: /ckpt.tar
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true  # sst only: needed for the spatial spread map and
    names:                    # for the internal-variability reference, which
      - sst                   # here must be taken about the forced trend
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0001-01-06T00:00:00'
