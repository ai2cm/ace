experiment_dir: /results
n_forward_steps: 3652
forward_steps_in_memory: 73
checkpoint_path: /ckpt.tar
allow_incompatible_dataset: true
labels:
- som
logging:
  project: FM
  entity: ai2cm
  log_to_screen: true
  log_to_file: true
  log_to_wandb: true
initial_condition:
  path: /results/spin-up/restart.nc
  engine: netcdf4
  start_indices:
    times:
    - '2031-01-01T00:00:00'
forcing_loader:
  dataset:
    data_path: /climate-default/2026-09-17-vertically-resolved-4deg-daily-c96-shield-som-eq-spin-up-plus-member-symlinks
    file_pattern: 2xCO2-ic_0005-*.zarr
    engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files: []
stepper_override:
  ocean:
    surface_temperature_name: surface_temperature
    ocean_fraction_name: ocean_fraction
    interpolate: false
    slab:
      mixed_layer_depth_name: prescribed_mixed_layer_depth
      q_flux_name: prescribed_qflux
