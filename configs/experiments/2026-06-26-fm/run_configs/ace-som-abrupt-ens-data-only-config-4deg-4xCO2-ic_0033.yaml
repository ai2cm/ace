experiment_dir: /results
n_forward_steps: 89
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
allow_incompatible_dataset: true
labels:
- som
logging:
  project: FM
  entity: ai2cm
  log_to_screen: true
  log_to_file: true
  log_to_wandb: true
loader:
  dataset:
    data_path: /climate-default/TBD-vertically-resolved-4deg-daily-c96-shield-som-abrupt-4xCO2-ensemble-fme-dataset
    file_pattern: abrupt4xCO2-ic_0033.zarr
    engine: zarr
  start_indices: &id001
    list:
    - 0
  num_data_workers: 8
prediction_loader:
  dataset:
    data_path: /climate-default/TBD-vertically-resolved-4deg-daily-c96-shield-som-abrupt-4xCO2-ensemble-fme-dataset
    file_pattern: abrupt4xCO2-ic_0033.zarr
    engine: zarr
  start_indices: *id001
  num_data_workers: 8
data_writer:
  save_prediction_files: false
  save_monthly_files: false
stepper_override:
  ocean:
    surface_temperature_name: surface_temperature
    ocean_fraction_name: ocean_fraction
    interpolate: false
    slab:
      mixed_layer_depth_name: prescribed_mixed_layer_depth
      q_flux_name: prescribed_qflux
