experiment_dir: /results
n_forward_steps: 3652
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
allow_incompatible_dataset: true
labels:
- som
logging:
  project: FM
  entity: ai2cm
  log_to_screen: true
  log_to_file: true
  log_to_wandb: true
loader:
  dataset:
    data_path: /climate-default/2026-06-08-vertically-resolved-4deg-daily-c96-shield-som-ensemble-fme-dataset
    file_pattern: 1xCO2-ic_0004.zarr
    engine: zarr
  start_indices: &id001
    times:
    - '2031-01-02T00:00:00'
  num_data_workers: 8
prediction_loader:
  dataset:
    data_path: /climate-default/2026-06-08-vertically-resolved-4deg-daily-c96-shield-som-ensemble-fme-dataset
    file_pattern: 1xCO2-ic_0004.zarr
    engine: zarr
  start_indices: *id001
  num_data_workers: 8
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files:
  - label: daily
    names:
    - PRATEsfc
    save_reference: false
    format:
      name: zarr
