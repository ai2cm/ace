# Resume of ../2026-07-28-hiro-downscaling-25km-100km-5ch/train.yaml, extended
# from 200 to 400 epochs, to check whether HiRO's gap vs. the video-PMD
# models narrows with more training. The prior run (experiment
# 01KZ1WGMKRX6AKWWQXB8JJWRZP, result dataset 01KZ1WGMM2SQR6WSV0R3F3EM47,
# wandb run ai2cm/multivariate-downscaling/gbm6d4ag "dauntless-butterfly-223")
# finished cleanly at epoch 199/200 (state: finished, not crashed) -- this is
# a genuine "does more training help" experiment, not a recovery from an
# interrupted run.
#
# resume_results_dir points at the previous run's checkpoints (mounted via
# run.sh's --dataset flag); fme.downscaling.train.py's
# _resume_from_results_dir_if_not_preempted copies the whole results dir
# (including checkpoints/latest.ckpt, whose saved startEpoch resumes the
# training loop) into experiment_dir before training starts.
#
# Everything else is unchanged from the source config -- same data split,
# same architecture, same normalization stats, same loss weights.
resume_results_dir: /resume_results

log_loss_vs_noise: true
static_inputs:
  HGTsfc: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/25km.zarr
  land_fraction: /climate-default/2025-11-19-X-SHiELD-AMIP-downscaling-land-fraction/25km/land_fraction.zarr
model:
  loss_weights:
    noise_weight_exponent: 0.75
    output_channels:
      PRATEsfc: 0.2
  use_amp_bf16: true
  out_names:
  - PRATEsfc
  - air_temperature_at_two_meters
  - PRMSL
  - eastward_wind_at_ten_meters
  - northward_wind_at_ten_meters
  in_names:
  - PRATEsfc
  - air_temperature_at_two_meters
  - PRMSL
  - eastward_wind_at_ten_meters
  - northward_wind_at_ten_meters
  loss:
    type: MSE
  module:
    config:
      bottleneck_attention: false
      model_channels: 128
      attn_resolutions: []
      num_blocks: 1
      channel_mult_emb: 6
      channel_mult:
      - 1
      - 2
      - 2
      - 2
      use_apex_gn: true
    type: unet_diffusion_song_v2
  normalization:
    fine:
      means:
        eastward_wind_at_ten_meters: -0.036200
        northward_wind_at_ten_meters: 0.170470
        PRMSL: 1008.160699
        PRATEsfc: 0.0000280
        air_temperature_at_two_meters: 279.675977
      stds:
        eastward_wind_at_ten_meters: 5.627319
        northward_wind_at_ten_meters: 4.692752
        PRMSL: 15.043594
        PRATEsfc: 0.0001289
        air_temperature_at_two_meters: 20.455977
    coarse:
      means:
        eastward_wind_at_ten_meters: -0.036981
        northward_wind_at_ten_meters: 0.171301
        PRMSL: 1008.158404
        PRATEsfc: 0.000028
        air_temperature_at_two_meters: 279.678194
      stds:
        eastward_wind_at_ten_meters: 5.538259
        northward_wind_at_ten_meters: 4.589926
        PRMSL: 15.020959
        PRATEsfc: 0.000100
        air_temperature_at_two_meters: 20.417566
  num_diffusion_generation_steps: 18
  churn: 0.0
  training_noise_distribution:
    p_min: 0.005
    p_max: 1000.0
  predict_residual: true
  sigma_max: 1000.0
  sigma_min: 0.005
  use_fine_topography: true
optimization:
  lr: 0.0001
  optimizer_type: Adam
ema:
  decay: 0.999
validate_using_ema: true
train_data:
  sample_with_replacement: 144
  batch_size: 48
  num_data_workers: 2
  fine:
  - data_path: /climate-default/2026-06-25-temporal-diffusion
    file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
    engine: zarr
    subset:
      start_time: '2013-01-02'
      stop_time: '2021-12-31'
  coarse:
  - data_path: /climate-default/2026-06-25-temporal-diffusion
    file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
    engine: zarr
    subset:
      start_time: '2013-01-02'
      stop_time: '2021-12-31'
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
  strict_ensemble: false
validation_data:
  batch_size: 16
  num_data_workers: 4
  fine:
  - data_path: /climate-default/2026-06-25-temporal-diffusion
    file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
    engine: zarr
    subset:
      start_time: '2022-01-01'
      stop_time: '2022-12-31'
  coarse:
  - data_path: /climate-default/2026-06-25-temporal-diffusion
    file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
    engine: zarr
    subset:
      start_time: '2022-01-01'
      stop_time: '2022-12-31'
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
  strict_ensemble: false
  drop_last: true
coarse_patch_extent_lat: 16
coarse_patch_extent_lon: 16
max_epochs: 400
validate_interval: 50
experiment_dir: /results
save_checkpoints: true
logging:
  project: multivariate-downscaling
  entity: ai2cm
  log_to_wandb: true
generate_n_samples: 2
