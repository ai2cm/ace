# Example / smoke-test single-year config (year 0251).
# Full OOS suite: years 0251–0255 via evaluate-coupled-nino-ar-sst.sh
# (coupled FT validation window; train starts 0256).
experiment_dir: /results
n_coupled_steps: 146
coupled_steps_in_memory: 1
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  start_indices:
    times:
    - '0250-12-29T12:00:00'
    - '0251-02-02T12:00:00'
    - '0251-02-27T12:00:00'
    - '0251-03-29T12:00:00'
    - '0251-04-28T12:00:00'
    - '0251-06-02T12:00:00'
    - '0251-07-02T12:00:00'
    - '0251-08-01T12:00:00'
    - '0251-08-31T12:00:00'
    - '0251-09-30T12:00:00'
    - '0251-10-30T12:00:00'
    - '0251-11-29T12:00:00'
  dataset:
    ocean:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-10-16-cm4-1pctCO2-140yr-ocean-no-smoothing.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-07-14-cm4-1pctCO2-140yr-ocean-no-smoothing-nino-leads.zarr
        engine: zarr
    atmosphere:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-sea_ice.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-06-18-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
        engine: zarr
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
aggregator:
  log_histograms: false
  log_zonal_mean_images: false
  log_global_mean_time_series: false
  log_global_mean_norm_time_series: false
