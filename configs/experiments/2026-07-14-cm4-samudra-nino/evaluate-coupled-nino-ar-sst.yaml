# Coupled OOS autoregressive Nino3.4 skill from diagnosed SST (not the MLP
# readout). Same 60 ICs as evaluate-coupled-nino-scalars.yaml; roll out ~12
# months of ocean steps and save sst for offline index diagnosis.
#
# Ocean Δt = 5 days => 73 steps ≈ 365 days. coupled_steps_in_memory must divide
# n_coupled_steps (73 is prime => 1).
experiment_dir: /results/raw
n_coupled_steps: 73
coupled_steps_in_memory: 1
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  # 60 ICs separated by 6 x 5-day ocean samples (~monthly coverage).
  start_indices:
    n_initial_conditions: 60
    first: 0
    interval: 6
  dataset:
    ocean:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-10-16-cm4-1pctCO2-140yr-ocean-no-smoothing.zarr
        engine: zarr
      # Still required: coupled FT ocean out_names include nino34_lead_*.
      - data_path: /climate-default
        file_pattern: 2026-07-14-cm4-1pctCO2-140yr-ocean-no-smoothing-nino-leads.zarr
        engine: zarr
    atmosphere:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-sea_ice.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-06-18-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
        engine: zarr
  num_data_workers: 4
data_writer:
  ocean:
    save_prediction_files: true
    save_monthly_files: false
    names:
    - sst
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
aggregator:
  log_histograms: false
  log_zonal_mean_images: false
  log_global_mean_time_series: false
  log_global_mean_norm_time_series: false
