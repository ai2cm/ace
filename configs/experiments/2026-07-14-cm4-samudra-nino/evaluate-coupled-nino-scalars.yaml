# Coupled OOS one-step Nino3.4 readout evaluation for the joint FT checkpoint.
# IC selection matches evaluate-nino-scalars.yaml (60 ICs, interval 6 from
# dataset start) so skill is comparable to the ocean-only Samudra run.
experiment_dir: /results/raw
n_coupled_steps: 1
coupled_steps_in_memory: 1
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  # 60 ICs separated by 6 x 5-day ocean samples (~monthly coverage).
  start_indices:
    n_initial_conditions: 60
    first: 0
    interval: 6
  dataset:
    ocean:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-10-16-cm4-1pctCO2-140yr-ocean-no-smoothing.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-07-14-cm4-1pctCO2-140yr-ocean-no-smoothing-nino-leads.zarr
        engine: zarr
    atmosphere:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-sea_ice.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-06-18-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
        engine: zarr
  num_data_workers: 4
data_writer:
  ocean:
    save_prediction_files: true
    save_monthly_files: false
    names:
    - nino34_lead_01
    - nino34_lead_02
    - nino34_lead_03
    - nino34_lead_04
    - nino34_lead_05
    - nino34_lead_06
    - nino34_lead_07
    - nino34_lead_08
    - nino34_lead_09
    - nino34_lead_10
    - nino34_lead_11
    - nino34_lead_12
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
aggregator:
  log_histograms: false
  log_zonal_mean_images: false
  log_global_mean_time_series: false
  log_global_mean_norm_time_series: false
