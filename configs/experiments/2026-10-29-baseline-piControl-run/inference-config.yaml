experiment_dir: gs://vcm-ml-scratch/spencerc/2026-10-30-baseline-piControl-SamudrACE
# 100 years of 5-day coupled (ocean) steps
n_coupled_steps: 7300
coupled_steps_in_memory: 20
checkpoint_path: /ckpt.tar
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: monthly_mean_predictions
        names:
          - sst
        save_reference: false
        time_coarsen:
          method: monthly_mean
        format:
          name: zarr
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: monthly_mean_predictions
        names:
          - surface_temperature
          - ULWRFtoa
          - USWRFtoa
          - net_energy_flux_toa_into_atmosphere
        save_reference: false
        time_coarsen:
          method: monthly_mean
        format:
          name: zarr
forcing_loader:
  atmosphere:
    dataset:
      data_path: /climate-default
      file_pattern: 2025-03-21-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
      engine: zarr
      # forcing data ends in 0350, so repeat it to cover 0320-0420
      n_repeats: 2
  # No ocean forcing loader: this model has no ocean-only exogenous forcings
  # (land_fraction comes from the atmosphere), and providing an ocean dataset
  # with no required variables yields empty ocean forcing batches, which
  # crashes the coupled stepper.
  num_data_workers: 1
initial_condition:
  # year 0320 is outside the 0151-0310 training and validation period; created
  # with run-create-ic.sh
  ocean:
    path: /climate-default/home/spencerc/2026-10-29-baseline-piControl-run/0320-01-03_ocean_ic.nc
  atmosphere:
    path: /climate-default/home/spencerc/2026-10-29-baseline-piControl-run/0320-01-03_atmosphere_ic.nc
  start_indices:
    first: 0
    n_initial_conditions: 1
logging:
  log_to_screen: true
  log_to_wandb: true
  # file logging is only supported for a local experiment_dir
  log_to_file: false
  project: ace-samudra-coupled-cm4
  entity: ai2cm
