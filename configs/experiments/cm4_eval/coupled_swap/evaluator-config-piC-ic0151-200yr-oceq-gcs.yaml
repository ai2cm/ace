# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4_eval/coupled_swap
#
# Variant -oceq-gcs: the -oceq config below with every file writer in zarr
# format (default chunks: the monthly zarr writer requires one month per
# chunk) and no log file, so that the whole run can be
# written to a gs:// experiment_dir (set per row via the override field).
#
# Variant -oceq: the -atmresp config below plus a monthly equatorial Pacific
# ocean writer (temperature to 650 m, currents to 130 m, SSH, SST; CM4's
# alongside) for the ocean's ENSO feedbacks.
#
# Variant -atmresp: the same, plus a monthly tropical Pacific writer on the
# atmosphere side (SST as the atmosphere sees it, surface stress, surface
# fluxes, precipitation, with CM4's alongside), identical to the writer in
# cm4_eval/atmos_tropac, to measure each atmosphere's response to its own
# coupled SST.
#
# The shared piC config, with the coupled checkpoint replaced by separate
# ocean and atmosphere component checkpoints (extracted from coupled
# checkpoints with scripts/coupled/create_decoupled_checkpoint.py and mounted
# by evaluate.sh at /ocean_ckpt.tar and /atmos_ckpt.tar), so any coupled-trained
# ocean can run with any atmosphere. The coupling-level settings
# (sst_name, ocean_fraction_prediction, timedeltas) are copied from the source
# coupled checkpoints' config, where both are identical.
experiment_dir: /results
n_coupled_steps: 14598
coupled_steps_in_memory: 18
checkpoint_path:
  ocean:
    timedelta: 5D
    path: /ocean_ckpt.tar
  atmosphere:
    timedelta: 6h
    path: /atmos_ckpt.tar
  sst_name: sst
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: kuroshio_extension_monthly
        names: [sst]
        lat_extent: [30.0, 40.0]
        lon_extent: [140.0, 180.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: gulf_stream_monthly
        names: [sst]
        lat_extent: [35.0, 45.0]
        lon_extent: [285.0, 315.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: n_atlantic_subpolar_monthly
        names: [sst]
        lat_extent: [50.0, 65.0]
        lon_extent: [300.0, 340.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: acc_monthly
        names: [sst]
        lat_extent: [-60.0, -45.0]
        lon_extent: [0.0, 360.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: n_pacific_gyre_monthly
        names: [sst]
        lat_extent: [25.0, 40.0]
        lon_extent: [180.0, 220.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: nino3_nino34_monthly
        names: [sst]
        lat_extent: [-5.0, 5.0]
        lon_extent: [190.0, 270.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: equatorial_pacific_ocean_monthly
        names:
          - sst
          - zos
          - thetao_0
          - thetao_1
          - thetao_2
          - thetao_3
          - thetao_4
          - thetao_5
          - thetao_6
          - thetao_7
          - thetao_8
          - thetao_9
          - uo_0
          - uo_1
          - uo_2
          - uo_3
          - uo_4
          - uo_5
          - vo_0
          - vo_1
          - vo_2
          - vo_3
          - vo_4
          - vo_5
        lat_extent: [-10.0, 10.0]
        lon_extent: [120.0, 280.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: tropical_pacific_monthly
        names:
          - surface_temperature
          - eastward_surface_wind_stress
          - northward_surface_wind_stress
          - DSWRFsfc
          - USWRFsfc
          - DLWRFsfc
          - ULWRFsfc
          - LHTFLsfc
          - SHTFLsfc
          - PRATEsfc
        lat_extent: [-20.0, 20.0]
        lon_extent: [120.0, 290.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: false
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0151-01-06T00:00:00'
