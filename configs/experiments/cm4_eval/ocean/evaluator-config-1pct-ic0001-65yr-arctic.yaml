# 1pct from year 1 for 65 years, with monthly gridded sea-ice and forcing output north of 40N,
# to see where and how the sea-ice thickness excess builds (years ~10-45) and is removed (years ~45-55).
# Thickness is not predicted: derive it as sea_ice_volume / (ocean_sea_ice_fraction * ocean area of the cell),
# since sea_ice_volume = HI * areacello * sea_ice_fraction (m^3 per cell).
# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4_eval/ocean
experiment_dir: /results
n_forward_steps: 4743  # 65 noleap years (65*73-2), ending 0065-12-27
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0001-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files:
    - label: kuroshio_extension_monthly
      names: [sst]
      lat_extent: [30.0, 40.0]
      lon_extent: [140.0, 180.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: gulf_stream_monthly
      names: [sst]
      lat_extent: [35.0, 45.0]
      lon_extent: [285.0, 315.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: n_atlantic_subpolar_monthly
      names: [sst]
      lat_extent: [50.0, 65.0]
      lon_extent: [300.0, 340.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: acc_monthly
      names: [sst]
      lat_extent: [-60.0, -45.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: n_pacific_gyre_monthly
      names: [sst]
      lat_extent: [25.0, 40.0]
      lon_extent: [180.0, 220.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: tropical_pacific_monthly_sst
      names: [sst, hfds_total_area]
      lat_extent: [-20.0, 20.0]
      lon_extent: [120.0, 290.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: arctic_hfds
      names: [hfds_total_area]
      lat_extent: [40.0, 90.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: antarctic_hfds
      names: [hfds_total_area]
      lat_extent: [-90.0, -50.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: arctic_ice_monthly
      names: [sea_ice_volume, ocean_sea_ice_fraction, sfdsi, UI, VI, sst, so_0, thetao_0, thetao_1, thetao_2, thetao_3, thetao_4, thetao_5, thetao_6, thetao_7, thetao_8, thetao_9]
      lat_extent: [40.0, 90.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: arctic_forcing_monthly
      names: [ULWRFsfc, USWRFsfc, DLWRFsfc, DSWRFsfc, LHTFLsfc, SHTFLsfc, sea_surface_fraction]
      lat_extent: [40.0, 90.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
