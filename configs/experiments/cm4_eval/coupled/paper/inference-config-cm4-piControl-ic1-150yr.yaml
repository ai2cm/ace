# job_runner/inference.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4_eval/coupled/paper
# Copy of gs://vcm-ml-experiments/spencerc/2026-11-18-hybrid1deg-cft-rs1-replay-piControl-ic1-150yr-monthly/config.yaml
# (SamudrACEv2-CM4 runs.yaml role samudrace2_picontrol_150yr), experiment_dir removed: the row override sets it.
n_coupled_steps: 10950
coupled_steps_in_memory: 6
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
initial_condition:
  ocean:
    path: /climate-default/2026-09-02-cm4-piControl-1deg-ocean-1daily.zarr
    engine: zarr
  atmosphere:
    path: /climate-default/2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
    engine: zarr
  start_indices:
    times:
    - '0301-01-01T00:00:00'
forcing_loader:
  num_data_workers: 1
  ocean:
    dataset:
      data_path: /climate-default/2026-11-05-cm4-abrupt-4xCO2-ensemble-1deg-static-ocean-forcing
      file_pattern: ic_0001.nc
      n_repeats: 500
  atmosphere:
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
        engine: zarr
        n_repeats: 2
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
        engine: zarr
        n_repeats: 2
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
    files:
    - label: monthly_mean_predictions
      save_reference: false
      time_coarsen:
        method: monthly_mean
      format:
        name: zarr
      names:
      - hfds_total_area
      - thetao_0
      - thetao_18
      - ocean_sea_ice_fraction
      - ocean_heat_content
      - ocean_heat_content_tendency
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
    files:
    - label: monthly_mean_predictions
      save_reference: false
      time_coarsen:
        method: monthly_mean
      format:
        name: zarr
      names:
      - air_temperature_0
      - air_temperature_7
      - LHTFLsfc
      - SHTFLsfc
      - DSWRFsfc
      - USWRFsfc
      - DLWRFsfc
      - ULWRFsfc
      - ULWRFtoa
      - USWRFtoa
      - surface_temperature
      - total_frozen_precipitation_rate
      - PRATEsfc
      - net_energy_flux_toa_into_atmosphere
      - TMP2m
