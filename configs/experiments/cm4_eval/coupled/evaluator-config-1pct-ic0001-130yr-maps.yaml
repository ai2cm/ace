# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4_eval/coupled
experiment_dir: /results
n_coupled_steps: 9488  # --min-runtime 6h
coupled_steps_in_memory: 16
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: false
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0001-01-06T00:00:00'
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: kuroshio_extension_monthly
        names: [sst]
        lat_extent: [30.0, 40.0]
        lon_extent: [140.0, 180.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: gulf_stream_monthly
        names: [sst]
        lat_extent: [35.0, 45.0]
        lon_extent: [285.0, 315.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: n_atlantic_subpolar_monthly
        names: [sst]
        lat_extent: [50.0, 65.0]
        lon_extent: [300.0, 340.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: acc_monthly
        names: [sst]
        lat_extent: [-60.0, -45.0]
        lon_extent: [0.0, 360.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: n_pacific_gyre_monthly
        names: [sst]
        lat_extent: [25.0, 40.0]
        lon_extent: [180.0, 220.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: tropical_pacific_monthly_sst
        names: [sst, hfds_total_area]
        lat_extent: [-20.0, 20.0]
        lon_extent: [120.0, 290.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: arctic_hfds
        names: [hfds_total_area]
        lat_extent: [40.0, 90.0]
        lon_extent: [0.0, 360.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: antarctic_hfds
        names: [hfds_total_area]
        lat_extent: [-90.0, -50.0]
        lon_extent: [0.0, 360.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
      - label: ocean_maps_monthly
        names: [ocean_heat_content, sea_ice_volume, ocean_sea_ice_fraction, thetao_0, thetao_1, thetao_2, thetao_3, thetao_4, thetao_5, thetao_6, thetao_7, thetao_8, thetao_9, thetao_10, thetao_11, thetao_12, thetao_13, thetao_14, thetao_15, thetao_16, thetao_17, thetao_18]
        time_coarsen:
          method: monthly_mean
        save_reference: true
        format:
          name: zarr
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
    files:
    - label: tropical_pacific_monthly
      names:
      - eastward_surface_wind_stress
      - northward_surface_wind_stress
      - DSWRFsfc
      - USWRFsfc
      - DLWRFsfc
      - ULWRFsfc
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      lat_extent: [-20.0, 20.0]
      lon_extent: [120.0, 290.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
      format:
        name: zarr
