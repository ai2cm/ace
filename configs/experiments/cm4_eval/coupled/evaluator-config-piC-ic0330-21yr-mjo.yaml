# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4_eval/coupled
# Out-of-sample piControl (all training/validation dates < 0311-01-01), daily
# tropical-band output for MJO lag regression. 1530 = largest multiple of
# coupled_steps_in_memory that fits from 0330-01-06 to the stores' end.
experiment_dir: /results
n_coupled_steps: 1530  # --min-runtime 2h
coupled_steps_in_memory: 18  # atmosphere steps per batch = 18 * 20, divisible by coarsen_factor 4
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: false
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0330-01-06T00:00:00'
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
    files:
    - label: tropics_daily
      names:
      - PRATEsfc
      - ULWRFtoa
      - surface_temperature
      - eastward_wind_6  # layer nearest 850 hPa
      - eastward_wind_2  # layer nearest 200 hPa
      lat_extent: [-20.0, 20.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        coarsen_factor: 4  # 4 x 6 h = daily block mean
      save_reference: false  # CM4 target: read from the GCS stores
      format:
        name: zarr
