# job_runner/evaluate.sh configs/experiments/cm4_1pct_46to125_piC_156to235/coupled/09-stage1b . \
#   --config-dir configs/experiments/cm4_eval/coupled
# ICs: 13's rule Y_m = round(2 + 38 m / 23), i = 2j-1, 2j -> first 5-daily stamp of month j.
# Arm C of the stage-1b pilot expansion (issue 09), job j=4: evaluator-config-1pct-ic0001-130yr-maps.yaml at 2 ICs,
# 60 days (12 coupled steps), per-step writers.
experiment_dir: /results
n_coupled_steps: 12
coupled_steps_in_memory: 6
checkpoint_path: /ckpt.tar
seed: 0  # same in arms A, T, O, C
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: false
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0012-04-01T00:00:00'
    - '0014-04-01T00:00:00'
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: per_step
        names: [sst, hfds_total_area, ocean_sea_ice_fraction, ocean_heat_content, implied_tendency_of_ocean_heat_content_due_to_advection]
        save_reference: false
        format:
          name: zarr
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
    files:
    - label: per_step
      names:
      - DSWRFsfc
      - USWRFsfc
      - DLWRFsfc
      - ULWRFsfc
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      - net_energy_flux_sfc_into_atmosphere
      - surface_temperature
      save_reference: false
      format:
        name: zarr
