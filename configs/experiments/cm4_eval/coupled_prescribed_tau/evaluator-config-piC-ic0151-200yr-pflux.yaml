# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4_eval/coupled_prescribed_tau
experiment_dir: /results
n_coupled_steps: 14598
#
# The shared piC config with every atmosphere-to-ocean field overwritten with
# CM4's at every atmosphere step: radiative and turbulent heat fluxes,
# precipitation, and wind stress. None of these is an atmosphere input, so the
# atmosphere still runs free but no longer influences the ocean, which becomes
# a CM4-flux-forced ocean inside the unchanged coupled pipeline (same hand-off,
# corrector, IC). There is no SST-flux feedback, so band power inflates by
# construction; the diagnostic is the ocean's gain/coherence against CM4.
atmosphere_stepper_override:
  prescribed_prognostic_names:
    - DLWRFsfc
    - DSWRFsfc
    - ULWRFsfc
    - USWRFsfc
    - LHTFLsfc
    - SHTFLsfc
    - PRATEsfc
    - eastward_surface_wind_stress
    - northward_surface_wind_stress
    - total_frozen_precipitation_rate
coupled_steps_in_memory: 18
checkpoint_path: /ckpt.tar
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: kuroshio_extension_monthly
        names: [sst]
        lat_extent: [30.0, 40.0]
        lon_extent: [140.0, 180.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: gulf_stream_monthly
        names: [sst]
        lat_extent: [35.0, 45.0]
        lon_extent: [285.0, 315.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: n_atlantic_subpolar_monthly
        names: [sst]
        lat_extent: [50.0, 65.0]
        lon_extent: [300.0, 340.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: acc_monthly
        names: [sst]
        lat_extent: [-60.0, -45.0]
        lon_extent: [0.0, 360.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: n_pacific_gyre_monthly
        names: [sst]
        lat_extent: [25.0, 40.0]
        lon_extent: [180.0, 220.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: nino3_nino34_monthly
        names: [sst]
        lat_extent: [-5.0, 5.0]
        lon_extent: [190.0, 270.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0151-01-06T00:00:00'
