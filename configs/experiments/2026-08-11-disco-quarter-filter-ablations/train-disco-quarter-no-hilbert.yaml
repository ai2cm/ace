optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps: 1
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          # Every block's filter is a DISCO convolution. filter_type stays
          # `linear` -- it is the fallback for blocks not listed here, and
          # listing all 8 leaves it unused.
          local_blocks: [0, 1, 2, 3, 4, 5, 6, 7]
          local_filter:
            # ABLATION: the Hilbert pathway removed. two_branch: false drops
            # the K_b branch and its zonal quarter-cycle shift H, leaving
            # K_a * f alone -- one genuinely isotropic convolution. Three
            # consequences, all intended:
            #
            #  1. The filter loses the axis-tied, mirror-breaking phase shift
            #     that dhconv's imaginary per-l weight supplies and that no
            #     isotropic kernel can express, so it commutes with longitude
            #     reflection. A real expressivity cut, not a
            #     reparameterization.
            #  2. The receptive field becomes genuinely pi/4. H is an FFT over
            #     the full longitude circle, so in the two-branch arm the
            #     filter stayed globally supported however small theta_cutoff
            #     was; with one isotropic branch, the support radius means
            #     what it says.
            #  3. Parameters halve: 96.5 M -> 48.2 M over the 8 blocks
            #     (61.9 M vs 110.2 M total, 13.7 M being elsewhere in the
            #     model). Inherent to removing a branch, since DISCO weights
            #     are (C, C, K) per branch, and not separable within this arm:
            #     raising K to compensate is near-degenerate at pi/4, where
            #     K 23 -> 45 adds 1.3% to the convolution tensor's nonzeros
            #     because 1 deg bumps on a 4 deg grid mostly contain no grid
            #     points.
            #
            # The basis is untouched: 22 radial rings of piecewise-linear bumps
            # plus 1 central bin, dr = 1.96 deg across the pi/4 disk.
            kernel_shape: [45, 1]
            basis_type: piecewise linear
            # pi/4. The "<n>lmax" shorthand only spells integer multiples and
            # "global" only spells pi, so both fields are given explicitly.
            theta_cutoff: 0.7853981633974483
            two_branch: false
            # Still unit gain with one branch (measured filter output std 1.000
            # on white unit-variance input), so dropping the branch does not
            # also change the initialization scale.
            match_spectral_init: true
          affine_norms: true
          normalize_big_skip: true
          # The DISCO filter supports neither grouped channels (groups=1 is
          # hardcoded) nor the pre/post 1x1 channel projections, so every arm
          # in this family drops to fg1/sr1, as the parity arms did. Comparable
          # to each other and to w4480jcg, NOT to the fg16/sr0.125 baseline.
          filter_num_groups: 1
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          clip_latent_global_means: true
          # Kept at 3 to stay matched to w4480jcg, though these arms need it
          # far less than the global one: at pi/4 the convolution tensor is
          # 5.8x sparser (62,728 vs 364,221 nonzeros per branch) and K is 23
          # rather than 90.
          #
          # Note the 4-GPU submission doubles the local batch relative to
          # w4480jcg's 8 (batch_size 8 global / world size, x n_ensemble 2),
          # so the saved activations double per block. Still far inside memory
          # with block checkpointing; it does mean per-epoch seconds are not
          # comparable to w4480jcg's 466.9 s except in GPU-seconds.
          #
          # Block-level gradient checkpointing (level 3), on BOTH arms so the
          # configs stay matched. Mathematically exact here (drop_rate is 0 and
          # noise is injected outside the blocks), so it cannot confound the
          # comparison -- it only trades compute for memory. Required by the
          # DISCO arm: its contraction materializes a (B, C, K, nlat, nlon)
          # activation plus a complex (B*C, nlat, bw, nfreq) intermediate, both
          # saved for backward, which is ~2.3 GiB per branch per block at
          # C=512, K=90, B=2 -- about 36 GiB across 8 blocks x 2 branches
          # without checkpointing.
          checkpointing: 3
      normalization:
        network:
          global_means_path: /climate-default/2026-04-17-era5-4deg-8layer-daily-stats-1990-2019/2026-03-19-era5-4deg-8layer-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-04-17-era5-4deg-8layer-daily-stats-1990-2019/2026-03-19-era5-4deg-8layer-1940-2025/scaling-full-field.nc
        residual:
          global_means_path: /climate-default/2026-04-17-era5-4deg-8layer-daily-stats-1990-2019/2026-03-19-era5-4deg-8layer-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-04-17-era5-4deg-8layer-daily-stats-1990-2019/2026-03-19-era5-4deg-8layer-1940-2025/scaling-residual.nc
