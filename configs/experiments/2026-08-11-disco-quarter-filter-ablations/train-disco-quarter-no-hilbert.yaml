# One of three filter ablations of the quarter-globe DISCO arm
# (exp/2026-07-29-disco-spectral-parity, wandb w4480jcg, 20 epochs,
# best_val_loss 0.1382). That arm is the reference for all three: every other
# field in this file is byte-identical to it, so a difference is the
# local_filter change alone.
#
# CM_PRIORITY is read by mcgibbon's balancer script, not by fme -- it is
# metadata on the beaker job, independent of the job's own beaker scheduling
# priority (which is urgent). Low marks these arms as the ones to yield first.
# arg: --env CM_PRIORITY=low
seed: 0
experiment_dir: /results
save_checkpoint: true
checkpoint_every_n_batches: 5000
validate_using_ema: true
ema_checkpoint_save_epochs:
  start: 5
  step: 5
# 20 epochs, not the recipe's 120: matched to the quarter-globe arm this
# ablates, so the two are directly comparable. There is no LR scheduler (constant 1e-4, no warmup) and
# n_forward_steps is a scalar, so this is exactly the first 20 epochs of
# the full run -- nothing is rescaled by the shorter horizon.
