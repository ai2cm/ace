# Stepper block of the ERA5 1deg 6-hourly ACE2S used in the summer-2026 SamudrACE-UFS coupled runs (the atmosphere of
# ft-coupled-era5-ufs-stochastic-5day-ocean, wandb ai2cm/ace-samudra-ufs/infvxbca): Troy's ACE2S ERA5 multi-step fine-tune
# without per-variable loss weights, ace2s-era5-multi-step-fine-tuning-no-var-weighting-rs0 (wandb ai2cm/ace/u9ek57d9, beaker
# 01KSN76D3GQ7MVP058Y2Z2TGKE, results 01KSVC6YS7C18SGYV4VPZYZ232, training_checkpoints/best_inference_ckpt.tar; 14 of 120
# epochs before it crashed, 5-yr inline channel mean 0.033). Same 2026-03-19 store, 40 in / 54 out, embed 512, no spectral
# bottleneck (the ACE2S-size network). Normalization = the same 2026-03-19 stats (01KPC6VHH4H3D800KV4VX83KK9) at /atmos_stats.
stepper:
  step:
    type: single_module
    config:
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      next_step_forcing_names:
      - DSWRFtoa
      out_names:
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      - ULWRFsfc
      - ULWRFtoa
      - DLWRFsfc
      - DSWRFsfc
      - USWRFsfc
      - USWRFtoa
      - tendency_of_total_water_path_due_to_advection
      - TMP850
      - h500
      - total_frozen_precipitation_rate
      - PRMSL
      - eastward_surface_stress
      - northward_surface_stress
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          affine_norms: true
          embed_dim: 512
          filter_type: linear
          noise_embed_dim: 64
          noise_type: isotropic
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          use_mlp: true
      corrector:
        conserve_dry_air: true
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
        - total_frozen_precipitation_rate
        moisture_budget_correction: advection_and_precipitation
      ocean:
        interpolate: true
        ocean_fraction_name: ocean_fraction
        surface_temperature_name: surface_temperature
      normalization:
        network:
          global_means_path: /atmos_stats/centering.nc
          global_stds_path: /atmos_stats/scaling-full-field.nc
        residual:
          global_means_path: /atmos_stats/centering.nc
          global_stds_path: /atmos_stats/scaling-residual.nc
