# Stepper block of Jeremy McGibbon's 1deg 6-HOURLY ACE2S ERA5 arm of the ACE2S paper (the paper's "sixhourly" model):
# pretrain 1deg-6h-ace2s-pretrain-rs0 (wandb ai2cm/ace/daiq4l0d, beaker 01M37WTT3QNB53GK4EFZ8H8AS9 + resume 01M39W3GBR9R900Q8KT5PTR9RD)
# -> 12-step detached fine-tune 1deg-6h-ace2s-ft12-detached-rs0 (wandb cerls68n, beaker 01M46V2EPJTJXPGPTQM3RW0WHS,
# results 01M49ERVM1DVWV12G5DRDXM0PC, training_checkpoints/ema_ckpt_0002.tar = the checkpoint the paper's sixhourly
# evaluations mount). Config = the pretrain run's stepper (configs/baselines/era5-ace2s-ablations/ace2s-pretrain-6hourly.yaml
# on experiment/ace2s-paper-ablations): 2026-03-19 ERA5 1deg 6-hourly store, 40 in / 54 out, spectral bottleneck
# (filter_num_groups 16, spectral_ratio 0.125), no energy corrector. Normalization = andrep/2026-03-19-era5-1deg-8layer-stats-1990-2019
# (beaker 01KPC6VHH4H3D800KV4VX83KK9), mounted at /atmos_stats by the launcher.
stepper:
  step:
    type: single_module
    config:
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      next_step_forcing_names:
      - DSWRFtoa
      - global_mean_co2
      out_names:
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      - ULWRFsfc
      - ULWRFtoa
      - DLWRFsfc
      - DSWRFsfc
      - USWRFsfc
      - USWRFtoa
      - tendency_of_total_water_path_due_to_advection
      - TMP850
      - h500
      - total_frozen_precipitation_rate
      - PRMSL
      - eastward_surface_stress
      - northward_surface_stress
      builder:
        type: NoiseConditionedSFNO
        config:
          affine_norms: true
          embed_dim: 512
          filter_num_groups: 16
          filter_type: linear
          noise_embed_dim: 32
          noise_type: isotropic
          normalize_big_skip: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_ratio: 0.125
          spectral_transform: sht
          use_mlp: true
      corrector:
        clip_frozen_precipitation: true
        conserve_dry_air: true
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - total_frozen_precipitation_rate
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
        moisture_budget_correction: advection_and_precipitation
      ocean:
        ocean_fraction_name: ocean_fraction
        surface_temperature_name: surface_temperature
      normalization:
        network:
          global_means_path: /atmos_stats/centering.nc
          global_stds_path: /atmos_stats/scaling-full-field.nc
        residual:
          global_means_path: /atmos_stats/centering.nc
          global_stds_path: /atmos_stats/scaling-residual.nc
