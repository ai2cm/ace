# ufs1deg-noohc-ace2s512-fto-then-alt: alternating coupled fine-tune (Jeremy's one-component-per-batch recipe, Elynn's 1deg
# template) of the FTO-stage ocean (lifted from ufs1deg-noohc-ace2s512-fto, /ocean_ckpt.tar) with the summer-2026 SamudrACE-UFS ERA5 ACE2S (embed 512, no bottleneck; wandb u9ek57d9, best_inference_ckpt)
# (/atmos_ckpt.tar, the original checkpoint). Stage 2 of the FTO -> alternating coupled FT recipe (Troy 2026-11-04).
# Launch: ARM=ace2s512 STAGE=fto-then-alt OCEAN_DS=<lifted FTO ocean dataset> ./launch-1deg-ufs-era5-coupled-ft.sh
experiment_dir: /results
save_checkpoint: true
ema_checkpoint_save_epochs:
  step: 1
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 12
inference:
- name: inference_10yr
  weight: 1.0
  n_coupled_steps: 730
  coupled_steps_in_memory: 2
  loader:
    num_data_workers: 2
    start_indices:
      times:
      - '2012-01-01T18:00:00'
      - '2012-04-05T18:00:00'
      - '2012-07-04T18:00:00'
      - '2012-10-02T18:00:00'
      - '2013-01-05T18:00:00'
      - '2013-04-05T18:00:00'
      - '2013-07-04T18:00:00'
      - '2013-10-02T18:00:00'
    dataset:
      ocean:
        data_path: /climate-default
        file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
        engine: zarr
      atmosphere:
        merge:
        - data_path: /era5frac
          file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
  aggregator:
    log_zonal_mean_images: false
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: metrics
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  dataset:
    concat:
    - ocean:
        data_path: /climate-default
        file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
        engine: zarr
        subset:
          start_time: '1994-01-05T18:00:00'
          stop_time: '2001-12-31T18:00:00'
      atmosphere:
        merge:
        - data_path: /era5frac
          file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
          engine: zarr
          subset:
            start_time: '1994-01-05T18:00:00'
            stop_time: '2001-12-31T18:00:00'
        - data_path: /climate-default
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '1994-01-05T18:00:00'
            stop_time: '2001-12-31T18:00:00'
    - ocean:
        data_path: /climate-default
        file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
        engine: zarr
        subset:
          start_time: '2012-01-01T18:00:00'
          stop_time: '2021-12-31T18:00:00'
      atmosphere:
        merge:
        - data_path: /era5frac
          file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
          engine: zarr
          subset:
            start_time: '2012-01-01T18:00:00'
            stop_time: '2021-12-31T18:00:00'
        - data_path: /climate-default
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '2012-01-01T18:00:00'
            stop_time: '2021-12-31T18:00:00'
validation:
- name: val_2022_2023
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        data_path: /climate-default
        file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
        engine: zarr
        subset:
          start_time: '2022-01-03T18:00:00'
          stop_time: '2023-10-10T18:00:00'
      atmosphere:
        merge:
        - data_path: /era5frac
          file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
          engine: zarr
          subset:
            start_time: '2022-01-03T18:00:00'
            stop_time: '2023-10-10T18:00:00'
        - data_path: /climate-default
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '2022-01-03T18:00:00'
            stop_time: '2023-10-10T18:00:00'
optimization:
  max_grad_norm: 1.0
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 7.0e-05
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    type: LinearLR
    step_each_iteration: true
    kwargs:
      start_factor: 0.01
      end_factor: 1
      total_iters: 300
stepper_training:
  n_coupled_steps: 8
  n_ensemble: 2
  optimize_single_component_per_batch: true
  ocean:
    parameter_init:
      weights_path: /ocean_ckpt.tar
    optimize_last_step_only: true
    n_steps:
      outcomes:
      - steps: 1
        probability: 0.167
      - steps: 2
        probability: 0.155
      - steps: 3
        probability: 0.143
      - steps: 4
        probability: 0.131
      - steps: 5
        probability: 0.119
      - steps: 6
        probability: 0.107
      - steps: 7
        probability: 0.095
      - steps: 8
        probability: 0.083
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    parameter_init:
      weights_path: /atmos_ckpt.tar
    n_steps:
      outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.0125
      - steps: 40
        probability: 0.0125
      - steps: 60
        probability: 0.0125
      - steps: 80
        probability: 0.0125
    optimize_last_step_only: true
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
stepper:
  sst_name: sst
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  atmosphere_output_rename:
    eastward_surface_wind_stress: eastward_surface_stress
    northward_surface_wind_stress: northward_surface_stress
  atmosphere_output_scale:
    eastward_surface_wind_stress: -1.0
    northward_surface_wind_stress: -1.0
  ocean:
    timedelta: 5D
    stepper:
      input_masking:
        mask_value: 0
        fill_value: mean
        exclude_names_and_prefixes:
        - land_fraction
        - sea_surface_fraction
      step:
        type: single_module
        config:
          builder:
            type: Samudra
            config:
              ch_width:
              - 280
              - 380
              - 480
              - 520
              dilation:
              - 1
              - 2
              - 4
              - 8
              n_layers:
