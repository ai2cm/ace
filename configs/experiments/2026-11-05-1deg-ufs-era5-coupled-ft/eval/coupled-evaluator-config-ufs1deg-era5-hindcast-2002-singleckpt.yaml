# Coupled ENSO hindcasts of a 1deg UFS + ERA5 coupled fine-tune checkpoint: the 12 monthly 2002 starts of the 120-IC 2002-2011
# protocol (first UFS 5-day stamp of each month) x 128 coupled steps (~21 months), atmosphere interactive; sst prediction files
# for the Nino3.4 ACC scorer. Generated by make_eval_configs.py.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 128
coupled_steps_in_memory: 8
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /climate-default
      file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
      engine: zarr
    atmosphere:
      merge:
      - data_path: /era5frac
        file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
  start_indices:
    times:
    - '2002-01-03T18:00:00'
    - '2002-02-02T18:00:00'
    - '2002-03-04T18:00:00'
    - '2002-04-03T18:00:00'
    - '2002-05-03T18:00:00'
    - '2002-06-02T18:00:00'
    - '2002-07-02T18:00:00'
    - '2002-08-01T18:00:00'
    - '2002-09-05T18:00:00'
    - '2002-10-05T18:00:00'
    - '2002-11-04T18:00:00'
    - '2002-12-04T18:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: true
    names:
    - sst
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
