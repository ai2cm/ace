# Coupled ENSO hindcasts of a 1deg UFS + ERA5 coupled fine-tune checkpoint: the 12 monthly 2008 starts of the 120-IC 2002-2011
# protocol (first UFS 5-day stamp of each month) x 128 coupled steps (~21 months), atmosphere interactive; sst prediction files
# for the Nino3.4 ACC scorer. The ocean corrector is overridden at inference WITHOUT the ocean heat-content
# correction (corrector off; other corrections restated); meant for a corrector-kept checkpoint. Generated by make_eval_configs.py.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 128
coupled_steps_in_memory: 2
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /climate-default
      file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
      engine: zarr
    atmosphere:
      merge:
      - data_path: /era5frac
        file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
  start_indices:
    times:
    - '2008-01-02T18:00:00'
    - '2008-02-01T18:00:00'
    - '2008-03-02T18:00:00'
    - '2008-04-01T18:00:00'
    - '2008-05-01T18:00:00'
    - '2008-06-05T18:00:00'
    - '2008-07-05T18:00:00'
    - '2008-08-04T18:00:00'
    - '2008-09-03T18:00:00'
    - '2008-10-03T18:00:00'
    - '2008-11-02T18:00:00'
    - '2008-12-02T18:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: true
    names:
    - sst
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
ocean_stepper_override:
  corrector:
    type: ocean_corrector
    config:
      corrector_disabled_epochs: 0
      surface_energy_flux_correction:
        method: prescribed_open_ocean
      force_positive_names:
      - so_0
      - so_1
      - so_2
      - so_3
      - so_4
      - so_5
      - so_6
      - so_7
      - so_8
      - so_9
      - so_10
      - so_11
      - so_12
      - so_13
      - so_14
      - so_15
      - so_16
      - so_17
      - so_18
      - sea_ice_volume
      sea_ice_fraction_correction:
        sea_ice_fraction_name: ocean_sea_ice_fraction
        land_fraction_name: land_fraction
        remove_negative_ocean_fraction: false
        zero_where_ice_free_names:
        - sea_ice_volume
        - sfdsi
        - UI
        - VI
      zos_global_mean_correction:
        reference_global_mean: 0.0
