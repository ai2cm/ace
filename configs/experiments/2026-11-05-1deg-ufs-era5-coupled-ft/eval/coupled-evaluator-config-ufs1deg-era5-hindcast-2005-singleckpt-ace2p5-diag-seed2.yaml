# Coupled ENSO hindcasts of a 1deg UFS + ERA5 coupled fine-tune checkpoint: the 12 monthly 2005 starts of the 120-IC 2002-2011
# protocol (first UFS 5-day stamp of each month) x 128 coupled steps (~21 months), atmosphere interactive; sst prediction files
# for the Nino3.4 ACC scorer. Spread-diagnosis member with seed 2: also saves daily-mean zonal
# surface stress and the ocean's zos / tauuo / thetao_3,5,7. ACE2.5 atmosphere inputs (PRMSL in hPa,
# carbon_dioxide + lake_fraction store). Generated by make_eval_configs.py.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 128
coupled_steps_in_memory: 2
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /climate-default
      file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
      engine: zarr
    atmosphere:
      merge:
      - data_path: /era5frac
        file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        overwrite:
          multiply_scalar:
            PRMSL: 0.01
      - data_path: /climate-default
        file_pattern: 2026-11-17-era5-1deg-ace2p5-extra-1940-2025.zarr
        engine: zarr
  start_indices:
    times:
    - '2005-01-02T18:00:00'
    - '2005-02-01T18:00:00'
    - '2005-03-03T18:00:00'
    - '2005-04-02T18:00:00'
    - '2005-05-02T18:00:00'
    - '2005-06-01T18:00:00'
    - '2005-07-01T18:00:00'
    - '2005-08-05T18:00:00'
    - '2005-09-04T18:00:00'
    - '2005-10-04T18:00:00'
    - '2005-11-03T18:00:00'
    - '2005-12-03T18:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: true
    names:
    - sst
    - zos
    - tauuo
    - thetao_3
    - thetao_5
    - thetao_7
  atmosphere:
    save_prediction_files: true
    save_monthly_files: false
    names:
    - eastward_surface_wind_stress
    time_coarsen:
      coarsen_factor: 4
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
seed: 2
