# Full-record coupled free rollout (1994-01-05 .. 2023-09, 2170 coupled steps) of a 1deg UFS ocean + ERA5 ACE2S pair in the TWO-CHECKPOINT (zero-shot, no coupled training) form,
# monthly outputs for the 30-yr trend and climate scoring (the 4deg protocol at 1deg). Launch: launch-1deg-ufs-era5-coupled-zeroshot-eval.sh. Generated by make_eval_configs.py.
experiment_dir: /results
checkpoint_path:
  ocean:
    timedelta: 5D
    path: /ocean_ckpt.tar
  atmosphere:
    timedelta: 6h
    path: /atmos_ckpt.tar
  sst_name: sst
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  atmosphere_output_rename:
    eastward_surface_wind_stress: eastward_surface_stress
    northward_surface_wind_stress: northward_surface_stress
  atmosphere_output_scale:
    eastward_surface_wind_stress: -1.0
    northward_surface_wind_stress: -1.0
n_coupled_steps: 2170
coupled_steps_in_memory: 10
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /climate-default
      file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
      engine: zarr
    atmosphere:
      merge:
      - data_path: /era5frac
        file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
  start_indices:
    times:
    - '1994-01-05T18:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
    - thetao_0
    - thetao_5
    - thetao_10
    - ocean_sea_ice_fraction
    - sea_ice_volume
    - hfds_total_area
    - zos
  atmosphere:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - surface_temperature
    - TMP2m
    - DSWRFsfc
    - DLWRFsfc
    - ULWRFsfc
    - USWRFsfc
    - LHTFLsfc
    - SHTFLsfc
    - PRATEsfc
    - eastward_surface_stress
    - northward_surface_stress
    - sea_ice_fraction
    - ocean_fraction
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
