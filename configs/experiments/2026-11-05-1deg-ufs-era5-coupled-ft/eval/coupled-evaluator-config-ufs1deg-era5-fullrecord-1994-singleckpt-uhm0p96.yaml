# Full-record coupled free rollout (1994-01-05 .. 2023-09, 2170 coupled steps) of a 1deg UFS + ERA5 coupled fine-tune checkpoint,
# monthly outputs for the 30-yr trend and climate scoring (the 4deg protocol at 1deg). The ocean corrector is overridden at inference with
# constant_unaccounted_heating -0.96 W/m2 (ocean-area mean) in the scaled-temperature heat-content budget; needs a
# corrector-kept checkpoint. Generated by make_eval_configs.py.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 2170
coupled_steps_in_memory: 10
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /climate-default
      file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
      engine: zarr
    atmosphere:
      merge:
      - data_path: /era5frac
        file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
  start_indices:
    times:
    - '1994-01-05T18:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
    - thetao_0
    - thetao_5
    - thetao_10
    - ocean_sea_ice_fraction
    - sea_ice_volume
    - hfds_total_area
    - zos
  atmosphere:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - surface_temperature
    - TMP2m
    - DSWRFsfc
    - DLWRFsfc
    - ULWRFsfc
    - USWRFsfc
    - LHTFLsfc
    - SHTFLsfc
    - PRATEsfc
    - eastward_surface_stress
    - northward_surface_stress
    - sea_ice_fraction
    - ocean_fraction
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
ocean_stepper_override:
  corrector:
    type: ocean_corrector
    config:
      corrector_disabled_epochs: 0
      ocean_heat_content_correction:
        method: scaled_temperature
        constant_unaccounted_heating: -0.96
      surface_energy_flux_correction:
        method: prescribed_open_ocean
      force_positive_names:
      - so_0
      - so_1
      - so_2
      - so_3
      - so_4
      - so_5
      - so_6
      - so_7
      - so_8
      - so_9
      - so_10
      - so_11
      - so_12
      - so_13
      - so_14
      - so_15
      - so_16
      - so_17
      - so_18
      - sea_ice_volume
      sea_ice_fraction_correction:
        sea_ice_fraction_name: ocean_sea_ice_fraction
        land_fraction_name: land_fraction
        remove_negative_ocean_fraction: false
        zero_where_ice_free_names:
        - sea_ice_volume
        - sfdsi
        - UI
        - VI
      zos_global_mean_correction:
        reference_global_mean: 0.0
