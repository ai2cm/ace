# Multi-step fine-tune of the CM4-line ACE2.5 atmosphere on ERA5 1deg 6-hourly, summer-2026 ACE2S recipe (sampled 1-20 step schedule).
# Generated by make_ace2p5_era5_ft_configs.py; launch with launch-1deg-era5-ace2p5-ft.sh (mounts /ckpt.tar, /atmos_stats, /extra).
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
evaluate_before_training: true
max_epochs: 20
ema:
  decay: 0.999
seed: 0
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 8
  prefetch_factor: 2
  dataset:
    merge:
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        overwrite: &id001
          multiply_scalar:
            PRMSL: 0.01
        subset:
          stop_time: '1995-12-31'
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        overwrite: *id001
        subset:
          start_time: '2011-01-01'
          stop_time: '2019-12-31'
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        overwrite: *id001
        subset:
          start_time: '2021-01-01'
    - concat:
      - data_path: /extra
        file_pattern: ace2p5_era5_extra.zarr
        engine: zarr
        subset:
          stop_time: '1995-12-31'
      - data_path: /extra
        file_pattern: ace2p5_era5_extra.zarr
        engine: zarr
        subset:
          start_time: '2011-01-01'
          stop_time: '2019-12-31'
      - data_path: /extra
        file_pattern: ace2p5_era5_extra.zarr
        engine: zarr
        subset:
          start_time: '2021-01-01'
validation:
- name: val
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 16
    num_data_workers: 8
    prefetch_factor: 2
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        overwrite:
          multiply_scalar:
            PRMSL: 0.01
        subset:
          start_time: '1996-01-01'
          stop_time: '1997-12-31'
      - data_path: /extra
        file_pattern: ace2p5_era5_extra.zarr
        engine: zarr
        subset:
          start_time: '1996-01-01'
          stop_time: '1997-12-31'
inference:
- name: inference
  weight: 1.0
  n_forward_steps: 7300
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '1996-01-01T00:00:00'
      - '1996-02-15T00:00:00'
      - '1996-04-01T00:00:00'
      - '1996-05-15T00:00:00'
      - '1996-07-01T00:00:00'
      - '1996-08-15T00:00:00'
      - '1996-10-01T00:00:00'
      - '1996-11-15T00:00:00'
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        overwrite:
          multiply_scalar:
            PRMSL: 0.01
      - data_path: /extra
        file_pattern: ace2p5_era5_extra.zarr
        engine: zarr
    num_data_workers: 8
  aggregator:
    log_histograms: false
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps:
    outcomes:
    - steps: 1
      probability: 0.6
    - steps: 2
      probability: 0.2
    - steps: 4
      probability: 0.1
    - steps: 12
      probability: 0.05
    - steps: 20
      probability: 0.05
  optimize_last_step_only: true
  parameter_init:
    weights_path: /ckpt.tar
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
      normalization:
        network:
          global_means_path: /atmos_stats/centering.nc
          global_stds_path: /atmos_stats/scaling-full-field.nc
        residual:
          global_means_path: /atmos_stats/centering.nc
          global_stds_path: /atmos_stats/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
        interpolate: true
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        clip_frozen_precipitation: true
        total_energy_budget_correction:
          method: constant_temperature
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - total_frozen_precipitation_rate
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
      next_step_forcing_names:
      - DSWRFtoa
      - carbon_dioxide
      in_names:
      - carbon_dioxide
      - land_fraction
      - lake_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      out_names:
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
