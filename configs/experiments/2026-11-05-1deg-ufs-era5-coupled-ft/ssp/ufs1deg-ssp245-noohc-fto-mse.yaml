# SSP2-4.5 coupled run 2015-01-20 .. 2099-12-05 (6200 coupled steps) of the 1deg UFS + ERA5 SamudrACE: corrector-free ocean, MSE FTO only (6-hourly ACE2S).
# Generated by make_ssp245_configs.py; launch with launch-1deg-ufs-era5-ssp245.sh.
experiment_dir: /results
n_coupled_steps: 6200
coupled_steps_in_memory: 10
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
initial_condition:
  ocean:
    path: /climate-default/2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
    engine: zarr
  atmosphere:
    path: /climate-default/2026-03-19-era5-1deg-8layer-1940-2025.zarr
    engine: zarr
  start_indices:
    times:
    - '2015-01-20T18:00:00'
forcing_loader:
  num_data_workers: 2
  atmosphere:
    dataset:
      data_path: /climate-default
      file_pattern: 2026-04-07-cm4-ssp245-ACE-forcing-dataset.zarr
      engine: zarr
  ocean:
    dataset:
      data_path: /oceanforcing
      file_pattern: ocean_forcing_ssp245.zarr
      engine: zarr
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
    - thetao_0
    - thetao_5
    - thetao_10
    - thetao_18
    - so_0
    - ocean_sea_ice_fraction
    - sea_ice_volume
    - hfds_total_area
    - zos
  atmosphere:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - surface_temperature
    - TMP2m
    - PRESsfc
    - PRATEsfc
    - DSWRFsfc
    - DLWRFsfc
    - ULWRFsfc
    - USWRFsfc
    - LHTFLsfc
    - SHTFLsfc
    - DSWRFtoa
    - ULWRFtoa
    - USWRFtoa
    - eastward_surface_stress
    - northward_surface_stress
    - sea_ice_fraction
    - ocean_fraction
    - h500
    - TMP850
aggregator:
  log_global_mean_time_series: true
