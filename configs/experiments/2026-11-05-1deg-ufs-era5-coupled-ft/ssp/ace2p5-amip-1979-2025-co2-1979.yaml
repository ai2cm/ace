# AMIP-style run of a CM4-line ACE2.5 atmosphere, 1979-01-01 .. 2025, ERA5 SST and sea ice, carbon_dioxide held at 336.67 ppmv (its 1979 mean).
# Generated by make_amip_co2_configs.py; launch with launch-1deg-era5-ace2p5-amip-co2.sh.
aggregator:
  log_global_mean_time_series: true
allow_incompatible_dataset: true
checkpoint_path: /ckpt.tar
data_writer:
  names:
  - surface_temperature
  - TMP2m
  - PRESsfc
  - PRATEsfc
  - DSWRFsfc
  - DLWRFsfc
  - ULWRFsfc
  - USWRFsfc
  - LHTFLsfc
  - SHTFLsfc
  - DSWRFtoa
  - ULWRFtoa
  - USWRFtoa
  - sea_ice_fraction
  - ocean_fraction
  - h500
  - TMP850
  - air_temperature_7
  - air_temperature_0
  - air_temperature_1
  - PRMSL
  save_monthly_files: true
  save_prediction_files: false
experiment_dir: /results
forcing_loader:
  dataset:
    merge:
    - data_path: /climate-default
      engine: zarr
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      overwrite:
        multiply_scalar:
          PRMSL: 0.01
    - data_path: /extra
      engine: zarr
      file_pattern: ace2p5_era5_extra.zarr
      overwrite:
        constant:
          carbon_dioxide: 336.67
  num_data_workers: 2
forward_steps_in_memory: 40
initial_condition:
  engine: zarr
  path: /climate-default/2026-03-19-era5-1deg-8layer-1940-2025.zarr
  start_indices:
    times:
    - '1979-01-01T00:00:00'
logging:
  entity: ai2cm
  log_to_file: true
  log_to_screen: true
  log_to_wandb: true
  project: ace-samudra-coupled-cm4
n_forward_steps: 68640
stepper_override:
  derived_forcings: {}
