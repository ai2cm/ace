# Fixed-SST stepped-CO2 sweep member: 10-yr prescribed-SST run (SSP2-4.5 forcing store 2015-01-20..2025-01-20) with global_mean_co2 = 500 ppm.
# Generated by make_co2sweep_configs.py; launch with launch-1deg-era5-co2sweep.sh.
experiment_dir: /results
n_forward_steps: 14600
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
initial_condition:
  path: /climate-default/2026-03-19-era5-1deg-8layer-1940-2025.zarr
  engine: zarr
  start_indices:
    times:
    - '2015-01-20T18:00:00'
forcing_loader:
  num_data_workers: 2
  dataset:
    data_path: /climate-default
    file_pattern: 2026-04-07-cm4-ssp245-ACE-forcing-dataset.zarr
    engine: zarr
    overwrite:
      constant:
        global_mean_co2: 0.0005
data_writer:
  save_prediction_files: false
  save_monthly_files: true
  names:
  - surface_temperature
  - TMP2m
  - PRESsfc
  - PRATEsfc
  - DSWRFsfc
  - DLWRFsfc
  - ULWRFsfc
  - USWRFsfc
  - LHTFLsfc
  - SHTFLsfc
  - DSWRFtoa
  - ULWRFtoa
  - USWRFtoa
  - sea_ice_fraction
  - ocean_fraction
  - h500
  - TMP850
  - air_temperature_7
  - air_temperature_0
aggregator:
  log_global_mean_time_series: true
