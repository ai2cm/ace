# bash configs/experiments/2026-10-22-ACE2-ERA5-constant-CO2/run-evaluators.sh
# ACE2-ERA5 (ace2-paper evaluator-era5-main checkpoint, Beaker dataset
# 01J4MT10JPQ8MFA41F2AXGFYJ9) from 1940-01-01T12:00 through 2020-12-31T18:00.
# Standard run: CO2 follows the observed record.
experiment_dir: /results
n_forward_steps: 118341 # through 2020-12-31T18:00
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
loader:
  start_indices:
    times:
      - "1940-01-01T12:00:00"
  dataset:
    data_path: /climate-default/2024-06-20-era5-1deg-8layer-1940-2022-netcdfs
  num_data_workers: 8
aggregator:
  log_histograms: true
  log_zonal_mean_images: false
  log_global_mean_time_series: false
  log_global_mean_norm_time_series: false
data_writer:
  save_prediction_files: false
  save_monthly_files: false
