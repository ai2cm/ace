# Test-set inference for video-pmd-spatiotemporal-25km-100km-global-5ch-flat-v1,
# region 3 of 4 needed to tile the full modeled domain (lat -88..88, lon
# 0..360) -- see ../2026-07-24-video-pmd-spatiotemporal-25km-100km-test-inference/
# for region 1 (lat -44..44, lon 0..180) and its OOM rationale.
#
# This region: the NORTHERN polar cap, lat 44..88, FULL longitude (0..360).
# Same total fine-pixel count as one of the mid-latitude quarters (176x1440
# = 352x720), just a different aspect ratio, so expected to fit in memory
# the same way region 1 did (attention memory scales with total H*W, not
# aspect ratio -- verified divisible by 16 for the 4 downsample levels:
# 176/16=11, 1440/16=90).
#
# Combined with the south-cap region and the two mid-latitude quarters,
# tiles the full lat -88..88 range with zero gap/overlap -- verified by
# replicating fme.downscaling.data.utils.adjust_fine_coord_range against the
# real fine/coarse coordinate arrays before launching: this region's fine
# lat range is [44.0026, 87.6260] (fine index [536, 711]), region 1's ends at
# fine lat index 535 (43.7533 deg) -- exact complement, no shared/duplicate
# grid points. Note -88/88 (not +-90) is this project's established "global"
# domain boundary throughout (matches training's lat_extent and the raw
# truth data's own convention) -- the outermost ~8 fine points right at each
# pole are excluded project-wide, not a gap introduced by this tiling.
#
# Checkpoint: same dataset as region 1 (01KYQG2PTJKRGNWZXTMR6MVC8B).
#
# model:/test_data: pasted verbatim from
# ../2026-07-24-video-pmd-spatiotemporal-25km-100km/video_train.yaml's own
# model:/test_data: blocks -- only data.lat_extent/lon_extent and
# output_path differ from region 1's yaml.
checkpoint_path: /checkpoint/checkpoints/latest.ckpt
experiment_dir: /results
output_path: /climate-default/2026-06-25-temporal-diffusion/inference/video-pmd-spatiotemporal-25km-100km-global-5ch-flat-v1/test-2023-2024-ens4-region-lat44to88-lon0to360.zarr
n_ensemble: 4
ensemble_chunk_size: 1
use_ema: true
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: video-pmd-spatiotemporal-25km-100km-global-5ch-flat-v1-test-inference-latNcap
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  # Northern polar cap, full longitude -- see header.
  lat_extent:
    start: 44
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  endpoints_observed: true
  endpoint_super_resolution:
    module:
      type: unet_diffusion_song
      config:
        model_channels: 64
        channel_mult: [1, 2, 2, 2]
        attn_resolutions: []
    loss:
      type: MSE
    training_noise_distribution:
      p_mean: -1.2
      p_std: 1.8
    coarse_shape: [176, 288]
    sigma_min: 0.002
    sigma_max: 150.0
    churn: 0.0
    num_diffusion_generation_steps: 18
    loss_weight: 1.0
  temporal_noise_correlation: independent
  log_transform_channels:
    PRATEsfc: 86400.0
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
