# 1deg UFS + ERA5 coupled fine-tune, one-stage joint recipe with the CM4 X6 learning-rate schedules (X4 otherwise).
# Generated by make_config.py.
# Launch: VARIANT=x6 ./launch.sh
experiment_dir: /results
save_checkpoint: true
ema_checkpoint_save_epochs:
  step: 1
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 16
inference:
- name: inference_10yr
  weight: 1.0
  n_coupled_steps: 730
  coupled_steps_in_memory: 2
  loader:
    num_data_workers: 2
    start_indices:
      times:
      - '2012-01-01T18:00:00'
      - '2012-04-05T18:00:00'
      - '2012-07-04T18:00:00'
      - '2012-10-02T18:00:00'
      - '2013-01-05T18:00:00'
      - '2013-04-05T18:00:00'
      - '2013-07-04T18:00:00'
      - '2013-10-02T18:00:00'
    dataset:
      ocean:
        data_path: /climate-default
        file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
        engine: zarr
      atmosphere:
        merge:
        - data_path: /era5frac
          file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          overwrite:
            multiply_scalar:
              PRMSL: 0.01
        - data_path: /climate-default
          file_pattern: 2026-11-17-era5-1deg-ace2p5-extra-1940-2025.zarr
          engine: zarr
  aggregator:
    log_zonal_mean_images: false
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: metrics
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  dataset:
    concat:
    - ocean:
        data_path: /climate-default
        file_pattern: 2026-10-06-ufs-replay-ocean-1deg-19level-1994-2023-cm4vars.zarr
        engine: zarr
        subset:
          start_time: '1994-01-05T18:00:00'
          stop_time: '2001-12-31T18:00:00'
      atmosphere:
        merge:
        - data_path: /era5frac
          file_pattern: 2026-11-05-era5-1deg-6h-ufs-coupled-fractions-1994-2023.zarr
          engine: zarr
          subset:
            start_time: '1994-01-05T18:00:00'
            stop_time: '2001-12-31T18:00:00'
        - data_path: /climate-default
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          overwrite:
            multiply_scalar:
              PRMSL: 0.01
          subset:
            start_time: '1994-01-05T18:00:00'
            stop_time: '2001-12-31T18:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-17-era5-1deg-ace2p5-extra-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '1994-01-05T18:00:00'
            stop_time: '2001-12-31T18:00:00'
