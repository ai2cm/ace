# 1979-2014 rollout against ERA5, scored for the in-sample trend: the fine-tunes' inline
# long_36year rollout (same 8 initial conditions, length and aggregator), run through the
# evaluator so the same checkpoint can be scored with the latent clip on and off.
experiment_dir: /results
n_forward_steps: 13141
forward_steps_in_memory: 73
checkpoint_path: /ckpt.tar
logging:
  project: ace
loader:
  start_indices:
    times:
    - '1979-01-01T00:00:00'
    - '1979-01-02T00:00:00'
    - '1979-01-03T00:00:00'
    - '1979-01-04T00:00:00'
    - '1979-01-05T00:00:00'
    - '1979-01-06T00:00:00'
    - '1979-01-07T00:00:00'
    - '1979-01-08T00:00:00'
  dataset:
    data_path: /climate-default
    file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
    engine: zarr
  num_data_workers: 8
aggregator:
  step_means: []
  ensembles: []
  histogram:
    enabled: true
  time_mean_reference_data: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/time-mean.nc
data_writer:
  save_prediction_files: false
  save_monthly_files: false
