# ACE2.2's recipe at 4 degrees daily in AIMIP mode, stage 2: ACE2.2's 40-epoch multi-step
# fine-tune (1, 2, 4, 12 or 20 steps sampled per batch, loss on the last step).
# ../2026-10-23-ace25-aimip-4deg/finetune.yaml with those training settings and no h500 loss
# weight. Shared by all arms: the launcher mounts the arm's pretrain result dataset at
# /weights, and architecture and inputs come from that checkpoint. The model evaluated is
# this stage's epoch-40 EMA checkpoint.
seed: 0
experiment_dir: /results
save_checkpoint: true
checkpoint_save_epochs:
  step: 5
ema_checkpoint_save_epochs:
  step: 5
validate_using_ema: true
max_epochs: 40
ema:
  decay: 0.999
inference:
- name: inference
  n_forward_steps: 1825
  forward_steps_in_memory: 73
  n_ensemble_per_ic: 3
  loader:
    start_indices:
      times:
      - '1996-01-01T00:00:00'
      - '1996-02-15T00:00:00'
      - '1996-04-01T00:00:00'
      - '1996-05-15T00:00:00'
      - '1996-07-01T00:00:00'
      - '1996-08-15T00:00:00'
      - '1996-10-01T00:00:00'
      - '1996-11-15T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
    num_data_workers: 8
  aggregator:
    step_means:
    - step: 5
      target: denorm
    - step: 5
      target: norm
    ensembles:
    - step: 5
    histogram:
      enabled: true
    time_mean_reference_data: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/time-mean.nc
- name: long_36year
  weight: 0.0
  epochs:
    start: 4
    step: 5
  n_forward_steps: 13141
  forward_steps_in_memory: 73
  loader:
    start_indices:
      times:
      - '1979-01-01T00:00:00'
      - '1979-01-02T00:00:00'
      - '1979-01-03T00:00:00'
      - '1979-01-04T00:00:00'
      - '1979-01-05T00:00:00'
      - '1979-01-06T00:00:00'
      - '1979-01-07T00:00:00'
      - '1979-01-08T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
    num_data_workers: 8
  aggregator:
    step_means: []
    ensembles: []
    histogram:
      enabled: true
    time_mean_reference_data: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 4
  time_buffer: 8
  time_buffer_pool_size: 32
  dataset:
    concat:
    - data_path: /climate-default
      engine: zarr
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      subset:
        start_time: '1979-01-01'
        stop_time: '1993-12-31'
    - data_path: /climate-default
      engine: zarr
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      subset:
        start_time: '1995-01-01'
        stop_time: '2013-12-31'
validation:
  evaluate_all_steps: false
  loader:
    batch_size: 32
    num_data_workers: 8
    prefetch_factor: 2
    time_buffer: 16
    dataset:
      concat:
      - data_path: /climate-default
        engine: zarr
        file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
        subset:
          start_time: '1994-01-01'
          stop_time: '1994-12-31'
      - data_path: /climate-default
        engine: zarr
        file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
        subset:
          start_time: '2014-01-01'
          stop_time: '2014-12-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
  optimize_last_step_only: true
  parameter_init:
    weights_path: /weights/training_checkpoints/best_ckpt.tar
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  checkpoint_path: /weights/training_checkpoints/best_ckpt.tar
