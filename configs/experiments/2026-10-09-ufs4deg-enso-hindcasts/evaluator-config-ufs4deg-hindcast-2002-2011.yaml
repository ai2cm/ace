# Ocean-only ENSO hindcasts of a UFS 4deg checkpoint on the untouched 2002-2011 decade: 120 monthly ICs (first 5-day
# sample of each month) x 128 five-day steps (~21 months). The forcing comes from the mounted store: the training store
# (true replay forcing = forced-ocean ceiling, the atmosphere carries the ENSO signal) or its climatological-forcing
# copy (the 10 forcing fields replaced by their training-years pentad climatology: the ocean's own ENSO memory).
# Launcher: launch-ufs4deg-hindcasts.sh (MODE=true|clim selects the dataset mounted at /ufs4deg).
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_forward_steps: 128
forward_steps_in_memory: 8
loader:
  num_data_workers: 2
  dataset:
    data_path: /ufs4deg
