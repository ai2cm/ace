# resid-cap0005-learnedheat-sstfill273.yaml: as resid-cap0005-learnedheat.yaml with the input land fill for `sst`
# set to 273.15 K (every other channel keeps fill 0.0). This mimics converting SST to Celsius in the loader: over land
# the SST input is then 0 C = -1.2 sigma like thetao_0, instead of 0 K = -24.5 sigma (Troy, 2026-10-09).
# resid-cap0005-learnedheat.yaml: UFS 4deg from scratch, residual, capped 0.5% scaled corrector, with the column-budget residual LEARNED as a
# diagnostic output channel `unaccounted_heating` (W/m2 per cell; trailing 1-yr mean of dOHC/dt minus the
# rebuilt surface flux, stored in the training zarr) whose ocean-area mean replaces the constant unaccounted
# heating in the heat-content corrector (unaccounted_heating_source: generated). Otherwise identical to
# ../2026-10-06-ufs4deg-ftcm4/scratch-resid-ohc-cap0005.yaml. Needs the "-uh" training dataset and stats (see plan.md).
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 200
inference:
- name: inference_10yr
  weight: 1.0
  n_forward_steps: 730
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '2012-01-01T18:00:00'
      - '2013-01-05T18:00:00'
    dataset:
      data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
    num_data_workers: 4
  aggregator:
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    concat:
    - data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
      subset:
        start_time: '1994-01-05T18:00:00'
        stop_time: '2002-01-01T00:00:00'
    - data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
      subset:
        start_time: '2012-01-01T00:00:00'
        stop_time: '2022-01-01T00:00:00'
    strict: true
validation:
- name: val_2022_2023
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 16
    num_data_workers: 8
    dataset:
      data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
      subset:
        start_time: '2022-01-03T18:00:00'
optimization:
  use_gradient_accumulation: true
  max_grad_norm: 1.0
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 4
  loss:
    type: MSE
stepper:
  input_masking:
    mask_value: 0
    fill_value: 0.0
    fill_values:
      sst: 273.15  # 0 C: the land fill SST would get in Celsius (-1.2 sigma) instead of 0 K (-24.5 sigma)
    exclude_names_and_prefixes:
    - land_fraction
    - sea_surface_fraction
    - DLWRFsfc
    - DSWRFsfc
    - ULWRFsfc
    - USWRFsfc
    - LHTFLsfc
    - SHTFLsfc
    - PRATEsfc
    - total_frozen_precipitation_rate
  step:
    type: single_module
    config:
      builder:
        type: Samudra
        config:
          ch_width:
          - 280
          - 380
          - 480
          - 520
          dilation:
          - 1
          - 2
          - 4
          - 4
          n_layers:
          - 1
          - 1
          - 1
          - 1
          norm: instance
          zonally_periodic_upsample: true
      normalization:
        network:
          global_means_path: /ocean_stats/centering.nc
          global_stds_path: /ocean_stats/scaling-full-field.nc
        residual:
          global_means_path: /ocean_stats/centering.nc
          global_stds_path: /ocean_stats/scaling-residual.nc
      corrector:
        type: ocean_corrector
        config:
          surface_energy_flux_correction:
            method: prescribed
          ocean_heat_content_correction:
            method: scaled_temperature
            unaccounted_heating_source: generated
            max_scaled_contraction: 0.005
          force_positive_names:
          - so_0
          - so_1
          - so_2
          - so_3
          - so_4
          - so_5
          - so_6
          - so_7
          - so_8
          - so_9
          - so_10
          - so_11
          - so_12
          - so_13
          - so_14
          - so_15
          - so_16
          - so_17
          - so_18
          - sea_ice_volume
          sea_ice_fraction_correction:
            sea_ice_fraction_name: ocean_sea_ice_fraction
            land_fraction_name: land_fraction
            remove_negative_ocean_fraction: false
            zero_where_ice_free_names:
            - sea_ice_volume
      residual_prediction:
        normalized: true
        names:
        - thetao_0
        - thetao_1
        - thetao_2
        - thetao_3
        - thetao_4
        - thetao_5
        - thetao_6
        - thetao_7
        - thetao_8
        - thetao_9
        - thetao_10
        - thetao_11
        - thetao_12
        - thetao_13
        - thetao_14
        - thetao_15
        - thetao_16
        - thetao_17
        - thetao_18
      next_step_forcing_names:
      - DLWRFsfc
      - DSWRFsfc
      - ULWRFsfc
      - USWRFsfc
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      - eastward_surface_wind_stress
      - northward_surface_wind_stress
      - total_frozen_precipitation_rate
      in_names:
      - land_fraction
      - sea_surface_fraction
      - deptho
      - DLWRFsfc
      - DSWRFsfc
      - ULWRFsfc
      - USWRFsfc
      - LHTFLsfc
