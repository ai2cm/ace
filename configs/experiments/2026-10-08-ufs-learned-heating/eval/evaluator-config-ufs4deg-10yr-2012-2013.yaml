# 10-year ocean-only rollouts of a UFS 4deg checkpoint from the two inline-inference starts (2012-01-01T18 and
# 2013-01-05T18, inside the training years), with monthly surface, upper-ocean, sea-ice and learned-heating fields
# written so the learned unaccounted heating's ocean-mean series can be compared with the data's.
experiment_dir: /results
n_forward_steps: 730
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '2012-01-01T18:00:00'
    - '2013-01-05T18:00:00'
  dataset:
    data_path: /ufs4deg
    file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
    engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: true
  names: [sst, thetao_0, thetao_5, thetao_10, ocean_sea_ice_fraction, hfds_total_area, unaccounted_heating]
aggregator:
  log_histograms: false
