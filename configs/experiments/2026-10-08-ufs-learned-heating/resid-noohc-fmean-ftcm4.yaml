# resid-noohc-fmean-ftcm4: UFS 4deg fine-tune (cm4vars-uh store, UFS stats + placeholder entries, 60 ep, lr 5e-5) of the NO-corrector CM4 ppad
# pretraining resid-noohc-ppad-fmean (samudra-ppad4deg-resid-noohc-ppad-fmean); stepper = that pretraining's (no ocean_heat_content_correction, no
# learned heating), corrector_disabled_epochs 0, zos reference 0.0. Generated by make_noohc_ftcm4_configs.py. Troy 2026-10-24.
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 60
inference:
- name: inference_10yr
  weight: 1.0
  n_forward_steps: 730
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '2012-01-01T18:00:00'
      - '2013-01-05T18:00:00'
    dataset:
      data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
    num_data_workers: 4
  aggregator:
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    concat:
    - data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
      subset:
        start_time: '1994-01-05T18:00:00'
        stop_time: '2002-01-01T00:00:00'
    - data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
      subset:
        start_time: '2012-01-01T00:00:00'
        stop_time: '2022-01-01T00:00:00'
    strict: true
validation:
- name: val_2022_2023
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 16
    num_data_workers: 8
    dataset:
      data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
      subset:
        start_time: '2022-01-03T18:00:00'
optimization:
  use_gradient_accumulation: true
  max_grad_norm: 1.0
  enable_automatic_mixed_precision: false
  lr: 5.0e-05
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 4
  loss:
    type: MSE
  parameter_init:
    weights_path: /ckpt.tar
evaluate_before_training: true
stepper:
  input_masking:
    mask_value: 0
    fill_value: mean
    exclude_names_and_prefixes:
    - land_fraction
    - sea_surface_fraction
  step:
    type: single_module
    config:
      builder:
        type: Samudra
        config:
          ch_width:
          - 280
          - 380
          - 480
          - 520
          dilation:
          - 1
          - 2
          - 4
          - 2
          n_layers:
          - 1
          - 1
          - 1
          - 1
          norm: instance
          zonally_periodic_upsample: true
          lat_pad: pole
      normalization:
        network:
          global_means_path: /ocean_stats/centering.nc
          global_stds_path: /ocean_stats/scaling-full-field.nc
        residual:
          global_means_path: /ocean_stats/centering.nc
          global_stds_path: /ocean_stats/scaling-residual.nc
      corrector:
        type: ocean_corrector
        config:
          corrector_disabled_epochs: 0
          surface_energy_flux_correction:
            method: prescribed_open_ocean
          force_positive_names:
          - so_0
          - so_1
          - so_2
          - so_3
          - so_4
          - so_5
          - so_6
          - so_7
          - so_8
          - so_9
          - so_10
          - so_11
          - so_12
          - so_13
          - so_14
          - so_15
          - so_16
          - so_17
          - so_18
          - sea_ice_volume
          sea_ice_fraction_correction:
            sea_ice_fraction_name: ocean_sea_ice_fraction
            land_fraction_name: land_fraction
            remove_negative_ocean_fraction: false
            zero_where_ice_free_names:
            - sea_ice_volume
            - sfdsi
            - UI
            - VI
          zos_global_mean_correction:
            reference_global_mean: 0.0
      residual_prediction:
        normalized: true
        names:
        - thetao_0
        - thetao_1
        - thetao_2
        - thetao_3
        - thetao_4
        - thetao_5
        - thetao_6
        - thetao_7
        - thetao_8
        - thetao_9
        - thetao_10
        - thetao_11
        - thetao_12
        - thetao_13
        - thetao_14
        - thetao_15
        - thetao_16
        - thetao_17
        - thetao_18
