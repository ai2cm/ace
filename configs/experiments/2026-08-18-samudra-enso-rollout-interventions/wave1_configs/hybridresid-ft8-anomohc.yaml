# Multi-step fine-tune: does training on longer rollouts give a FULL-FIELD
# ocean the long-lead ENSO skill that residual prediction currently supplies?
#
# The team's protocol has a second stage we have never run -- 10 epochs at
# ENSO check for the anomaly-scaled corrector: identical to hybridresid-ft8 except
# the heat-content correction contracts about the 1-degree climatological profile
# (anomaly_scaled_temperature) instead of about 0 C. Same checkpoint, same 8-step
# 10-epoch schedule, so the 240-IC comparison isolates the corrector.
# stepper_training.n_forward_steps 8 instead of 4, from the pretrain's own
# checkpoint -- and it is worth a lot of climate skill for them (their
# full-field baseline 0.047 -> 0.034, their residual arm 0.049 -> 0.038). Nobody
# has measured what it does to FORECAST skill, and longer-rollout training is
# exactly the change that should help at long leads, which is where full-field
# loses to residual (0.44 vs 0.57 at lead 6 on the matched 240-IC pair).
#
# Two arms, each fine-tuning its own matched pretrain, so the 240-IC comparison
# afterwards is like-for-like:
#   baseline-ft8    <- 01KW2BQ83EGZ90WZ74CZ4TJATN, full-field  (climate 0.048)
#   hybridresid-ft8 <- 01M1Q9P68PK7DC5W0KHGWFTWFN, residual    (climate 0.057)
# The two pretrains differ ONLY in residual_prediction (verified by diffing the
# baseline's saved config against hybridresid-pretrain.yaml).
#
# THIS ARM: residual pretrain + 8-step fine-tune
experiment_dir: /results
evaluate_before_training: true
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 10
inference:
  n_forward_steps: 1440
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '0251-01-03T12:00:00'
      - '0262-06-22T12:00:00'
      - '0273-12-09T12:00:00'
      - '0285-05-28T12:00:00'
      - '0296-11-14T12:00:00'
      - '0308-05-03T12:00:00'
      - '0319-10-20T12:00:00'
      - '0331-04-08T12:00:00'
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-10-16-cm4-1pctCO2-140yr-ocean-no-smoothing.zarr
        engine: zarr
    num_data_workers: 4
  aggregator:
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-ocean.zarr
      engine: zarr
      subset:
        start_time: '0256-01-03T12:00:00'
    - data_path: /climate-default
      file_pattern: 2025-10-16-cm4-1pctCO2-140yr-ocean-no-smoothing.zarr
      engine: zarr
      subset:
        start_time: '0256-01-03T12:00:00'
validation:
  loader:
    batch_size: 16
    num_data_workers: 8
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-ocean.zarr
        engine: zarr
        subset:
          start_time: '0251-01-03T12:00:00'
          stop_time: '0255-12-29T12:00:00'
      - data_path: /climate-default
        file_pattern: 2025-10-16-cm4-1pctCO2-140yr-ocean-no-smoothing.zarr
        engine: zarr
        subset:
          start_time: '0251-01-03T12:00:00'
          stop_time: '0255-12-29T12:00:00'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 8
  loss:
    type: MSE
  parameter_init:
    weights_path: /ckpt.tar
stepper:
  input_masking:
    mask_value: 0
    fill_value: 0.0
    exclude_names_and_prefixes:
    - land_fraction
    - DLWRFsfc
    - DSWRFsfc
    - ULWRFsfc
    - USWRFsfc
    - LHTFLsfc
    - SHTFLsfc
    - PRATEsfc
    - eastward_surface_wind_stress
    - northward_surface_wind_stress
    - total_frozen_precipitation_rate
  step:
    type: single_module
    config:
      builder:
        type: Samudra
        config:
          ch_width:
          - 200
          - 250
          - 300
          - 400
          dilation:
          - 1
          - 2
          - 4
          - 8
          n_layers:
          - 1
          - 1
          - 1
          - 1
          norm: instance
      normalization:
        network:
          global_means_path: /ocean_stats/ocean/centering.nc
          global_stds_path: /ocean_stats/ocean/scaling-full-field.nc
        residual:
          global_means_path: /ocean_stats/ocean/centering.nc
          global_stds_path: /ocean_stats/ocean/scaling-residual.nc
      corrector:
        type: ocean_corrector
        config:
          force_positive_names:
          - so_0
          - so_1
          - so_2
          - so_3
          - so_4
          - so_5
          - so_6
          - so_7
          - so_8
          - so_9
          - so_10
          - so_11
          - so_12
          - so_13
          - so_14
          - so_15
          - so_16
          - so_17
          - so_18
          - sea_ice_volume
          sea_ice_fraction_correction:
            sea_ice_fraction_name: ocean_sea_ice_fraction
            land_fraction_name: land_fraction
            remove_negative_ocean_fraction: false
            zero_where_ice_free_names:
            - sea_ice_volume
          surface_energy_flux_correction:
            method: prescribed
          ocean_heat_content_correction:
            method: anomaly_scaled_temperature
            max_anomaly_contraction: 0.1
