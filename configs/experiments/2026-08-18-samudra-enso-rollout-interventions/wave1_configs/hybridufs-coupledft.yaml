seed: 1
experiment_dir: /results
save_checkpoint: true
save_best_inference_epoch_checkpoints: false
checkpoint_every_n_batches: 100
checkpoint_save_epochs: null
log_train_every_n_batches: 10
train_evaluation_samples: 32
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 25
inference:
  n_coupled_steps: 140
  coupled_steps_in_memory: 2
  loader:
    num_data_workers: 4
    dataset:
      ocean:
        data_path: gs://vcm-ml-intermediate
        file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023-t12shift.zarr
        engine: zarr
      atmosphere:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
    start_indices:
      times:
      - '2022-01-01T12:00:00'
  aggregator:
    log_zonal_mean_images: false
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  dataset:
    concat:
    - ocean:
        data_path: gs://vcm-ml-intermediate
        file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023-t12shift.zarr
        engine: zarr
        subset:
          start_time: '1994-01-03T12:00:00'
          stop_time: '2001-12-27T12:00:00'
      atmosphere:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1994-01-03T12:00:00'
          stop_time: '2001-12-27T12:00:00'
    - ocean:
        data_path: gs://vcm-ml-intermediate
        file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023-t12shift.zarr
        engine: zarr
        subset:
          start_time: '2012-01-04T12:00:00'
          stop_time: '2021-12-27T12:00:00'
      atmosphere:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2012-01-04T12:00:00'
          stop_time: '2021-12-27T12:00:00'
validation:
  loader:
    batch_size: 16
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        data_path: gs://vcm-ml-intermediate
        file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023-t12shift.zarr
        engine: zarr
        subset: &id001
          start_time: '2022-01-01T00:00:00'
      atmosphere:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset: *id001
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 1.0e-05
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    schedulers:
    - type: LinearLR
      step_each_iteration: true
      kwargs:
        start_factor: 0.01
        end_factor: 1
        total_iters: 3000
    - type: ConstantLR
      step_each_iteration: true
    milestones:
    - 3000
stepper_training:
  n_coupled_steps: 4
  n_ensemble: 2
  ocean:
    parameter_init:
      weights_path: /ocean_ckpt.tar
    loss_weight: 1.0
    n_steps:
      outcomes:
      - steps: 0
        probability: 0.1
      - steps: 1
        probability: 0.3
      - steps: 2
        probability: 0.3
      - steps: 4
        probability: 0.3
    optimize_last_step_only: true
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    parameter_init:
      weights_path: /atmos_ckpt.tar
    loss_weight: 1.0
    n_steps:
      outcomes:
      - steps: 0
        probability: 0.025
      - steps: 1
        probability: 0.29
      - steps: 2
        probability: 0.29
      - steps: 4
        probability: 0.29
      - steps: 21
        probability: 0.1
      - steps: 41
        probability: 0.05
    optimize_last_step_only: true
    loss:
      type: EnsembleLoss
      weights:
        air_temperature_0: 0.5
        air_temperature_1: 0.5
        eastward_wind_0: 0.5
        northward_wind_0: 0.5
        specific_total_water_0: 0.5
        specific_total_water_1: 0.25
        specific_total_water_2: 0.5
        PRATEsfc: 0.5
        h500: 10
        TMP850: 5
        Q2m: 0.5
        TMP2m: 10
        UGRD10m: 2.5
        VGRD10m: 2.5
        DLWRFsfc: 2
        ULWRFsfc: 5
        USWRFsfc: 2
        DSWRFsfc: 2
        USWRFtoa: 2
        tendency_of_total_water_path_due_to_advection: 0.5
        PRESsfc: 3
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
