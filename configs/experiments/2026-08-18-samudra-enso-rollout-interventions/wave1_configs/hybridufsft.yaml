experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 40
inference:
  n_forward_steps: 630
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '2012-01-04T09:00:00'
      - '2013-01-03T09:00:00'
      - '2014-01-03T09:00:00'
      - '2015-01-03T09:00:00'
    dataset:
      data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023.zarr
      engine: zarr
    num_data_workers: 4
  aggregator:
    log_histograms: false
    enso_coefficient:
      enabled: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    concat:
    - data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023.zarr
      engine: zarr
      subset:
        stop_time: '2001-12-27T09:00:00'
    - data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023.zarr
      engine: zarr
      subset:
        start_time: '2012-01-04T09:00:00'
        stop_time: '2021-12-27T09:00:00'
validation:
  loader:
    batch_size: 16
    num_data_workers: 8
    dataset:
      data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023.zarr
      engine: zarr
      subset:
        start_time: '2022-01-01T09:00:00'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 3.0e-05
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 4
  loss:
    type: MSE
  parameter_init:
    weights_path: /base_ckpt.tar
stepper:
  input_masking:
    mask_value: 0
    fill_value: 0.0
    exclude_names_and_prefixes:
    - land_fraction
    - DLWRFsfc
    - DSWRFsfc
    - ULWRFsfc
    - USWRFsfc
    - LHTFLsfc
    - SHTFLsfc
    - PRATEsfc
    - total_frozen_precipitation_rate
  step:
    type: single_module
    config:
      builder:
        type: Samudra
        config:
          ch_width:
          - 200
          - 250
          - 300
          - 400
          dilation:
          - 1
          - 2
          - 4
          - 8
          n_layers:
          - 1
          - 1
          - 1
          - 1
          norm: instance
      normalization:
        network:
          global_means_path: /ocean_stats/ocean/centering.nc
          global_stds_path: /ocean_stats/ocean/scaling-full-field.nc
        residual:
          global_means_path: /ocean_stats/ocean/centering.nc
          global_stds_path: /ocean_stats/ocean/scaling-residual.nc
      corrector:
        type: ocean_corrector
        config:
          force_positive_names:
          - so_0
          - so_1
          - so_2
          - so_3
          - so_4
          - so_5
          - so_6
          - so_7
          - so_8
          - so_9
          - so_10
          - so_11
          - so_12
          - so_13
          - so_14
          - so_15
          - so_16
          - so_17
          - so_18
          - sea_ice_volume
          sea_ice_fraction_correction:
            sea_ice_fraction_name: ocean_sea_ice_fraction
            land_fraction_name: land_fraction
            remove_negative_ocean_fraction: false
            zero_where_ice_free_names:
            - sea_ice_volume
          surface_energy_flux_correction:
            method: prescribed
      next_step_forcing_names:
      - DLWRFsfc
      - DSWRFsfc
      - ULWRFsfc
      - USWRFsfc
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      - eastward_surface_wind_stress
      - northward_surface_wind_stress
      - total_frozen_precipitation_rate
      in_names:
      - land_fraction
      - sea_surface_fraction
      - deptho
