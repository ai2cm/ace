experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 146
coupled_steps_in_memory: 1
loader:
  num_data_workers: 4
  dataset:
    ocean:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-ocean.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-10-16-cm4-1pctCO2-140yr-ocean-no-smoothing.zarr
        engine: zarr
    atmosphere:
      merge:
      - data_path: /climate-default
        file_pattern: 2025-10-21-cm4-1pctCO2-140yr-no-smoothing-coupled-sea_ice.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2025-06-18-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
        engine: zarr
  start_indices:
    times:
    - '0232-12-29T12:00:00'
    - '0233-02-02T12:00:00'
    - '0233-02-27T12:00:00'
    - '0233-03-29T12:00:00'
    - '0233-04-28T12:00:00'
    - '0233-06-02T12:00:00'
    - '0233-07-02T12:00:00'
    - '0233-08-01T12:00:00'
    - '0233-08-31T12:00:00'
    - '0233-09-30T12:00:00'
    - '0233-10-30T12:00:00'
    - '0233-11-29T12:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
    - zos
    - thetao_2
    - thetao_4
    - thetao_6
    - thetao_8
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
