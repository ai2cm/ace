experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 128
coupled_steps_in_memory: 1
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023-t12shift.zarr
      engine: zarr
    atmosphere:
      data_path: /climate-default/
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
  start_indices:
    times:
    - '2003-12-22T12:00:00'
    - '2004-01-26T12:00:00'
    - '2004-02-20T12:00:00'
    - '2004-03-26T12:00:00'
    - '2004-04-25T12:00:00'
    - '2004-05-25T12:00:00'
    - '2004-06-24T12:00:00'
    - '2004-07-24T12:00:00'
    - '2004-08-23T12:00:00'
    - '2004-09-22T12:00:00'
    - '2004-10-22T12:00:00'
    - '2004-11-21T12:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: true
    names:
    - sst
    - thetao_0
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
