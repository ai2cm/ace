experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 128
coupled_steps_in_memory: 1
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-06-29-ufs-replay-ocean-1deg-19level-5day-1994-2023-t12shift.zarr
      engine: zarr
    atmosphere:
      data_path: /climate-default/
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
  start_indices:
    times:
    - '2007-12-26T12:00:00'
    - '2008-01-25T12:00:00'
    - '2008-02-24T12:00:00'
    - '2008-03-25T12:00:00'
    - '2008-04-24T12:00:00'
    - '2008-05-24T12:00:00'
    - '2008-06-23T12:00:00'
    - '2008-07-23T12:00:00'
    - '2008-08-22T12:00:00'
    - '2008-09-21T12:00:00'
    - '2008-10-26T12:00:00'
    - '2008-11-25T12:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: true
    names:
    - sst
    - thetao_0
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
