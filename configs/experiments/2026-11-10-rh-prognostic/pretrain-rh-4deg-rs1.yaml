# Prognostic relative humidity: the corrector-off control
# (pretrain-corroff-4deg-rs1.yaml) with specific_total_water_<k> replaced by
# relative_humidity_<k> in in_names/out_names. The loader derives
# relative_humidity_<k> = specific_total_water_<k> / q_sat(air_temperature_<k>,
# layer-mean pressure), Bolton (1980) over liquid water, unclipped
# (derive_relative_humidity on every dataset). RH is not in
# force_positive_names. RH normalization stats are hard-coded (no stats file):
# unweighted mean/std and one-step-difference std over 1990-01-01..2019-12-31
# of the same store, computed with the script beside the research record
# experiments/2026-11-10-rh-prognostic-4deg/compute_rh_stats.py; the network
# and residual means are the full-field means.
seed: 1
experiment_dir: /results
save_checkpoint: true
checkpoint_save_epochs:
  start: 36
ema_checkpoint_save_epochs:
  start: 10
  step: 10
validate_using_ema: true
max_epochs: 40
ema:
  decay: 0.999
inference:
- name: inference
  n_forward_steps: 1825
  forward_steps_in_memory: 73
  n_ensemble_per_ic: 3
  loader:
    start_indices:
      times:
      - '1996-01-01T00:00:00'
      - '1996-02-15T00:00:00'
      - '1996-04-01T00:00:00'
      - '1996-05-15T00:00:00'
      - '1996-07-01T00:00:00'
      - '1996-08-15T00:00:00'
      - '1996-10-01T00:00:00'
      - '1996-11-15T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      derive_relative_humidity: true
    num_data_workers: 8
  aggregator:
    step_means:
    - step: 5
      target: denorm
    - step: 5
      target: norm
    ensembles:
    - step: 5
    histogram:
      enabled: true
    time_mean_reference_data: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/time-mean.nc
- name: long_81year
  weight: 0.0
  epochs:
    start: 4
    step: 5
  n_forward_steps: 29565
  forward_steps_in_memory: 73
  loader:
    start_indices:
      times:
      - '1940-01-03T00:00:00'
      - '1940-01-04T00:00:00'
      - '1940-01-05T00:00:00'
      - '1940-01-06T00:00:00'
      - '1940-01-07T00:00:00'
      - '1940-01-08T00:00:00'
      - '1940-01-09T00:00:00'
      - '1940-01-10T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      derive_relative_humidity: true
    num_data_workers: 8
  aggregator:
    step_means: []
    ensembles: []
    histogram:
      enabled: true
    time_mean_reference_data: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 4
  time_buffer: 8
  time_buffer_pool_size: 32
  dataset:
    concat:
    - data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      derive_relative_humidity: true
      subset:
        stop_time: '1995-12-31'
    - data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      derive_relative_humidity: true
      subset:
        start_time: '2011-01-01'
        stop_time: '2019-12-31'
    - data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      derive_relative_humidity: true
      subset:
        start_time: '2021-01-01'
validation:
  loader:
    batch_size: 32
    num_data_workers: 8
    prefetch_factor: 2
    time_buffer: 16
    dataset:
      data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      derive_relative_humidity: true
      subset:
        start_time: '1996-01-01'
        stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  optimizer_type: Muon
  lr: 0.0003
  kwargs:
    weight_decay: 0.01
    adamw_lr: 0.0001
    adamw_weight_decay: 0.01
  adamw_names:
  - W_scale
  - W_bias
  - pos_embed
stepper_training:
  n_ensemble: 2
  n_forward_steps: 1
  loss:
    type: EnsembleLoss
    weights:
      h500: 5.0
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
      normalization:
        network:
          global_means_path: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/scaling-full-field.nc
          means:
            relative_humidity_0: 0.0083771236
            relative_humidity_1: 0.11160717
            relative_humidity_2: 0.25993645
            relative_humidity_3: 0.40427002
            relative_humidity_4: 0.43954499
            relative_humidity_5: 0.49369889
            relative_humidity_6: 0.634732
            relative_humidity_7: 0.75293933
          stds:
            relative_humidity_0: 0.02490504
            relative_humidity_1: 0.19759818
            relative_humidity_2: 0.28479157
            relative_humidity_3: 0.24257804
            relative_humidity_4: 0.24644523
            relative_humidity_5: 0.23968405
            relative_humidity_6: 0.20650558
            relative_humidity_7: 0.17855024
        residual:
          global_means_path: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/scaling-residual.nc
          means:
            relative_humidity_0: 0.0083771236
            relative_humidity_1: 0.11160717
            relative_humidity_2: 0.25993645
            relative_humidity_3: 0.40427002
            relative_humidity_4: 0.43954499
            relative_humidity_5: 0.49369889
            relative_humidity_6: 0.634732
            relative_humidity_7: 0.75293933
          stds:
            relative_humidity_0: 0.0044419038
            relative_humidity_1: 0.17575794
            relative_humidity_2: 0.20740988
            relative_humidity_3: 0.24930079
            relative_humidity_4: 0.23461468
            relative_humidity_5: 0.22724259
            relative_humidity_6: 0.17969902
            relative_humidity_7: 0.1156588
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        clip_frozen_precipitation: true
        force_positive_names:
        - Q2m
        - PRATEsfc
        - total_frozen_precipitation_rate
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
        - tendency_of_total_water_path_due_to_advection
      next_step_forcing_names:
      - DSWRFtoa
      - global_mean_co2
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - relative_humidity_0
      - relative_humidity_1
      - relative_humidity_2
      - relative_humidity_3
      - relative_humidity_4
      - relative_humidity_5
      - relative_humidity_6
      - relative_humidity_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
