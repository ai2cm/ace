# Matched-unit moisture evaluation (81year window), EMA weights of the
# epoch-40 checkpoint. Launched by run-evaluate.sh.
experiment_dir: /results/81year
n_forward_steps: 29565
forward_steps_in_memory: 73
n_ensemble_per_ic: 1
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace
  entity: ai2cm
loader:
  start_indices:
    times:
    - '1940-01-03T00:00:00'
    - '1940-01-04T00:00:00'
  dataset:
    data_path: /climate-default
    file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
    engine: zarr
    derive_relative_humidity: true
  num_data_workers: 8
data_writer:
  save_prediction_files: true
  save_monthly_files: false
  names:
  - PRESsfc
  - air_temperature_3
  - air_temperature_7
  - relative_humidity_3
