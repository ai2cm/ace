# arg: --dataset 01M0RFP2DKAGABV89KRPMXX5C3:/weights
#
# Pressure-level fine-tune of the 1deg/6-hourly AIMIP-like experiment: stage 3, adding the
# AIMIP evaluation pressure-level diagnostics (1000/850/700/500/250/100/50 hPa for
# ta/hus/ua/va) via a secondary decoder head, with the trunk frozen. Donor is the stage-2
# multi-step fine-tune (...-multi-step-ft.yaml, wandb 78crdqjr): the dataset mounted above is
# that run's final-job result dataset. Beaker repopulates the results dir on each preemption
# retry, so the last job's dataset carries the whole checkpoint set. The plev fields already exist in
# the 6-hourly ERA5 store and its stats, so no separate plev dataset is needed. See README.md.
seed: 0
experiment_dir: /results
save_checkpoint: true
checkpoint_every_n_batches: 5000
validate_using_ema: true
ema_checkpoint_save_epochs:
  start: 5
  step: 5
max_epochs: 50
ema:
  decay: 0.999
inference:
  - name: 10year_insample
    weight: 1.0
    epochs:
      start: 1
      step: 2
    n_forward_steps: 14608
    forward_steps_in_memory: 40
    n_ensemble_per_ic: 1
    loader:
      start_indices:
        times:
          - '1995-01-01T06:00:00'
          - '1995-01-02T06:00:00'
          - '1995-01-03T06:00:00'
          - '1995-01-04T06:00:00'
          - '1995-01-05T06:00:00'
          - '1995-01-06T06:00:00'
          - '1995-01-07T06:00:00'
          - '1995-01-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 20
          target: denorm
          name: day_5
          variables: &inference_variables
            - PRATEsfc
            - TMP2m
            - Q2m
            - UGRD10m
            - VGRD10m
            - h500
            - TMP850
            - PRESsfc
            - surface_temperature
            - ULWRFsfc
            - DLWRFsfc
            - USWRFsfc
            - DSWRFsfc
            - ULWRFtoa
            - USWRFtoa
            - LHTFLsfc
            - SHTFLsfc
            - tendency_of_total_water_path_due_to_advection
            - air_temperature_0
            - air_temperature_1
            - air_temperature_3
            - air_temperature_7
            - specific_total_water_0
            - specific_total_water_1
            - specific_total_water_3
            - specific_total_water_7
            - eastward_wind_0
            - eastward_wind_1
            - eastward_wind_3
            - eastward_wind_7
            - northward_wind_0
            - northward_wind_1
            - northward_wind_3
            - northward_wind_7
            - total_water_path
        - step: 20
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles: []
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      histogram:
        enabled: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  time_buffer: 1
  dataset:
    strict: false
    # ERA5 production-stream stitch boundaries that fall inside the training
    # window are placed on subset boundaries, so no sample pairs across a
    # stream-to-stream jump (the global-mean 1-step finite difference at a
    # stitch is a coherent, resolution-independent bias step, out of
    # distribution as a residual target). See knowledge/era5-stitching-discontinuities.
    concat:
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1979-01-01'
          stop_time: '1986-03-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1986-04-01'
          stop_time: '1993-07-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1993-08-01'
          stop_time: '1993-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1995-01-01'
          stop_time: '1999-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2000-01-01'
          stop_time: '2009-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2010-01-01'
          stop_time: '2013-12-31'
validation:
  loader:
    batch_size: 32
    num_data_workers: 4
    prefetch_factor: 2
    time_buffer: 3
    dataset:
      strict: false
      concat:
        - data_path: /climate-default/
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '1994-01-01'
            stop_time: '1994-12-31'
        - data_path: /climate-default/
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '2014-01-01'
            stop_time: '2014-12-31'
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 1
  loss:
    type: MSE
  parameter_init:
    # best_inference_ckpt.tar, not best_ckpt.tar: the inference-error criterion is the one
    # prior checkpoint selection used, and it peaked at stage-2 epoch 8 (0.026124) and never
    # improved through epoch 40. EMA-wrapped, since stage 2 ran validate_using_ema: true.
    weights_path: /weights/training_checkpoints/best_inference_ckpt.tar
    parameters:
      # Freeze the entire donor module. The secondary decoder is a second entry in
      # stepper.modules, which _filled_parameters pads with a trainable default, so only
      # the plev head learns.
      - frozen:
          include: ["*"]
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          clip_latent_global_means: true
      normalization:
        network:
          global_means_path: /climate-default/2026-03-19-era5-1deg-8layer-stats-1990-2019/2026-03-19-era5-1deg-8layer-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-03-19-era5-1deg-8layer-stats-1990-2019/2026-03-19-era5-1deg-8layer-1940-2025/scaling-full-field.nc
        residual:
          global_means_path: /climate-default/2026-03-19-era5-1deg-8layer-stats-1990-2019/2026-03-19-era5-1deg-8layer-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-03-19-era5-1deg-8layer-stats-1990-2019/2026-03-19-era5-1deg-8layer-1940-2025/scaling-residual.nc
      secondary_decoder:
        secondary_diagnostic_names:
        - TMP50
        - TMP100
        - TMP250
        - TMP500
        - TMP700
        - TMP1000
        - Q50
        - Q100
        - Q250
        - Q500
        - Q700
        - Q850
        - Q1000
        - UGRD50
        - UGRD100
        - UGRD250
        - UGRD500
        - UGRD700
        - UGRD850
        - UGRD1000
        - VGRD50
        - VGRD100
        - VGRD250
        - VGRD500
        - VGRD700
        - VGRD850
        - VGRD1000
        network:
          type: MLP
          config:
            hidden_dim: 256
            depth: 2
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
      next_step_forcing_names:
      - DSWRFtoa
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - PRESsfc
      - surface_temperature
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
