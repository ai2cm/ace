# arg: --dataset 01KZYJ4HTBWED5VG3VFTRYKDRC:/weights
#
# Multi-step fine-tune of the 1deg/6-hourly AIMIP-like experiment: stage 2 of the standard
# ACE2S two-stage recipe. Donor is the 1-step pretraining stage
# (train-1deg-6hourly-v2-era5-only-no-residual-no-co2.yaml, wandb g94277n6, beaker
# 01KZYJ4HT4ZMZH296KBNWMPCQF at commit b4a688d85), whose result dataset
# 01KZYJ4HTBWED5VG3VFTRYKDRC is mounted at /weights above. The stepper config and the
# weights both come from that checkpoint; see README.md.
# 6-hourly counterpart of train-1deg-daily-v2-era5-only-no-residual-no-co2.yaml.
# See README.md for the full daily -> 6-hourly change list. The daily-step model
# emits daily snapshots, which cannot be compared against the monthly-/daily-
# AVERAGED AIMIP ERA5 evaluation data; a 6h step resolves the diurnal cycle so
# its output averages into comparable means.
seed: 0
experiment_dir: /results
save_checkpoint: true
checkpoint_every_n_batches: 5000
validate_using_ema: true
ema_checkpoint_save_epochs:
  start: 5
  step: 5
max_epochs: 40
ema:
  decay: 0.999
inference:
  - name: 10year
    weight: 0.0
    epochs:
      start: 3
      step: 4
    n_forward_steps: 14608
    forward_steps_in_memory: 40
    n_ensemble_per_ic: 1
    loader:
      start_indices:
        times:
          - '2015-01-01T06:00:00'
          - '2015-01-02T06:00:00'
          - '2015-01-03T06:00:00'
          - '2015-01-04T06:00:00'
          - '2015-01-05T06:00:00'
          - '2015-01-06T06:00:00'
          - '2015-01-07T06:00:00'
          - '2015-01-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 20
          target: denorm
          name: day_5
          variables: &inference_variables
            - PRATEsfc
            - TMP2m
            - Q2m
            - UGRD10m
            - VGRD10m
            - h500
            - TMP850
            - PRESsfc
            - surface_temperature
            - ULWRFsfc
            - DLWRFsfc
            - USWRFsfc
            - DSWRFsfc
            - ULWRFtoa
            - USWRFtoa
            - LHTFLsfc
            - SHTFLsfc
            - tendency_of_total_water_path_due_to_advection
            - air_temperature_0
            - air_temperature_1
            - air_temperature_3
            - air_temperature_7
            - specific_total_water_0
            - specific_total_water_1
            - specific_total_water_3
            - specific_total_water_7
            - eastward_wind_0
            - eastward_wind_1
            - eastward_wind_3
            - eastward_wind_7
            - northward_wind_0
            - northward_wind_1
            - northward_wind_3
            - northward_wind_7
            - total_water_path
        - step: 20
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles: []
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      histogram:
        enabled: true
  - name: 10year_insample
    weight: 1.0
    epochs:
      start: 3
      step: 4
    n_forward_steps: 14608
    forward_steps_in_memory: 40
    n_ensemble_per_ic: 1
    loader:
      start_indices:
        times:
          - '1995-01-01T06:00:00'
          - '1995-01-02T06:00:00'
          - '1995-01-03T06:00:00'
          - '1995-01-04T06:00:00'
          - '1995-01-05T06:00:00'
          - '1995-01-06T06:00:00'
          - '1995-01-07T06:00:00'
          - '1995-01-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 20
          target: denorm
          name: day_5
          variables: *inference_variables
        - step: 20
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles: []
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      histogram:
        enabled: true
  - name: weather_2024
    weight: 0.0
    n_forward_steps: 20
    forward_steps_in_memory: 20
    n_ensemble_per_ic: 8
    loader:
      start_indices:
        times:
          - '2024-06-01T06:00:00'
          - '2024-06-02T06:00:00'
          - '2024-06-03T06:00:00'
          - '2024-06-04T06:00:00'
          - '2024-06-05T06:00:00'
          - '2024-06-06T06:00:00'
          - '2024-06-07T06:00:00'
          - '2024-06-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 20
          target: denorm
          name: day_5
          variables: *inference_variables
        - step: 20
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles:
        - step: 20
          name: day_5_ensemble
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      power_spectrum:
        enabled: false
      zonal_mean:
        enabled: false
      time_mean_denorm:
        enabled: false
        target: denorm
      time_mean_norm:
        enabled: false
        target: norm
      annual:
        enabled: false
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      ipo_index:
        enabled: false
  - name: weather_1994
    weight: 0.0
    n_forward_steps: 20
    forward_steps_in_memory: 20
    n_ensemble_per_ic: 8
    loader:
      start_indices:
        times:
          - '1994-06-01T06:00:00'
          - '1994-06-02T06:00:00'
          - '1994-06-03T06:00:00'
          - '1994-06-04T06:00:00'
          - '1994-06-05T06:00:00'
          - '1994-06-06T06:00:00'
          - '1994-06-07T06:00:00'
          - '1994-06-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 20
          target: denorm
          name: day_5
          variables: *inference_variables
        - step: 20
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles:
        - step: 20
          name: day_5_ensemble
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      power_spectrum:
        enabled: false
      zonal_mean:
        enabled: false
      time_mean_denorm:
        enabled: false
        target: denorm
      time_mean_norm:
        enabled: false
        target: norm
      annual:
        enabled: false
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      ipo_index:
        enabled: false
  - name: long_46year
    weight: 0.0
    epochs:
      start: 29
      step: 5
    n_forward_steps: 67176
    forward_steps_in_memory: 40
    n_ensemble_per_ic: 1
    loader:
      start_indices:
        times:
          - '1979-01-01T06:00:00'
          - '1979-01-02T06:00:00'
          - '1979-01-03T06:00:00'
          - '1979-01-04T06:00:00'
          - '1979-01-05T06:00:00'
          - '1979-01-06T06:00:00'
          - '1979-01-07T06:00:00'
          - '1979-01-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means: []
      ensembles: []
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      zonal_mean:
        enabled: false
      time_mean_denorm:
        target: denorm
        variables: *inference_variables
      time_mean_norm:
        target: norm
        variables: *inference_variables
      annual:
        variables: *inference_variables
      power_spectrum:
        variables: *inference_variables
      histogram:
        enabled: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  time_buffer: 1
  dataset:
    strict: false
    # ERA5 production-stream stitch boundaries that fall inside the training
    # window are placed on subset boundaries, so no sample pairs across a
    # stream-to-stream jump (the global-mean 1-step finite difference at a
    # stitch is a coherent, resolution-independent bias step, out of
    # distribution as a residual target). See knowledge/era5-stitching-discontinuities.
    concat:
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1979-01-01'
          stop_time: '1986-03-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1986-04-01'
          stop_time: '1993-07-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1993-08-01'
          stop_time: '1993-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1995-01-01'
          stop_time: '1999-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2000-01-01'
          stop_time: '2009-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2010-01-01'
          stop_time: '2013-12-31'
validation:
  # The 20-step outcome sizes every window at 21 timesteps regardless of the sampled
  # length, so evaluating all steps would cost ~20x the pretrain's validation time and
  # per-batch memory rises ~21x.
  evaluate_all_steps: false
  loader:
    batch_size: 16
    num_data_workers: 4
    prefetch_factor: 2
    time_buffer: 3
    dataset:
      strict: false
      concat:
        - data_path: /climate-default/
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '1994-01-01'
            stop_time: '1994-12-31'
        - data_path: /climate-default/
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '2014-01-01'
            stop_time: '2014-12-31'
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  parameter_init:
    weights_path: /weights/training_checkpoints/best_ckpt.tar
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  checkpoint_path: /weights/training_checkpoints/best_ckpt.tar
