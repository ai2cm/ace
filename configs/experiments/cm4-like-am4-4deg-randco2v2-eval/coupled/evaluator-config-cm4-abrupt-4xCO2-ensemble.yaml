# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4-like-am4-4deg-randco2v2-eval/coupled
# Coupled abrupt-4xCO2 ensemble: 36 members started on the first of each month
# from piControl in years 301, 306 and 311, with CO2 held at 4x (1137.048 ppm).
experiment_dir: /results
n_coupled_steps: 18  # --min-runtime 1h
coupled_steps_in_memory: 1
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-om4-picontrol-4deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-om4-picontrol-4deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
          engine: zarr
          overwrite:
            constant:
              carbon_dioxide: 1137.048
  start_indices:
    times:
      - "0301-01-01T00:00:00"
      - "0301-02-01T00:00:00"
      - "0301-03-01T00:00:00"
      - "0301-04-01T00:00:00"
      - "0301-05-01T00:00:00"
      - "0301-06-01T00:00:00"
      - "0301-07-01T00:00:00"
      - "0301-08-01T00:00:00"
      - "0301-09-01T00:00:00"
      - "0301-10-01T00:00:00"
      - "0301-11-01T00:00:00"
      - "0301-12-01T00:00:00"
      - "0306-01-01T00:00:00"
