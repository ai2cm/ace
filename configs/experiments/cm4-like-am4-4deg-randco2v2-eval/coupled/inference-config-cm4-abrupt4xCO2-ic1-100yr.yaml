# job_runner/inference.sh configs/experiments/cm4-like-am4-4deg-randco2v2-eval/coupled .
# Coupled abrupt-4xCO2 100-year extension of ensemble member 1 of 36: inference
# from piControl at 0301-01-01T00:00:00, with CO2 held at 4x (1137.048 ppm).
# Initial conditions and forcing are as in inference-config-cm4-abrupt4xCO2-ic1.yaml,
# except that both forcing datasets are repeated in time to cover 0301-0401:
# - the piControl atmosphere stores end in 0350, so they are repeated once; the
#   remaining atmosphere forcings are periodic in the noleap calendar and CO2 is
#   overwritten with a constant, so the repeat introduces no discontinuity.
# - the ocean's time-constant forcings file only spans the 90-day ensemble window
#   on a 5-day axis, so it is tiled well past the 7301 times needed.
experiment_dir: /results
n_coupled_steps: 7300 # 100 years of 5-day ocean steps
coupled_steps_in_memory: 20
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
initial_condition:
  ocean:
    path: /climate-default/2026-09-02-cm4-piControl-4deg-ocean-1daily.zarr
    engine: zarr
  atmosphere:
    path: /climate-default/2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
    engine: zarr
  start_indices:
    times:
      - "0301-01-01T00:00:00"
forcing_loader:
  num_data_workers: 1
  ocean:
    dataset:
      data_path: /climate-default/2026-10-20-cm4-abrupt-4xCO2-ensemble-4deg-static-ocean-forcing
      file_pattern: ic_0001.nc
      n_repeats: 500
  atmosphere:
    dataset:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-atmosphere.zarr
          engine: zarr
          n_repeats: 2
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
          engine: zarr
          n_repeats: 2
          overwrite:
            constant:
              carbon_dioxide: 1137.048
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
