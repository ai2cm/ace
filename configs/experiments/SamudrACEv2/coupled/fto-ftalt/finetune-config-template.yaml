# FTalt, coupled stage 2: alternating ocean / atmosphere updates with random-CO2 uncoupled atmosphere
# batches, from an FTO checkpoint (train-config-template.yaml). Recipe of wandb
# ai2cm/ace-samudra-coupled-cm4/p7czybxj, with per-component Muon at the FTO LRs / 7 after a linear
# warmup. Data, model and inference as FTO.
# job_runner/coupled_finetune.sh configs/experiments/SamudrACEv2/coupled fto-ftalt \
#   --coupled_stats andrep/2026-11-13-om4-1pctco2-1deg-coupled-stats
experiment_dir: /results
save_checkpoint: true
ema_checkpoint_save_epochs:
  step: 1
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 3  # p7czybxj
inference:
- name: inference_piC
  weight: 1.0
  n_coupled_steps: 730
  coupled_steps_in_memory: 2
  loader:
    num_data_workers: 4
    start_indices:
      times:
      - '0151-01-06T00:00:00'
      - '0161-01-01T00:00:00'
      - '0171-01-01T00:00:00'
      - '0181-01-01T00:00:00'
      - '0191-01-01T00:00:00'
      - '0201-01-01T00:00:00'
      - '0211-01-01T00:00:00'
      - '0221-01-01T00:00:00'
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  aggregator:
    log_zonal_mean_images: false
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: metrics
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  dataset:
    concat:
    - ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
    - ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
validation:
- name: val_1pct_early
  evaluate_all_steps: false
