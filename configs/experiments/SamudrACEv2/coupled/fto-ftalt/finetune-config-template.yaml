            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
- name: val_1pct_late
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
- name: val_piC
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
optimization:
  atmosphere:  # FTO LR / 7 (3.0e-04 / 7, 1.0e-04 / 7)
    optimizer_type: Muon
    kwargs:
      adjust_lr_fn: match_rms_adamw
      adamw_lr: 1.4285714285714285e-05
      weight_decay: 0.01
      adamw_weight_decay: 0.01
    enable_automatic_mixed_precision: false
    use_gradient_accumulation: true
    max_grad_norm: 1.0
    lr: 4.2857142857142856e-05
    scheduler:  # linear warmup to a constant LR, as no228urh and p7czybxj
      type: LinearLR
      step_each_iteration: true
      kwargs:
        start_factor: 0.01
        end_factor: 1
        total_iters: 1460
  ocean:  # FTO LR / 7 (1.0e-03 / 7, 3.0e-04 / 7)
    optimizer_type: Muon
    kwargs:
      adjust_lr_fn: match_rms_adamw
      adamw_lr: 4.2857142857142856e-05
      weight_decay: 0.01
      adamw_weight_decay: 0.01
    enable_automatic_mixed_precision: false
    use_gradient_accumulation: true
    max_grad_norm: 1.0
    lr: 1.4285714285714287e-04
    scheduler:  # linear warmup to a constant LR, as no228urh and p7czybxj
      type: LinearLR
      step_each_iteration: true
      kwargs:
        start_factor: 0.01
        end_factor: 1
        total_iters: 1460
stepper_training:
  n_coupled_steps: 4
  n_ensemble: 2
  parameter_init:
    checkpoint_path: /ckpt.tar  # FTO checkpoint, mounted by job_runner/coupled_finetune.sh
  ocean:
    n_steps: 4
    optimize_last_step_only: false
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    n_steps:
      outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.0125
      - steps: 40
        probability: 0.0125
      - steps: 60
        probability: 0.0125
      - steps: 80
        probability: 0.0125
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
    optimize_last_step_only: true
  # p7czybxj: each coupled batch updates ocean or atmosphere, 50/50; random-CO2 batches are
  # 0.3333 of each epoch. Here: ocean : atmosphere : uncoupled_atmosphere = 1 : 1 : 1, so
  # uncoupled_atmosphere batches are 1/3 of each epoch and equal in number to ocean batches.
  # No joint pairs (p7czybxj has none).
  objective_per_batch:
    ocean: 1.0
    atmosphere: 1.0
    uncoupled_atmosphere: 1.0
  uncoupled_atmosphere:
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
    n_steps:
      outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
    optimize_last_step_only: true
# Overrides only: job_runner/create_coupled_finetune_config.sh fills the rest of the stepper
# from the coupled checkpoint's config.yaml (template values win).
stepper:
  ocean:
    timedelta: 5D
    stepper:
      step:
        config:
          builder:
            config:
              checkpoint_strategy: all
          corrector:
            config:
              corrector_disabled_epochs: 0  # p7czybxj
  atmosphere:
    timedelta: 6h
    stepper:
      step:
        config:
          builder:
            config:
              checkpointing: 3
seed: 0
checkpoint_every_n_batches: 250
