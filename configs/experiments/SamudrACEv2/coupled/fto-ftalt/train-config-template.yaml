# FTO, coupled stage 1: ocean trains, atmosphere frozen. Recipe of wandb
# ai2cm/ace-samudra-coupled-cm4/no228urh, with per-component Muon at the uncoupled pretraining LRs
# after a linear warmup. Init, data, model and inference as ../jointpairs.
# job_runner/coupled_train.sh configs/experiments/SamudrACEv2/coupled fto-ftalt \
#   --coupled_stats andrep/2026-11-13-om4-1pctco2-1deg-coupled-stats
experiment_dir: /results
save_checkpoint: true
ema_checkpoint_save_epochs:
  step: 1
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 8  # no228urh
inference:
- name: inference_piC
  weight: 1.0
  n_coupled_steps: 730
  coupled_steps_in_memory: 2
  loader:
    num_data_workers: 4
    start_indices:
      times:
      - '0151-01-06T00:00:00'
      - '0161-01-01T00:00:00'
      - '0171-01-01T00:00:00'
      - '0181-01-01T00:00:00'
      - '0191-01-01T00:00:00'
      - '0201-01-01T00:00:00'
      - '0211-01-01T00:00:00'
      - '0221-01-01T00:00:00'
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  aggregator:
    log_zonal_mean_images: false
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: metrics
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  dataset:
    concat:
    - ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
    - ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
validation:
- name: val_1pct_early
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
          subset:
            start_time: '0041-01-06T00:00:00'
            stop_time: '0046-01-01T00:00:00'
- name: val_1pct_late
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
          subset:
            start_time: '0126-01-06T00:00:00'
            stop_time: '0131-01-01T00:00:00'
- name: val_piC
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
optimization:
  atmosphere:  # uncoupled pretraining LR, atmos/ace2p5-muon/finetune-config-template.yaml; no effect while the atmosphere is frozen
    optimizer_type: Muon
    kwargs:
      adjust_lr_fn: match_rms_adamw
      adamw_lr: 1.0e-04
      weight_decay: 0.01
      adamw_weight_decay: 0.01
    enable_automatic_mixed_precision: false
    use_gradient_accumulation: true
    max_grad_norm: 1.0
    lr: 3.0e-04
    scheduler:  # linear warmup to a constant LR, as no228urh and p7czybxj
      type: LinearLR
      step_each_iteration: true
      kwargs:
        start_factor: 0.01
        end_factor: 1
        total_iters: 1460
  ocean:  # uncoupled pretraining LR, ocean/hybridSSTdiag-fiz/train-config.yaml
    optimizer_type: Muon
    kwargs:
      adjust_lr_fn: match_rms_adamw
      adamw_lr: 3.0e-04
      weight_decay: 0.01
      adamw_weight_decay: 0.01
    enable_automatic_mixed_precision: false
    use_gradient_accumulation: true
    max_grad_norm: 1.0
    lr: 1.0e-03
    scheduler:  # linear warmup to a constant LR, as no228urh and p7czybxj
      type: LinearLR
      step_each_iteration: true
      kwargs:
        start_factor: 0.01
        end_factor: 1
        total_iters: 1460
stepper_training:
  n_coupled_steps: 4
  n_ensemble: 2
  # Every batch updates the ocean only: no objective_per_batch, no joint pairs, no
  # uncoupled atmosphere batches (no228urh).
  ocean:
    parameter_init:
      weights_path: /ocean_ckpt.tar
    n_steps: 4
    optimize_last_step_only: false
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:  # frozen, as no228urh
    parameter_init:
      weights_path: /atmos_ckpt.tar
      parameters:
      - frozen:
          include:
          - '*'
    n_steps: 0
    loss_weight: 0.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
# Overrides only: job_runner/create_coupled_train_config.sh fills the rest of each component
# stepper from its uncoupled checkpoint's config.yaml (template values win).
stepper:
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  sst_name: SST_degK
  ocean:
    timedelta: 5D
    stepper:
      step:
        config:
          builder:
            config:
              checkpoint_strategy: all
          corrector:
            config:
              corrector_disabled_epochs: 1  # no228urh
  atmosphere:
    timedelta: 6h
    stepper:
      step:
        config:
          builder:
            config:
              checkpointing: 3
seed: 0
checkpoint_every_n_batches: 250
# Inline random-CO2 inference, kept from ../jointpairs (no228urh and p7czybxj have none).
atmosphere_inference:
- name: randco2_1xCO2
  weight: 0.3333333333333333
  loader:
    dataset:
      merge:
      - data_path: /climate-default/2026-10-11-CM4-like-AM4-random-CO2-coupled
        file_pattern: random-CO2-1xCO2-ic_0003-sea_ice.zarr
        engine: zarr
      - data_path: /climate-default/2026-10-11-CM4-like-AM4-random-CO2
        file_pattern: random-CO2-1xCO2-ic_0003.zarr
        engine: zarr
    start_indices:
      n_initial_conditions: 8
      first: 0
      interval: 958
    num_data_workers: 4
  n_forward_steps: 958
  forward_steps_in_memory: 50
  aggregator:
    zonal_mean:
      enabled: false
- name: randco2_2xCO2
