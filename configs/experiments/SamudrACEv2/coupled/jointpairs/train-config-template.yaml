- name: val_piC
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
