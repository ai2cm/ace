            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
          subset:
            start_time: '0236-01-06T00:00:00'
            stop_time: '0241-01-01T00:00:00'
optimization:
  atmosphere:
    optimizer_type: Muon
    kwargs:
      adjust_lr_fn: match_rms_adamw
      adamw_lr: 7.0e-07
      weight_decay: 0.01
      adamw_weight_decay: 0.01
    enable_automatic_mixed_precision: false
    use_gradient_accumulation: true
    max_grad_norm: 1.0
    lr: 2.1e-06
    scheduler:
      period: 5840
      min_factor: 0.0
      cosine_start: trough
      decay_end: 11680
      step_each_iteration: true
  ocean:
    optimizer_type: Muon
    kwargs:
      adjust_lr_fn: match_rms_adamw
      adamw_lr: 0.00021
      weight_decay: 0.01
      adamw_weight_decay: 0.01
    enable_automatic_mixed_precision: false
    use_gradient_accumulation: true
    max_grad_norm: 1.0
    lr: 0.0007
    scheduler:
      period: 2920
      min_factor: 0.001
      cosine_start: peak
      warmup_iters: 1460
      warmup_start_factor: 0.01
      decay_end: 11680
      step_each_iteration: true
stepper_training:
  n_coupled_steps: 4
  n_ensemble: 2
  ocean:
    parameter_init:
      weights_path: /ocean_ckpt.tar
    n_steps: 4
    optimize_last_step_only: false
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    parameter_init:
      weights_path: /atmos_ckpt.tar
    n_steps:
      outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.0125
      - steps: 40
        probability: 0.0125
      - steps: 60
        probability: 0.0125
      - steps: 80
        probability: 0.0125
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
    optimize_last_step_only: true
  joint_pairs:
  - - 1
    - 20
  - - 2
    - 40
  - - 3
    - 60
  - - 4
    - 80
  objective_per_batch:
    ocean: 1.0
    joint: 1.0
    uncoupled_atmosphere: 2.0
  uncoupled_atmosphere:
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
    n_steps:
      outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
    optimize_last_step_only: true
# Overrides only: job_runner/create_coupled_train_config.sh fills the rest of each component
# stepper from its uncoupled checkpoint's config.yaml (template values win).
stepper:
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  sst_name: SST_degK
  ocean:
    timedelta: 5D
    stepper:
      step:
        config:
          builder:
            config:
              checkpoint_strategy: all
          corrector:
            config:
              corrector_disabled_epochs: 0
  atmosphere:
    timedelta: 6h
    stepper:
      step:
        config:
          builder:
            config:
              checkpointing: 3
seed: 0
checkpoint_every_n_batches: 250
