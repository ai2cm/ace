# job_runner/uncoupled_finetune.sh configs/experiments/SamudrACEv2/atmos/ace2p5-muon-norandco2 . \
#   --coupled_stats andrep/2026-11-13-om4-1pctco2-1deg-coupled-stats
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
evaluate_before_training: true
max_epochs: 2 # 160 yr x 1460/yr / bs 8 = 29,200 iter/epoch -> 58,400 iterations; ace2p5-muon: 2 x 34,660 = 69,320 (exact match: 2.37 epochs)
ema_checkpoint_save_epochs:
  start: 1
  step: 1
ema:
  decay: 0.999
inference:
  - name: inference_1pct
    weight: 1.0
    n_forward_steps: 7300 # exactly 5 noleap years
    forward_steps_in_memory: 50
    loader:
      start_indices:
        times:
          # 4 ICs each in the validation 1pct_early and 1pct_late periods,
          # 5-year rollouts, never entering the 131-140 holdout
          - '0041-01-01T00:00:00'
          - '0042-01-01T00:00:00'
          - '0043-01-01T00:00:00'
          - '0044-01-01T00:00:00'
          - '0123-01-01T00:00:00'
          - '0124-01-01T00:00:00'
          - '0125-01-01T00:00:00'
          - '0126-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-sea_ice.zarr
            engine: zarr
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
            engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_forward_steps: 7300 # exactly 5 noleap years
    forward_steps_in_memory: 50
    loader:
      start_indices:
        times:
          # 8 ICs on either side of the training period, 5-year rollouts
          - '0151-01-06T00:00:00'
          - '0152-01-01T00:00:00'
          - '0153-01-01T00:00:00'
          - '0154-01-01T00:00:00'
          - '0236-01-01T00:00:00'
          - '0237-01-01T00:00:00'
          - '0238-01-01T00:00:00'
          - '0239-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-sea_ice.zarr
            engine: zarr
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
            engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace2-cm4-atmos-noLSM
  entity: ai2cm
  metrics_log_dir: metrics
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  dataset:
    # 80 years of 1pctCO2; 80 years piControl.  160 years total.
    merge:
      - concat:
          - data_path: /climate-default
            file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0046-01-01T06:00:00'
              stop_time: '0126-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0156-01-01T06:00:00'
              stop_time: '0236-01-01T00:00:00'
      - concat:
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
            engine: zarr
            subset:
              start_time: '0046-01-01T06:00:00'
              stop_time: '0126-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
            engine: zarr
            subset:
              start_time: '0156-01-01T06:00:00'
              stop_time: '0236-01-01T00:00:00'
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 64
      num_data_workers: 4
      prefetch_factor: 2
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0041-01-01T06:00:00'
              stop_time: '0046-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
            engine: zarr
            subset:
              start_time: '0041-01-01T06:00:00'
              stop_time: '0046-01-01T00:00:00'
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 64
      num_data_workers: 4
      prefetch_factor: 2
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0126-01-01T06:00:00'
              stop_time: '0131-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
            engine: zarr
            subset:
              start_time: '0126-01-01T06:00:00'
              stop_time: '0131-01-01T00:00:00'
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 64
      num_data_workers: 4
      prefetch_factor: 2
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-sea_ice.zarr
            engine: zarr
            subset:
              start_time: '0236-01-01T06:00:00'
              stop_time: '0241-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
            engine: zarr
            subset:
              start_time: '0236-01-01T06:00:00'
              stop_time: '0241-01-01T00:00:00'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0003 # Muon group
  optimizer_type: Muon
  kwargs:
    adjust_lr_fn: match_rms_adamw
    adamw_lr: 0.0001
    weight_decay: 0.01
    adamw_weight_decay: 0.01
stepper_training:
  parameter_init:
    weights_path: /ckpt.tar
  n_ensemble: 2
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
    weights:
      h500: 5.0
stepper:
  derived_forcings:
    insolation:
      insolation_name: DSWRFtoa
      solar_constant:
        value: 1360.782
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
