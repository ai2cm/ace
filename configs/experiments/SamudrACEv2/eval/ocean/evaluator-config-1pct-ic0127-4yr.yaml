# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/SamudrACEv2/eval/ocean
# Adapted from configs/experiments/SamudrACEv2/ocean/eval/oos/evaluator-config-1pct-ic0121-20yr-maps.yaml at 1275e7093: correction_maps on, no reference (target) output. IC 0127 (1 yr after the last train sample 0126-01-01), 4 yr, no ENSO index (the rollout targets warm-climate biases, not ENSO).
# Warm-side (training_splits.yaml): IC 0127-01-01 and steps 1..292 (0127-01-06 to 0131-01-01, its last sample) all in val_1pct_late; no train or holdout step.
experiment_dir: /results
n_forward_steps: 292  # exactly 4 noleap years
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: false
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0127-01-01T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-11-13-om4-1pctco2-1deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-11-13-om4-1pctco2-1deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
aggregator:
  log_histograms: true
  log_nino34_index: false
  log_ipo_index: false
  step_diagnostics:
    correction_maps: true
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files:
    - label: kuroshio_extension_monthly
      names: [SST_degK]
      lat_extent: [30.0, 40.0]
      lon_extent: [140.0, 180.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
    - label: gulf_stream_monthly
      names: [SST_degK]
      lat_extent: [35.0, 45.0]
      lon_extent: [285.0, 315.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
    - label: n_atlantic_subpolar_monthly
      names: [SST_degK]
      lat_extent: [50.0, 65.0]
      lon_extent: [300.0, 340.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
    - label: acc_monthly
      names: [SST_degK]
      lat_extent: [-60.0, -45.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
    - label: n_pacific_gyre_monthly
      names: [SST_degK]
      lat_extent: [25.0, 40.0]
      lon_extent: [180.0, 220.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
    - label: tropical_pacific_monthly_sst
      names: [SST_degK, hfds_total_area]
      lat_extent: [-20.0, 20.0]
      lon_extent: [120.0, 290.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
    - label: arctic_hfds
      names: [hfds_total_area]
      lat_extent: [40.0, 90.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
    - label: antarctic_hfds
      names: [hfds_total_area]
      lat_extent: [-90.0, -50.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
    - label: ocean_maps_monthly
      names: [ocean_heat_content, ocean_sea_ice_thickness_mean, ocean_sea_ice_fraction, thetao_0, thetao_1, thetao_2, thetao_3, thetao_4, thetao_5, thetao_6, thetao_7, thetao_8, thetao_9, thetao_10, thetao_11, thetao_12, thetao_13, thetao_14, thetao_15, thetao_16, thetao_17, thetao_18]
      time_coarsen:
        method: monthly_mean
      save_reference: false
      format:
        name: zarr
