# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/SamudrACEv2/eval/coupled/paper
# ../evaluator-config-piC-ic0151-200yr.yaml with a 40-yr out-of-sample rollout and one global
# monthly-mean writer per realm holding every stepper output (prognostic and
# diagnostic); the base's regional monthly writers are subsets of these, dropped.
# Prediction only: CM4 targets are read from their GCS stores.
# IC 0244-01-06 is the first ocean snapshot after the last piControl time the
# coupled trainings (jointpairs, fto, ftalt) or their ocean (hybridSSTdiag-fiz) and
# atmosphere (ace2p5-muon, -ft) inits read: 0244-01-01, the end of the atmosphere
# inline inference (5-yr rollouts from 0236-0239; training 0156-0235, validation
# 0236-0240, ocean inline inference to 0241-01-01). Steps run through 0283-12-17.
# experiment_dir is not set here: each experiments.txt row must set a unique GCS
# directory in its override column (space-separated key=value, passed to
# --override), e.g.
#   experiment_dir=gs://vcm-ml-experiments/jamesd/<YYYY-MM-DD>-samudracev2-paper-eval/coupled/<training wandb run id>/piC-ic0244-40yr-paper
n_coupled_steps: 2916  # --min-runtime 5h
coupled_steps_in_memory: 18
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0244-01-06T00:00:00'
aggregator:
  step_diagnostics:
    correction_maps: true
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
