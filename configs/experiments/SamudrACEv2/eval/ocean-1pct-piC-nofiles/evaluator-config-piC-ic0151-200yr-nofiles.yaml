# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/SamudrACEv2/eval/ocean-1pct-piC-nofiles
# Copy of configs/experiments/SamudrACEv2/eval/ocean/evaluator-config-piC-ic0151-200yr.yaml with every data_writer files block (netCDF writers) removed.
# Adapted from configs/experiments/cm4_eval/ocean/evaluator-config-piC-ic0151-200yr.yaml:
# SamudrACEv2 stores (2026-11-13), sst -> SST_degK.
experiment_dir: /results
n_forward_steps: 14598  # --min-runtime 2h
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0151-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
  step_diagnostics:
    correction_maps: true
data_writer:
  save_prediction_files: false
  save_monthly_files: false
