# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/SamudrACEv2/eval/coupled-1pct-piC-nofiles
# Copy of configs/experiments/SamudrACEv2/eval/coupled/evaluator-config-piC-ic0151-200yr.yaml with every data_writer files block (netCDF writers) removed.
# Adapted from configs/experiments/cm4_eval/coupled/evaluator-config-piC-ic0151-200yr.yaml:
# SamudrACEv2 ocean and coupled-atmosphere stores (2026-11-13), sst -> SST_degK,
# no reference output, correction maps on.
experiment_dir: /results
n_coupled_steps: 14598  # --min-runtime 8h
coupled_steps_in_memory: 18
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0151-01-06T00:00:00'
aggregator:
  step_diagnostics:
    correction_maps: true
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
