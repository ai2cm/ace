# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/SamudrACEv2/eval/atmos-1pct-piC-nofiles-randco2
# Copy of configs/experiments/SamudrACEv2/eval/atmos/evaluator-config-piC-ic0151-200yr.yaml with every data_writer files block (netCDF writers) removed.
# Adapted from configs/experiments/cm4_eval/atmos/evaluator-config-piC-ic0151-200yr.yaml:
# sea-ice/SST store 2026-07-15 -> 2026-11-13 (as the SamudrACEv2 atmos trainings),
# no reference output written.
experiment_dir: /results
n_forward_steps: 291960  # --min-runtime 8h
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
n_ensemble_per_ic: 1
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace2-cm4-atmos-noLSM
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0151-01-06T00:00:00'
  dataset:
    merge:
      - data_path: /climate-default
        file_pattern: 2026-11-13-om4-picontrol-1deg-coupled-sea_ice.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
        engine: zarr
  num_data_workers: 4
aggregator:
  zonal_mean:
    enabled: false
  power_spectrum:
     enabled: false
  enso_coefficient:
    enabled: false
  step_diagnostics:
    correction_scalars: true
    correction_maps: true
data_writer:
  save_prediction_files: false
  save_monthly_files: false
