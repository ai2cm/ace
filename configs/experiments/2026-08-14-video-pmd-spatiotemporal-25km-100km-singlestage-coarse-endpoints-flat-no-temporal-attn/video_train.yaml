# Ablation of ../2026-08-07-video-pmd-spatiotemporal-25km-100km-singlestage-coarse-endpoints-flat/:
# same coarse_endpoints_only architecture (true LR-endpoints-in/HR-full-out,
# single joint network, nothing pinned), but with ALL temporal attention
# removed (temporal_attention_levels: [] below) -- the goal is a HiRO-style,
# per-frame-independent spatial denoiser that still supports the
# coarse-endpoint-only conditioning scheme, to isolate how much of the
# video-PMD models' advantage over HiRO comes from cross-frame temporal
# attention specifically vs. just having endpoint-anchored conditioning at
# all (see toy/single_vs_two_stage_v1_comparison.md's hiro discussion).
#
# Why this is architecturally sound without temporal attention: every other
# layer in this backbone (ResBlock's PeriodicConv3d, kernel=(1,3,3)) already
# has a temporal kernel size of 1 -- i.e. is a plain per-frame spatial
# operation. TemporalAttention is the ONLY place any information ever
# crosses frames. The two endpoint frames' values still reach every interior
# frame the same way they always did: through _spatiotemporal_baseline's
# linear interpolation between the endpoints, which each frame's own
# diffusion residual is predicted relative to -- that's carried per-frame in
# the conditioning tensor, not through attention. So temporal_attention_levels: []
# gives a genuinely fair test of "does a network need to *attend* across
# frames, given it's already anchored to a temporally-interpolated
# baseline?", not a broken/uninformed model.
#
# IMPORTANT: fixed a real bug to make this ablation possible.
# VideoUNet's mid/bottleneck block used to hardcode temporal=True regardless
# of temporal_attention_levels (fme/downscaling/modules/video_modules.py),
# so temporal_attention_levels: [] alone would NOT have actually reached
# zero cross-frame mixing -- one TemporalAttention layer at the bottleneck
# would have stayed active. Fixed (mid-block now reuses the deepest
# encoder level's attn_temporal membership, since it shares that
# resolution) and covered by fme/downscaling/modules/test_video_modules.py,
# including a frame-permutation-invariance test that only holds when temporal
# attention is truly absent everywhere.
#
# max_epochs: the flat coarse-endpoints model this ablates
# (../2026-08-07-.../video_train.yaml, experiment 01KZEN3KJN8Y6SYDSZBKWRFKFE,
# wandb ai2cm/ace-temporal-interp/4tnvhw3o) crashed on an infra failure with
# only 31 completed epochs baked into its last checkpoint (confirmed via
# checkpoint['startEpoch'] == 31, not just the wandb summary) -- that's the
# real amount of training the model actually being compared against here
# went through, so 31 (not the originally-planned 200) is what "comparable"
# means for this ablation, not a smaller budget for its own sake.
#
# Everything else (backbone, channel_mult, attention_levels, patch size,
# sigma schedule, normalization stats, data paths) is copied verbatim from
# the flat coarse-endpoints config -- this is a single-variable ablation
# (temporal attention on/off), not a redesign. Fresh run, not resumed:
# removing TemporalAttention submodules makes the state dict incompatible
# with the flat checkpoint regardless of matching in_channels.
experiment_dir: /results
max_epochs: 31
validate_using_ema: true
validate_interval: 10
test_interval: 20
max_val_batches: 20
max_test_batches: 50
generate_n_samples: 1
log_loss_vs_noise: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-temporal-interp
  name: global-25km-100km-spatiotemporal-singlestage-5ch-coarse-endpoints-flat-no-temporal-attn
  entity: ai2cm
optimization:
  lr: 0.0001
ema:
  decay: 0.9999
coarse_patch_extent_lat: 44
coarse_patch_extent_lon: 72
train_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  batch_size: 4  # global across ranks (4 GPUs x 1 sample/GPU) -- matches the source config
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
validation_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
test_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  # The whole point of this ablation: zero temporal attention anywhere,
  # including the mid/bottleneck block (see header comment + the
  # video_modules.py fix this config depends on). Spatial attention
  # (attention_levels above) is untouched -- this is a temporal-attention-
  # only ablation, not a move to a fully attention-free model.
  temporal_attention_levels: []
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Nothing is pinned: no fine truth exists anywhere, so every frame -- the
  # former endpoints included -- is diffused. See header comment.
  endpoints_observed: false
  # Coarse (LR) is only available at the two endpoint frames -- masked to
  # zero at interior frames in the conditioning, with its own mask channel
  # -- rather than continuously at every frame. See header comment and
  # VideoDiffusionModelConfig.coarse_endpoints_only's docstring.
  coarse_endpoints_only: true
  # Flat/independent noise (no temporal correlation) -- matches the source
  # config this ablates (temporal noise correlation is a property of the
  # diffusion process's noise, unrelated to the network's temporal
  # attention; not touched by this ablation).
  temporal_noise_correlation: independent
  log_transform_channels:
    PRATEsfc: 86400.0  # precip modeled in log1p(mm/day) space
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:  # fine (25km), train-only, global domain -- toy/compute_norm_stats_25km.py
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074   # log1p(PRATEsfc * 86400) space, matching log_transform_channels
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:  # coarse (100km), train-only, global domain -- reused verbatim
    # from the stage-1 config: verified 2026-07-24 that the 100km store is
    # byte-identical to the dataset those stats were computed from.
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
