# arg: --dataset FILL-AFTER-PREVIOUS-STAGE-SELECTION:/weights
# (gantry will fail loudly on the placeholder if launched unfilled)
# ACE2.2 variant P2, stage 2: multi-step fine-tune of the ns-diag pretrain. The
# architecture comes from the stage-1 checkpoint; only the inline-inference variable
# list differs from P1 stage 2 (no near-surface fields exist yet).
seed: 0
experiment_dir: /results
save_checkpoint: true
checkpoint_every_n_batches: 5000
validate_using_ema: true
ema_checkpoint_save_epochs:
  start: 5
  step: 5
max_epochs: 40
ema:
  decay: 0.999
inference:
  - name: 5year_outsample
    weight: 1.0
    epochs:
      start: 3
      step: 4
    n_forward_steps: 7300
    forward_steps_in_memory: 40
    n_ensemble_per_ic: 1
    loader:
      start_indices:
        times:
          - '2009-01-01T06:00:00'
          - '2009-02-15T06:00:00'
          - '2009-04-01T06:00:00'
          - '2009-05-15T06:00:00'
          - '2009-07-01T06:00:00'
          - '2009-08-15T06:00:00'
          - '2009-10-01T06:00:00'
          - '2009-11-15T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 20
          target: denorm
          name: day_5
          variables: &inference_variables
            - PRATEsfc
            - h500
            - TMP850
            - PRESsfc
            - surface_temperature
            - ULWRFsfc
            - DLWRFsfc
            - USWRFsfc
            - DSWRFsfc
            - ULWRFtoa
            - USWRFtoa
            - LHTFLsfc
            - SHTFLsfc
            - tendency_of_total_water_path_due_to_advection
            - air_temperature_0
            - air_temperature_1
            - air_temperature_3
            - air_temperature_7
            - specific_total_water_0
            - specific_total_water_1
            - specific_total_water_3
            - specific_total_water_7
            - eastward_wind_0
            - eastward_wind_1
            - eastward_wind_3
            - eastward_wind_7
            - northward_wind_0
            - northward_wind_1
            - northward_wind_3
            - northward_wind_7
            - total_water_path
        - step: 20
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles: []
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      histogram:
        enabled: true
  - name: weather_1994
    weight: 0.0
    n_forward_steps: 20
    forward_steps_in_memory: 20
    n_ensemble_per_ic: 8
    loader:
      start_indices:
        times:
          - '1994-06-01T06:00:00'
          - '1994-06-02T06:00:00'
          - '1994-06-03T06:00:00'
          - '1994-06-04T06:00:00'
          - '1994-06-05T06:00:00'
          - '1994-06-06T06:00:00'
          - '1994-06-07T06:00:00'
          - '1994-06-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 20
          target: denorm
          name: day_5
          variables: *inference_variables
        - step: 20
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles:
        - step: 20
          name: day_5_ensemble
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      power_spectrum:
        enabled: false
      zonal_mean:
        enabled: false
      time_mean_denorm:
        enabled: false
        target: denorm
      time_mean_norm:
        enabled: false
        target: norm
      annual:
        enabled: false
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      ipo_index:
        enabled: false
  - name: weather_2014
    weight: 0.0
    n_forward_steps: 20
    forward_steps_in_memory: 20
    n_ensemble_per_ic: 8
    loader:
      start_indices:
        times:
          - '2014-06-01T06:00:00'
          - '2014-06-02T06:00:00'
          - '2014-06-03T06:00:00'
          - '2014-06-04T06:00:00'
          - '2014-06-05T06:00:00'
          - '2014-06-06T06:00:00'
          - '2014-06-07T06:00:00'
          - '2014-06-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
        - step: 20
          target: denorm
          name: day_5
          variables: *inference_variables
        - step: 20
          target: norm
          name: day_5_norm
          variables: *inference_variables
      ensembles:
        - step: 20
          name: day_5_ensemble
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      power_spectrum:
        enabled: false
      zonal_mean:
        enabled: false
      time_mean_denorm:
        enabled: false
        target: denorm
      time_mean_norm:
        enabled: false
        target: norm
      annual:
        enabled: false
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      ipo_index:
        enabled: false
  - name: long_36year
    weight: 0.0
    epochs:
      start: 29
      step: 5
    n_forward_steps: 52566
    forward_steps_in_memory: 40
    n_ensemble_per_ic: 1
    loader:
      start_indices:
        times:
          - '1979-01-01T06:00:00'
          - '1979-01-02T06:00:00'
          - '1979-01-03T06:00:00'
          - '1979-01-04T06:00:00'
          - '1979-01-05T06:00:00'
          - '1979-01-06T06:00:00'
          - '1979-01-07T06:00:00'
          - '1979-01-08T06:00:00'
      dataset:
        data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means: []
      ensembles: []
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      zonal_mean:
        enabled: false
      time_mean_denorm:
        target: denorm
        variables: *inference_variables
      time_mean_norm:
        target: norm
        variables: *inference_variables
      annual:
        variables: *inference_variables
      power_spectrum:
        variables: *inference_variables
      histogram:
        enabled: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  time_buffer: 1
  dataset:
    strict: false
    # ERA5 production-stream stitch boundaries that fall inside the training
    # window are placed on subset boundaries, so no sample pairs across a
    # stream-to-stream jump (the global-mean 1-step finite difference at a
    # stitch is a coherent, resolution-independent bias step, out of
    # distribution as a residual target). See knowledge/era5-stitching-discontinuities.
    concat:
    # Harmonized with ACE2.1: train 1979-2008 (1994 returns to training),
    # validate 2009-2014. Stitch boundaries inside the window are kept.
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1979-01-01'
          stop_time: '1986-03-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1986-04-01'
          stop_time: '1993-07-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1993-08-01'
          stop_time: '1999-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2000-01-01'
          stop_time: '2008-12-31'
validation:
  # The 20-step outcome sizes every window at 21 timesteps regardless of the sampled
  # length, so evaluating all steps would cost ~20x the pretrain's validation time and
  # per-batch memory rises ~21x.
  evaluate_all_steps: false
  loader:
    batch_size: 16
    num_data_workers: 4
    prefetch_factor: 2
    time_buffer: 3
    dataset:
      strict: false
      concat:
        - data_path: /climate-default/
          file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
          engine: zarr
          subset:
            start_time: '2009-01-01'
            stop_time: '2014-12-31'
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  parameter_init:
    weights_path: /weights/training_checkpoints/best_ckpt.tar
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  checkpoint_path: /weights/training_checkpoints/best_ckpt.tar
