# Stage 2: spatiotemporal video PMD, SINGLE-STAGE mode, TRUE LR-endpoints-in
# / HR-full-out (2026-08-07), flat/independent noise variant.
#
# Supersedes ../2026-08-05-video-pmd-spatiotemporal-25km-100km-singlestage-v2/
# (stopped 2026-08-06): that config used endpoints_observed=True with NO
# endpoint_super_resolution sub-model, which relies on real fine-resolution
# (25km) ground truth being fed in at the two endpoint frames -- fine at
# training time (our dataset has paired truth), but NOT deployable, since
# real inference only ever has the coarse (100km) endpoints available, never
# true fine data anywhere.
#
# This config instead uses the new endpoints_observed=False +
# coarse_endpoints_only=True combination (see the module docstring and
# VideoDiffusionModelConfig.coarse_endpoints_only's docstring in
# fme/downscaling/video_models.py for the full architecture):
#   - coarse (LR) is only available at the two endpoint frames (sparse
#     anchors), masked to zero at every interior frame in the conditioning,
#     with its own observed-mask channel -- exactly like the old
#     endpoints_observed=True mode masked its endpoint blocks, just with no
#     fine block at all here (none exists).
#   - baseline = linear_interp(coarse-upsampled endpoints) -- no fine value
#     of any kind enters it.
#   - NOTHING is pinned: every frame, including the former "endpoints", is
#     diffused by this ONE network in a single joint pass. This is the
#     single-stage analog of the two-stage endpoint_super_resolution path
#     (../2026-08-05-video-pmd-spatiotemporal-25km-100km-flat-v2/), which
#     instead super-resolves the endpoints with a separate 2D sub-model
#     before pinning them -- here the same video-diffusion network handles
#     everything, endpoints included.
# in_channels changed accordingly (3C+1 instead of the old 4C+1), so this is
# a from-scratch run, not comparable to/resumed from v1 or v2's checkpoints.
#
# Flat/independent noise (temporal_noise_correlation: independent) -- see
# ../2026-08-07-video-pmd-spatiotemporal-25km-100km-singlestage-coarse-endpoints-ou/
# for the OU-kernel counterpart, for comparing noise-kernel choice at fixed
# (now-correct) single-stage architecture. subset_augmentation_prob and
# marginal_consistency_weight are left at 0.0 -- both are incompatible with
# endpoints_observed=False anyway (validated in __post_init__, since they
# assume a fixed pinned endpoint which doesn't exist in this mode).
#
# Video UNet architecture/schedule (backbone, channel_mult, attention_levels,
# per-channel noise/sigma settings), patch size, and data paths copied
# verbatim from the old singlestage-v2 config -- none of those change with
# this fix, only the endpoint-conditioning semantics.
#
# Data: 2026-07-14-X-SHiELD-AMIP-FME-3h-{25km,100km}.zarr on weka
# (/climate-default/2026-06-25-temporal-diffusion), same store/PMD split as
# every other spatiotemporal config in this family. downscale_factor = 4.
#
# sigma_data_by_channel / training_noise_distributions / sigma_min|max_by_channel
# below are carried over unchanged from v1/v2 -- not recomputed for this
# baseline formula (interior-frame residual scale should be materially
# similar; the coarse-upsampled endpoint baseline at t=0/-1 is smoother than
# the true-fine-endpoint baseline was, but interior frames dominate the
# channel count). Recompute with a residual-std script specific to this
# baseline formula if training behaves unexpectedly.
experiment_dir: /results
max_epochs: 200
validate_using_ema: true
validate_interval: 10
test_interval: 20
max_val_batches: 20
max_test_batches: 50
generate_n_samples: 1
log_loss_vs_noise: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-temporal-interp
  name: global-25km-100km-spatiotemporal-singlestage-5ch-coarse-endpoints-flat
  entity: ai2cm
optimization:
  lr: 0.0001
ema:
  decay: 0.9999
coarse_patch_extent_lat: 44
coarse_patch_extent_lon: 72
train_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  batch_size: 4  # global across ranks (4 GPUs x 1 sample/GPU) -- matches the two-stage configs
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
validation_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
test_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Nothing is pinned: no fine truth exists anywhere, so every frame -- the
  # former endpoints included -- is diffused. See header comment.
  endpoints_observed: false
  # Coarse (LR) is only available at the two endpoint frames -- masked to
  # zero at interior frames in the conditioning, with its own mask channel
  # -- rather than continuously at every frame. See header comment and
  # VideoDiffusionModelConfig.coarse_endpoints_only's docstring.
  coarse_endpoints_only: true
  # Flat/independent noise (no temporal correlation) -- see header comment.
  temporal_noise_correlation: independent
  log_transform_channels:
    PRATEsfc: 86400.0  # precip modeled in log1p(mm/day) space
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:  # fine (25km), train-only, global domain -- toy/compute_norm_stats_25km.py
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074   # log1p(PRATEsfc * 86400) space, matching log_transform_channels
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:  # coarse (100km), train-only, global domain -- reused verbatim
    # from the stage-1 config: verified 2026-07-24 that the 100km store is
    # byte-identical to the dataset those stats were computed from.
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
