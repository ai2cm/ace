# Stage 2: spatiotemporal video PMD, SINGLE-STAGE mode, TRUE LR-endpoints-in
# / HR-full-out (2026-08-07), OU per-channel noise-kernel variant.
#
# Identical to
# ../2026-08-07-video-pmd-spatiotemporal-25km-100km-singlestage-coarse-endpoints-flat/video_train.yaml
# (see that config's header for the full endpoints_observed=False +
# coarse_endpoints_only=True architecture rationale -- nothing pinned,
# coarse only at the two endpoint frames, single joint network diffuses
# every frame including the endpoints) EXCEPT
# temporal_noise_correlation: independent -> per_channel with an OU kernel
# for every channel, mirroring the two-stage
# ../2026-08-05-video-pmd-spatiotemporal-25km-100km-ou-v2/ variant.
#
# OU DOES correctly denoise the endpoints in this mode -- this was
# specifically verified (not just assumed) as part of building this config:
#   - Before this work, ou_mixing_matrix/rbf_mixing_matrix (via noise.py's
#     shared Cholesky scaffold) always zero-padded the endpoint rows/cols
#     regardless of endpoints_observed -- correct when endpoints are pinned
#     (endpoints_observed=True), but silently wrong here: it would have
#     given the endpoints zero training noise and zero initial generation
#     noise, so they'd never get diffused at all.
#   - Fixed via a new `pin_endpoints` argument threaded through
#     noise.ou_mixing_matrix/rbf_mixing_matrix and
#     video_models._channel_mixing_matrix/_per_channel_mixing_tensor, set to
#     `config.endpoints_observed` -- False here, so the OU kernel now
#     correlates noise across ALL frames (endpoints included), matching
#     brownian_bridge's algebraic requirement to stay pinned-only (blocked
#     for endpoints_observed=False in __post_init__, since its correlation
#     formula divides by zero at the endpoints) while OU/RBF (well-defined
#     at the endpoints) do not need that restriction.
#   - Verified end-to-end in fme/downscaling/test_video_models.py: the OU
#     variant of test_coarse_endpoints_only_generate_runs_and_does_not_pin_endpoints
#     confirms repeated generate() samples differ at the endpoint frames
#     (i.e. they're genuinely stochastically diffused, not frozen), and
#     test_pure_coarse_to_fine_ou_kernel_noises_endpoints confirms nonzero
#     empirical training-noise variance at the endpoint frames directly.
#     Structurally: _video_edm_sample's `mask` (from _interior_mask) is
#     all-ones in this mode, so every `* mask` in the sampler loop is a
#     no-op -- the endpoints go through the exact same num_steps of
#     iterative denoising as every interior frame.
#
# Per-channel kernel choice / length scales: reused verbatim from the
# two-stage ou-v2 config, which in turn carried them from the temporal-only
# precedent at ../2026-07-20-video-pmd-5ch-per-channel-kernel/video_train.yaml
# (see that config's header and toy/process_residual_bridge_report.md for
# the fit provenance). OU for every channel; length scales in
# normalized-tau units (hours / 24h window): u10 12.9h, v10 13.4h, PRMSL
# 19.3h, PRATEsfc 7.9h, T2m 11.4h.
experiment_dir: /results
max_epochs: 200
validate_using_ema: true
validate_interval: 10
test_interval: 20
max_val_batches: 20
max_test_batches: 50
generate_n_samples: 1
log_loss_vs_noise: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-temporal-interp
  name: global-25km-100km-spatiotemporal-singlestage-5ch-coarse-endpoints-ou
  entity: ai2cm
optimization:
  lr: 0.0001
ema:
  decay: 0.9999
coarse_patch_extent_lat: 44
coarse_patch_extent_lon: 72
train_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  batch_size: 4  # global across ranks (4 GPUs x 1 sample/GPU) -- matches the two-stage configs
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
validation_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
test_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Nothing is pinned: no fine truth exists anywhere, so every frame -- the
  # former endpoints included -- is diffused. See header comment.
  endpoints_observed: false
  # Coarse (LR) is only available at the two endpoint frames -- masked to
  # zero at interior frames in the conditioning, with its own mask channel
  # -- rather than continuously at every frame. See header comment and
  # VideoDiffusionModelConfig.coarse_endpoints_only's docstring.
  coarse_endpoints_only: true
  # OU per-channel noise kernel -- see header comment for provenance and the
  # endpoint-denoising verification.
  temporal_noise_correlation: per_channel
  per_channel_noise_kernel:
    eastward_wind_at_ten_meters: ou
    northward_wind_at_ten_meters: ou
    PRMSL: ou
    PRATEsfc: ou
    air_temperature_at_two_meters: ou
  per_channel_kernel_length_scale:
    eastward_wind_at_ten_meters: 0.5375      # 12.9h / 24h
    northward_wind_at_ten_meters: 0.558333   # 13.4h / 24h
    PRMSL: 0.804167                          # 19.3h / 24h
    PRATEsfc: 0.329167                       # 7.9h / 24h
    air_temperature_at_two_meters: 0.475     # 11.4h / 24h
  log_transform_channels:
    PRATEsfc: 86400.0  # precip modeled in log1p(mm/day) space
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:  # fine (25km), train-only, global domain -- toy/compute_norm_stats_25km.py
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074   # log1p(PRATEsfc * 86400) space, matching log_transform_channels
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:  # coarse (100km), train-only, global domain -- reused verbatim
    # from the stage-1 config: verified 2026-07-24 that the 100km store is
    # byte-identical to the dataset those stats were computed from.
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
