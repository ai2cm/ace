experiment_dir: gs://vcm-ml-experiments/2026-09-13-ace2s-snow-memory-rollouts/era5-masked-log1p
n_forward_steps: 1825
forward_steps_in_memory: 25
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: false
  project: ace
  entity: ai2cm
loader:
  start_indices:
    times:
    - '1998-01-01T00:00:00'
    - '2003-01-01T00:00:00'
    - '2008-01-01T00:00:00'
    - '2013-01-01T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default/
      file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
    - data_path: /climate-default/
      file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025-snow-masked.zarr
      engine: zarr
  num_data_workers: 8
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files:
  - label: daily_fields
    names:
    - USWRFsfc
    - DSWRFsfc
    - DLWRFsfc
    - ULWRFsfc
    - SHTFLsfc
    - LHTFLsfc
    - total_frozen_precipitation_rate
    - TMP2m
    - surface_temperature
    - surface_snow_amount_masked
    - surface_snow_area_fraction_masked
    lat_extent: [-40, 90]
    save_reference: false
    format:
      name: zarr
aggregator:
  power_spectrum:
    enabled: false
  zonal_mean:
    enabled: false
  annual:
    enabled: false
  enso_index:
    enabled: false
  enso_coefficient:
    enabled: false
  ipo_index:
    enabled: false
