# 200-year piControl coupled free rollout at 1deg from a single coupled checkpoint (a coupled fine-tune's
# best_inference_ckpt) mounted at /ckpt.tar; the 4deg protocol (ic 0151-01-06) on the 1deg stores of the coupled FT.
experiment_dir: /results
n_coupled_steps: 14598
coupled_steps_in_memory: 6  # must divide n_coupled_steps (14598 = 2 x 3^2 x 811)
checkpoint_path: /ckpt.tar
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names: [sst]
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0151-01-06T00:00:00'
