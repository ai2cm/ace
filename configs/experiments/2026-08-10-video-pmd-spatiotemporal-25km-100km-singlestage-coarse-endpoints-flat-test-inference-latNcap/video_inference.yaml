# Test-set inference for
# video-pmd-spatiotemporal-25km-100km-global-5ch-singlestage-coarse-endpoints-flat
# (the SINGLE-STAGE, TRUE LR-endpoints-in/HR-full-out model -- see
# ../../fme/downscaling/video_models.py's module docstring and
# ../2026-08-07-video-pmd-spatiotemporal-25km-100km-singlestage-coarse-endpoints-flat/video_train.yaml
# for the endpoints_observed=false + coarse_endpoints_only=true
# architecture: no separate stage-A network -- ONE joint network diffuses
# every frame, including the endpoints, from the coarse (LR) endpoints
# alone). Region: NORTHERN polar cap, lat 44..88, full longitude. One of 4 regions tiling the full modeled
# domain (lat -88..88, lon 0..360) -- same tiling/boundary-verification as
# the two-stage v2 test-inference configs
# (../2026-08-10-video-pmd-spatiotemporal-25km-100km-flat-v2-test-inference-latNcap/).
#
# CHECKPOINT CAVEAT: training (experiment 01KZEN3KJN8Y6SYDSZBKWRFKFE) has NOT finished
# (crashed before reaching max_epochs=200) -- training crashed after starting epoch 32 (SIGABRT, rank-1 NCCL failure) and was NOT auto-resumed -- checkpoints/latest.ckpt reflects whatever epoch last saved before that crash.
# This is a preliminary/undertrained checkpoint, prepared for readiness but
# NOT YET LAUNCHED -- confirm training status before running.
#
# Checkpoint dataset: 01KZEN3KJVNMCQMPAEB8KXWRA3
checkpoint_path: /checkpoint/checkpoints/latest.ckpt
experiment_dir: /results
output_path: /climate-default/2026-06-25-temporal-diffusion/inference/video-pmd-spatiotemporal-25km-100km-global-5ch-singlestage-coarse-endpoints-flat/test-2023-2024-ens4-region-lat44to88-lon0to360.zarr
n_ensemble: 4
ensemble_chunk_size: 1
use_ema: true
# Preemptively true: a prior batch of v2 two-stage test-inference jobs hit
# a node health-check failure mid-run, and the auto-retry then failed with
# FileExistsError against the partial output store (default overwrite is
# False -- see this field's docstring in video_inference.py). Set true here
# up front so a retry after any similar interruption just cleanly replaces
# the partial zarr instead of failing.
overwrite: true
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: video-pmd-spatiotemporal-25km-100km-global-5ch-singlestage-coarse-endpoints-flat-test-inference-latNcap
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  # NORTHERN polar cap, lat 44..88, full longitude.
  lat_extent:
    start: 44
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Nothing pinned: no fine truth exists anywhere, every frame (endpoints
  # included) is diffused by this one network.
  endpoints_observed: false
  # Coarse (LR) is only available at the two endpoint frames -- masked to
  # zero at interior frames, with its own mask channel.
  coarse_endpoints_only: true
  temporal_noise_correlation: independent
  log_transform_channels:
    PRATEsfc: 86400.0
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
