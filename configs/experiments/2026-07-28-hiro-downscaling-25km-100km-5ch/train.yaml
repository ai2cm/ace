# HiRO-ACE-style spatial downscaling (100km -> 25km, factor 4), all 5
# channels. Architecture ported from Anna Kwa's real production config on
# config/global-moe-models --
# configs/experiments/2026-04-14-noise-schedule-moe/train-tmp2m-prate.yaml --
# but DATA is back to our own store (2026-07-14-X-SHiELD-AMIP-FME-3h-{25km,100km}.zarr
# on weka), not Anna's. History: the first full port (see git log) also
# switched to Anna's data source (her 25km.zarr + a merged pressure-data
# store for PRMSL), which turned out unnecessary and broken -- her 25km.zarr
# is missing air_temperature_at_two_meters entirely (confirmed by running
# job 01KYTJ2KBW636T4NN76Q85TTES: data_vars are only
# HGTsfc/PRATEsfc/eastward_wind_at_ten_meters/northward_wind_at_ten_meters),
# and no stats/25km/*.nc exists there either (job 01KYQM18BM6XTX6KD3FEXEJGZR).
# Our own store already has all 5 fields (confirmed: toy/compute_norm_stats_25km.py
# already computed real stats for exactly this channel set against it), so
# there's no need for Anna's data or a merge at all -- the only thing we
# actually needed from her config was the fine-resolution topography/
# land-fraction static inputs, which our own store never had, and those DO
# load successfully (no error on them in either failed run, only on the data
# source we've now dropped).
#
# Also restored the PMD-matching split (2013-01-02/2021-12-31 train,
# 2022 validation) and global lat/lon extent, since we're back on our own
# data and this baseline's whole point is comparability with the PMD runs.
#
# Kept from the port: unet_diffusion_song_v2 module type/config (with
# channel_mult shortened from 6 to 4 levels -- see below), EDM schedule,
# EMA/optimizer, loss_weights, use_amp_bf16, predict_residual,
# use_fine_topography.
# - module.config.channel_mult: source was [1,2,2,2,1,1] (6 levels, sized
#   for the source config's 100km->3km, ~33x factor). Ours is 100km->25km
#   (4x, much smaller), so shortened to [1,2,2,2] (4 levels), matching this
#   repo's other real 100km->25km precedent
#   (../../baselines/downscaling/train-conus-100km-to-25km-augusta.yaml).
# - normalization: inline means/stds (toy/norm_stats_25km.json for fine,
#   toy/norm_stats_100km.json for coarse -- both already computed and
#   verified against these exact stores), not file paths -- avoids
#   depending on Anna's stats files, which don't exist for 25km anyway.
#
# Open question, not changed: logging.project is Anna's own wandb project
# ("multivariate-downscaling"), copied verbatim -- worth confirming whether
# intended (shared team project) or should point at our own
# "ace-temporal-interp" instead, matching our other HiRO runs.
log_loss_vs_noise: true
static_inputs:
  HGTsfc: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/25km.zarr
  land_fraction: /climate-default/2025-11-19-X-SHiELD-AMIP-downscaling-land-fraction/25km/land_fraction.zarr
model:
  loss_weights:
    noise_weight_exponent: 0.75
    output_channels:
      PRATEsfc: 0.2
  use_amp_bf16: true
  out_names:
  - PRATEsfc
  - air_temperature_at_two_meters
  - PRMSL
  - eastward_wind_at_ten_meters
  - northward_wind_at_ten_meters
  in_names:
  - PRATEsfc
  - air_temperature_at_two_meters
  - PRMSL
  - eastward_wind_at_ten_meters
  - northward_wind_at_ten_meters
  loss:
    type: MSE
  module:
    config:
      bottleneck_attention: false
      model_channels: 128
      attn_resolutions: []
      num_blocks: 1
      channel_mult_emb: 6
      channel_mult:
      - 1
      - 2
      - 2
      - 2
      use_apex_gn: true
    type: unet_diffusion_song_v2
  normalization:
    # fine (25km) and coarse (100km), TRAIN split only, raw -- computed by
    # toy/compute_norm_stats_25km.py / toy/compute_norm_stats_100km.py
    # against our own store (not Anna's), verified against real GCS/weka data.
    fine:
      means:
        eastward_wind_at_ten_meters: -0.036200
        northward_wind_at_ten_meters: 0.170470
        PRMSL: 1008.160699
        PRATEsfc: 0.0000280
        air_temperature_at_two_meters: 279.675977
      stds:
        eastward_wind_at_ten_meters: 5.627319
        northward_wind_at_ten_meters: 4.692752
        PRMSL: 15.043594
        PRATEsfc: 0.0001289
        air_temperature_at_two_meters: 20.455977
    coarse:
      means:
        eastward_wind_at_ten_meters: -0.036981
        northward_wind_at_ten_meters: 0.171301
        PRMSL: 1008.158404
        PRATEsfc: 0.000028
        air_temperature_at_two_meters: 279.678194
      stds:
        eastward_wind_at_ten_meters: 5.538259
        northward_wind_at_ten_meters: 4.589926
        PRMSL: 15.020959
        PRATEsfc: 0.000100
        air_temperature_at_two_meters: 20.417566
  num_diffusion_generation_steps: 18
  churn: 0.0
  training_noise_distribution:
    p_min: 0.005
    p_max: 1000.0
  predict_residual: true
  sigma_max: 1000.0
  sigma_min: 0.005
  use_fine_topography: true
optimization:
  lr: 0.0001
  optimizer_type: Adam
ema:
  decay: 0.999
validate_using_ema: true
train_data:
  sample_with_replacement: 144
  batch_size: 48
  num_data_workers: 2
  fine:
  - data_path: /climate-default/2026-06-25-temporal-diffusion
    file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
    engine: zarr
    subset:
      start_time: '2013-01-02'
      stop_time: '2021-12-31'
  coarse:
  - data_path: /climate-default/2026-06-25-temporal-diffusion
    file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
    engine: zarr
    subset:
      start_time: '2013-01-02'
      stop_time: '2021-12-31'
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
  strict_ensemble: false
validation_data:
  batch_size: 16
  num_data_workers: 4
  fine:
  - data_path: /climate-default/2026-06-25-temporal-diffusion
    file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
    engine: zarr
    subset:
      start_time: '2022-01-01'
      stop_time: '2022-12-31'
  coarse:
  - data_path: /climate-default/2026-06-25-temporal-diffusion
    file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
    engine: zarr
    subset:
      start_time: '2022-01-01'
      stop_time: '2022-12-31'
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
  strict_ensemble: false
  # Required for DDP validation: train=False uses ContiguousDistributedSampler
  # (fme/downscaling/data/config.py), whose __iter__ gives the LAST rank the
  # entire remainder when the validation set size isn't evenly divisible by
  # world_size (datasets.py: `end = start + chunk_size if rank !=
  # num_replicas - 1 else total_size`). Without drop_last, that rank
  # iterates more validation batches than the others, desyncing the
  # Aggregator/GenerationAggregator reduce_sum collectives every rank must
  # issue in lockstep -- observed in job 01KYTJGBDYQ6A1W0DK3QF5CEP1 as a
  # silent NCCL ALLREDUCE watchdog timeout ~4h into the FIRST validation
  # pass (never reached a single training batch). Anna Kwa's original
  # source config (config/global-moe-models) already had this set; it was
  # dropped when this file was ported/reverted.
  drop_last: true
coarse_patch_extent_lat: 16
coarse_patch_extent_lon: 16
max_epochs: 200
# Raised from 20 (2026-08-01): fme.downscaling.train.TrainerConfig has no
# max_val_batches cap (unlike video_train.py's trainer), so every
# validation pass runs full generation (generate_n_samples: 2, 18 diffusion
# steps) over the ENTIRE global patch-tiled validation set -- observed to
# take ~4 hours per pass (job 01KYX54YVBSW4NXRSP4K6Z3HWN). At
# validate_interval: 20 that's 11 passes over a 200-epoch run (~44h just on
# validation); at 50 it's 4 passes (epochs 0/50/100/150). Paired with
# FME_DISTRIBUTED_TIMEOUT_MINUTES in run.sh so a genuinely slow-but-working
# pass isn't killed by the (otherwise 30-min) NCCL collective timeout.
validate_interval: 50
experiment_dir: /results
save_checkpoints: true
logging:
  project: multivariate-downscaling
  entity: ai2cm
  log_to_wandb: true
generate_n_samples: 2
