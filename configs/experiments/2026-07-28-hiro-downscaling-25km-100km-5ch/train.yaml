# HiRO-ACE-style spatial downscaling (100km -> 25km, factor 4), all 5
# channels, ported from Anna Kwa's real production config on the
# config/global-moe-models branch --
# configs/experiments/2026-04-14-noise-schedule-moe/train-tmp2m-prate.yaml
# (https://github.com/ai2cm/ace/blob/config/global-moe-models/configs/experiments/2026-04-14-noise-schedule-moe/train-tmp2m-prate.yaml)
# -- rather than the from-scratch version this file used previously (see git
# history), since that config already has real weka-hosted fine-resolution
# topography/land-fraction static inputs and a merged PRMSL data source,
# which our from-scratch version lacked entirely.
#
# Changes made when porting (everything else copied verbatim, including the
# unet_diffusion_song_v2 module type, EDM schedule, EMA/optimizer, and the
# 2014-2022 train / 2023 validation split -- NOT re-matched to the PMD split
# this time since that wasn't asked for in this pass):
# - out_names: was [PRATEsfc, air_temperature_at_two_meters] (2 fields) --
#   the source config only downscales those two. Set to all 5 (same as
#   in_names, which already listed all 5 as coarse conditioning inputs).
# - module.config.channel_mult: was [1,2,2,2,1,1] (6 resolution levels),
#   sized for the source config's 100km->3km downscale factor (~33x). Ours
#   is 100km->25km (4x, much smaller), so shortened to [1,2,2,2] (4 levels),
#   matching this repo's other real 100km->25km precedent
#   (../../baselines/downscaling/train-conus-100km-to-25km-augusta.yaml).
# - Every path containing "3km" (static_inputs, normalization.fine, the fine
#   merge file_patterns) changed to "25km" -- ASSUMES a 25km variant exists
#   alongside the 3km one in each of those weka directories; NOT verified
#   here (no local weka access). If a run hits FileNotFoundError/KeyError on
#   any of these, that's the first thing to check.
# - save_checkpoints: source config had this false (fine for a short
#   sweep/test run); set true here since a 200-epoch run with no
#   checkpoints would produce nothing usable at the end.
#
# Left as an open question rather than changed: logging.project is Anna's
# own wandb project ("multivariate-downscaling"), copied verbatim -- worth
# confirming whether that's intended (shared team project) or should point
# at our own "ace-temporal-interp" project instead, matching our other HiRO
# runs.
log_loss_vs_noise: true
static_inputs:
  HGTsfc: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/25km.zarr
  land_fraction: /climate-default/2025-11-19-X-SHiELD-AMIP-downscaling-land-fraction/25km/land_fraction.zarr
model:
  loss_weights:
    noise_weight_exponent: 0.75
    output_channels:
      PRATEsfc: 0.2
  use_amp_bf16: true
  out_names:
  - PRATEsfc
  - air_temperature_at_two_meters
  - PRMSL
  - eastward_wind_at_ten_meters
  - northward_wind_at_ten_meters
  in_names:
  - PRATEsfc
  - air_temperature_at_two_meters
  - PRMSL
  - eastward_wind_at_ten_meters
  - northward_wind_at_ten_meters
  loss:
    type: MSE
  module:
    config:
      bottleneck_attention: false
      model_channels: 128
      attn_resolutions: []
      num_blocks: 1
      channel_mult_emb: 6
      channel_mult:
      - 1
      - 2
      - 2
      - 2
      use_apex_gn: true
    type: unet_diffusion_song_v2
  normalization:
    coarse:
      global_means_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/stats/100km/centering-20260514.nc
      global_stds_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/stats/100km/scaling-full-field-20260514.nc
    fine:
      global_means_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/stats/25km/centering-20260514.nc
      global_stds_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/stats/25km/scaling-full-field-20260514.nc
  num_diffusion_generation_steps: 18
  churn: 0.0
  training_noise_distribution:
    p_min: 0.005
    p_max: 1000.0
  predict_residual: true
  sigma_max: 1000.0
  sigma_min: 0.005
  use_fine_topography: true
optimization:
  lr: 0.0001
  optimizer_type: Adam
ema:
  decay: 0.999
validate_using_ema: true
train_data:
  sample_with_replacement: 144
  batch_size: 48
  num_data_workers: 2
  fine:
  - merge:
    - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
      file_pattern: 25km.zarr
      engine: zarr
      subset:
        start_time: '2014-01-01T00:00:00'
        stop_time: '2022-12-31T23:59:00'
    - data_path: /climate-default/2026-02-03-downscaling-data-X-SHiELD-AMIP-pressure-data
      file_pattern: instantaneous_surface_and_sea_level_pressure_25km.zarr
      engine: zarr
      subset:
        start_time: '2014-01-01T00:00:00'
        stop_time: '2022-12-31T23:59:00'
  coarse:
  - merge:
    - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
      file_pattern: 100km.zarr
      engine: zarr
      subset:
        start_time: '2014-01-01T00:00:00'
        stop_time: '2022-12-31T23:59:00'
    - data_path: /climate-default/2026-02-03-downscaling-data-X-SHiELD-AMIP-pressure-data
      file_pattern: prmsl_100km.zarr
      engine: zarr
      subset:
        start_time: '2014-01-01T00:00:00'
        stop_time: '2022-12-31T23:59:00'
  lat_extent:
    start: -66.0
    stop: 70
  strict_ensemble: false
validation_data:
  batch_size: 16
  num_data_workers: 4
  fine:
  - merge:
    - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
      file_pattern: 25km.zarr
      engine: zarr
      subset:
        start_time: '2023-01-01T00:00:00'
        stop_time: '2024-01-01T00:00:00'
        step: 9
    - data_path: /climate-default/2026-02-03-downscaling-data-X-SHiELD-AMIP-pressure-data
      file_pattern: instantaneous_surface_and_sea_level_pressure_25km.zarr
      engine: zarr
      subset:
        start_time: '2023-01-01T00:00:00'
        stop_time: '2024-01-01T00:00:00'
        step: 9
  coarse:
  - merge:
    - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
      file_pattern: 100km.zarr
      engine: zarr
      subset:
        start_time: '2023-01-01T00:00:00'
        stop_time: '2024-01-01T00:00:00'
        step: 9
    - data_path: /climate-default/2026-02-03-downscaling-data-X-SHiELD-AMIP-pressure-data
      file_pattern: prmsl_100km.zarr
      engine: zarr
      subset:
        start_time: '2023-01-01T00:00:00'
        stop_time: '2024-01-01T00:00:00'
        step: 9
  lat_extent:
    start: 0
    stop: 35
  lon_extent:
    start: 75
    stop: 195
  strict_ensemble: false
  drop_last: true
coarse_patch_extent_lat: 16
coarse_patch_extent_lon: 16
max_epochs: 200
validate_interval: 20
experiment_dir: /results
save_checkpoints: true
logging:
  project: multivariate-downscaling
  entity: ai2cm
  log_to_wandb: true
generate_n_samples: 2
