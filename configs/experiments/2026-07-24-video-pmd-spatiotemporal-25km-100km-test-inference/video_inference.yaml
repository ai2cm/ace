# Test-set inference for video-pmd-spatiotemporal-25km-100km-global-5ch-flat-v1
# (the "flat"/independent-noise spatiotemporal two-stage PMD variant),
# GLOBAL not patch-tiled -- video_train.py's built-in evaluate_test() always
# divides into coarse_patch_extent-sized patches for a patch-trained model
# (see Trainer._get_batch_generator), but fme.downscaling.video_inference
# never patches at all: it calls griddata.get_generator() directly (whole,
# un-tiled batches at data.lat_extent/lon_extent) and runs model.generate()
# on those. This works because neither stage A (endpoint_super_resolution,
# physicsnemo_unets_v1 SongUNet) nor stage B (video UNet, v2/SongUNetv2) set
# additive_pos_embed or attn_resolutions in this model -- those are the only
# things that bake a fixed spatial size into the weights, so both backbones
# are fully convolutional / resolution-agnostic here. If that assumption
# were wrong, model.generate() would raise a shape-mismatch error rather
# than silently produce garbage.
#
# Checkpoint: /checkpoint/checkpoints/latest.ckpt, mounted from the RESUMED
# run's current result dataset (01KYQG2PTJKRGNWZXTMR6MVC8B, experiment
# 01KYQG2PTD4C9PS5PYFBBS3ZF9 -- itself resumed on weka from the original
# killed run 01KYGFN96W7XXJGVX8H9YWZYN3). This is whatever step is currently
# checkpointed at launch time, NOT verified in advance to be exactly step
# 345240 -- the inference job's own startup log prints the loaded
# checkpoint's num_batches_seen/epoch; check that against 345240 once it
# starts.
#
# n_ensemble reduced to 4 (not the 32 used for the lighter stage-1 1-degree
# model, see ../2026-07-22-video-pmd-5ch-flat-test-inference/) for this
# first pass -- this two-stage 25km model is a much heavier per-sample cost
# (720x1440 fine grid vs 1-degree's ~180x360, plus the extra stage-A
# network per endpoint) and runtime here is unverified; scale up once a
# first full-test-period pass completes and its wall-clock is known.
# ensemble_chunk_size: 1 carried over from the stage-1 configs' own
# known-safe value (int32 grouped-conv overflow at higher effective batch,
# same architecture family).
#
# model:/test_data: pasted verbatim from
# ../2026-07-24-video-pmd-spatiotemporal-25km-100km/video_train.yaml's own
# model:/test_data: blocks -- do not hand-edit them out of sync with that file.
checkpoint_path: /checkpoint/checkpoints/latest.ckpt
experiment_dir: /results
output_path: /climate-default/2026-06-25-temporal-diffusion/inference/video-pmd-spatiotemporal-25km-100km-global-5ch-flat-v1/test-2023-2024-ens4-region-lat-44to44-lon0to180.zarr
n_ensemble: 4
ensemble_chunk_size: 1
use_ema: true
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: video-pmd-spatiotemporal-25km-100km-global-5ch-flat-v1-test-inference
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  # NOT full global (-88/88, 0/360) -- that OOM'd (67.3 GiB single alloc for
  # the attention_levels: [3,4] spatial attention on the full 720x1440 fine
  # grid, folded with n_timesteps=9 as an effective batch multiplier: at
  # level 3 (~88x180=15840px after 3 downsamples), memory is
  # batch(1)*T(9)*heads(8)*N^2(15840^2)*4B =~67GB, on a GPU already at
  # 172/178GiB before that allocation even starts -- this architecture has
  # no spatial-attention tiling, so true single-shot full-globe generation
  # doesn't fit no matter the batch_size (already minimal at 1/GPU). Cut to
  # a quarter-area region (half lat, half lon) as a first empirical probe;
  # shrink further if this still OOMs. Genuinely-global coverage would need
  # running several such regions and concatenating outputs (accepting a
  # small accuracy cost at the seams vs. true full-domain attention), not a
  # single job -- see run.sh header before scaling this up.
  lat_extent:
    start: -44
    stop: 44
  lon_extent:
    start: 0
    stop: 180
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  endpoints_observed: true
  endpoint_super_resolution:
    module:
      type: unet_diffusion_song
      config:
        model_channels: 64
        channel_mult: [1, 2, 2, 2]
        attn_resolutions: []
    loss:
      type: MSE
    training_noise_distribution:
      p_mean: -1.2
      p_std: 1.8
    coarse_shape: [176, 288]
    sigma_min: 0.002
    sigma_max: 150.0
    churn: 0.0
    num_diffusion_generation_steps: 18
    loss_weight: 1.0
  temporal_noise_correlation: independent
  log_transform_channels:
    PRATEsfc: 86400.0
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
