# Test-set inference for
# video-pmd-spatiotemporal-25km-100km-global-5ch-singlestage-coarse-endpoints-ou
# (the SINGLE-STAGE, TRUE LR-endpoints-in/HR-full-out model), GLOBAL DOMAIN
# IN ONE JOB -- via divide_generation (see fme/downscaling/predictors/video_composite.py's
# VideoPatchPredictor), instead of the 4-region manual tiling used by
# ../2026-08-10-video-pmd-spatiotemporal-25km-100km-singlestage-coarse-endpoints-ou-test-inference-*/.
#
# divide_generation tiles the requested domain into coarse_patch_extent
# ([44, 72], matching this model's OWN training patch size -- see
# ../2026-08-07-video-pmd-spatiotemporal-25km-100km-singlestage-coarse-endpoints-ou/video_train.yaml's
# coarse_patch_extent_lat/lon) patches, generates each independently, and
# composites the fine-resolution results back together with
# coarse_horizontal_overlap=1 pixel of overlap averaged away at patch
# boundaries. This is NEW, unit-tested-but-not-yet-production-run code
# (fme/downscaling/predictors/test_video_composite.py) -- consider a small
# max_batches/reduced-domain smoke run before trusting this as the full
# production result.
#
# CHECKPOINT CAVEAT: training (experiment 01KZEN6Z9H6JP6P01Z6YF5VGH5) has NOT finished
# (crashed before reaching max_epochs=200) -- training crashed once (exitcode 255), was auto-resumed by Beaker, then crashed again after starting epoch 38 (exitcode 1) -- checkpoint dataset is from the SECOND (most recent) attempt.
# checkpoints/latest.ckpt reflects whatever epoch last saved before that
# crash -- preliminary/undertrained, not the final model.
#
# Checkpoint dataset: 01KZMVWK98BJK0XV52NFK972M1
checkpoint_path: /checkpoint/checkpoints/latest.ckpt
experiment_dir: /results
output_path: /climate-default/2026-06-25-temporal-diffusion/inference/video-pmd-spatiotemporal-25km-100km-global-5ch-singlestage-coarse-endpoints-ou/test-2023-2024-ens4-global.zarr
n_ensemble: 4
ensemble_chunk_size: 1
use_ema: true
overwrite: true
divide_generation: true
coarse_patch_extent: [44, 72]
coarse_horizontal_overlap: 1
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: video-pmd-spatiotemporal-25km-100km-global-5ch-singlestage-coarse-endpoints-ou-test-inference-global
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  # Full global domain -- no manual region split needed with divide_generation.
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Nothing pinned: no fine truth exists anywhere, every frame (endpoints
  # included) is diffused by this one network.
  endpoints_observed: false
  # Coarse (LR) is only available at the two endpoint frames -- masked to
  # zero at interior frames, with its own mask channel.
  coarse_endpoints_only: true
  temporal_noise_correlation: per_channel
  per_channel_noise_kernel:
    eastward_wind_at_ten_meters: ou
    northward_wind_at_ten_meters: ou
    PRMSL: ou
    PRATEsfc: ou
    air_temperature_at_two_meters: ou
  per_channel_kernel_length_scale:
    eastward_wind_at_ten_meters: 0.5375
    northward_wind_at_ten_meters: 0.558333
    PRMSL: 0.804167
    PRATEsfc: 0.329167
    air_temperature_at_two_meters: 0.475
  log_transform_channels:
    PRATEsfc: 86400.0
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
