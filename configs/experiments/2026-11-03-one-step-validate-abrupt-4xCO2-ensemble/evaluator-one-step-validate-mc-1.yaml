# arg: --dataset 01JQKRW7XSB1QJQSXAEY3G7D1C:training_checkpoints/best_inference_ckpt.tar:/ckpt.tar
#
# One-step validation of 2025-03-30-ace-som-rp-ga-b16-energy-fine-tune-mc-1
# (best_inference_ckpt.tar) on the 36-member SHiELD-SOM abrupt-4xCO2 ensemble,
# using the evaluator's validation section. The evaluator still requires an
# inference rollout, so it is a minimal one: a single 1-step forecast with no
# file output.
#
# Multi-call is disabled because the ensemble data has no multi-call targets.
# Loss weights match the original fine-tuning config so val/mean/loss is
# comparable to training.
