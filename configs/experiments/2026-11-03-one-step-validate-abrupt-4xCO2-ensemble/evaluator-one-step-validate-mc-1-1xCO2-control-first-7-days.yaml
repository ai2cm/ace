# arg: --dataset 01JQKRW7XSB1QJQSXAEY3G7D1C:training_checkpoints/best_inference_ckpt.tar:/ckpt.tar
#
# One-step validation of 2025-03-30-ace-som-rp-ga-b16-energy-fine-tune-mc-1
# (best_inference_ckpt.tar) on the 1xCO2 control (ic_0005) over the periods
# that match the 36 abrupt-4xCO2 ensemble members, which were initialized from
# this run on the first of each month from 2031-01 to 2033-12. Each window
# starts 6 hours after the initialization date, to line up with the first time
# in the abrupt-4xCO2 data. Each window has
# 28 one-step samples, so targets fall in hours 6-174 after initialization,
# matching the first-7-days abrupt-4xCO2 config.
# Times are in the data's proleptic_gregorian calendar. The control data keep
# their own global_mean_co2 (no overwrite).
#
# Validation uses the evaluator's validation section, and the evaluator still
# requires an inference rollout, so it is a minimal one: a single 1-step
# forecast with no file output.
#
# Multi-call is disabled because the data has no multi-call targets. Loss
# weights match the original fine-tuning config so val/mean/loss is comparable
# to training.
experiment_dir: /results
checkpoint_path: /ckpt.tar
stepper_override:
  multi_call: null
logging:
  project: ace-som
  entity: ai2cm
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
validation:
  loader:
    batch_size: 8
    num_data_workers: 4
    prefetch_factor: 4
    dataset:
      concat:
      - data_path: /climate-default/2025-04-07-vertically-resolved-1deg-c96-shield-som-ensemble-fme-dataset-combined-spin-up-and-post-spin-up-zarr
        file_pattern: 1xCO2-ic_0005.zarr
        engine: zarr
        subset:
          start_time: '2031-01-01T06:00:00'
          stop_time: '2031-01-08T00:00:00'
      - data_path: /climate-default/2025-04-07-vertically-resolved-1deg-c96-shield-som-ensemble-fme-dataset-combined-spin-up-and-post-spin-up-zarr
