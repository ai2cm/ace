# Stage A: 5-year rollout from the 8 1940 ICs, saving the full
# prognostic state every 73 days. forward_steps_in_memory equals the
# snapshot interval so the step slice picks one state per window.
# Generated by make_configs.py; edit that, not this file.
experiment_dir: /results
n_forward_steps: 1825
forward_steps_in_memory: 73
checkpoint_path: /ckpt.tar
n_ensemble_per_ic: 1
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
loader:
  dataset:
    merge:
    - data_path: /climate-default/
      file_pattern: 2026-08-13-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
    - data_path: /climate-default/
      file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
  start_indices:
    times:
    - '1940-01-03T00:00:00'
    - '1940-01-04T00:00:00'
    - '1940-01-05T00:00:00'
    - '1940-01-06T00:00:00'
    - '1940-01-07T00:00:00'
    - '1940-01-08T00:00:00'
    - '1940-01-09T00:00:00'
    - '1940-01-10T00:00:00'
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files:
  - label: states
    names:
    - PRESsfc
    - surface_temperature
    - air_temperature_0
    - air_temperature_1
    - air_temperature_2
    - air_temperature_3
    - air_temperature_4
    - air_temperature_5
    - air_temperature_6
    - air_temperature_7
    - specific_total_water_0
    - specific_total_water_1
    - specific_total_water_2
    - specific_total_water_3
    - specific_total_water_4
    - specific_total_water_5
    - specific_total_water_6
    - specific_total_water_7
    - eastward_wind_0
    - eastward_wind_1
    - eastward_wind_2
    - eastward_wind_3
    - eastward_wind_4
    - eastward_wind_5
    - eastward_wind_6
    - eastward_wind_7
    - northward_wind_0
    - northward_wind_1
    - northward_wind_2
    - northward_wind_3
    - northward_wind_4
    - northward_wind_5
    - northward_wind_6
    - northward_wind_7
    save_reference: false
    time_selection:
      start: 0
      step: 73
