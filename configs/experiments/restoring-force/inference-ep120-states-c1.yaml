# Stage B chunk 1: 30-day runs from states saved along the
# ep120 checkpoint's stage-A rollout (mounted at /ic).
# Generated by make_configs.py; edit that, not this file.
experiment_dir: /results
n_forward_steps: 30
forward_steps_in_memory: 5
checkpoint_path: /ckpt.tar
n_ensemble_per_ic: 1
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
initial_condition:
  path: /ic/ep120-states.nc
  start_indices:
    first: 50
    n_initial_conditions: 50
    interval: 1
forcing_loader:
  dataset:
    merge:
    - data_path: /climate-default/
      file_pattern: 2026-08-13-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
    - data_path: /climate-default/
      file_pattern: 2026-07-24-era5-1deg-8layer-daily-1940-2025.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files:
  - label: 5day_mean
    names:
    - air_temperature_0
    - air_temperature_1
    - air_temperature_2
    - air_temperature_3
    - air_temperature_4
    - air_temperature_5
    - air_temperature_6
    - air_temperature_7
    - specific_total_water_0
    - PRESsfc
    - TMP2m
    - ULWRFtoa
    - USWRFtoa
    - PRATEsfc
    save_reference: false
    time_coarsen:
      coarsen_factor: 5
