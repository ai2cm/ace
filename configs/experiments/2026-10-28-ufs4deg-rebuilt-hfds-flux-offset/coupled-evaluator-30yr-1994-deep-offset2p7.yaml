# As coupled-evaluator-30yr-1994-deep.yaml, with a -2.7 W/m2 constant in the ocean heat-content budget at inference only
# (a flux adjustment for the coupled atmosphere's surface-flux excess over the replay; no retraining).
experiment_dir: /results
checkpoint_path: /ckpt.tar  # a coupled fine-tune checkpoint (carries the rename/scale/fraction config)
n_coupled_steps: 2170  # 1994-01-05 .. 2023-09, the whole replay record incl. the untouched 2002-2011 decade
coupled_steps_in_memory: 10
ocean_stepper_override:
  # Replaces the checkpoint's ocean corrector (options not restated fall back to defaults), identical to the coupled
  # fine-tune's corrector except for the constant: -2.7 W/m2 (ocean-area mean, the corrector's own averaging) removes the
  # surface heat the coupled system books beyond the replay's uptake (4.01 vs 1.27 W/m2 in the pretrain-vs-scratch
  # pretrained arm's 30-yr run, wandb qqgfwu22).
  corrector:
    type: ocean_corrector
    config:
      ocean_heat_content_correction:
        method: scaled_temperature
        constant_unaccounted_heating: -2.7
      surface_energy_flux_correction:
        method: prescribed_open_ocean
      force_positive_names: [so_0, so_1, so_2, so_3, so_4, so_5, so_6, so_7, so_8, so_9, so_10, so_11, so_12, so_13, so_14, so_15, so_16, so_17, so_18, sea_ice_volume]
      sea_ice_fraction_correction:
        sea_ice_fraction_name: ocean_sea_ice_fraction
        land_fraction_name: land_fraction
        remove_negative_ocean_fraction: false
        zero_where_ice_free_names: [sea_ice_volume, sfdsi, UI, VI]
      zos_global_mean_correction:
        reference_global_mean: 0.0
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
    atmosphere:
      data_path: /era5
      file_pattern: 2026-10-14-era5-4deg-8layer-daily-ufs-coupled-1994-2023.zarr
      engine: zarr
  start_indices:
    times:
    - '1994-01-05T18:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names: [sst, thetao_0, thetao_5, thetao_10, thetao_14, thetao_15, thetao_16, thetao_17, thetao_18, ocean_heat_content, ocean_sea_ice_fraction, hfds_total_area]
  atmosphere:
    save_prediction_files: false
    save_monthly_files: true
    names: [surface_temperature, TMP2m, DSWRFsfc, DLWRFsfc, ULWRFsfc, USWRFsfc, LHTFLsfc, SHTFLsfc, PRATEsfc, eastward_surface_stress, northward_surface_stress, sea_ice_fraction, ocean_fraction]
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
