# 2002-2010 clean-window S2S hindcast of the GLO12 coupled SamudrACE checkpoint, year 2007: 12 monthly starts (first
# GLORYS12 5-day state of each month) x 8 noise members, 18 five-day steps (90 d), daily atmosphere + 5-day ocean
