# arg: --dataset brianhenn/2026-08-07-era5-1deg-8layer-daily-1940-2025-land-snow-masked-stats-1990-2019:/statsdata
seed: 0
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
max_epochs: 40
save_per_epoch_diagnostics: true
ema:
  decay: 0.999
inference:
- n_forward_steps: 1825
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '1998-01-01T00:00:00'
      - '1999-01-01T00:00:00'
      - '2000-01-01T00:00:00'
      - '2001-01-01T00:00:00'
      - '2002-01-01T00:00:00'
      - '2003-01-01T00:00:00'
      - '2004-01-01T00:00:00'
      - '2005-01-01T00:00:00'
    dataset:
      merge:
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025-land-snow-masked.zarr
        engine: zarr
    num_data_workers: 8
  aggregator:
    histogram:
      enabled: true
    time_mean_reference_data: /statsdata/time-mean.nc
    anomaly_memory:
      enabled: true
      # Snow-relevant fields; the controls have no snow channels and skip them.
      variables:
      - USWRFsfc
      - TMP2m
      - surface_temperature
      - surface_snow_amount_masked
      - surface_snow_area_fraction_masked
      report_lags: [7, 14]
      # Leading times: extended cold season per hemisphere.
      months_northern: [11, 12, 1, 2, 3, 4, 5]
      months_southern: [5, 6, 7, 8, 9, 10, 11]
      regions:
        - name: Siberia
          lat: [50, 68]
          lon: [60, 140]
        - name: Canada
          lat: [50, 65]
          lon: [250, 285]
        - name: N_Europe
          lat: [55, 68]
          lon: [5, 40]
        - name: Tibet
          lat: [30, 38]
          lon: [80, 100]
        - name: Great_Plains
          lat: [32, 49]
          lon: [255, 265]
        - name: Rockies
          lat: [38, 45]
          lon: [249, 256]
        - name: Andes
          lat: [-35, -15]
          lon: [287, 293]
        - name: north_of_40S
          lat: [-40, 90]
          lon: [0, 360]
    snow_season:
      enabled: true
      variable: surface_snow_amount_masked
      regions:
        - name: Siberia
          lat: [50, 68]
          lon: [60, 140]
        - name: Canada
          lat: [50, 65]
          lon: [250, 285]
        - name: N_Europe
          lat: [55, 68]
          lon: [5, 40]
        - name: Tibet
          lat: [30, 38]
          lon: [80, 100]
        - name: Great_Plains
          lat: [32, 49]
          lon: [255, 265]
        - name: Rockies
          lat: [38, 45]
          lon: [249, 256]
        - name: Andes
          lat: [-35, -15]
          lon: [287, 293]
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 8
  prefetch_factor: 2
  dataset:
    merge:
    - concat:
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          stop_time: '1995-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2011-01-01'
          stop_time: '2019-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2021-01-01'
    - concat:
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025-land-snow-masked.zarr
        engine: zarr
        subset:
          stop_time: '1995-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025-land-snow-masked.zarr
        engine: zarr
        subset:
          start_time: '2011-01-01'
          stop_time: '2019-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025-land-snow-masked.zarr
        engine: zarr
        subset:
          start_time: '2021-01-01'
validation:
  loader:
    batch_size: 64
    num_data_workers: 8
    prefetch_factor: 2
    dataset:
      merge:
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1996-01-01'
          stop_time: '1997-12-31'
      - data_path: /climate-default/
        file_pattern: 2026-08-07-era5-1deg-8layer-daily-1940-2025-land-snow-masked.zarr
        engine: zarr
        subset:
          start_time: '1996-01-01'
          stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps: 1
  loss:
    type: EnsembleLoss
    weights:
      h500: 5.0
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  input_masking:
    mask_value: 0
    fill_value: 0.0
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
      normalization:
        network:
          global_means_path: /statsdata/centering.nc
          global_stds_path: /statsdata/scaling-full-field.nc
        residual:
          global_means_path: /statsdata/centering.nc
          global_stds_path: /statsdata/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        clip_frozen_precipitation: true
        total_energy_budget_correction:
          method: constant_temperature
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - total_frozen_precipitation_rate
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
        - surface_snow_amount_masked
        - surface_snow_area_fraction_masked
      next_step_forcing_names:
      - DSWRFtoa
      - global_mean_co2
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - surface_snow_amount_masked
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      out_names:
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
