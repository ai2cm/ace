# Test-set inference for video-pmd-spatiotemporal-25km-100km-global-5ch-ou-v1,
# region 3 of 4 needed to tile the full modeled domain (lat -88..88, lon
# 0..360). See the flat variant's matching region config
# (../2026-08-03-video-pmd-spatiotemporal-25km-100km-flat-test-inference-latNcap/)
# for the full tiling-verification and memory rationale (identical grid,
# only the model block's noise kernel differs between flat/ou).
#
# Checkpoint: same dataset as OU region 1 (01KYQG329F629C70X0QH2WKZPZ).
checkpoint_path: /checkpoint/checkpoints/latest.ckpt
experiment_dir: /results
output_path: /climate-default/2026-06-25-temporal-diffusion/inference/video-pmd-spatiotemporal-25km-100km-global-5ch-ou-v1/test-2023-2024-ens4-region-lat44to88-lon0to360.zarr
n_ensemble: 4
ensemble_chunk_size: 1
use_ema: true
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: video-pmd-spatiotemporal-25km-100km-global-5ch-ou-v1-test-inference-latNcap
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  # Northern polar cap, full longitude.
  lat_extent:
    start: 44
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  endpoints_observed: true
  endpoint_super_resolution:
    module:
      type: unet_diffusion_song
      config:
        model_channels: 64
        channel_mult: [1, 2, 2, 2]
        attn_resolutions: []
    loss:
      type: MSE
    training_noise_distribution:
      p_mean: -1.2
      p_std: 1.8
    coarse_shape: [176, 288]
    sigma_min: 0.002
    sigma_max: 150.0
    churn: 0.0
    num_diffusion_generation_steps: 18
    loss_weight: 1.0
  temporal_noise_correlation: per_channel
  per_channel_noise_kernel:
    eastward_wind_at_ten_meters: ou
    northward_wind_at_ten_meters: ou
    PRMSL: ou
    PRATEsfc: ou
    air_temperature_at_two_meters: ou
  per_channel_kernel_length_scale:
    eastward_wind_at_ten_meters: 0.5375
    northward_wind_at_ten_meters: 0.558333
    PRMSL: 0.804167
    PRATEsfc: 0.329167
    air_temperature_at_two_meters: 0.475
  log_transform_channels:
    PRATEsfc: 86400.0
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
