# Full 1940-2025 free-running evaluation of the hybrid-residual arm-1 model
# (best_inference checkpoint = epoch 15, the last epoch whose inline 5-yr
# rollout stayed finite). Identical to the ERA5 baseline evaluator config so
# results are directly comparable to the ace2s baseline evaluation.
experiment_dir: /results
n_forward_steps: 124121 #1940 - 2025
forward_steps_in_memory: 50
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
loader:
  start_indices:
    times:
      - '1940-01-01T12:00:00'
  dataset:
    data_path: /climate-default/
    file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
    engine: zarr
  num_data_workers: 8
aggregator:
  zonal_mean:
    enabled: true
  histogram:
    enabled: true
data_writer:
  save_prediction_files: false
  save_monthly_files: false
