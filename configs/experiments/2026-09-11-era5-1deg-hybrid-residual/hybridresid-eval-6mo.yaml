# 1-year evaluation window (within the hybrid model's finite range: the 86-yr
# rollout went NaN at step ~1669). Used for clean power-spectrum / histogram
# comparison between the hybrid-residual arm-1 model and the full-field ace2s
# baseline at identical protocol (same window, same aggregators).
experiment_dir: /results
n_forward_steps: 720 # 6 months: safely inside the hybrid blowup (earliest observed step 1203)
forward_steps_in_memory: 50
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
loader:
  start_indices:
    times:
      - '1940-01-01T12:00:00'
  dataset:
    data_path: /climate-default/
    file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
    engine: zarr
  num_data_workers: 8
aggregator:
  zonal_mean:
    enabled: true
  histogram:
    enabled: true
data_writer:
  save_prediction_files: false
  save_monthly_files: false
