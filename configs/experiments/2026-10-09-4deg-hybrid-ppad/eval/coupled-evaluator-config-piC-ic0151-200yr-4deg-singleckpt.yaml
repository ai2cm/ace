# Same 200-year piControl coupled protocol as coupled-evaluator-config-piC-ic0151-200yr-4deg.yaml,
# but from a single coupled checkpoint (the output of a coupled fine-tune) mounted at /ckpt.tar.
experiment_dir: /results
n_coupled_steps: 14598
coupled_steps_in_memory: 18
checkpoint_path: /ckpt.tar
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names: [sst]
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0151-01-06T00:00:00'
