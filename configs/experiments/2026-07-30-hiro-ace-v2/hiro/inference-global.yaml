experiment_dir: /climate-default/2026-08-03-hiro-ace-v2-outputs/2026-08-03-hiro-perfect-pred-global-2023
patch:
  divide_generation: true
  composite_prediction: true
  coarse_horizontal_overlap: 1
model:
  mixture_of_experts_path: /ckpt.tar
data:
  coarse:
    - merge:
      - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
        file_pattern: 100km.zarr
        engine: zarr
      - data_path:  /climate-default/2026-02-03-downscaling-data-X-SHiELD-AMIP-pressure-data
        file_pattern: prmsl_100km.zarr
        engine: zarr
  batch_size: 8
  num_data_workers: 2
  strict_ensemble: false
outputs:
  - name: "global_perfect_prediction"
    save_vars: ["PRATEsfc", "eastward_wind_at_ten_meters", "northward_wind_at_ten_meters", "PRMSL"]
    n_ens: 1
    max_samples_per_gpu: 32
    time_range:
      start_time: "2023-01-01T00:00:00"
      stop_time: "2023-12-31T18:00:00"
    lat_extent:
      start: -65.0
      stop: 65.0
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: multivariate-downscaling
  entity: ai2cm