    start: 0
    stop: 16
    # start: 22.0
    # stop: 50.0
  lon_extent:
    #start: 230.0
    #stop: 295.0
    start: 0
    stop: 16
  batch_size: 8
  num_data_workers: 2
  strict_ensemble: false
