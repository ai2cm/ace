# 4deg twin of evaluator-config-1pct_yearly_1deg.yaml: identical except for the
# dataset stores, for checkpoints trained on the 4deg OM4 zarrs (e.g. the
# salinity-corrector runs). The 4deg stores have the same 10220-step,
# 0001-01-06..0141-01-01 time axis, so the IC and step count are unchanged.
# Keep the two files in sync when changing anything other than the dataset.
experiment_dir: /results
n_forward_steps: 10147
forward_steps_in_memory: 73
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0002-01-01T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-4deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: true
  save_step_diagnostics: true
  time_coarsen:
    coarsen_factor: 73
