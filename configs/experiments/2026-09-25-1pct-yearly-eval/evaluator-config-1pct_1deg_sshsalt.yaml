# The default 1pctCO2 eval: evaluator-config-1pct_yearly_1deg_sshsalt.yaml without the monthly
# files (save_monthly_files false), keeping the metrics and the yearly-mean
# corrector deltas. Use the 1pct_yearly_* config when the monthly-mean
# targets and predictions are wanted.
#
# evaluator-config-1pct_yearly_1deg.yaml with the SSH salt correction added at inference: the corrector
# of the ocean_socorr runs (2026-10-09-samudra-pool-padding/ocean_socorr_pool),
# restated whole since the override replaces the trained corrector, without
# the training-only corrector_disabled_epochs. For a checkpoint trained without
# the salt correction, this adds it; for one trained with it, nothing changes.
#
# 1deg twin of evaluator-config-1pct_yearly_4deg.yaml: identical except for the
# dataset stores, the 1deg OM4 1pctCO2 zarrs, which have the same 10220-step,
# 0001-01-06..0141-01-01 time axis, so the IC and step count are unchanged.
# Keep the two files in sync when changing anything other than the dataset.
experiment_dir: /results
n_forward_steps: 10147
forward_steps_in_memory: 73
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0002-01-01T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  save_step_diagnostics: true
  time_coarsen:
    coarsen_factor: 73
stepper_override:
  corrector:
    type: ocean_corrector
    config:
      ocean_heat_content_correction:
        method: scaled_temperature
      surface_energy_flux_correction:
        method: prescribed_open_ocean
      force_positive_names:
      - so_0
      - so_1
      - so_2
      - so_3
      - so_4
      - so_5
      - so_6
      - so_7
      - so_8
      - so_9
      - so_10
      - so_11
      - so_12
      - so_13
      - so_14
      - so_15
      - so_16
      - so_17
      - so_18
      - sea_ice_volume
      sea_ice_fraction_correction:
        sea_ice_fraction_name: ocean_sea_ice_fraction
        land_fraction_name: land_fraction
        remove_negative_ocean_fraction: false
        zero_where_ice_free_names:
        - sea_ice_volume
        - sfdsi
        - UI
        - VI
      zos_global_mean_correction:
        reference_global_mean: -0.00013
      ocean_salt_content_correction:
        method: scaled_salinity
        budget_config:
          type: sea_surface_height
