# Full test-set frame-by-frame inference for the HiRO-ACE-style spatial
# downscaling baseline (100km -> 25km, 5ch), training job v6
# (01KZ1WGMKRX6AKWWQXB8JJWRZP, succeeded 2026-08-03) -- SAME checkpoint as
# ../2026-08-06-hiro-downscaling-25km-100km-5ch-test-inference/, no
# retraining needed, just a re-run with n_ens: 4 instead of 1.
#
# n_ens: 4, not 1 -- the original n_ens=1 run was for visual/frame-by-frame
# inspection only (its own header said "bump this ... if/when this becomes
# about scoring probabilistic skill"). It's since become exactly that:
# hiro is scored deterministically (RMSE/MAE/bias) against the video-PMD
# models in toy/single_vs_two_stage_v1_comparison.md, but that's not a fair
# comparison against models that get real CRPS/spread-skill scoring with a
# 4-member ensemble -- this run makes hiro directly comparable via
# scripts/video_pmd_eval/crps_eval.py-style fair-CRPS scoring (same n_ens=4
# convention as every other model in that comparison). max_samples_per_gpu
# unchanged from the n_ens=1 run: it's an independent per-GPU
# time*ensemble batching knob (see fme/downscaling/inference/output.py's
# OutputTarget docstring), not something that needs to scale with n_ens.
#
# Everything else (patch tiling, data, save_vars, time/lat/lon range)
# copied verbatim from the n_ens=1 config -- this is a single-variable
# change (n_ens only).
model:
  checkpoint_path: /checkpoint/checkpoints/ema_ckpt.tar
experiment_dir: /results
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: hiro-downscaling-25km-100km-global-5ch-v6-test-inference-ens4
  entity: ai2cm
data:
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 4
  strict_ensemble: false
patch:
  divide_generation: true
  composite_prediction: true
  coarse_horizontal_overlap: 1
outputs:
  - name: test-2023-2024-ens4
    n_ens: 4
    max_samples_per_gpu: 8
    save_vars:
      - PRATEsfc
      - air_temperature_at_two_meters
      - PRMSL
      - eastward_wind_at_ten_meters
      - northward_wind_at_ten_meters
    time_range:
      start_time: "2023-01-01"
      stop_time: "2024-01-04"
    lat_extent:
      start: -88
      stop: 88
    lon_extent:
      start: 0
      stop: 360
