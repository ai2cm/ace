# Writes to the weka mount. Paired with config-gcs.yaml, which differs only in
# experiment_dir, to compare a POSIX store against object storage.
experiment_dir: /climate-default/home/brianhenn/ace/scratch/2026-09-04-ace-data-writing-benchmark
logging:
  log_to_screen: true
  log_to_wandb: true
  # the benchmark logs to a temporary directory that it deletes on exit, so a log
  # file would be discarded; the job log carries the same content
  log_to_file: false
  project: ace-data-writing-benchmark
  entity: ai2cm
loader:
  dataset:
    data_path: /climate-default
    file_pattern: 2025-03-21-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
    engine: zarr
  start_indices:
    n_initial_conditions: 2
    first: 0
    interval: 3
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files:
    - label: autoregressive_predictions
      save_reference: false
      format:
        name: zarr
n_forward_steps: 1000
forward_steps_in_memory: 50
names:
  - ocean_fraction
  - sea_ice_fraction
  - DSWRFtoa
  - PRESsfc
  - surface_temperature
  - TMP2m
  - Q2m
  - UGRD10m
  - VGRD10m
  - air_temperature_0
  - air_temperature_1
  - air_temperature_2
  - air_temperature_3
  - air_temperature_4
  - air_temperature_5
  - air_temperature_6
  - air_temperature_7
  - specific_total_water_0
  - specific_total_water_1
  - specific_total_water_2
  - specific_total_water_3
  - specific_total_water_4
  - specific_total_water_5
  - specific_total_water_6
  - specific_total_water_7
  - eastward_wind_0
  - eastward_wind_1
  - eastward_wind_2
  - eastward_wind_3
  - eastward_wind_4
  - eastward_wind_5
  - eastward_wind_6
  - eastward_wind_7
  - northward_wind_0
  - northward_wind_1
  - northward_wind_2
  - northward_wind_3
  - northward_wind_4
  - northward_wind_5
  - northward_wind_6
  - northward_wind_7
  - LHTFLsfc
  - SHTFLsfc
  - PRATEsfc
  - ULWRFsfc
  - ULWRFtoa
  - DLWRFsfc
  - DSWRFsfc
  - USWRFsfc
  - USWRFtoa
  - tendency_of_total_water_path_due_to_advection
  - TMP850
  - h500
