optimization:
  max_grad_norm: 1.0
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 7.0e-05
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    type: LinearLR
    step_each_iteration: true
    kwargs:
      start_factor: 0.01
      end_factor: 1
      total_iters: 1460
stepper_training:
  n_coupled_steps: 4
  n_ensemble: 2
  optimize_single_component_per_batch: true
  ocean:
    parameter_init:
      weights_path: /ocean_ckpt.tar
    n_steps: 4
    optimize_last_step_only: false
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    parameter_init:
      weights_path: /atmos_ckpt.tar
    n_steps:
      outcomes:
      - steps: 0
        probability: 0.025
      - steps: 1
        probability: 0.29
      - steps: 2
        probability: 0.29
      - steps: 4
        probability: 0.29
      - steps: 21
        probability: 0.1
      - steps: 41
        probability: 0.05
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
stepper:
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  sst_name: sst
  ocean:
    timedelta: 5D
    stepper:
      step:
        config:
          corrector:
            config:
              corrector_disabled_epochs: 0
  atmosphere:
    timedelta: 6h
    stepper:
      derived_forcings:
        insolation:
          insolation_name: DSWRFtoa
          solar_constant:
            value: 1360.782
      step:
        type: single_module
        config:
          residual_prediction: null
          builder:
            type: NoiseConditionedSFNO
            config:
              embed_dim: 512
              noise_embed_dim: 32
              noise_type: isotropic
              filter_type: linear
              use_mlp: true
              num_layers: 8
              operator_type: dhconv
              separable: false
              spectral_layers: 3
              spectral_transform: sht
              affine_norms: true
              normalize_big_skip: true
          normalization:
            network:
              global_means_path: /atmos_stats/centering.nc
              global_stds_path: /atmos_stats/scaling-full-field.nc
            residual:
              global_means_path: /atmos_stats/centering.nc
              global_stds_path: /atmos_stats/scaling-residual.nc
          ocean:
            surface_temperature_name: surface_temperature
            ocean_fraction_name: ocean_fraction
            interpolate: true
          corrector:
            conserve_dry_air: true
            moisture_budget_correction: advection_and_precipitation
            clip_frozen_precipitation: true
            total_energy_budget_correction:
              method: constant_temperature
            force_positive_names:
            - specific_total_water_0
            - specific_total_water_1
            - specific_total_water_2
            - specific_total_water_3
            - specific_total_water_4
            - specific_total_water_5
            - specific_total_water_6
            - specific_total_water_7
            - Q2m
