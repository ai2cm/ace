# Alternating coupled FT (FT-alt) at 4deg of the deterministic hybrid L1 Muon pretrain mu3e-4
# (ocean_hybrid_mae_muon_lr/, Muon 3e-4 / AdamW 1e-4, 30 ep; ace-samudra-cm4/iu1hnebz) at best_inference_ckpt, coupled
# with the 4deg ACE2S atmosphere (ace2-cm4-atmos-noLSM/etzrvbi4, best_inference_ckpt).
# Recipe verbatim from coupled_4deg_pretrain_lin8_alt/ (exper/2026-10-22-4deg-stoch-hybrid), i.e. Troy's
# resid-ohc-cap0005-ppad-fmean-coupled-ft-jointens-spb (wandb ace-samudra-coupled-cm4/ylcw8iwl; reports#176's recommended
# stage): both components trained, optimize_single_component_per_batch, EnsembleLoss on both, AdamW 7e-5 with a
# 1460-iteration linear warmup, 4 coupled steps, n_ensemble 2, batch 8, 8 epochs, 2 GPUs, EMA checkpoint every epoch.
# The ocean stepper is merged from iu1hnebz's config (deterministic, as Troy's hybrid).
#
# job_runner/coupled_train.sh configs/experiments/cm4_1pct_46to125_piC_156to235_4deg coupled_hybrid_mae_muon_lr_alt \
#   --coupled_stats elynn/2026-07-22-cm4-1pctco2-4deg-coupled-stats   (WANDB_USERNAME=elynnwu)
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 8
ema_checkpoint_save_epochs:
  step: 1
inference:
- name: inference_1pct
  weight: 1.0
  n_coupled_steps: 1460
  coupled_steps_in_memory: 2
  loader:
    num_data_workers: 4
    start_indices:
      times:
      - '0041-01-01T00:00:00'
      - '0051-01-01T00:00:00'
      - '0061-01-01T00:00:00'
      - '0071-01-01T00:00:00'
      - '0081-01-01T00:00:00'
      - '0091-01-01T00:00:00'
      - '0101-01-01T00:00:00'
      - '0111-01-01T00:00:00'
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-4deg-ocean-5daily.zarr
          engine: zarr
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-4deg-8layer-140yr.zarr
          engine: zarr
  aggregator:
    log_zonal_mean_images: false
    log_histograms: false
- name: inference_piC
  weight: 1.0
  n_coupled_steps: 1460
  coupled_steps_in_memory: 2
  loader:
    num_data_workers: 4
    start_indices:
      times:
      - '0151-01-06T00:00:00'
      - '0161-01-01T00:00:00'
      - '0171-01-01T00:00:00'
      - '0181-01-01T00:00:00'
      - '0191-01-01T00:00:00'
      - '0201-01-01T00:00:00'
      - '0211-01-01T00:00:00'
      - '0221-01-01T00:00:00'
    dataset:
      ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
          engine: zarr
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-4deg-8layer-200yr.zarr
          engine: zarr
  aggregator:
    log_zonal_mean_images: false
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  dataset:
    concat:
    - ocean:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-ocean.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-4deg-ocean-5daily.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-4deg-8layer-140yr.zarr
          engine: zarr
          subset:
            start_time: '0046-01-06T00:00:00'
            stop_time: '0126-01-01T00:00:00'
    - ocean:
        merge:
        - data_path: /climate-default
