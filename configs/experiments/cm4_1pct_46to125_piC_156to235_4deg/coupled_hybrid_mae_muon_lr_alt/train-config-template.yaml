          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
      atmosphere:
        merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-atmosphere.zarr
          engine: zarr
          subset:
            start_time: '0156-01-06T00:00:00'
            stop_time: '0236-01-01T00:00:00'
        - data_path: /climate-default
