# evaluator-config-piC-ic0151-200yr.yaml with the sea surface height salt budget
# correction added to the ocean corrector at inference: -S_ref times the
# change of SSH, weighted by the sea surface fraction, in float64, with no
# constant term. The run trained without it.
#   job_runner/evaluate.sh configs/experiments/2026-10-05-ocean-wide-ssh/coupled .
experiment_dir: /results
n_coupled_steps: 14598
coupled_steps_in_memory: 18
checkpoint_path: /ckpt.tar
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
    files:
      - label: kuroshio_extension_monthly
        names: [sst]
        lat_extent: [30.0, 40.0]
        lon_extent: [140.0, 180.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: gulf_stream_monthly
        names: [sst]
        lat_extent: [35.0, 45.0]
        lon_extent: [285.0, 315.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: n_atlantic_subpolar_monthly
        names: [sst]
        lat_extent: [50.0, 65.0]
        lon_extent: [300.0, 340.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: acc_monthly
        names: [sst]
        lat_extent: [-60.0, -45.0]
        lon_extent: [0.0, 360.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: n_pacific_gyre_monthly
        names: [sst]
        lat_extent: [25.0, 40.0]
        lon_extent: [180.0, 220.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
      - label: nino3_nino34_monthly
        names: [sst]
        lat_extent: [-5.0, 5.0]
        lon_extent: [190.0, 270.0]
        time_coarsen:
          method: monthly_mean
        save_reference: true
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0151-01-06T00:00:00'
ocean_stepper_override:
  # Replaces the checkpoint's ocean corrector wholesale, so it restates the
  # run's corrector (train-config.yaml) without the training-only
  # corrector_disabled_epochs, and adds the salt correction.
  corrector:
    type: ocean_corrector
    config:
      ocean_heat_content_correction:
        method: scaled_temperature
      surface_energy_flux_correction:
        method: prescribed
      force_positive_names:
        - so_0
        - so_1
        - so_2
        - so_3
        - so_4
        - so_5
        - so_6
        - so_7
        - so_8
        - so_9
        - so_10
        - so_11
        - so_12
        - so_13
        - so_14
        - so_15
        - so_16
        - so_17
        - so_18
        - sea_ice_volume
      sea_ice_fraction_correction:
        sea_ice_fraction_name: ocean_sea_ice_fraction
        land_fraction_name: land_fraction
        remove_negative_ocean_fraction: false
        zero_where_ice_free_names:
          - sea_ice_volume
          - sfdsi
          - UI
          - VI
      ocean_salt_content_correction:
        method: scaled_salinity
        budget_config:
          type: sea_surface_height
        weight_by_sea_surface_fraction: true
        use_float64: true
