# The shared cm4 coupled evaluation configs/experiments/cm4_eval/coupled/
# evaluator-config-1pct-ic0001-130yr.yaml of exper/2026-07-16-jamesd (35939bca8),
# unchanged: the coupled run's own correctors, no salt correction.
#   job_runner/evaluate.sh configs/experiments/2026-10-05-ocean-wide-ssh/coupled .
experiment_dir: /results
n_coupled_steps: 9488
coupled_steps_in_memory: 16
checkpoint_path: /ckpt.tar
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: false
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0001-01-06T00:00:00'
