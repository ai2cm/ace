# Joint prior over 3 km precipitation and 10 m winds, conditioned only on
# fine static inputs (topography and land fraction), sampled with exact
# block-mean projection of all three variables onto their 100 km values.
#
# Identical to train.yaml except that the 10 m winds are added to out_names.
# Tests whether modeling the winds jointly gives the prior enough information
# about the precipitation regime (e.g. orographic, stratiform vs convective)
# to reduce the noisy, convective-looking texture of the precipitation-only
# prior, without exposing the network to coarse inputs.
# nonnegative_names stays PRATEsfc only; the winds use additive projection.
log_loss_vs_noise: true
static_inputs:
  HGTsfc: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/3km.zarr
  land_fraction: /climate-default/2025-11-19-X-SHiELD-AMIP-downscaling-land-fraction/3km/land_fraction.zarr
model:
  use_amp_bf16: true
  out_names:
  - PRATEsfc
  - eastward_wind_at_ten_meters
  - northward_wind_at_ten_meters
  in_names: []
  loss:
    type: MSE
  module:
    config:
      bottleneck_attention: false
      model_channels: 128
      attn_resolutions: []
      num_blocks: 1
      channel_mult_emb: 6
      channel_mult:
      - 1
      - 2
      - 2
      - 2
      - 2
      - 2
      use_apex_gn: true
    type: unet_diffusion_song_v2
  normalization:
    coarse:
      global_means_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/stats/100km/centering-20260407.nc
      global_stds_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/stats/100km/scaling-full-field-20260407.nc
    fine:
      global_means_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/stats/3km/centering-20260206.nc
      global_stds_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling/stats/3km/scaling-full-field-20260206.nc
  num_diffusion_generation_steps: 18
  churn: 0.0
  training_noise_distribution:
    p_min: 0.005
    p_max: 2000.0
  predict_residual: false
  sigma_max: 2000.0
  sigma_min: 0.005
  use_fine_topography: true
  project_block_mean: true
  nonnegative_names:
  - PRATEsfc
optimization:
  lr: 0.0001
  optimizer_type: Adam
ema:
  decay: 0.999
validate_using_ema: true
train_data:
  sample_with_replacement: 144
  batch_size: 48
  num_data_workers: 2
  fine:
  - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
    file_pattern: 3km.zarr
    engine: zarr
    subset:
      start_time: '2014-01-01T00:00:00'
      stop_time: '2022-12-31T23:59:00'
  coarse:
  - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
    file_pattern: 100km.zarr
    engine: zarr
    subset:
      start_time: '2014-01-01T00:00:00'
      stop_time: '2022-12-31T23:59:00'
  lat_extent:
    start: -66.0
    stop: 70
  strict_ensemble: false
validation_data:
  batch_size: 16
  num_data_workers: 4
  fine:
  - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
    file_pattern: 3km.zarr
    engine: zarr
    subset:
      start_time: '2023-01-01T00:00:00'
      stop_time: '2024-01-01T00:00:00'
      step: 9
  coarse:
  - data_path: /climate-default/2025-09-25-downscaling-data-X-SHiELD-AMIP-downscaling
    file_pattern: 100km.zarr
    engine: zarr
    subset:
      start_time: '2023-01-01T00:00:00'
      stop_time: '2024-01-01T00:00:00'
      step: 9
  lat_extent:
    start: 0
    stop: 35
  lon_extent:
    start: 75
    stop: 195
  strict_ensemble: false
  drop_last: true
coarse_patch_extent_lat: 16
coarse_patch_extent_lon: 16
max_epochs: 200
validate_interval: 20
experiment_dir: /results
save_checkpoints: true
logging:
  project: block-mean-downscaling-experiment
  entity: ai2cm
  log_to_wandb: true
generate_n_samples: 2
