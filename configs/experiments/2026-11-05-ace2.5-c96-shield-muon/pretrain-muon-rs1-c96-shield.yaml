# ACE2.5 recipe (ACE2S paper pretrain: 1deg daily, NoiseConditionedSFNO, no energy
# corrector) trained on the C96 SHiELD AMIP member ic_0001 instead of ERA5, with the
# Muon optimizer and seed 1 exactly as pretrain-muon-rs1.yaml (wandb exoomsxr).
# Purpose: does inference behaviour degrade as training runs long (120 epochs)?
#
# Differences from ../2026-10-27-muon-ablation/pretrain-muon-rs1.yaml:
#   - data: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-
#     ensemble-dataset/ic_0001.zarr (daily 00Z, 1939-10-02..2021-12-16), stats from the
#     matching -stats/ic_0001/ directory; the ERA5 held-out split is mirrored
#     (train <=1995, 2011-2019, >=2021; validation 1996-1997).
#   - out_names: 51, not 61. The SHiELD daily store lacks PRMSL, the two surface
#     stresses and the 7 daily-mean surface fields (*_mean), so those are dropped.
# Everything else (architecture, loss, optimizer, EMA, inference suite) is unchanged.
seed: 1
experiment_dir: /results
save_checkpoint: true
checkpoint_save_epochs:
  start: 116
ema_checkpoint_save_epochs:
  start: 10
  step: 10
validate_using_ema: true
max_epochs: 120
ema:
  decay: 0.999
inference:
- name: inference
  n_forward_steps: 1825
  forward_steps_in_memory: 40
  n_ensemble_per_ic: 3
  loader:
    start_indices:
      times:
      - '1996-01-01T00:00:00'
      - '1996-02-15T00:00:00'
      - '1996-04-01T00:00:00'
      - '1996-05-15T00:00:00'
      - '1996-07-01T00:00:00'
      - '1996-08-15T00:00:00'
      - '1996-10-01T00:00:00'
      - '1996-11-15T00:00:00'
    dataset:
      data_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset/
      file_pattern: ic_0001.zarr
      engine: zarr
    num_data_workers: 4
  aggregator:
    step_means:
    - step: 5
      target: denorm
    - step: 5
      target: norm
    ensembles:
    - step: 5
    histogram:
      enabled: true
    time_mean_reference_data: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset-stats/ic_0001/time-mean.nc
- name: long_81year
  weight: 0.0
  epochs:
    start: 4
    step: 5
  n_forward_steps: 29565
  forward_steps_in_memory: 20
  loader:
    start_indices:
      times:
      - '1940-01-03T00:00:00'
      - '1940-01-04T00:00:00'
      - '1940-01-05T00:00:00'
      - '1940-01-06T00:00:00'
      - '1940-01-07T00:00:00'
      - '1940-01-08T00:00:00'
      - '1940-01-09T00:00:00'
      - '1940-01-10T00:00:00'
    dataset:
      data_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset/
      file_pattern: ic_0001.zarr
      engine: zarr
    num_data_workers: 4
  aggregator:
    step_means: []
    ensembles: []
    histogram:
      enabled: true
    time_mean_reference_data: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset-stats/ic_0001/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  dataset:
    concat:
    - data_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset/
      file_pattern: ic_0001.zarr
      engine: zarr
      subset:
        stop_time: '1995-12-31'
    - data_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset/
      file_pattern: ic_0001.zarr
      engine: zarr
      subset:
        start_time: '2011-01-01'
        stop_time: '2019-12-31'
    - data_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset/
      file_pattern: ic_0001.zarr
      engine: zarr
      subset:
        start_time: '2021-01-01'
validation:
  loader:
    batch_size: 64
    num_data_workers: 4
    prefetch_factor: 2
    dataset:
      data_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset/
      file_pattern: ic_0001.zarr
      engine: zarr
      subset:
        start_time: '1996-01-01'
        stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  optimizer_type: Muon
  lr: 0.0003
  kwargs:
    weight_decay: 0.01
    adamw_lr: 0.0001
    adamw_weight_decay: 0.01
  spectral_names:
  - filter.filter.weight
  adamw_names:
  - W_scale
  - W_bias
  - pos_embed
stepper_training:
  n_ensemble: 2
  n_forward_steps: 1
  loss:
    type: EnsembleLoss
    weights:
      h500: 5.0
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
      normalization:
        network:
          global_means_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset-stats/ic_0001/centering.nc
          global_stds_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset-stats/ic_0001/scaling-full-field.nc
        residual:
          global_means_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset-stats/ic_0001/centering.nc
          global_stds_path: /climate-default/2026-01-28-vertically-resolved-c96-1deg-daily-shield-amip-ensemble-dataset-stats/ic_0001/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        clip_frozen_precipitation: true
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - total_frozen_precipitation_rate
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
        - tendency_of_total_water_path_due_to_advection
      next_step_forcing_names:
      - DSWRFtoa
      - global_mean_co2
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      out_names:
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - LHTFLsfc
      - SHTFLsfc
      - PRATEsfc
      - ULWRFsfc
      - ULWRFtoa
      - DLWRFsfc
      - DSWRFsfc
      - USWRFsfc
      - USWRFtoa
      - tendency_of_total_water_path_due_to_advection
      - TMP850
      - h500
      - total_frozen_precipitation_rate
