# Stage 2: spatiotemporal video PMD, SINGLE-STAGE mode (per user request
# 2026-07-31: "not 2 stage, spatial and temporal together"). Unlike the
# two-stage configs (../2026-07-24-.../, ../2026-07-27-...-ou/), there is NO
# separate stage-A endpoint-super-resolution network here -- this config
# relies on the fact that OUR OWN dataset actually has real paired
# fine-resolution (25km) endpoint truth available at training time (the
# two-stage design's premise -- "no fine truth available, only a
# continuously-running coarse emulator" -- was a deliberate deployment
# scenario choice, not a hard limitation of our data).
#
# With model.coarse_normalization set and model.endpoint_super_resolution
# left unset (endpoints_observed stays at its default True), VideoDiffusionModel
# uses the real fine endpoint truth directly (VideoDiffusionModel.train_on_batch:
# endpoint_sr_module is None -> anchor_clip = clip, i.e. the true fine clip
# unmodified) and computes ONE joint baseline:
#   baseline = upsample(coarse) + linear_interp(true_fine_endpoints - upsample(coarse))
# i.e. the bicubic-upsampled coarse trajectory, bias-corrected at every
# frame by linearly interpolating the *endpoint* residual (fine truth minus
# upsampled coarse) across the clip -- so the model is diffusing ONE
# residual (clip - baseline) that combines CorrDiff-style spatial
# super-resolution and endpoint-conditioned temporal infilling in a SINGLE
# UNet call, with no second network, no detached stage-A estimate, and no
# stage-A loss term. See _spatiotemporal_baseline's docstring in
# fme/downscaling/video_models.py for the exact three-case breakdown.
#
# Flat/independent noise (temporal_noise_correlation: independent), same as
# the two-stage "flat" config -- this is the single-stage counterpart to
# that run, for comparing two-stage vs. single-stage architectures at fixed
# noise-kernel choice. subset_augmentation_prob and marginal_consistency_weight
# left at 0.0 (matches every other config in this family so far).
#
# Video UNet architecture/schedule (backbone, channel_mult, attention_levels,
# per-channel noise/sigma settings) copied verbatim from the two-stage flat
# config's stage-B settings -- there is no stage A here, so nothing else to
# carry over from that file except stage B's own hyperparameters.
#
# Data: 2026-07-14-X-SHiELD-AMIP-FME-3h-{25km,100km}.zarr on weka
# (/climate-default/2026-06-25-temporal-diffusion), same store/PMD split as
# every other spatiotemporal config in this family. downscale_factor = 4.
#
# Patch size: coarse_patch_extent_lat/lon (44, 72) -> 176x288 fine patches,
# reused verbatim from the two-stage configs, where this was confirmed NOT
# to OOM on 4x GPU titan hardware (see that config's header for the OOM
# history). This single-stage model has STRICTLY LESS memory footprint than
# the two-stage one at the same patch size (no second/stage-A network at
# all), so this patch size should be at least as safe; not yet re-tuned
# upward to exploit the freed-up memory.
#
# sigma_data_by_channel / training_noise_distributions / sigma_min|max_by_channel
# below are carried over from the temporal-only (stage 1) residual scale,
# same caveat as the two-stage configs: not recomputed for this exact
# single-stage residual (which now also carries spatial super-resolution
# content, not just temporal). Recompute with a residual-std script specific
# to this baseline formula before trusting these for a long run.
experiment_dir: /results
max_epochs: 200
validate_using_ema: true
validate_interval: 10
test_interval: 20
max_val_batches: 20
max_test_batches: 50
generate_n_samples: 1
log_loss_vs_noise: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-temporal-interp
  name: global-25km-100km-spatiotemporal-singlestage-5ch-flat-v1
  entity: ai2cm
optimization:
  lr: 0.0001
ema:
  decay: 0.9999
coarse_patch_extent_lat: 44
coarse_patch_extent_lon: 72
train_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  batch_size: 4  # global across ranks (4 GPUs x 1 sample/GPU) -- matches the two-stage configs
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
validation_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
test_data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Default (true): endpoints ARE real fine-resolution ground truth here --
  # no endpoint_super_resolution sub-model, so this pins directly to actual
  # observed values, not a generated estimate. See header comment.
  endpoints_observed: true
  # Flat/independent noise (no temporal correlation) -- see header comment.
  temporal_noise_correlation: independent
  log_transform_channels:
    PRATEsfc: 86400.0  # precip modeled in log1p(mm/day) space
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:  # fine (25km), train-only, global domain -- toy/compute_norm_stats_25km.py
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074   # log1p(PRATEsfc * 86400) space, matching log_transform_channels
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:  # coarse (100km), train-only, global domain -- reused verbatim
    # from the stage-1 config: verified 2026-07-24 that the 100km store is
    # byte-identical to the dataset those stats were computed from.
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
