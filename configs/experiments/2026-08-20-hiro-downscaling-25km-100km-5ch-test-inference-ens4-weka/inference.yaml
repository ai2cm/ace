# Rerun of ../2026-08-17-hiro-downscaling-25km-100km-5ch-test-inference-ens4/
# with output written DIRECTLY TO WEKA instead of the job's Beaker result
# dataset (/results). Same checkpoint, same n_ens=4, same everything else --
# single-variable change: experiment_dir.
#
# Why: that ens4 run's output zarr (in its own Beaker result dataset,
# 01M08MXPM2EA4TX8QCN9WD1HPN) has ~1.86M individual small chunk files
# (chunk_shape [2,4,64,64] over a [2945,4,704,1440] array x5 variables --
# see toy/single_vs_two_stage_v1_comparison.md's HiRO discussion history).
# Every attempt (5+) to mount that dataset into a downstream eval job
# (CRPS, diurnal, TC verification -- scripts/video_pmd_eval/run_crps_eval.sh
# et al.) failed partway through the multi-hour mount-download with
# transient network errors (GOAWAY, connection reset) -- consistent with an
# operation that's fundamentally too long-running/fragile at that file
# count, not fixable by retrying. Every other model in this comparison
# already writes its inference output straight to weka
# (/climate-default/...), which has been completely reliable all session --
# this rerun matches that pattern instead of fighting the Beaker-dataset
# mount mechanism.
#
# Checkpoint: ema_ckpt.tar (training job v6, 01KZ1WGMKRX6AKWWQXB8JJWRZP,
# succeeded 2026-08-03) -- SAME checkpoint as both prior ens1/ens4 runs, no
# retraining needed.
model:
  checkpoint_path: /checkpoint/checkpoints/ema_ckpt.tar
experiment_dir: /climate-default/2026-06-25-temporal-diffusion/inference/hiro-downscaling-25km-100km-global-5ch-v6
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: hiro-downscaling-25km-100km-global-5ch-v6-test-inference-ens4-weka
  entity: ai2cm
data:
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 4
  strict_ensemble: false
patch:
  divide_generation: true
  composite_prediction: true
  coarse_horizontal_overlap: 1
outputs:
  - name: test-2023-2024-ens4
    n_ens: 4
    max_samples_per_gpu: 8
    save_vars:
      - PRATEsfc
      - air_temperature_at_two_meters
      - PRMSL
      - eastward_wind_at_ten_meters
      - northward_wind_at_ten_meters
    time_range:
      start_time: "2023-01-01"
      stop_time: "2024-01-04"
    lat_extent:
      start: -88
      stop: 88
    lon_extent:
      start: 0
      stop: 360
