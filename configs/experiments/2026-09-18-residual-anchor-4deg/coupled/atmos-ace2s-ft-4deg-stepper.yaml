# `stepper` block of configs/experiments/cm4_1pct_46to125_piC_156to235_4deg/atmos_ace2s/finetune-config.yaml
# (exp/cm4-piC-1pct-4deg), the 4deg ACE2S atmosphere used for coupling. Frozen copy for make_coupled_ft_config.py.
stepper:
  derived_forcings:
    insolation:
      insolation_name: DSWRFtoa
      solar_constant:
        value: 1360.782
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
      normalization:
        network:
          global_means_path: /atmos_stats/centering.nc
          global_stds_path: /atmos_stats/scaling-full-field.nc
        residual:
          global_means_path: /atmos_stats/centering.nc
          global_stds_path: /atmos_stats/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
        interpolate: true
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        clip_frozen_precipitation: true
        total_energy_budget_correction:
          method: constant_temperature
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - total_frozen_precipitation_rate
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
      next_step_forcing_names:
      - DSWRFtoa
      - carbon_dioxide
      in_names:
      - carbon_dioxide
      - land_fraction
      - lake_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
