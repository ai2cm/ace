# 50-year 1pctCO2 OCEAN-ONLY rollout at 4deg (CM4 atmosphere prescribed), the uncoupled twin of the
# 50-yr ocean-forcing ablation, with monthly ice outputs and a seed for the stochastic ocean.
experiment_dir: /results
n_forward_steps: 3650  # 50 yr; years 1-40 outside the 1pct training window
forward_steps_in_memory: 50  # divides 3650
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0001-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-4deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
seed: 0  # launcher override: stochastic ocean noise sequence
data_writer:
  save_prediction_files: false
  save_monthly_files: true
  names: [sst, thetao_0, ocean_sea_ice_fraction, sea_ice_volume, hfds_total_area]
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
