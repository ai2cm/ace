# 130-year 1pctCO2 COUPLED rollout at 4deg with NO coupled fine-tuning: the
# ocean-only arm's own best_inference_ckpt is paired with the frozen 4deg ACE2S
# atmosphere (cm4_1pct_46to125_piC_156to235_4deg-atmos_ace2s-ft) through the
# evaluator's two-checkpoint form. Same start (0001-01-06) and length (9488 steps) as the ocean-only 1pct protocol; reference stores are the
# ocean-only 4deg protocol, so the ocean drift with and without an interactive
# atmosphere is a like-for-like comparison. Ported from the shared 1deg
# configs/experiments/cm4_eval/coupled/evaluator-config-piC-ic0151-200yr.yaml
# with the four zarr names swapped for their 4deg counterparts.
experiment_dir: /results
n_coupled_steps: 9488
coupled_steps_in_memory: 18
checkpoint_path:
  ocean:
    timedelta: 5D
    path: /ocean_ckpt.tar
  atmosphere:
    timedelta: 6h
    path: /atmos_ckpt.tar
  sst_name: sst
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names: [sst]
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-4deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-4deg-8layer-140yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0001-01-06T00:00:00'
