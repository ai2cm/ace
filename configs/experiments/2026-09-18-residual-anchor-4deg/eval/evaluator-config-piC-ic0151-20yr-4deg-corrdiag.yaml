# 20-year piControl rollout at 4deg (same start and stores as the 200-yr protocol) with the
# corrector step-diagnostics fully on: per-field time-mean normalized correction magnitude and
# the SIGNED time-mean correction map. Used with and without the OHC correction (the latter via
# --override stepper_override.disable_corrections=[ocean_heat_content_correction]) to measure
# how much of each arm's temperature field the corrector supplies.
experiment_dir: /results
n_forward_steps: 1460
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0151-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: true
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
  step_diagnostics:
    correction_scalars: true
    correction_maps: true
