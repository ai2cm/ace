# 130-year 1pctCO2 rollout at 4deg: the shared 1deg protocol
# (configs/experiments/cm4_eval/ocean/evaluator-config-1pct-ic0001-130yr.yaml) with only the
# two zarr names swapped for their 4deg counterparts. Same start (0001-01-06), same 9488 steps.
experiment_dir: /results
n_forward_steps: 9488
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0001-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-4deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: true
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
