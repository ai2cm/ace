# 50-year 1pctCO2 coupled rollout from a single coupled checkpoint mounted at /ckpt.tar, for the
# ocean-forcing ablation: the launcher overrides `ocean_forcings_from_data` so that chosen
# atmosphere-produced ocean forcings are read from the CM4 data instead of from ACE. Monthly means
# of the ocean's sea-ice state and of every coupled flux on the atmosphere side are written so the
# out-of-sample years 1-40 can be mapped. Everything else as the 130-yr single-checkpoint protocol.
experiment_dir: /results
n_coupled_steps: 3650  # 50 yr; years 1-40 are outside the 1pct training window (46-125)
coupled_steps_in_memory: 10  # must divide 3650 = 2 x 5^2 x 73
checkpoint_path: /ckpt.tar
ocean_forcings_from_data: null  # set per run by the launcher's --override
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names: [sst, thetao_0, ocean_sea_ice_fraction, sea_ice_volume, hfds_total_area]
  atmosphere:
    save_prediction_files: false
    save_monthly_files: true
    names: [surface_temperature, TMP2m, DLWRFsfc, DSWRFsfc, ULWRFsfc, USWRFsfc, LHTFLsfc, SHTFLsfc,
            PRATEsfc, total_frozen_precipitation_rate, eastward_surface_wind_stress,
            northward_surface_wind_stress]
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
loader:
  num_data_workers: 1
  dataset:
    ocean:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-ocean.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-07-15-om4-1pctco2-4deg-ocean-5daily.zarr
          engine: zarr
    atmosphere:
      merge:
        - data_path: /climate-default
          file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-atmosphere.zarr
          engine: zarr
        - data_path: /climate-default
          file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-4deg-8layer-140yr.zarr
          engine: zarr
  start_indices:
    times:
    - '0001-01-06T00:00:00'
