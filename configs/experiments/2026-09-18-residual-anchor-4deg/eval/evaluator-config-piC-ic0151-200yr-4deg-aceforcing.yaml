# 200-yr piControl ocean-only rollout (as evaluator-config-piC-ic0151-200yr-4deg.yaml) but with the ten
# atmosphere-supplied forcings taken from ACE's own coupled-rollout 5-day means (zarr built by
# tools/build_ace_forcing.py, mounted at /aceforcing). Merged first, so its variables win over the CM4 stores.
experiment_dir: /results
n_forward_steps: 14598
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0151-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /aceforcing
      file_pattern: ace_forcing.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-picontrol-4deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: true
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
