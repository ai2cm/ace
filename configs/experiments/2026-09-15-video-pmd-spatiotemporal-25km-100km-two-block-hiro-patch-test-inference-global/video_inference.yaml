# Test-set inference for
# video-pmd-spatiotemporal-25km-100km-global-5ch-two-block-hiro-patch
# (TWO-BLOCK mode, FIXED/flat kernel, trained at the HiRO-ACE coarse patch
# size 16x16 -- see
# ../2026-09-10-video-pmd-spatiotemporal-25km-100km-two-block-hiro-patch/video_train.yaml),
# GLOBAL DOMAIN IN ONE JOB via divide_generation -- directly mirrors
# ../2026-08-31-video-pmd-spatiotemporal-25km-100km-two-block-test-inference-global/
# (the 44x72-patch two-block checkpoint's own test inference), same
# LR-endpoints-in/HR-full-out setting, same data/split/channels/backbone.
#
# The ONLY intended differences from that config: coarse_patch_extent
# ([44, 72] -> [16, 16], matching this checkpoint's own training patch
# size) and the checkpoint/output paths. divide_generation now tiles the
# domain into ~11 x 23 ~= 250 patches instead of 20 -- ~12.5x more patches
# per raw window batch to generate and composite, so expect this job to
# run considerably longer than the 44x72 checkpoint's own ~4.9 GPU-day
# estimate (see that config's run.sh comment) even though each patch is
# individually ~12x smaller (fixed per-patch overhead -- diffusion step
# count, kernel launches -- does not shrink with patch area the way FLOPs
# do, per the training-side finding that bs64/16x16 needed 4x more
# raw-batch iterations for the same per-epoch pixel throughput).
#
# CHECKPOINT: training (Beaker experiment 01M26N8CB71XEDD5T40BCZFA67 /
# wandb ai2cm/ace-temporal-interp/mmhhkkz5, "...-two-block-hiro-patch")
# was manually stopped 2026-09-15 at epoch ~55-60/200 -- matching the
# depth (epoch 56-58) the 44x72 comparison checkpoint was itself stopped
# at, so the two are a fair apples-to-apples comparison rather than one
# being more trained than the other. validation/interior_mae had already
# plateaued (0.636 -> ... -> ~1.24 over the last 3 validation cycles, vs.
# the 44x72 run's plateau at ~0.64) -- see the training config's own repo
# history/PR discussion for the full patch-size-vs-interior_mae writeup.
# Using checkpoints/best.ckpt (lowest validation/interior_mae), not
# latest.ckpt as the 44x72 config's inference used -- that config's loss
# was still trending down at stop time so latest ~= best there; this run
# had already plateaued for one full validation cycle before being
# stopped, so best.ckpt is the more defensible pick here.
#
# Checkpoint dataset: 01M26N8CBHE5DB0KG08WPR5EWV (result of task
# 01M26N8CEXNVCQ326E16HK4SST / job 01M26N8CB71XEDD5T40BCZFA67)
#
# RESUME, not overwrite (added 2026-09-16, fme/downscaling/video_inference.py):
# the first attempt (01M2GGAVQYTQVHGDC5X91FZ0PC on titan) burned ~2 days
# across 3 job attempts with zero net progress -- every restart re-ran with
# overwrite=true, which unconditionally wipes the output zarr, so a node
# cordon after 19.5h of real generation (batch 15/92) lost all of it. resume
# opens the existing store (mode="a") and skips any raw batch whose clips
# are already fully written (ZarrWriter.is_slice_written), matching the
# pattern already used by fme.downscaling.inference (the plain/non-video
# path) -- see VideoInferenceConfig.resume's docstring. Safe to resubmit
# this exact config after any future preemption/cordon: it will pick up
# from wherever the last attempt left off instead of starting over.
checkpoint_path: /checkpoint/checkpoints/best.ckpt
experiment_dir: /results
output_path: /climate-default/2026-06-25-temporal-diffusion/inference/video-pmd-spatiotemporal-25km-100km-global-5ch-two-block-hiro-patch/test-2023-2024-ens4-global.zarr
n_ensemble: 4
ensemble_chunk_size: 1
use_ema: true
resume: true
divide_generation: true
coarse_patch_extent: [16, 16]
coarse_horizontal_overlap: 1
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: video-pmd-spatiotemporal-25km-100km-global-5ch-two-block-hiro-patch-test-inference-global
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /climate-default/2026-06-25-temporal-diffusion
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  # Full global domain -- no manual region split needed with divide_generation.
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Coarse (LR) is only available at the two endpoint frames -- masked to
  # zero at interior frames, with its own mask channel. Nothing is pinned
  # to fine truth at inference time (endpoints_observed=false): every
  # frame, including the two endpoints, is diffused -- the two-block
  # split governs how r (pinned to the real coarse input at endpoints,
  # zero there) and d (unpinned, present at every frame) are noised and
  # reassembled, not whether ground truth is ever given to the network.
  endpoints_observed: false
  coarse_endpoints_only: true
  two_block: true
  r_kernel: brownian_bridge
  d_kernel: independent
  # temporal_noise_correlation must stay at its "independent" default (not
  # set here) -- two_block uses r_kernel/d_kernel instead (validated in
  # __post_init__).
  # Same calibration as the training config (residual_calibration_diagnostic.py,
  # 2026-08-26) -- must match what the checkpoint was trained with.
  # Patch-size independent (per-pixel quantity) -- same numbers as the
  # 44x72 checkpoint's own inference config.
  r_sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.3201
    northward_wind_at_ten_meters: 0.4415
    PRMSL: 0.1783
    PRATEsfc: 0.6825
    air_temperature_at_two_meters: 0.1229
  d_sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.1617
    northward_wind_at_ten_meters: 0.1892
    PRMSL: 0.0586
    PRATEsfc: 0.4254
    air_temperature_at_two_meters: 0.0529
  log_transform_channels:
    PRATEsfc: 86400.0
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
