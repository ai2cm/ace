# Continuation of pretrain-muon-4deg-rs1.yaml (beaker 01M70VEE6375A7G3X0SSV97HDG, wandb b6v0uw1j): resumes
# that run's final result dataset 01M7536HDXJ6MDGVXAXZKNCJ2M (training_checkpoints/ckpt.tar at
# epoch 120) under the same wandb id and trains to 240 epochs. Only
# max_epochs, checkpoint_save_epochs.start, and resume_results differ.
# arg: --dataset 01M7536HDXJ6MDGVXAXZKNCJ2M:/prior-results
# ACE2S 4deg daily pretrain with Muon optimizer, seed 1, one GPU: the
# investigation baseline (pretrain-muon-rs1.yaml, wandb exoomsxr) ported to the
# regenerated 4deg daily store 2026-09-08-era5-4deg-8layer-daily-1940-2025
# (one store carries every channel, so no two-store merge) with its matching
# 1990-2019 stats. Model, optimizer, loss, 120 epochs, seed, and inference
# suite are unchanged from the 1deg baseline; loader and memory parameters
# (time_buffer, forward_steps_in_memory 73, worker counts, validation batch
# 32) follow the 4deg ACE2S ablation pretrain
# (configs/baselines/era5-ace2s-ablations/ace2s-pretrain-4deg.yaml at
# f001ebb0). The 4deg store is sampled at 00Z, which the IC times are.
# Batch size 8 on one GPU gives the same steps per epoch as the 1deg arms.
# Spectral filter weights route to per-mode complex Muon by parameter type on
# this branch, so the 1deg baseline's spectral_names key is dropped.
# Companion of pretrain-fieldsfno-pos64-mlpfilter-4deg-rs1.yaml.
seed: 1
experiment_dir: /results
save_checkpoint: true
checkpoint_save_epochs:
  start: 236
ema_checkpoint_save_epochs:
  start: 10
  step: 10
validate_using_ema: true
max_epochs: 240
resume_results:
  existing_dir: /prior-results
  resume_wandb: true
ema:
  decay: 0.999
inference:
- name: inference
  n_forward_steps: 1825
  forward_steps_in_memory: 73
  n_ensemble_per_ic: 3
  loader:
    start_indices:
      times:
      - '1996-01-01T00:00:00'
      - '1996-02-15T00:00:00'
      - '1996-04-01T00:00:00'
      - '1996-05-15T00:00:00'
      - '1996-07-01T00:00:00'
      - '1996-08-15T00:00:00'
      - '1996-10-01T00:00:00'
      - '1996-11-15T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
    num_data_workers: 8
  aggregator:
    step_means:
    - step: 5
      target: denorm
    - step: 5
      target: norm
    ensembles:
    - step: 5
    histogram:
      enabled: true
    time_mean_reference_data: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/time-mean.nc
- name: long_81year
  weight: 0.0
  epochs:
    start: 4
    step: 5
  n_forward_steps: 29565
  forward_steps_in_memory: 73
  loader:
    start_indices:
      times:
      - '1940-01-03T00:00:00'
      - '1940-01-04T00:00:00'
      - '1940-01-05T00:00:00'
      - '1940-01-06T00:00:00'
      - '1940-01-07T00:00:00'
      - '1940-01-08T00:00:00'
      - '1940-01-09T00:00:00'
      - '1940-01-10T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
    num_data_workers: 8
  aggregator:
    step_means: []
    ensembles: []
    histogram:
      enabled: true
    time_mean_reference_data: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 4
  time_buffer: 8
  time_buffer_pool_size: 32
  dataset:
    concat:
    - data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        stop_time: '1995-12-31'
    - data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2011-01-01'
        stop_time: '2019-12-31'
    - data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2021-01-01'
validation:
  loader:
    batch_size: 32
    num_data_workers: 8
    prefetch_factor: 2
    time_buffer: 16
    dataset:
      data_path: /climate-default
      file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1996-01-01'
        stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  optimizer_type: Muon
  lr: 0.0003
  kwargs:
    weight_decay: 0.01
    adamw_lr: 0.0001
    adamw_weight_decay: 0.01
  adamw_names:
  - W_scale
  - W_bias
  - pos_embed
stepper_training:
  n_ensemble: 2
  n_forward_steps: 1
  loss:
    type: EnsembleLoss
    weights:
      h500: 5.0
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
      normalization:
        network:
          global_means_path: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/scaling-full-field.nc
        residual:
          global_means_path: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/centering.nc
          global_stds_path: /climate-default/2026-09-08-era5-4deg-8layer-daily-stats-1990-2019/2026-09-08-era5-4deg-8layer-daily-1940-2025/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        clip_frozen_precipitation: true
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - total_frozen_precipitation_rate
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
        - tendency_of_total_water_path_due_to_advection
      next_step_forcing_names:
      - DSWRFtoa
      - global_mean_co2
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      out_names:
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
