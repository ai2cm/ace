# Coupled ENSO hindcasts from a coupled fine-tune checkpoint:
# 120 monthly ICs in the untouched 2002-2011 decade (the same ICs as the ocean-only hindcast report) x 128 coupled steps
# (~21 months) with the atmosphere INTERACTIVE, so this is true ENSO forecast skill, not the forced-ocean ceiling.
# Scored by scripts/score_hindcasts.py of reports troya/2026-10-09-ufs4deg-scratch-vs-cm4-pretrain-enso (Nino3.4 ACC vs persistence).
experiment_dir: /results
checkpoint_path: /ckpt.tar  # a coupled fine-tune checkpoint (carries the rename/scale/fraction config)
n_coupled_steps: 128
coupled_steps_in_memory: 8
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /ufs4deg
      file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
      engine: zarr
    atmosphere:
      data_path: /era5
      file_pattern: 2026-10-14-era5-4deg-8layer-daily-ufs-coupled-1994-2023.zarr
      engine: zarr
