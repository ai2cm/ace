# noohc-fmean-ftcm4-era5-coupledft-spb: ALTERNATING coupled FT (both trained, one component per batch, EnsembleLoss) of the
# NO-corrector UFS ocean resid-noohc-fmean-ftcm4 (hybrid mean fill; no ocean_heat_content_correction, no learned heating) with
# the ERA5 4deg daily ACE2S atmosphere: the corrector-free line's coupled stage. Troy 2026-10-23/25.
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
evaluate_before_training: true
ema:
  decay: 0.999
max_epochs: 12
inference:
- name: inference_10yr
  weight: 1.0
  n_coupled_steps: 730
  coupled_steps_in_memory: 2
  loader:
    num_data_workers: 2
    start_indices:
      times:
      - '2012-01-01T18:00:00'
      - '2012-07-04T18:00:00'
      - '2013-01-05T18:00:00'
      - '2013-07-04T18:00:00'
    dataset:
      ocean:
        data_path: /ufs4deg
        file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
        engine: zarr
      atmosphere:
        data_path: /era5
        file_pattern: 2026-10-14-era5-4deg-8layer-daily-ufs-coupled-1994-2023.zarr
        engine: zarr
  aggregator:
    log_zonal_mean_images: false
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  dataset:
    concat:
    - ocean:
        data_path: /ufs4deg
        file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
        engine: zarr
        subset:
          start_time: '1994-01-05T18:00:00'
          stop_time: '2001-12-31T18:00:00'
      atmosphere:
        data_path: /era5
        file_pattern: 2026-10-14-era5-4deg-8layer-daily-ufs-coupled-1994-2023.zarr
        engine: zarr
        subset:
          start_time: '1994-01-05T18:00:00'
          stop_time: '2001-12-31T18:00:00'
    - ocean:
        data_path: /ufs4deg
        file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
        engine: zarr
        subset:
          start_time: '2012-01-01T18:00:00'
          stop_time: '2021-12-31T18:00:00'
      atmosphere:
        data_path: /era5
        file_pattern: 2026-10-14-era5-4deg-8layer-daily-ufs-coupled-1994-2023.zarr
        engine: zarr
        subset:
          start_time: '2012-01-01T18:00:00'
          stop_time: '2021-12-31T18:00:00'
validation:
- name: val_2022_2023
  evaluate_all_steps: false
  weight: 1.0
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      ocean:
        data_path: /ufs4deg
        file_pattern: 2026-10-06-ufs-replay-ocean-4deg-19level-1994-2023.zarr
        engine: zarr
        subset:
          start_time: '2022-01-03T18:00:00'
      atmosphere:
        data_path: /era5
        file_pattern: 2026-10-14-era5-4deg-8layer-daily-ufs-coupled-1994-2023.zarr
        engine: zarr
        subset:
          start_time: '2022-01-03T18:00:00'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 7.0e-05
  max_grad_norm: 1.0
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    type: LinearLR
    step_each_iteration: true
    kwargs:
      start_factor: 0.01
      end_factor: 1
      total_iters: 300
stepper_training:
  n_coupled_steps: 4
  n_ensemble: 2
  optimize_single_component_per_batch: true
  ocean:
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
    loss_weight: 1.0
    n_steps: 4
    optimize_last_step_only: false
    parameter_init:
      weights_path: /ocean_ckpt.tar
  atmosphere:
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        h500: 5
    loss_weight: 1.0
    n_steps:
      outcomes:
      - steps: 0
        probability: 0.025
      - steps: 1
        probability: 0.29
      - steps: 2
        probability: 0.29
      - steps: 4
        probability: 0.29
      - steps: 10
        probability: 0.1
      - steps: 20
        probability: 0.05
    parameter_init:
      weights_path: /atmos_ckpt.tar
stepper:
  sst_name: sst
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  atmosphere_output_rename:
    eastward_surface_wind_stress: eastward_surface_stress
    northward_surface_wind_stress: northward_surface_stress
  atmosphere_output_scale:
    eastward_surface_wind_stress: -1.0
    northward_surface_wind_stress: -1.0
  ocean:
    timedelta: 5D
    stepper:
      input_masking:
        mask_value: 0
        fill_value: mean
        exclude_names_and_prefixes:
        - land_fraction
        - sea_surface_fraction
      step:
        type: single_module
        config:
          builder:
            type: Samudra
            config:
              ch_width:
              - 280
              - 380
              - 480
              - 520
              dilation:
              - 1
              - 2
              - 4
              - 2
              n_layers:
              - 1
              - 1
              - 1
              - 1
              norm: instance
              zonally_periodic_upsample: true
              lat_pad: pole
          normalization:
            network:
              global_means_path: /ocean_stats/centering.nc
              global_stds_path: /ocean_stats/scaling-full-field.nc
            residual:
              global_means_path: /ocean_stats/centering.nc
              global_stds_path: /ocean_stats/scaling-residual.nc
          corrector:
            type: ocean_corrector
            config:
