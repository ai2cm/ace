# coupled-evaluator-config-glo12-era5-hindcast-2025-6mo-twockpt: the SAME 2025 hindcast protocol with the two components loaded EIGHT-MEMBER ensemble version: each start repeated 8x in start_indices (the stochastic atmosphere draws fresh noise per sample).
# separately (/ocean_ckpt.tar, /atmos_ckpt.tar) = the lifted UFS alternating coupled FT BEFORE any GLO12 fine-tuning
# (zero-shot baseline on GLO12), coupling glue copied from the UFS two-checkpoint hindcast config. Troy 2026-10-23.
experiment_dir: /results
checkpoint_path:
  ocean:
    timedelta: 5D
    path: /ocean_ckpt.tar
  atmosphere:
    timedelta: 1D
    path: /atmos_ckpt.tar
  sst_name: sst
  ocean_fraction_prediction:
    sea_ice_fraction_name: ocean_sea_ice_fraction
    land_fraction_name: land_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  atmosphere_output_rename:
    eastward_surface_wind_stress: eastward_surface_stress
    northward_surface_wind_stress: northward_surface_stress
  atmosphere_output_scale:
    eastward_surface_wind_stress: -1.0
    northward_surface_wind_stress: -1.0
n_coupled_steps: 36
coupled_steps_in_memory: 4
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /glo12
      file_pattern: 2026-10-22-glo12-ocean-4deg-19level-5day-2022-2025-cm4vars-v2.zarr
      engine: zarr
    atmosphere:
      data_path: /era5glo
      file_pattern: 2026-10-23-era5-4deg-8layer-daily-glo12-coupled-2022-2025.zarr
      engine: zarr
  start_indices:
