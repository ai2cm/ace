# coupled-evaluator-config-glo12-era5-fullrecord-2022-2025-twockpt: free coupled rollout over the WHOLE GLO12 record, 260 five-day steps from
# 2022-06-03 to 2025-12-24 (through the 2025 holdout), monthly outputs; two separately loaded components (/ocean_ckpt.tar, /atmos_ckpt.tar: the lifted UFS system, no GLO12 fine-tune). Troy 2026-10-23: the one-year inline
# windows are dominated by internal variability, so judge the fine-tune on the full record.
experiment_dir: /results
checkpoint_path:
  ocean:
    timedelta: 5D
    path: /ocean_ckpt.tar
  atmosphere:
    timedelta: 1D
    path: /atmos_ckpt.tar
  sst_name: sst
  ocean_fraction_prediction:
    sea_ice_fraction_name: ocean_sea_ice_fraction
    land_fraction_name: land_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  atmosphere_output_rename:
    eastward_surface_wind_stress: eastward_surface_stress
    northward_surface_wind_stress: northward_surface_stress
  atmosphere_output_scale:
    eastward_surface_wind_stress: -1.0
    northward_surface_wind_stress: -1.0
n_coupled_steps: 260
coupled_steps_in_memory: 10
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /glo12
      file_pattern: 2026-10-22-glo12-ocean-4deg-19level-5day-2022-2025-cm4vars-v2.zarr
      engine: zarr
    atmosphere:
      data_path: /era5glo
      file_pattern: 2026-10-23-era5-4deg-8layer-daily-glo12-coupled-2022-2025.zarr
      engine: zarr
  start_indices:
    times:
    - '2022-06-03T00:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  ocean:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - sst
    - thetao_0
    - thetao_5
    - thetao_10
    - ocean_sea_ice_fraction
    - sea_ice_volume
    - hfds_total_area
    - zos
  atmosphere:
    save_prediction_files: false
    save_monthly_files: true
    names:
    - surface_temperature
    - TMP2m
    - DSWRFsfc
    - DLWRFsfc
    - ULWRFsfc
    - USWRFsfc
    - LHTFLsfc
    - SHTFLsfc
    - PRATEsfc
    - eastward_surface_stress
    - northward_surface_stress
    - sea_ice_fraction
    - ocean_fraction
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
