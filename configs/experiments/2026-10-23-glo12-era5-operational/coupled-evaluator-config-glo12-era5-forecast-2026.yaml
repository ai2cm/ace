# coupled-evaluator-config-glo12-era5-forecast-2026: a TRUE 12-month coupled forecast from the LAST analysed GLO12 state
# (2025-12-24), 72 five-day steps x 8 noise members, on the stores extended through 2026 by relabelling 2025 (+365 d): beyond
# 2025-12-30 the model takes only forcing (TOA insolation, CO2 nudged by the 2024->2025 increment, static fields) from them,
# so the 2026 'target' and every metric against it are meaningless; score the Nino3.4 forecast against CPC/OISST as 2026
# observations arrive. Troy 2026-10-24.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 72
coupled_steps_in_memory: 8
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /glo12
      file_pattern: 2026-10-22-glo12-ocean-4deg-19level-5day-2026-10-22-glo12-ocean-4deg-19level-5day-2022-2026ext-cm4vars-v3.zarr
      engine: zarr
    atmosphere:
      data_path: /era5glo
      file_pattern: 2026-10-23-era5-4deg-8layer-daily-glo12-coupled-2026-10-23-era5-4deg-8layer-daily-glo12-coupled-2022-2026ext-v2.zarr
      engine: zarr
  start_indices:
    times:
    - '2025-12-24T00:00:00'
    - '2025-12-24T00:00:00'
    - '2025-12-24T00:00:00'
    - '2025-12-24T00:00:00'
    - '2025-12-24T00:00:00'
    - '2025-12-24T00:00:00'
    - '2025-12-24T00:00:00'
    - '2025-12-24T00:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: false
data_writer:
  atmosphere:
    save_monthly_files: false
    save_prediction_files: false
  ocean:
    names:
    - sst
    - thetao_0
    - thetao_5
    - ocean_sea_ice_fraction
    save_prediction_files: true
    save_monthly_files: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
