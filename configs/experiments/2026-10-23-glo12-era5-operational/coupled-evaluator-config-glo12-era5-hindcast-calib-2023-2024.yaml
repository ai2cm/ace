# coupled-evaluator-config-glo12-era5-hindcast-calib-2023-2024: drift-calibration hindcasts INSIDE the training years: 18 monthly starts
# Jan 2023 .. Jun 2024 x 4 noise members, 36 five-day steps, same protocol as the 2025 test. Gives the model's mean Nino3.4
# drift by lead (and coarsely by start month) to correct the 2025 forecasts; in-sample for the ocean, so an optimistic estimate.
experiment_dir: /results
checkpoint_path: /ckpt.tar
n_coupled_steps: 36
coupled_steps_in_memory: 4
loader:
  num_data_workers: 2
  dataset:
    ocean:
      data_path: /glo12
      file_pattern: 2026-10-22-glo12-ocean-4deg-19level-5day-2022-2025-cm4vars-v2.zarr
      engine: zarr
    atmosphere:
      data_path: /era5glo
      file_pattern: 2026-10-23-era5-4deg-8layer-daily-glo12-coupled-2022-2025.zarr
      engine: zarr
  start_indices:
