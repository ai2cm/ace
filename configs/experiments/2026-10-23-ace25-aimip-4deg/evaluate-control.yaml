# +4 K response of the AIMIP-mode 4-degree paper recipe: control.
# Matched to the im4ecamc perturbation harness (wandb muu8pjbc): 4 years from
# 1979-01-01, one initial condition, forcing from the training store.
experiment_dir: /results
n_forward_steps: 1460
forward_steps_in_memory: 73
checkpoint_path: /ckpt.tar
logging:
  project: ace
loader:
  dataset:
    data_path: /climate-default
    engine: zarr
    file_pattern: 2026-09-08-era5-4deg-8layer-daily-1940-2025.zarr
  start_indices:
    times:
    - '1979-01-01T00:00:00'
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: true
