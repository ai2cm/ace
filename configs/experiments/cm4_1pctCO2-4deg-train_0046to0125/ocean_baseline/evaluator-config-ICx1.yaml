# Single-IC 140-year 1pctCO2 rollout, for out-of-sample skill.
#
# One IC at the store's start, run to the end of year 0140, so the rollout
# spans the whole 1pctCO2 record and crosses every data split:
#   years 0001-0040  never seen (out of sample, CO2 below the training range)
#   years 0041-0045  val_1pct_early
#   years 0046-0125  training window
#   years 0126-0130  val_1pct_late
#   years 0131-0140  holdout (out of sample, CO2 above the training range)
# The per-segment split is done offline from the monthly output + the annual
# aggregator series; nothing here restricts scoring to a segment.
#
# 10218 steps x 5 days = 0001-01-06 -> 0140-12-27 (73 steps/noleap year).
experiment_dir: /results
n_forward_steps: 10218
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0001-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-22-cm4-1pctco2-4deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-4deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: true
aggregator:
  log_histograms: true
  # Both of these plot a matplotlib *date* axis (they are the only two
  # aggregators that call convert_cftime_to_datetime_coord). Autoscale pads ~5%
  # below the data range, which on a 140-year series starting in year 0001
  # lands at year -6 — and matplotlib rejects dates before year 0001:
  #   ValueError: Date ordinal -721577.15 converts to -006-05-22 ...
  # It kills the run at the very end, after the rollout and the reduced-metric
  # netcdf are already written. Nothing here needs the ENSO or IPO index, so
  # they are off; the alternative (starting at year 0008+ to clear the padding)
  # would cost the first 7 out-of-sample years. Re-enable once the plotting
  # code clamps its date axis.
  log_nino34_index: false
  log_ipo_index: false
