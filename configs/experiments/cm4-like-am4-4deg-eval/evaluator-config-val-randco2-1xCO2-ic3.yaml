# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4-like-am4-4deg-eval
# Validation only: one-step validation on random-CO2 1xCO2 ic_0003 from the
# training start time onward. The inference rollout is a single step.
experiment_dir: /results
n_forward_steps: 1
forward_steps_in_memory: 1
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace2-cm4-atmos-noLSM
  entity: ai2cm
loader:
  start_indices:
    times:
      - "0153-01-01T06:00:00"
  dataset:
    merge:
      - &coupled_data
        data_path: /climate-default/2026-09-29-CM4-like-AM4-random-CO2-coupled-4deg
        file_pattern: random-CO2-1xCO2-ic_0003-sea_ice.zarr
        engine: zarr
      - &atmosphere_data
        data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-4deg
        file_pattern: random-CO2-1xCO2-ic_0003.zarr
        engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
validation:
  loader:
    batch_size: 64
    num_data_workers: 4
    prefetch_factor: 4
    time_buffer: 10
    dataset:
      merge:
        - <<: *coupled_data
          subset:
            start_time: '0153-01-01T06:00:00'
        - <<: *atmosphere_data
          subset:
            start_time: '0153-01-01T06:00:00'
