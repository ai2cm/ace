# job_runner/evaluate.sh configs/experiments/<exper> . \
#   --config-dir configs/experiments/cm4-like-am4-4deg-eval
experiment_dir: /results
n_forward_steps: 7667
forward_steps_in_memory: 50
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace2-cm4-atmos-noLSM
  entity: ai2cm
aggregator:
  log_zonal_mean_images: false
loader:
  start_indices:
    times:
      - "0152-10-01T06:00:00"
  dataset:
    merge:
      - data_path: /climate-default/2026-09-29-CM4-like-AM4-random-CO2-coupled-4deg
        file_pattern: random-CO2-1xCO2-ic_0002-sea_ice.zarr
        engine: zarr
      - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-4deg
        file_pattern: random-CO2-1xCO2-ic_0002.zarr
        engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
