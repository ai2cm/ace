# Stage 2: spatiotemporal video PMD, TWO-STAGE mode (per user request
# 2026-07-24). NO real fine-resolution (25km) truth is available as model
# input at either training or deployment time for the "endpoint" frames --
# only the coarse (100km) trajectory is assumed continuously available (e.g.
# from ACE2S). Instead of disabling endpoint pinning entirely (the
# endpoints_observed=false approach this file used previously -- see git
# history), a HiRO-style 2D residual-diffusion super-resolution sub-model
# ("stage A", model.endpoint_super_resolution) generates a fine-resolution
# estimate of the two endpoint frames from the coarse endpoint frames alone;
# THAT estimate is what gets pinned into the video-diffusion ("stage B")
# conditioning/baseline -- restoring a meaningful pinned endpoint so
# brownian_bridge noise / subset training / marginal-consistency loss are
# valid again, without depending on real fine truth as input. Stage A is
# supervised by its own denoising loss against the TRUE fine endpoints
# (available during training/validation, just not fed forward as input), with
# NO gradient from stage B's loss flowing back into it (detached at the
# handoff -- each stage is trained primarily by its own loss). Both stages'
# losses are computed and backpropagated in one `train_on_batch` call -- see
# VideoDiffusionModelConfig.endpoint_super_resolution's docstring in
# fme/downscaling/video_models.py.
#
# Still deliberately the flat/simple baseline for stage B, per the earlier
# user request: flat per-channel noise (temporal_noise_correlation:
# independent -- no cross-time correlation kernel; sigma_data/sigma_min/
# sigma_max/training noise distributions still differ per channel, that's
# just per-channel magnitude scaling, unrelated to "flat"), and no subset
# training / no marginal-consistency loss for THIS config (both are now
# actually compatible again thanks to stage A's pinning, but starting simple
# and adding them back later once this two-stage design is validated).
#
# Data: gs://vcm-ml-intermediate/2026-07-14-X-SHiELD-AMIP-FME-3h-{25km,100km}.zarr
# (same underlying X-SHiELD AMIP simulation as the "as before" 5-channel
# configs -- the 100km store is byte-identical to
# gs://vcm-ml-scratch/andrep/2025-07-25-X-SHiELD-AMIP-FME-3h.zarr, verified
# 2026-07-24 -- just now split into a genuinely paired fine/coarse dataset).
# downscale_factor = 720/180 = 1440/360 = 4.
#
# ---- THINGS TO TUNE BEFORE A FULL RUN (see run.sh comments too) ----
# - coarse_patch_extent_lat/lon: a 2x2 quadrant split (88, 180 -- 352x720
#   fine-pixel patches) was tried first and CONFIRMED to OOM on real 8x GPU
#   hardware (job 01KYATGZR00EJ7V49TZ17EWB61, 2026-07-24: CUDA OOM inside the
#   video U-Net's conv forward, ~178GiB GPU already ~177.8GiB in use at
#   failure time -- i.e. essentially the whole card, not a borderline case).
#   That job's batch_size (global 8 / 8 GPUs = 1 raw sample/GPU/fetch, before
#   patch splitting) was already effectively minimal, so batch_size/
#   num_data_workers are not the lever here -- reducing num_data_workers only
#   affects host-side CPU data-loading parallelism, not GPU memory, and
#   batch_size has no room left to shrink. Patch pixel count is what drives
#   activation memory, so switched to a 4(lat) x 5(lon) grid instead (44, 72
#   -- still divides 176x360 evenly, no partial-patch drop): 176x288
#   fine-pixel patches, 1/5 the pixel count of the 2x2 split (not a clean 4x4
#   because the video U-Net's 4 downsampling levels (channel_mult:
#   [1,2,2,2,2]) require each patch dimension divisible by 16 after the x4
#   upscale -- 90*4=360 is NOT (360/16=22.5, unlike the original 720/16=45),
#   72*4=288 IS (288/16=18), so lon uses a 5-way split, not 4-way, to
#   preserve that divisibility rather than risk a shape-mismatch crash).
#   If this STILL OOMs, drop further while preserving divisibility-by-16 on
#   both fine dimensions (e.g. 22/36 for an 8x10 split, 88x144 fine patches)
#   rather than touching batch_size/num_data_workers again.
#   (Also: run.sh now requests 4 GPUs, not the 8 the failed job used --
#   batch_size below was halved to 4 to match, keeping the same 1
#   sample/GPU/step as before rather than doubling per-GPU memory pressure
#   on top of the patch-size change above.)
# - num_data_workers: 4 -> 2 (2026-07-26). After the OOM fix above, two
#   separate 4-GPU retries (jobs 01KYAYFKP4HK8X03E37ZJKQ2HH,
#   01KYE90PN4FR0M333AKZBNVQY0) each got ~2h/~9950-9975 training steps in,
#   then hung on an NCCL collective for 30min with no application-level
#   error, killed by the watchdog. Both hangs landed in nearly the same
#   step-count window; replicating DistributedSampler's exact shuffle
#   (seed=0, epoch=0 -- set_epoch() is never called, so every fresh run
#   reshuffles identically) and reading the 24 candidate clip-start dates
#   that land there directly from GCS found nothing anomalous (all fast,
#   clean, no NaNs) -- so it's likely NOT one bad chunk, more likely
#   resource exhaustion under sustained concurrent load (4 GPUs x 4 workers
#   = 16 concurrent async GCS readers x 2 stores x 5 channels) hitting a
#   GCS QPS/connection-pool limit that gcsfs doesn't surface as an error by
#   default (see also the new GCS request timeout in
#   fme/core/dataset/utils.py, added the same day for the same reason: a
#   stalled read should fail fast with a clear exception, not hang
#   silently until the NCCL watchdog notices 30min later). Halving workers
#   reduces concurrent GCS pressure; unverified whether this alone is
#   sufficient, hence pairing it with the timeout fix. NOTE:
#   model.endpoint_super_resolution.coarse_shape below MUST be kept in sync
#   with this (it's [coarse_patch_extent_lat, coarse_patch_extent_lon] *
#   downscale_factor = [176, 288]) -- the underlying SongUNet backbone bakes
#   a fixed-size positional embedding into its weights at construction time,
#   so this can't just be inferred at runtime the way stage B's shape-agnostic
#   architecture can.
# - model.endpoint_super_resolution's architecture (model_channels: 64,
#   channel_mult: [1,2,2,2]) and generation schedule (sigma_min/max,
#   num_diffusion_generation_steps) are copied from the one real precedent
#   for this exact downscale factor in this repo
#   (../../baselines/downscaling/train-conus-100km-to-25km-augusta.yaml,
#   100km->25km, factor 4) -- a reasonable starting point, not tuned for our
#   5-channel/global-domain case specifically. attn_resolutions left empty
#   (unlike that CONUS config's [16], which isn't a valid resolution in OUR
#   pyramid -- 176/88/44/22 for a 176px (lat) fine patch -- SongUNet requires
#   an exact match, matched against img_shape_y i.e. the lat dimension only)
#   matching this repo's actual *global* HiRO baseline instead
#   (../../baselines/downscaling-hiro-global/train.yaml), which is the
#   closer precedent for a global (not regional) domain anyway, and cheaper
#   given the GPU memory constraints confirmed above.
# - sigma_data_by_channel / training_noise_distributions / sigma_min|max_by_channel
#   below (stage B's) are carried over from the temporal-only (stage 1)
#   residual scale. That residual was ~0 at the two endpoints (pinned, as it
#   is again here via stage A), so the *interior* residual scale those values
#   were tuned for should still be a reasonable proxy -- better than in the
#   endpoints_observed=false version of this file, but still not recomputed
#   for the actual two-stage setup. Recompute with a two-stage-aware version
#   of toy/compute_residual_std.py before trusting these for a long run.
experiment_dir: /results
max_epochs: 200
validate_using_ema: true
validate_interval: 10
test_interval: 20
max_val_batches: 20
max_test_batches: 50
generate_n_samples: 1
log_loss_vs_noise: true
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-temporal-interp
  name: global-25km-100km-spatiotemporal-twostage-5ch-flat-v1
  entity: ai2cm
optimization:
  lr: 0.0001
ema:
  decay: 0.9999
coarse_patch_extent_lat: 44
coarse_patch_extent_lon: 72
train_data:
  n_timesteps: 9
  fine:
    - data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  coarse:
    - data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  batch_size: 4  # global across ranks (4 GPUs x 1 sample/GPU) -- see "things to tune" above
  # No sample_with_replacement cap: with 20 patches/raw batch (4x5 grid),
  # one epoch over the full train loader is ~820 raw batches x 20 = ~16400
  # steps. Add a cap here if that's too slow once you've measured
  # wall-clock/epoch.
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
validation_data:
  n_timesteps: 9
  fine:
    - data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  coarse:
    - data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-01-01"
        stop_time: "2022-12-31"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
test_data:
  n_timesteps: 9
  fine:
    - data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: gs://vcm-ml-intermediate
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 4
  num_data_workers: 2
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # True (the default; explicit here for clarity): the two endpoint frames
  # ARE pinned in stage B's output -- but to stage A's generated estimate,
  # not real fine truth (there is none) -- see endpoint_super_resolution
  # below and the header comment.
  endpoints_observed: true
  # Stage A: HiRO-style 2D endpoint super-resolution -- see header comment
  # for the architecture/schedule provenance and the coarse_shape coupling
  # to coarse_patch_extent_lat/lon above.
  endpoint_super_resolution:
    module:
      type: unet_diffusion_song
      config:
        model_channels: 64
        channel_mult: [1, 2, 2, 2]
        attn_resolutions: []
    loss:
      type: MSE
    training_noise_distribution:
      p_mean: -1.2
      p_std: 1.8
    coarse_shape: [176, 288]  # fine patch size = coarse_patch_extent_lat/lon * downscale_factor(4)
    sigma_min: 0.002
    sigma_max: 150.0
    churn: 0.0
    num_diffusion_generation_steps: 18
    loss_weight: 1.0
  # Flat/independent noise (no temporal correlation) -- see header comment.
  # subset_augmentation_prob and marginal_consistency_weight are left at
  # their 0.0 defaults (matches the earlier "no subset training" request;
  # both are compatible with endpoint_super_resolution if you want them back).
  temporal_noise_correlation: independent
  log_transform_channels:
    PRATEsfc: 86400.0  # precip modeled in log1p(mm/day) space
  training_noise_distributions:
    eastward_wind_at_ten_meters:
      p_mean: -1.04
      p_std: 1.2
    northward_wind_at_ten_meters:
      p_mean: -0.72
      p_std: 1.2
    PRMSL:
      p_mean: -1.61
      p_std: 1.2
    PRATEsfc:
      p_mean: -0.25
      p_std: 1.2
    air_temperature_at_two_meters:
      p_mean: -1.96
      p_std: 1.2
  sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.354
    northward_wind_at_ten_meters: 0.487
    PRMSL: 0.200
    PRATEsfc: 0.782
    air_temperature_at_two_meters: 0.1403
  sigma_min_by_channel:
    eastward_wind_at_ten_meters: 0.002
    northward_wind_at_ten_meters: 0.002
    PRMSL: 0.002
    PRATEsfc: 0.002
    air_temperature_at_two_meters: 0.002
  sigma_max_by_channel:
    eastward_wind_at_ten_meters: 57.0
    northward_wind_at_ten_meters: 78.0
    PRMSL: 32.0
    PRATEsfc: 125.0
    air_temperature_at_two_meters: 22.4
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:  # fine (25km), train-only, global domain -- toy/compute_norm_stats_25km.py
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074   # log1p(PRATEsfc * 86400) space, matching log_transform_channels
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:  # coarse (100km), train-only, global domain -- reused verbatim
    # from the stage-1 config above: verified 2026-07-24 that the new 100km
    # store is byte-identical to the dataset those stats were computed from.
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
