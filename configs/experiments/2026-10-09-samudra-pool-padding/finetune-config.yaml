# Fine-tune the 1deg SSH ocean_wide pretraining (ocean_wide_ssh_ohc_clip_cde1
# rs0 of 2026-10-05-ocean-wide-ssh; wandb ace-samudra-cm4/k8bhakrc, best_ckpt =
# epoch 75) under each arm's Samudra padding options; the arm is set per row in
# finetuning.txt.
#   job_runner/uncoupled_finetune.sh configs/experiments/2026-10-09-samudra-pool-padding . \
#     --coupled_stats jamesd/2026-07-15-om4-1pctco2-1deg-coupled-stats
#
# The recipe is that of the ocean_frozen_mass_floor_latpad fine-tunes on
# exper/2026-10-07-samudra-lat-padding, whose loaders and inference match the
# SSH pretraining's: everything outside `stepper` is
# 2026-10-05-ocean-wide-ssh/train-config.yaml except max_epochs,
# evaluate_before_training, the LR warmup and parameter_init.
# create_finetune_config.sh merges only `.stepper` from the pretraining's
# config.yaml (template values win), so stepper_training and
# optimization.max_grad_norm are restated here from the pretraining.
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
ema:
  decay: 0.999
# THE LENGTH KNOB. 10 epochs = 7,300 iterations (730/epoch), 13% of the
# pretraining's 75; the latpad arms took ~6 h on 4 jupiter GPUs, and pad_pool
# adds 0.3% to the forward FLOPs at 1deg.
max_epochs: 10
evaluate_before_training: true # epoch-0 inline inference = the arm's zero-shot score
inference:
  - name: inference_1pct
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          # 8 ICs at 10-year spacing, 20-year rollouts tiling years 41-130
          # (validation + training), never entering the 131-140 holdout
          - '0041-01-01T00:00:00'
          - '0051-01-01T00:00:00'
          - '0061-01-01T00:00:00'
          - '0071-01-01T00:00:00'
          - '0081-01-01T00:00:00'
          - '0091-01-01T00:00:00'
          - '0101-01-01T00:00:00'
          - '0111-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
            engine: zarr
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
            engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
  - name: inference_piC
    weight: 1.0
    n_forward_steps: 1460 # exactly 20 noleap years
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          # 8 ICs at 10-year spacing, 20-year rollouts tiling relative years
          # 1-90, never entering the relative-year-91+ holdout. The first IC
          # is the store's first 5-daily snapshot.
          - '0151-01-06T00:00:00'
          - '0161-01-01T00:00:00'
          - '0171-01-01T00:00:00'
          - '0181-01-01T00:00:00'
          - '0191-01-01T00:00:00'
          - '0201-01-01T00:00:00'
          - '0211-01-01T00:00:00'
          - '0221-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
            engine: zarr
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
            engine: zarr
      num_data_workers: 4
    aggregator:
      log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
  metrics_log_dir: /results/metrics
train_loader:
  batch_size: 16
  num_data_workers: 8
  dataset:
    # 1pctCO2 years 0046-0125 concatenated with piControl years 0156-0235: 80
    # years each, 160 total. Neither window enters its run's validation years
    # (1pctCO2 0041-0045 and 0126-0130, piControl 0236-0240) or holdout (1pctCO2
    # 0131-0140, piControl 0241-0350). One concat list per store, both in the
    # same simulation order so the merged members share sample start times.
    merge:
      - concat:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0046-01-06T00:00:00'
              stop_time: '0126-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0156-01-06T00:00:00'
              stop_time: '0236-01-01T00:00:00'
      - concat:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0046-01-06T00:00:00'
              stop_time: '0126-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0156-01-06T00:00:00'
              stop_time: '0236-01-01T00:00:00'
validation:
  - name: val_1pct_early
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0041-01-06T00:00:00'
              stop_time: '0046-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0041-01-06T00:00:00'
              stop_time: '0046-01-01T00:00:00'
  - name: val_1pct_late
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0126-01-06T00:00:00'
              stop_time: '0131-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0126-01-06T00:00:00'
              stop_time: '0131-01-01T00:00:00'
  - name: val_piC
    evaluate_all_steps: false
    weight: 1.0
    loader:
      batch_size: 16
      num_data_workers: 8
      dataset:
        merge:
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
            engine: zarr
            subset:
              start_time: '0236-01-06T00:00:00'
              stop_time: '0241-01-01T00:00:00'
          - data_path: /climate-default
            file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
            engine: zarr
            subset:
              start_time: '0236-01-06T00:00:00'
              stop_time: '0241-01-01T00:00:00'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  max_grad_norm: 1.0 # ocean_wide_ohc_clip_cde1
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  # the optimizer state is not carried over from the pretraining, so warm the
  # fresh AdamW up to the pretraining's constant lr (the cm4 ocean_baseline
  # fine-tune convention)
  scheduler:
    schedulers:
      - type: LinearLR
        step_each_iteration: true
        kwargs:
          start_factor: 0.01
          end_factor: 1
          total_iters: 2000
      - type: ConstantLR
        step_each_iteration: true
    milestones: [2000]
stepper_training:
  n_forward_steps: 4
  parameter_init:
    weights_path: /ckpt.tar
  loss:
    type: MSE
stepper:
  step:
    config:
      builder:
        config:
          # control arm values; each finetuning.txt row overrides both
          lat_pad: constant
          pad_pool: false
          ch_width:
            - 280
            - 380
            - 480
            - 520
          dilation:
            - 1
            - 2
            - 4
            - 8
          n_layers:
            - 1
            - 1
            - 1
            - 1
          norm: instance
          zonally_periodic_upsample: true
        type: Samudra
      corrector:
        config:
          # the pretraining's cde1 warm-up would rerun on the fine-tune's first
          # epoch (the epoch counter restarts), training it uncorrected
          corrector_disabled_epochs: 0
          ocean_heat_content_correction:
            method: scaled_temperature
          surface_energy_flux_correction:
            method: prescribed
          force_positive_names:
            - so_0
            - so_1
            - so_2
            - so_3
            - so_4
            - so_5
            - so_6
            - so_7
            - so_8
            - so_9
            - so_10
            - so_11
            - so_12
            - so_13
            - so_14
            - so_15
            - so_16
            - so_17
            - so_18
            - sea_ice_volume
          sea_ice_fraction_correction:
            sea_ice_fraction_name: ocean_sea_ice_fraction
            land_fraction_name: land_fraction
            remove_negative_ocean_fraction: false
            zero_where_ice_free_names:
              - sea_ice_volume
              - sfdsi
              - UI
              - VI
        type: ocean_corrector
      normalization:
        network:
          global_means_path: /ocean_stats/centering.nc
          global_stds_path: /ocean_stats/scaling-full-field.nc
      next_step_forcing_names:
        - DLWRFsfc
        - DSWRFsfc
        - ULWRFsfc
        - USWRFsfc
        - LHTFLsfc
        - SHTFLsfc
        - PRATEsfc
        - eastward_surface_wind_stress
        - northward_surface_wind_stress
        - total_frozen_precipitation_rate
