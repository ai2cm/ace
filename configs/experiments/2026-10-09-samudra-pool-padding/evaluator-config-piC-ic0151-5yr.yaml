# piControl IC 0151-01-06, 5 years: the first 5 years of the shared
# cm4_eval/ocean/evaluator-config-piC-ic0151-200yr.yaml, otherwise identical
# except use_ema_if_available is stated (the 200-yr eval oxlwiuqz ran before
# ace #1531 and so used raw weights; this branch defaults to EMA).
# Time-mean diagnostics (time_mean/bias_map/*, saved to
# time_mean_diagnostics.nc) are always on in the legacy aggregator.
#
#   job_runner/evaluate.sh configs/experiments/2026-10-09-samudra-pool-padding .
experiment_dir: /results
n_forward_steps: 365 # 5 noleap years at the stores' 5-day step (73/yr)
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
use_ema_if_available: true # see header
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0151-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-picontrol-1deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-picontrol-1deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
  files:
    - label: kuroshio_extension_monthly
      names: [sst]
      lat_extent: [30.0, 40.0]
      lon_extent: [140.0, 180.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: gulf_stream_monthly
      names: [sst]
      lat_extent: [35.0, 45.0]
      lon_extent: [285.0, 315.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: n_atlantic_subpolar_monthly
      names: [sst]
      lat_extent: [50.0, 65.0]
      lon_extent: [300.0, 340.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: acc_monthly
      names: [sst]
      lat_extent: [-60.0, -45.0]
      lon_extent: [0.0, 360.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: n_pacific_gyre_monthly
      names: [sst]
      lat_extent: [25.0, 40.0]
      lon_extent: [180.0, 220.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
    - label: nino3_nino34_monthly
      names: [sst]
      lat_extent: [-5.0, 5.0]
      lon_extent: [190.0, 270.0]
      time_coarsen:
        method: monthly_mean
      save_reference: true
aggregator:
  log_histograms: true
  log_nino34_index: true
  log_ipo_index: true
