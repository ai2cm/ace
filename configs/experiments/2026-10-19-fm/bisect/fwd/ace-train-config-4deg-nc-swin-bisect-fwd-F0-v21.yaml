      file_pattern: 2xCO2-ic_0001.zarr
      engine: zarr
      subset:
        start_time: '2031-01-02'
        stop_time: '2041-01-01'
      labels:
      - som
    - data_path: /climate-default/2026-06-08-vertically-resolved-4deg-daily-c96-shield-som-ensemble-fme-dataset
      file_pattern: 4xCO2-ic_0001.zarr
      engine: zarr
      subset:
        start_time: '2031-01-02'
        stop_time: '2041-01-01'
      labels:
      - som
    - data_path: /climate-default
      file_pattern: 2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1940-01-03'
        stop_time: '1993-12-31'
      labels:
      - era5
    - data_path: /climate-default
      file_pattern: 2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1995-01-01'
        stop_time: '2013-12-31'
      labels:
      - era5
  label_sampling:
    weights:
      amip: 10958
      ramped: 10968
      som: 10959
      era5: 26662
    samples_per_epoch: 8888
validation:
  loader:
    batch_size: 32
    num_data_workers: 8
    prefetch_factor: 2
    time_buffer: 16
    dataset:
      strict: false
      concat:
      - data_path: /climate-default
        file_pattern: 2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '1994-01-01'
          stop_time: '1994-12-31'
        labels:
        - era5
      - data_path: /climate-default
        file_pattern: 2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2014-01-01'
          stop_time: '2014-12-31'
        labels:
        - era5
optimization:
  max_consecutive_non_finite_losses: 5
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
  scheduler:
    schedulers:
    - type: LinearLR
      kwargs:
        start_factor: 0.01
        end_factor: 1.0
        total_iters: 6
      step_each_iteration: false
    - type: ConstantLR
      kwargs:
        factor: 1.0
        total_iters: 10
      step_each_iteration: false
    milestones:
    - 6
stepper_training:
  n_ensemble: 2
  n_forward_steps: 1
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      float32_matmul_precision: high
      builder:
        type: NoiseConditionedSwinTransformer
        config:
          embed_dim: 128
          noise_embed_dim: 32
          depth_multiplier: 1
          num_heads:
          - 4
          - 8
          - 8
          - 4
          window_size:
          - 4
          - 8
          patch_size:
          - 1
          - 1
          num_levels: 1
          mlp_ratio: 4.0
          drop_path_rate: 0.1
          use_skip: true
          skip_projection: true
          mlp_layer: swiglu
          padding_conf:
            activate: true
            mode: earth
            pad_lat:
            - 2
            - 1
            pad_lon:
            - 3
            - 3
        conditional: true
      normalization:
        network:
          global_means_path: /climate-default/alexeyy/norm_ablation_0/fm/centering.nc
          global_stds_path: /climate-default/alexeyy/norm_ablation_0/fm/scaling-full-field.nc
        residual:
          global_means_path: /climate-default/alexeyy/norm_ablation_0/fm/centering.nc
          global_stds_path: /climate-default/alexeyy/norm_ablation_0/fm/scaling-residual.nc
        grouped:
          groups:
            amip:
              global_means_path: /climate-default/alexeyy/norm_ablation_0/fm/groups/c96/centering.nc
              global_stds_path: /climate-default/alexeyy/norm_ablation_0/fm/groups/c96/scaling-full-field.nc
            ramped:
              global_means_path: /climate-default/alexeyy/norm_ablation_0/fm/groups/c96/centering.nc
              global_stds_path: /climate-default/alexeyy/norm_ablation_0/fm/groups/c96/scaling-full-field.nc
            som:
              global_means_path: /climate-default/alexeyy/norm_ablation_0/fm/groups/c96/centering.nc
              global_stds_path: /climate-default/alexeyy/norm_ablation_0/fm/groups/c96/scaling-full-field.nc
            era5:
              global_means_path: /climate-default/alexeyy/norm_ablation_0/fm/groups/era5/centering.nc
              global_stds_path: /climate-default/alexeyy/norm_ablation_0/fm/groups/era5/scaling-full-field.nc
          default_label: era5
          pinned_variables:
          - global_mean_co2
          - HGTsfc
          - land_fraction
          - ocean_fraction
          - sea_ice_fraction
          - DSWRFtoa
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
