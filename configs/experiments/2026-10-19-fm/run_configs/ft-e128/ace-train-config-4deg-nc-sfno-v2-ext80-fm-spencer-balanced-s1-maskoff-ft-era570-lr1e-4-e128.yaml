optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
  scheduler:
    type: LinearLR
    kwargs:
      start_factor: 1.0
      end_factor: 0.0
      total_iters: 99072
    step_each_iteration: true
stepper_training:
  n_ensemble: 2
  n_forward_steps: 3
  optimize_last_step_only: false
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
  parameter_init:
    weights_path: /parent_ckpt.tar
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 1024
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          clip_latent_global_means: true
        conditional: true
      normalization:
        network:
          global_means_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/centering.nc
