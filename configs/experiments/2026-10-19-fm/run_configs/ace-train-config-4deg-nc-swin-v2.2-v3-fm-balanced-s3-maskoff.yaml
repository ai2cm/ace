              global_stds_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/groups/xshield/scaling-full-field.nc
          default_label: era5
          pinned_variables:
          - global_mean_co2
          - HGTsfc
          - land_fraction
          - ocean_fraction
          - sea_ice_fraction
          - DSWRFtoa
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
