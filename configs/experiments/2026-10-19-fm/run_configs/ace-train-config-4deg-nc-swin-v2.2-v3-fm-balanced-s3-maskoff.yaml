  max_consecutive_non_finite_losses: 5
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
  scheduler:
    schedulers:
    - type: LinearLR
      kwargs:
        start_factor: 0.01
        end_factor: 1.0
        total_iters: 2
      step_each_iteration: false
    - type: ConstantLR
      kwargs:
        factor: 1.0
        total_iters: 68
      step_each_iteration: false
    - type: LinearLR
      kwargs:
        start_factor: 1.0
        end_factor: 0.0
        total_iters: 30
      step_each_iteration: false
    milestones:
    - 2
    - 70
stepper_training:
  n_ensemble: 2
  n_forward_steps:
    start_value: 1
    milestones:
    - epoch: 41
      value:
        outcomes:
        - steps: 1
          probability: 0.6
        - steps: 2
          probability: 0.2
        - steps: 4
          probability: 0.2
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      include_channel_mask_inputs: true
      residual_prediction: false
      float32_matmul_precision: high
      builder:
        type: NoiseConditionedSwinTransformer
        config:
          embed_dim: 512
          noise_embed_dim: 32
          depth_multiplier: 1
          num_heads:
          - 4
          - 8
          - 8
          - 4
          window_size:
          - 4
          - 8
          patch_size:
          - 1
          - 1
          num_levels: 2
          mlp_ratio: 4.0
          drop_path_rate: 0.1
          use_skip: true
          skip_projection: true
          mlp_layer: swiglu
          padding_conf:
            activate: true
            mode: earth
            pad_lat:
            - 2
            - 1
            pad_lon:
            - 3
            - 3
        conditional: true
      normalization:
        network:
          global_means_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/centering.nc
          global_stds_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/scaling-full-field.nc
        residual:
          global_means_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/centering.nc
          global_stds_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/scaling-residual.nc
        grouped:
          groups:
            c96:
              global_means_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/groups/c96/centering.nc
              global_stds_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/groups/c96/scaling-full-field.nc
            era5:
              global_means_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/groups/era5/centering.nc
              global_stds_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/groups/era5/scaling-full-field.nc
            cm4:
              global_means_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/groups/cm4/centering.nc
              global_stds_path: /climate-default/alexeyy/norm_ablation_0/2026-10-22-fm-all-datasets-v2/groups/cm4/scaling-full-field.nc
            xshield:
