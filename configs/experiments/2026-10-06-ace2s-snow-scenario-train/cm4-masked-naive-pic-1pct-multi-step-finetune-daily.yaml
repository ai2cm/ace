# arg: --dataset brianhenn/2026-10-07-cm4-pic-1pct-daily-land-snow-masked-stats:/statsdata
# Masked-naive treatment, multi-step fine-tuning on pic-1pct (160 years; see README).
seed: 0
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
max_epochs: 50  # ~7,300 iterations per epoch at batch 8
save_per_epoch_diagnostics: false
ema:
  decay: 0.999
inference:
- name: inference
  n_forward_steps: 1825  # exactly 5 noleap years
  forward_steps_in_memory: 25
  loader:
    start_indices:
      times:
      - '0151-01-02T00:00:00'
      - '0152-01-01T00:00:00'
      - '0153-01-01T00:00:00'
      - '0154-01-01T00:00:00'
      - '0236-01-01T00:00:00'
      - '0237-01-01T00:00:00'
      - '0238-01-01T00:00:00'
      - '0239-01-01T00:00:00'
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily.zarr
        engine: zarr
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily-land-snow-masked.zarr
        engine: zarr
    num_data_workers: 8
  aggregator:
    histogram:
      enabled: true
    time_mean_reference_data: /statsdata/time-mean-piControl.nc
    anomaly_memory:
      enabled: true
      # Snow-relevant fields; the controls have no snow channels.
      variables:
      - USWRFsfc
      - TMP2m
      - surface_temperature
      - surface_snow_amount_masked
      - surface_snow_area_fraction_masked
      report_lags: [7, 14]
      # Leading times: extended cold season per hemisphere.
      months_northern: [11, 12, 1, 2, 3, 4, 5]
      months_southern: [5, 6, 7, 8, 9, 10, 11]
      regions:
        - name: Siberia
          lat: [50, 68]
          lon: [60, 140]
        - name: Canada
          lat: [50, 65]
          lon: [250, 285]
        - name: N_Europe
          lat: [55, 68]
          lon: [5, 40]
        - name: Tibet
          lat: [30, 38]
          lon: [80, 100]
        - name: Great_Plains
          lat: [32, 49]
          lon: [255, 265]
        - name: Rockies
          lat: [38, 45]
          lon: [249, 256]
        - name: Andes
          lat: [-35, -15]
          lon: [287, 293]
        - name: north_of_40S
          lat: [-40, 90]
          lon: [0, 360]
    snow_season:
      enabled: true
      variable: surface_snow_amount_masked
      regions:
        - name: Siberia
          lat: [50, 68]
          lon: [60, 140]
        - name: Canada
          lat: [50, 65]
          lon: [250, 285]
        - name: N_Europe
          lat: [55, 68]
          lon: [5, 40]
        - name: Tibet
          lat: [30, 38]
          lon: [80, 100]
        - name: Great_Plains
          lat: [32, 49]
          lon: [255, 265]
        - name: Rockies
          lat: [38, 45]
          lon: [249, 256]
        - name: Andes
          lat: [-35, -15]
          lon: [287, 293]
