logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  dataset:
    merge:
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr-daily.zarr
        engine: zarr
        subset:
          start_time: '0046-01-01T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily.zarr
        engine: zarr
        subset:
          start_time: '0156-01-01T00:00:00'
          stop_time: '0236-01-01T00:00:00'
    - concat:
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr-daily-land-snow-masked.zarr
        engine: zarr
        subset:
          start_time: '0046-01-01T00:00:00'
          stop_time: '0126-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily-land-snow-masked.zarr
        engine: zarr
        subset:
          start_time: '0156-01-01T00:00:00'
          stop_time: '0236-01-01T00:00:00'
validation:
- name: val_piC
  loader:
    batch_size: 32
    num_data_workers: 4
    prefetch_factor: 4
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily.zarr
        engine: zarr
        subset:
          start_time: '0236-01-01T00:00:00'
          stop_time: '0241-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily-land-snow-masked.zarr
        engine: zarr
        subset:
          start_time: '0236-01-01T00:00:00'
          stop_time: '0241-01-01T00:00:00'
- name: val_1pct_early
  loader:
    batch_size: 32
    num_data_workers: 4
    prefetch_factor: 4
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr-daily.zarr
        engine: zarr
        subset:
          start_time: '0041-01-01T00:00:00'
          stop_time: '0046-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr-daily-land-snow-masked.zarr
        engine: zarr
        subset:
          start_time: '0041-01-01T00:00:00'
          stop_time: '0046-01-01T00:00:00'
- name: val_1pct_late
  loader:
    batch_size: 32
    num_data_workers: 4
    prefetch_factor: 4
    dataset:
      merge:
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr-daily.zarr
        engine: zarr
        subset:
          start_time: '0126-01-01T00:00:00'
          stop_time: '0131-01-01T00:00:00'
      - data_path: /climate-default
        file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr-daily-land-snow-masked.zarr
        engine: zarr
        subset:
          start_time: '0126-01-01T00:00:00'
          stop_time: '0131-01-01T00:00:00'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  parameter_init:
    weights_path: /weights/training_checkpoints/best_ckpt.tar
  n_ensemble: 2
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 3
        probability: 0.1
      - steps: 4
        probability: 0.05
      - steps: 5
        probability: 0.05
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  checkpoint_path: /weights/training_checkpoints/best_ckpt.tar
