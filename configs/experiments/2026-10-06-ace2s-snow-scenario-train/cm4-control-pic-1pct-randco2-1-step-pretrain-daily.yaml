# arg: --dataset brianhenn/2026-10-07-cm4-pic-1pct-randco2-daily-stats:/statsdata
# Control, 1-step pre-training on pic-1pct-randco2 (190 years; see README).
seed: 0
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
max_epochs: 45  # ~8,668 iterations per epoch at batch 8
save_per_epoch_diagnostics: true
ema:
  decay: 0.999
inference:
- name: inference
  n_forward_steps: 1825  # exactly 5 noleap years
  forward_steps_in_memory: 25
  loader:
    start_indices:
      times:
      - '0151-01-02T00:00:00'
      - '0152-01-01T00:00:00'
      - '0153-01-01T00:00:00'
      - '0154-01-01T00:00:00'
      - '0236-01-01T00:00:00'
      - '0237-01-01T00:00:00'
      - '0238-01-01T00:00:00'
      - '0239-01-01T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily.zarr
      engine: zarr
    num_data_workers: 8
  aggregator:
    histogram:
      enabled: true
    time_mean_reference_data: /statsdata/time-mean-piControl.nc
    anomaly_memory:
      enabled: true
      variables:
      - USWRFsfc
      - TMP2m
      - surface_temperature
      report_lags: [7, 14]
      # Leading times: extended cold season per hemisphere.
      months_northern: [11, 12, 1, 2, 3, 4, 5]
      months_southern: [5, 6, 7, 8, 9, 10, 11]
      regions:
        - name: Siberia
          lat: [50, 68]
          lon: [60, 140]
        - name: Canada
          lat: [50, 65]
          lon: [250, 285]
        - name: N_Europe
          lat: [55, 68]
          lon: [5, 40]
        - name: Tibet
          lat: [30, 38]
          lon: [80, 100]
        - name: Great_Plains
          lat: [32, 49]
          lon: [255, 265]
        - name: Rockies
          lat: [38, 45]
          lon: [249, 256]
        - name: Andes
          lat: [-35, -15]
          lon: [287, 293]
        - name: north_of_40S
          lat: [-40, 90]
          lon: [0, 360]
- name: inference_1pct
  n_forward_steps: 1825  # exactly 5 noleap years
  forward_steps_in_memory: 25
  loader:
    start_indices:
      times:
      - '0041-01-01T00:00:00'
      - '0042-01-01T00:00:00'
      - '0043-01-01T00:00:00'
      - '0044-01-01T00:00:00'
      - '0123-01-01T00:00:00'
      - '0124-01-01T00:00:00'
      - '0125-01-01T00:00:00'
      - '0126-01-01T00:00:00'
    dataset:
      data_path: /climate-default
      file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr-daily.zarr
      engine: zarr
    num_data_workers: 8
  aggregator:
    time_mean_reference_data: /statsdata/time-mean-1pctCO2.nc
    anomaly_memory:
      enabled: true
      variables:
      - USWRFsfc
      - TMP2m
      - surface_temperature
      report_lags: [7, 14]
      # Leading times: extended cold season per hemisphere.
      months_northern: [11, 12, 1, 2, 3, 4, 5]
      months_southern: [5, 6, 7, 8, 9, 10, 11]
      regions:
        - name: Siberia
          lat: [50, 68]
          lon: [60, 140]
        - name: Canada
          lat: [50, 65]
          lon: [250, 285]
        - name: N_Europe
          lat: [55, 68]
          lon: [5, 40]
        - name: Tibet
          lat: [30, 38]
          lon: [80, 100]
        - name: Great_Plains
          lat: [32, 49]
          lon: [255, 265]
        - name: Rockies
          lat: [38, 45]
          lon: [249, 256]
        - name: Andes
          lat: [-35, -15]
          lon: [287, 293]
        - name: north_of_40S
          lat: [-40, 90]
          lon: [0, 360]
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 8
  num_data_workers: 4
  prefetch_factor: 2
  dataset:
    concat:
    - data_path: /climate-default
      file_pattern: 2026-06-19-CM4-1pctCO2-atmosphere-land-1deg-8layer-140yr-daily.zarr
      engine: zarr
      subset:
        start_time: '0046-01-01T00:00:00'
        stop_time: '0126-01-01T00:00:00'
    - data_path: /climate-default
      file_pattern: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily.zarr
      engine: zarr
      subset:
        start_time: '0156-01-01T00:00:00'
        stop_time: '0236-01-01T00:00:00'
    - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-1deg-daily
      file_pattern: random-CO2-1xCO2-ic_0001.zarr
      engine: zarr
      subset:
        start_time: '0153-01-01T00:00:00'
    - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-1deg-daily
      file_pattern: random-CO2-1xCO2-ic_0002.zarr
      engine: zarr
      subset:
        start_time: '0153-01-01T00:00:00'
    - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-1deg-daily
      file_pattern: random-CO2-2xCO2-ic_0001.zarr
      engine: zarr
      subset:
        start_time: '0153-01-01T00:00:00'
    - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-1deg-daily
      file_pattern: random-CO2-2xCO2-ic_0002.zarr
      engine: zarr
      subset:
        start_time: '0153-01-01T00:00:00'
    - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-1deg-daily
      file_pattern: random-CO2-4xCO2-ic_0001.zarr
      engine: zarr
      subset:
        start_time: '0153-01-01T00:00:00'
    - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-1deg-daily
      file_pattern: random-CO2-4xCO2-ic_0002.zarr
      engine: zarr
      subset:
        start_time: '0153-01-01T00:00:00'
