# Held-out random-CO2 member ic_0003 at 4xCO2, the whole member: AM4 with the
# prescribed SST ramping about 1 K per year while CO2 jumps to a new random
# value every two weeks or so. Only its year 0155 entered training, as
# validation; the pic-1pct arms never saw random-CO2 data at all.
experiment_dir: /results
n_forward_steps: 1916  # the whole member
forward_steps_in_memory: 50
n_ensemble_per_ic: 4
seed: 0
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: false
  project: ace
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0152-10-02T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-1deg-daily
      file_pattern: random-CO2-4xCO2-ic_0003.zarr
      engine: zarr
    - data_path: /climate-default/2026-06-19-CM4-like-AM4-random-CO2-1deg-daily
      file_pattern: random-CO2-4xCO2-ic_0003-land-snow-masked.zarr
      engine: zarr
  num_data_workers: 8
data_writer:
  save_prediction_files: false
  save_monthly_files: false
aggregator:
  snow_season:
    enabled: true
    variable: surface_snow_amount_masked
    regions:
    - name: Siberia
      lat: [50, 68]
      lon: [60, 140]
    - name: Canada
      lat: [50, 65]
      lon: [250, 285]
    - name: N_Europe
      lat: [55, 68]
      lon: [5, 40]
    - name: Tibet
      lat: [30, 38]
      lon: [80, 100]
    - name: Great_Plains
      lat: [32, 49]
      lon: [255, 265]
    - name: Rockies
      lat: [38, 45]
      lon: [249, 256]
    - name: Andes
      lat: [-35, -15]
      lon: [287, 293]
    - name: Patagonia
      lat: [-55, -40]
      lon: [285, 295]
    - name: north_of_40S
      lat: [-40, 90]
      lon: [0, 360]
