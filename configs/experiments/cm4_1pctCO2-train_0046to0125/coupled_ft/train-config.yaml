optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.00001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    schedulers:
      - type: LinearLR
        step_each_iteration: true
        kwargs:
          start_factor: 0.01
          end_factor: 1
          total_iters: 2000
      - type: ConstantLR
        step_each_iteration: true
    milestones: [2000]
stepper_training:
  n_coupled_steps: 4
  # Required, not incidental: the ocean's stochasticity is supplied by the
  # atmosphere, so the ensemble must run through both realms.
  n_ensemble: 2
  # Each batch optimizes exactly one realm, drawn 50/50. Valid here because
  # both realms carry a non-null loss.
  optimize_single_component_per_batch: true
  ocean:
    parameter_init:
      weights_path: /ocean_ckpt.tar
    # Uniform over the coupled window. A `steps: 0` outcome is excluded: it
    # contributes no loss and is degenerate under optimize_last_step_only.
    n_steps:
      outcomes:
        - steps: 1
          probability: 0.25
        - steps: 2
          probability: 0.25
        - steps: 3
          probability: 0.25
        - steps: 4
          probability: 0.25
    optimize_last_step_only: true
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    parameter_init:
      weights_path: /atmos_ckpt.tar
    n_steps:
      outcomes:
        - steps: 1
          probability: 0.6
        - steps: 2
          probability: 0.2
        - steps: 4
          probability: 0.1
        - steps: 12
          probability: 0.05
        - steps: 20
          probability: 0.025
        - steps: 40
          probability: 0.025
    optimize_last_step_only: true
    loss_weight: 1.0
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
      weights:
        air_temperature_0: 0.5
        air_temperature_1: 0.5
        eastward_wind_0: 0.5
        northward_wind_0: 0.5
        specific_total_water_0: 0.5
        specific_total_water_1: 0.25
        specific_total_water_2: 0.5
        PRATEsfc: 0.5
        h500: 10
        TMP850: 5
        Q2m: 0.5
        TMP2m: 10
        UGRD10m: 2.5
        VGRD10m: 2.5
        DLWRFsfc: 2
        ULWRFsfc: 5
        USWRFsfc: 2
        DSWRFsfc: 2
        USWRFtoa: 2
        tendency_of_total_water_path_due_to_advection: 0.5
        PRESsfc: 3
stepper:
  ocean_fraction_prediction:
    land_fraction_name: land_fraction
    sea_ice_fraction_name: ocean_sea_ice_fraction
    sea_ice_fraction_name_in_atmosphere: sea_ice_fraction
  sst_name: sst
  ocean:
    timedelta: 5D
    # stepper added by job_runner/create_coupled_train_config.sh

    stepper:
      input_masking:
        mask_value: 0
        fill_value: 0.0
        exclude_names_and_prefixes:
          - land_fraction
          - DLWRFsfc
          - DSWRFsfc
          - ULWRFsfc
          - USWRFsfc
          - LHTFLsfc
          - SHTFLsfc
          - PRATEsfc
          - eastward_surface_wind_stress
          - northward_surface_wind_stress
          - total_frozen_precipitation_rate
      step:
        type: single_module
        config:
          builder:
            type: Samudra
            config:
              ch_width:
                - 200
                - 250
                - 300
                - 400
              dilation:
                - 1
                - 2
                - 4
                - 8
              n_layers:
                - 1
                - 1
                - 1
                - 1
              norm: instance
              zonally_periodic_upsample: true
          normalization:
            network:
              global_means_path: /ocean_stats/centering.nc
              global_stds_path: /ocean_stats/scaling-full-field.nc
