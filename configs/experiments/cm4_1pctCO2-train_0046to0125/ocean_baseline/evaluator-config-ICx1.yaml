# Single-IC 140-year 1pctCO2 rollout at 1deg, for out-of-sample skill.
#
# One IC at the store's first snapshot, run to the end of year 0140, so the
# rollout spans the whole 1pctCO2 record and crosses every data split:
#   years 0001-0040  never seen (out of sample, CO2 below the training range)
#   years 0041-0045  val_1pct_early
#   years 0046-0125  training window
#   years 0126-0130  val_1pct_late
#   years 0131-0140  holdout (out of sample, CO2 above the training range)
# Nothing here restricts scoring to a segment; the per-segment split is done
# offline from the monthly output and the annual aggregator series.
#
# 10218 steps x 5 days = 0001-01-06 -> 0140-12-27 (73 steps/noleap year), the
# last snapshot of year 140. One more step would leave the record.
#
# This is the 1deg twin of the 4deg ICx1 evaluation, and deliberately matches
# it in shape so the two resolutions are read the same way. Resolution-specific
# values (the zarrs, forward_steps_in_memory) are taken from the 1deg training
# config's own inference blocks, not carried over from 4deg.
#
# The stepper -- including input_masking.fill_value -- is restored from the
# checkpoint, so this one config serves both the zero-fill and mean-fill arms
# unchanged. Keep it identical between the two arm directories.
experiment_dir: /results
n_forward_steps: 10218
forward_steps_in_memory: 40
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-cm4
  entity: ai2cm
loader:
  start_indices:
    times:
    - '0001-01-06T00:00:00'
  dataset:
    merge:
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-1deg-coupled-ocean.zarr
      engine: zarr
    - data_path: /climate-default
      file_pattern: 2026-07-15-om4-1pctco2-1deg-ocean-5daily.zarr
      engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  # Off by default: the monthly files are large, and the per-segment split this
  # evaluation needs comes from the wandb per-step weighted_rmse series instead.
  # Turn on only for an analysis that genuinely needs gridded monthly output.
  save_monthly_files: false
aggregator:
  log_histograms: true
  # Both of these plot a matplotlib *date* axis (they are the only two
  # aggregators that call convert_cftime_to_datetime_coord). Autoscale pads ~5%
  # below the data range, which on a 140-year series starting in year 0001
  # lands at year -6 -- and matplotlib rejects dates before year 0001. It kills
  # the run at the very end, after the rollout and the reduced-metric netcdf
  # are already written. The fix is on ace #1439, which is not on this branch,
  # so they stay off; nothing here needs the ENSO or IPO index.
  log_nino34_index: false
  log_ipo_index: false
