# Time-coarsen the raw 6-hourly UFS-Replay ocean+atmosphere output
# (produced by scripts/ufs-replay/pipeline/ufs-replay-pipeline.py) to
# daily via scripts/data_process/time_coarsen.py.
#
# Ocean/sea-ice prognostic state variables are snapshotted (subsampled,
# not averaged) so training sees actual model states; atmosphere forcing
# and ocean surface flux variables are window-averaged over each day,
# matching the SHiELD-family time_coarsen configs' convention.
#
# Run name matches the dated production output of `make
# ufs_replay_dataflow` (see scripts/ufs-replay/Makefile: DATE-DATASET_NAME);
# update it again to match whenever that pipeline is re-run.
runs:
  2026-08-07-ufs-replay-ocean-1deg-19level-1994-2023: ""
data_output_directory: gs://vcm-ml-intermediate
stats:
  output_directory: gs://vcm-ml-intermediate/ufs-replay-ocean-1deg-19level-daily-stats
  beaker_dataset: ufs-replay-ocean-1deg-19level-daily-stats
  data_type: UFS_REPLAY
  start_date: "1994-01-01"
  end_date: "2021-12-31"
time_coarsen:
  factor: 4 # 6-hourly -> daily
  data_output_directory: gs://vcm-ml-intermediate
  output_name: ufs-replay-ocean-1deg-19level-daily
  stats_output_directory: gs://vcm-ml-intermediate/ufs-replay-ocean-1deg-19level-daily-stats
