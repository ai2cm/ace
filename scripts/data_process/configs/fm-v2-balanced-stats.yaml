# Pooled normalization stats for the fm-balanced training arm, generated from the
# train_loader.dataset.concat of the fm-balanced run configs in
# configs/experiments/2026-10-19-fm/run_configs/
#   ace-train-config-4deg-nc-sfno-v2-fm-balanced-s0-maskoff.yaml
# (identical across sfno-v2 / swin-v2.2-v2 and seeds 0-2), with the same stores,
# time slices and transforms as training, grouped by each entry's label.
# This is fm-all-datasets-stats-v2.yaml plus the extra c96 members added by
# create_fm_v2_jobs.py: AMIP ic_0002 (same two slices as ic_0001) and SOM
# {1,2,4}xCO2-ic_0002..0005 except 1xCO2-ic_0005.
# Stores are the GCS copies of the weka training stores, except ERA5, which is
# read from weka because its GCS copy is stored under a different store name.
# The CM4 stores have no global_mean_co2 or ocean_fraction; as in the training
# config, each CM4 entry renames carbon_dioxide to global_mean_co2, derives
# ocean_fraction, and converts global_mean_co2 from ppmv to volume mixing ratio,
# so the pooled stats of both variables include CM4.
# Training also sets sht_roundtrip_variables: [HGTsfc] on the CM4 and X-SHiELD
# entries; get_pooled_stats.py does not support that option, so HGTsfc stats
# here use the raw (non-roundtripped) field for those stores.
dataset_pairs:
- dataset: gs://vcm-ml-intermediate/2026-01-28-vertically-resolved-c96-4deg-daily-shield-amip-ensemble-dataset/ic_0001.zarr
