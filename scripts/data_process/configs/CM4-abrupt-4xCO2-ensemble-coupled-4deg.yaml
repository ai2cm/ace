# make cm4_abrupt_4xCO2_ensemble_coupled_4deg
# Requires the ocean stats from make cm4_abrupt_4xCO2_ensemble_ocean_stats.
version: "2026-10-20"
family_name: cm4-abrupt-4xCO2-ensemble-4deg-coupled
output_directory: gs://vcm-ml-intermediate

coupled_datasets:
  coupled_ts:
    how: interpolate_sst
  coupled_sea_surface:
    precomputed_sea_ice_mask:
      zarr_path: gs://vcm-ml-intermediate/2026-07-22-cm4-picontrol-4deg-coupled-ocean.zarr
    ocean_extra_masked_names: ["HI", "sea_ice_volume", "UI", "VI", "sfdsi"]
    ocean_extra_fill_values:
      UI: 0.0
      VI: 0.0
    surface_flux_window_avg:
      window_timedelta: 120h
      # No first_timestamp or last_timestamp: the members start on different
      # dates, so each member's flux windows are right-labeled at its own
      # ocean timesteps, i.e. each window (t - 120h, t] ends at an ocean
      # timestep t, starting from the ocean store's first timestamp.
      subset_names:
        - DLWRFsfc
        - DSWRFsfc
        - ULWRFsfc
        - USWRFsfc
        - LHTFLsfc
        - SHTFLsfc
        - PRATEsfc
        - eastward_surface_wind_stress
        - northward_surface_wind_stress
        - total_frozen_precipitation_rate
  coupled_sea_ice:
    # No window_avg and no sea_ice input dataset: the sea ice fraction is
    # sourced from the ocean store's native 5-daily fields and forward-filled
    # onto the atmosphere's 6-hourly time index.
    include_ts: true
    use_atmosphere_sea_ice_fraction_fallback: false
  output_writer:
    n_dask_workers: 32
    # Members span at most 1460 6-hourly steps, i.e. a few 360-step outer
    # chunks, so the default 50 partitions would be mostly empty.
    n_split: 1

stats:
  beaker_dataset: 2026-10-20-cm4-abrupt-4xCO2-ensemble-4deg-coupled-stats

input_datasets:
  climate_data_type: "CM4"
  stats:
    atmosphere_dir: gs://vcm-ml-intermediate/2026-10-16-CM4-abrupt-4xCO2-ensemble-4deg-stats/combined
    ocean_dir: gs://vcm-ml-intermediate/2026-10-19-cm4-abrupt-4xCO2-ensemble-ocean-4deg-5daily-stats/combined
  # Every member shares ic_0001's atmosphere and ocean settings (anchored
  # below) and overrides only its zarr_path.
  runs:
    ic_0001:
      atmosphere: &atmosphere
        zarr_path: gs://vcm-ml-intermediate/2026-10-16-CM4-abrupt-4xCO2-ensemble-4deg/ic_0001.zarr
        time_chunk_size: 1460
        extra_fields:
          names_and_prefixes: ["ak_", "bk_"]
      ocean: &ocean
        zarr_path: gs://vcm-ml-intermediate/2026-10-19-cm4-abrupt-4xCO2-ensemble-ocean-4deg-5daily/ic_0001.zarr
        time_chunk_size: 73
        extra_fields:
          names_and_prefixes: ["idepth_", "mask_", "deptho"]
    ic_0002:
      atmosphere:
        <<: *atmosphere
        zarr_path: gs://vcm-ml-intermediate/2026-10-16-CM4-abrupt-4xCO2-ensemble-4deg/ic_0002.zarr
      ocean:
        <<: *ocean
        zarr_path: gs://vcm-ml-intermediate/2026-10-19-cm4-abrupt-4xCO2-ensemble-ocean-4deg-5daily/ic_0002.zarr
    ic_0003:
      atmosphere:
        <<: *atmosphere
        zarr_path: gs://vcm-ml-intermediate/2026-10-16-CM4-abrupt-4xCO2-ensemble-4deg/ic_0003.zarr
      ocean:
        <<: *ocean
        zarr_path: gs://vcm-ml-intermediate/2026-10-19-cm4-abrupt-4xCO2-ensemble-ocean-4deg-5daily/ic_0003.zarr
    ic_0004:
