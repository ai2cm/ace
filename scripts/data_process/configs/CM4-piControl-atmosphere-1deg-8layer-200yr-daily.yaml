# Produces the daily 1deg CM4-piControl atmosphere+land dataset by time-coarsening
# the 2026-06-19 6-hourly zarr store by a factor of 4, for training on piControl
# together with the 1pctCO2 and random-CO2 scenarios. It supersedes the daily
# store built from the 2025-03-21 6-hourly store (branch
# scripts/cm4-picontrol-1deg-daily-dataset), which came from the earlier
# piControl run; the 2026-06-19 reprocessing is the one the 1pctCO2 and
# random-CO2 stores share.
#
# Run with (never pass --dataset, which would rewrite the 6-hourly source):
#   ./compute_dataset.sh --time-coarsen --stats --config configs/CM4-piControl-atmosphere-1deg-8layer-200yr-daily.yaml
#
# --stats computes the daily stats over the scenario-training window
# 0156-0235 only, so that they can be pooled with the 1pctCO2 and random-CO2
# daily stats over their training windows. The 6-hourly stats already exist at
# stats.output_directory and are skipped.
#
# Variables in none of the three lists below are dropped by the coarsening.
runs:
  2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr: ""  # no real data source, config only for time coarsening
data_output_directory: gs://vcm-ml-intermediate
stats:
  # The 6-hourly stats already exist here (full record) and are skipped; the
  # dates apply to the daily stats under time_coarsen.
  output_directory: gs://vcm-ml-intermediate/2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-stats
  start_date: "0156-01-01T00:00:00"
  end_date: "0236-01-01T00:00:00"
  data_type: CM4
  beaker_dataset: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-stats
time_coarsen:
  factor: 4
  data_output_directory: gs://vcm-ml-intermediate/2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily
  stats_output_directory: gs://vcm-ml-intermediate/2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily-stats-0156-0236
  beaker_dataset: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily-stats-0156-0236
  output_names:
    2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr: 2026-06-19-CM4-piControl-atmosphere-land-1deg-8layer-200yr-daily
  n_split: 200 # 200 years * 365 days/yr / 360 steps per shard ~= 203 shards, so about one shard per partition
  snapshot_names:
    # variables whose cell_methods in the 6-hourly store is "time: point"
    - PRESsfc
    - PRMSL
    - Q2m
    - TMP2m
    - TMP850
    - UGRD10m
    - VGRD10m
    - air_temperature_0
    - air_temperature_1
    - air_temperature_2
    - air_temperature_3
    - air_temperature_4
    - air_temperature_5
    - air_temperature_6
    - air_temperature_7
    - column_soil_moisture
    - eastward_wind_0
    - eastward_wind_1
    - eastward_wind_2
    - eastward_wind_3
    - eastward_wind_4
    - eastward_wind_5
    - eastward_wind_6
    - eastward_wind_7
    - h500
    - northward_wind_0
    - northward_wind_1
    - northward_wind_2
    - northward_wind_3
    - northward_wind_4
    - northward_wind_5
    - northward_wind_6
    - northward_wind_7
    - ocean_fraction
    - sea_ice_fraction
    - specific_total_water_0
    - specific_total_water_1
    - specific_total_water_2
    - specific_total_water_3
    - specific_total_water_4
    - specific_total_water_5
    - specific_total_water_6
    - specific_total_water_7
    - surface_snow_amount
    - surface_snow_area_fraction
    - surface_temperature
    - temperature_of_soil_layer_0
    - temperature_of_soil_layer_1
    - temperature_of_soil_layer_2
    - temperature_of_soil_layer_3
    - total_land_column_energy_without_rivers
    - total_moisture_content_of_soil_layer_0
    - total_moisture_content_of_soil_layer_1
    - total_moisture_content_of_soil_layer_2
    - total_moisture_content_of_soil_layer_3
    - total_water_path
    - total_energy
  window_names:
    # variables whose cell_methods in the 6-hourly store is "time: mean", plus
    # the two derived tendencies. The tendencies are backward differences over
    # one 6-hourly step, so averaging four of them telescopes to exactly the
    # daily rate (TWP[T] - TWP[T-24h]) / 24h.
    - DLWRFsfc
    - DSWRFsfc
    - DSWRFtoa
    - GHTFLsfc
    - LHTFLsfc
    - PRATEsfc
    - SHTFLsfc
    - ULWRFsfc
    - ULWRFtoa
    - USWRFsfc
    - USWRFtoa
    - carbon_dioxide  # cell_methods is "time: mean" in the 2026-06-19 stores
    - downward_longwave_radiative_flux
    - eastward_surface_wind_stress
    - net_surface_longwave_radiative_flux
    - northward_surface_wind_stress
    - tendency_of_total_water_path
    - tendency_of_total_water_path_due_to_advection
    - total_frozen_precipitation_rate
    - total_precipitation_heat_flux
    - total_vapor_sensible_heat_flux
  constant_prefixes:
    # copied through unmodified; all are static in the 6-hourly store
    - HGTsfc
    - ak_
    - bk_
    - glac_fraction
    - lake_fraction
    - land_fraction
    - lat
    - lon
    - soil_fraction
