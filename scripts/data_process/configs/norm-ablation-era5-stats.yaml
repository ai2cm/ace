# Normalization statistics for the per-dataset normalization ablation,
# ERA5-only regime.
#
# The stores and time slices here mirror the train_loader of
# configs/experiments/2026-06-26-fm/base_configs/ace-train-config-4deg-AIMIP-nc-sfno-v2.yaml
# exactly, so the pooled stats are computed over precisely the data the model
# trains on. The six windows follow that config's split on the ERA5
# production-stream stitch boundaries; 1994 and 2014 are held out for
# validation.
#
# All the data is one source, so every grouping strategy collapses to the root
# pooled stats and no `groups` are defined: A1 == A2 == A3 here.
#
# Usage:
#   python get_pooled_stats.py submit configs/norm-ablation-era5-stats.yaml \
#     /climate-default/alexeyy/norm_ablation_0/era5 \
#     --name norm-ablation-era5
#
# The output directory must match the STATS_ROOT of
# configs/experiments/2026-06-26-fm/generate_norm_ablation_configs.py, which is
# what the generated training configs read.

dataset_pairs:
  - dataset: /climate-default/2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
    start_time: "1979-01-01"
    stop_time: "1986-03-31"
  - dataset: /climate-default/2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
    start_time: "1986-04-01"
    stop_time: "1993-07-31"
  - dataset: /climate-default/2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
    start_time: "1993-08-01"
    stop_time: "1993-12-31"
  - dataset: /climate-default/2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
    start_time: "1995-01-01"
    stop_time: "1999-12-31"
  - dataset: /climate-default/2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
    start_time: "2000-01-01"
    stop_time: "2009-12-31"
  - dataset: /climate-default/2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
    start_time: "2010-01-01"
    stop_time: "2013-12-31"
