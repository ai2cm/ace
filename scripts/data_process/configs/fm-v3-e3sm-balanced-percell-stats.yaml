# Per-grid-cell normalization stats for the FM v3 runs, over exactly the train
# concat of the fm-e3sm-balanced arm: a copy of fm-v2-e3sm-balanced-stats.yaml
# (same entries, time slices, renames, derived variables, scalings and groups)
# that reads every store from its weka copy, as the training configs do (the
# stats job runs on beaker, which has no GCS credentials). The entries, in
# order, equal train_loader.dataset.concat of
#   configs/experiments/2026-10-19-fm/run_configs/
#   ace-train-config-4deg-nc-sfno-v2-ext80-fm-e3sm-balanced-s0-maskoff.yaml
# with each data_path/file_pattern as the dataset. See
# fm-v2-e3sm-balanced-stats.yaml for notes on the CM4 and E3SM entries.
#
# Relative to v2:
# - per_grid_cell: every file holds a mean / std per grid cell (reduced over
#   time only), on the stores' lat/lon grid.
# - scalar_variables stay scalars, copied from the v2 stats (root from root,
#   groups/{name} from groups/{name}, e3sm from groups/e3sm-filled), so they are
#   exactly the v2 constants. These are the grouped normalization's pinned
#   variables. The v2 caveat that HGTsfc stats are not of the SHT-roundtripped
#   field (sht_roundtrip_variables on the cm4/xshield entries) is moot, as
#   HGTsfc is copied from v2 unchanged.
# - pooling: label_equal: the root stats give each of the five groups equal
#   total weight (timestep-weighted within a group), matching the training
#   sampler's label_sampling weights of 0.2 each. E3SM has no TMP850 or h500,
#   so those root stats pool the other four groups with weights 0.25 each.
#   Group stats are timestep-weighted within the group, as in v2.
# - group_placeholders: groups/e3sm gets per-cell mean 0 / std 1 for TMP850
#   and h500, which are masked for E3SM samples in training (inputs are zeroed
#   after normalization and the loss excludes masked targets), so the values
#   are never applied to real data; this replaces v2's groups/e3sm-filled.
per_grid_cell: true
scalar_variables:
- HGTsfc
- land_fraction
- ocean_fraction
- sea_ice_fraction
- global_mean_co2
scalar_reference:
  directory: /climate-default/alexeyy/norm_ablation_0/2026-11-09-fm-v2-e3sm-balanced
  groups:
    e3sm: e3sm-filled
pooling: label_equal
group_placeholders:
  e3sm:
  - TMP850
  - h500
