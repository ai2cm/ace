# Produces the daily 1deg ERA5 dataset by time-coarsening the existing 6-hourly
# zarr store by a factor of 4. Supersedes the 2026-07-24 daily store, which
# omitted the snow and soil-temperature fields.
#
# Run with (never pass --dataset):
#   ./compute_dataset.sh --time-coarsen --stats --config configs/era5-1deg-8layer-daily-1940-2025.yaml
#
# `runs` names the 6-hourly store because that is the coarsening input:
# get_stats.py builds its input zarr from data_output_directory + the run key.
runs:
  2026-03-19-era5-1deg-8layer-1940-2025: ""  # no real data source, config only for time coarsening and stats
data_output_directory: gs://vcm-ml-intermediate
stats:
  # Deliberately the 6-hourly stats location: those outputs already exist, and
  # get_stats.py and combine_stats.py both skip existing outputs, so only the
  # daily stats under time_coarsen are computed. Repointing this would silently
  # recompute the full native ERA5 stats.
  output_directory: gs://vcm-ml-intermediate/2026-03-19-era5-1deg-8layer-stats-1990-2019
  # No beaker_dataset: the 6-hourly stats dataset already exists and is uploaded
  # from era5-1deg-8layer-1940-2025.yaml. Naming it here would upload a second
  # copy under whoever runs this, so only the coarsened stats are published.
  start_date: "1990-01-01"
  end_date: "2019-12-31"
  data_type: ERA5
time_coarsen:
  chunking:
    time: 1
    latitude: 180
    longitude: 360
  sharding:
    time: 360
    latitude: 180
    longitude: 360
  factor: 4
  data_output_directory: gs://vcm-ml-intermediate/2026-08-07-era5-1deg-8layer-daily-1940-2025
  stats_output_directory: gs://vcm-ml-intermediate/2026-08-07-era5-1deg-8layer-daily-stats-1990-2019
  beaker_dataset: 2026-08-07-era5-1deg-8layer-daily-stats-1990-2019
  snapshot_names:
    - DPT2m
    - PRESsfc
    - Q10
    - Q200
    - Q2m
    - Q500
    - Q850
    - TMP10
    - TMP200
    - TMP2m
    - TMP500
    - TMP850
    - UGRD10
    - UGRD10m
    - UGRD200
    - UGRD500
    - UGRD850
    - VGRD10
    - VGRD10m
    - VGRD200
    - VGRD500
    - VGRD850
    - air_temperature_0
    - air_temperature_1
    - air_temperature_2
    - air_temperature_3
    - air_temperature_4
    - air_temperature_5
    - air_temperature_6
    - air_temperature_7
    - eastward_wind_0
    - eastward_wind_1
    - eastward_wind_2
    - eastward_wind_3
    - eastward_wind_4
    - eastward_wind_5
    - eastward_wind_6
    - eastward_wind_7
    - h10
    - h1000
    - h200
    - h250
    - h300
    - h500
    - h700
    - h850
