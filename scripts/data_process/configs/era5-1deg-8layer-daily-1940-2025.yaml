    - northward_wind_1
    - northward_wind_2
    - northward_wind_3
    - northward_wind_4
    - northward_wind_5
    - northward_wind_6
    - northward_wind_7
    - ocean_fraction
    - sea_ice_fraction
    - soil_moisture_0
    - soil_moisture_1
    - soil_moisture_2
    - soil_moisture_3
    - soil_temperature_0
    - soil_temperature_1
    - soil_temperature_2
    - soil_temperature_3
    - specific_total_water_0
    - specific_total_water_1
