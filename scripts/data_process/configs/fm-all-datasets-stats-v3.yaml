# Pooled normalization stats over every dataset in the train concat of
# configs/experiments/2026-10-19-fm/base_configs/
#   ace-train-config-4deg-nc-sfno-fm-a2-cond-era5-c96-piC-1pct-cm4-xshield.yaml
# with the same stores and time slices as training, grouped by each entry's label.
# Stores are the GCS copies of the weka training stores, except ERA5, which is
# read from weka because its GCS copy is stored under a different store name.
# The CM4 stores have no global_mean_co2 or ocean_fraction; as in the training
# config, each CM4 entry renames carbon_dioxide to global_mean_co2, derives
# ocean_fraction, and converts global_mean_co2 from ppmv to volume mixing ratio,
# so the pooled stats of both variables include CM4.
# v3 adds the daily E3SMv3 piControl store (group e3sm), which keeps E3SM
# variable names: its entry applies the same renames and unit conversions as
# the -e3sm training configs (PHIS geopotential to HGTsfc in m). Its
# surface_precipitation_rate is labeled m/s but is already in kg/m2/s (global
# mean ~3.4e-5, consistent with its latent heat flux), so it is not rescaled.
# It has no TMP850 or h500, so those stats exclude E3SM.
dataset_pairs:
  - dataset: gs://vcm-ml-intermediate/2026-01-28-vertically-resolved-c96-4deg-daily-shield-amip-ensemble-dataset/ic_0001.zarr
