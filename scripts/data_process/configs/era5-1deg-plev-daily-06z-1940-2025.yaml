# Daily-06Z ERA5 pressure-level dataset, coarsened from the same 6-hourly source
# as the era5-1deg-8layer daily dataset (2026-03-19-era5-1deg-8layer-1940-2025),
# so it is co-extensive and mutually consistent with the 8-layer daily core.
#
# Purpose: provide the pressure-level TARGET fields for the ACE2.2-ERA5 AIMIP
# pressure-level-decoder fine-tune. The 8-layer daily config keeps only a few
# pressure levels (200/500/850); this keeps the levels the source carries so the
# AIMIP EVALUATION_PRESSURE_LEVELS (1000/850/700/500/250/100/50 hPa) are available
# for ta/hus/ua/va. All pressure-level fields are instantaneous snapshots, so
# window_names is empty (requires the empty-window_names handling in time_coarsen.py).
#
# Run: time_coarsen.py then get_stats.py on this config (see the Makefile target
# era5_1deg_plev_daily_stats_beaker_dataset).
runs:
  2026-03-19-era5-1deg-8layer-1940-2025: ""
data_output_directory: gs://vcm-ml-intermediate
stats:
  output_directory: gs://vcm-ml-intermediate/2026-08-08-era5-1deg-plev-daily-06z-stats-1990-2019
  beaker_dataset: 2026-08-08-era5-1deg-plev-daily-06z-stats-1990-2019
  start_date: "1990-01-01"
  end_date: "2019-12-31"
  data_type: ERA5
time_coarsen:
  chunking:
    time: 1
    latitude: 180
    longitude: 360
  sharding:
    time: 360
    latitude: 180
    longitude: 360
  factor: 4
  data_output_directory: gs://vcm-ml-intermediate/2026-08-08-era5-1deg-plev-daily-06z-1940-2025
  stats_output_directory: gs://vcm-ml-intermediate/2026-08-08-era5-1deg-plev-daily-06z-stats-1990-2019
  snapshot_names:
    - TMP10
    - TMP50
    - TMP100
    - TMP200
    - TMP250
    - TMP500
    - TMP700
    - TMP850
    - TMP1000
    - Q10
    - Q50
    - Q100
    - Q200
    - Q250
    - Q500
    - Q700
    - Q850
    - Q1000
    - UGRD10
    - UGRD50
    - UGRD100
    - UGRD200
    - UGRD250
    - UGRD500
    - UGRD700
    - UGRD850
    - UGRD1000
    - VGRD10
    - VGRD50
    - VGRD100
    - VGRD200
    - VGRD250
    - VGRD500
    - VGRD700
    - VGRD850
    - VGRD1000
    - h10
    - h50
    - h100
    - h200
    - h250
    - h300
    - h500
    - h700
    - h850
    - h1000
  window_names: []
  constant_prefixes:
    - latitude
    - longitude
  input_time_slice:  # align coarsened snapshots with the 8-layer daily core grid
    start: "1940-01-02T06:00:00"
