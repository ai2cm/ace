# Pooled normalization stats over exactly the train concat of the fm-e3sm-balanced
# arm, generated from the run configs
#   configs/experiments/2026-10-19-fm/run_configs/
#   ace-train-config-4deg-nc-{sfno-v2,swin-v2.2-v2}-fm-e3sm-balanced-s{0,1,2}-maskoff.yaml
# (identical train_loader.dataset.concat in all six), with the same stores, time
# slices, renames, derived variables and scalings as training, grouped by each
# entry's label. Validation and inference datasets are not included.
# Relative to fm-all-datasets-stats-v3.yaml this adds the extra c96 members of
# create_fm_v2_jobs.py: AMIP ic_0002 (same two slices as ic_0001) and SOM
# {1,2,4}xCO2-ic_0002..0005 (except 1xCO2-ic_0005), 2031-01-02..2041-01-01.
# Stores are the GCS copies of the weka training stores, except ERA5, which is
# read from weka because its GCS copy is stored under a different store name.
# The CM4 stores have no global_mean_co2 or ocean_fraction; as in the training
# config, each CM4 entry renames carbon_dioxide to global_mean_co2, derives
# ocean_fraction, and converts global_mean_co2 from ppmv to volume mixing ratio,
# so the pooled stats of both variables include CM4.
# Training also sets `sht_roundtrip_variables: [HGTsfc]` on the cm4 and xshield
# entries; get_pooled_stats.py has no such option, so HGTsfc stats here are of
# the stored (not SHT-roundtripped) field.
# The daily E3SMv3 piControl store (group e3sm) keeps E3SM variable names: its
# entry applies the same renames and unit conversions as the -e3sm training
# configs (PHIS geopotential to HGTsfc in m). Its surface_precipitation_rate is
# labeled m/s but is already in kg/m2/s (global mean ~3.4e-5, consistent with
# its latent heat flux), so it is not rescaled. It has no TMP850 or h500, so
# those stats exclude E3SM; training reads the e3sm group from
# groups/e3sm-filled, built afterwards by fill_e3sm_group_stats.py.
