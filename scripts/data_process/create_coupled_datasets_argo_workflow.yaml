apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: create-coupled-datasets-
spec:
  entrypoint: create-coupled-datasets
  volumes:
    - name: gcp-key-secret
      secret:
        defaultMode: 420
        secretName: gcp-key
  arguments:
    parameters:
    # one parameter per module in create_coupled_datasets.py's transitive
    # sibling-import closure; each is written to <module>.py in the container
    - name: create_coupled_datasets_script
    - name: coupled_dataset_utils_script
    - name: create_window_avg_dataset_script
    - name: time_utils_script
    - name: get_stats_script
    - name: merge_stats_script
    - name: combine_stats_script
    - name: writer_utils_script
    - name: fs_utils_script
    - name: config
    - name: image
      value: "us-central1-docker.pkg.dev/vcm-ml/full-model/coupled-processing:v2026.09.0"
    - name: debug
      value: "false"  # default value, can be overridden
    - name: subsample
      value: "false"  # default value, can be overridden
  templates:
    - name: create-coupled-datasets
      tolerations:
        - effect: NoSchedule
          key: dedicated
          value: highmem-sim-pool
      container:
        image: "{{workflow.parameters.image}}"
        resources:
          limits:
            cpu: "30000m"
            memory: "230Gi"
          requests:
            cpu: "30000m"
            memory: "230Gi"
        command: ["bash", "-c", "-e"]
        args:
          - |
            cat << 'EOF' > create_coupled_datasets.py
            {{workflow.parameters.create_coupled_datasets_script}}
            EOF

            cat << 'EOF' > coupled_dataset_utils.py
            {{workflow.parameters.coupled_dataset_utils_script}}
            EOF

            cat << 'EOF' > create_window_avg_dataset.py
            {{workflow.parameters.create_window_avg_dataset_script}}
            EOF

            cat << 'EOF' > time_utils.py
            {{workflow.parameters.time_utils_script}}
            EOF

            cat << 'EOF' > get_stats.py
            {{workflow.parameters.get_stats_script}}
            EOF

            cat << 'EOF' > merge_stats.py
            {{workflow.parameters.merge_stats_script}}
            EOF

            cat << 'EOF' > combine_stats.py
            {{workflow.parameters.combine_stats_script}}
            EOF

            cat << 'EOF' > writer_utils.py
            {{workflow.parameters.writer_utils_script}}
            EOF

            cat << 'EOF' > fs_utils.py
            {{workflow.parameters.fs_utils_script}}
            EOF

            cat << 'EOF' > config.yaml
            {{workflow.parameters.config}}
            EOF

            flags=()
            if [ "{{workflow.parameters.debug}}" = "true" ]; then
              flags+=(--debug)
            fi
            if [ "{{workflow.parameters.subsample}}" = "true" ]; then
              flags+=(--subsample)
            fi

            python -u create_coupled_datasets.py --yaml config.yaml "${flags[@]}"
        env:
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: /secret/gcp-credentials/key.json
          - name: CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
            value: /secret/gcp-credentials/key.json
        volumeMounts:
          - mountPath: /secret/gcp-credentials
            name: gcp-key-secret
