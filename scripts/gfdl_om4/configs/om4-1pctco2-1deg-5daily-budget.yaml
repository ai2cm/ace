# 5-daily 1-degree sea-ice budget companion to the 2026-07-15 CM4 1pctCO2
# ocean store: only the SIS2 surface fluxes and ice/snow transport the
# extensive sea-ice heat budget needs and that store lacks. Same wetmask,
# weights, and time axis, so the two stores merge by time.
target_grid: F90
weights_url: gs://vcm-ml-intermediate/2026-07-15-gfdl-om4-pipeline-inputs/regridding-weights/om4-tripolar-0.25deg-to-F90
expected_level_count: 19
shift_timestamps_to_avg_interval_midpoint: false
output:
  path: gs://vcm-ml-intermediate/2026-10-06-om4-1pctco2-1deg-ocean-5daily-budget.zarr
  time_chunk_size: 1
  time_shard_size: 365
wetmask:
  store: gs://vcm-ml-raw-flexible-retention/2026-06-19-CM4-ocean-and-sea-ice-piControl-and-1pctCO2/zarrs/1pctCO2/ocean_1daily_snap_subset_to_5daily_snap.zarr
  variable: thetao
statics:
  store: gs://vcm-ml-raw-flexible-retention/2026-06-19-CM4-ocean-and-sea-ice-piControl-and-1pctCO2/zarrs/1pctCO2/ocean_static.zarr
  variables: []
streams:
  # Means of the 20 six-hourly means ending at each 5-daily snapshot
  # instant (the window of the 5-daily ocean fluxes), per total cell area.
  - name: ice_flux_mean
    store: gs://vcm-ml-raw-flexible-retention/2026-06-19-CM4-ocean-and-sea-ice-piControl-and-1pctCO2/zarrs/1pctCO2/ice_6hourly.zarr
    variables: [SNOWFL, SW, LW, LH, SH]
    dim_renaming:
      xT: xh
      yT: yh
    time_block_mean: 20
    full_cell_variables: [SNOWFL, SW, LW, LH, SH]
    full_cell_only: true
    renaming:
      SNOWFL: SNOWFL_total_area
      SW: SW_total_area
      LW: LW_total_area
      LH: LH_total_area
      SH: SH_total_area
  - name: ice_transport_mean
    store: gs://vcm-ml-raw-flexible-retention/2026-06-19-CM4-ocean-and-sea-ice-piControl-and-1pctCO2/zarrs/1pctCO2/ice_tendencies_and_TSN_6hourly.zarr
    variables: [XPRTi, XPRTs]
    dim_renaming:
      xT: xh
      yT: yh
    time_block_mean: 20
    full_cell_variables: [XPRTi, XPRTs]
    full_cell_only: true
    renaming:
      XPRTi: XPRTi_total_area
      XPRTs: XPRTs_total_area
