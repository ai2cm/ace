# Environment of pipeline/raw_ingest.py on Beaker (gantry --python-manager conda).
name: ufs-replay-raw-ingest
channels:
  - conda-forge
dependencies:
  - python=3.11
  - esmpy
  - xesmf>=0.8
  - h5netcdf
  - h5py
  - s3fs
  - cf_xarray
  - pip
  - pip:
    - apache_beam[gcp]==2.71.0
    - cftime
    - dask
    - gcsfs
    - numpy
    - obstore
    - scipy
    - xarray==2026.2.0
    - xarray_beam==0.11.5
    - zarr==3.1.5
