experiment_dir: /results
n_coupled_steps: 72
coupled_steps_in_memory: 8
n_ensemble_per_ic: 8
checkpoint_path: /ckpt.tar
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudra-coupled-cm4
  entity: ai2cm
initial_condition:
  ocean:
    path: /ic/ocean_ic_2026-02-01.nc
    engine: netcdf4
  atmosphere:
    path: /ic/atmos_ic_2026-02-01.nc
    engine: netcdf4
forcing_loader:
  num_data_workers: 1
  atmosphere:
    dataset:
      data_path: /ic
      file_pattern: atmos_forcing_2026-02-01.zarr
      engine: zarr
  ocean:
    dataset:
      data_path: /ic
      file_pattern: ocean_forcing_2026-02-01.zarr
      engine: zarr
data_writer:
  atmosphere:
    save_prediction_files: false
    save_monthly_files: false
  ocean:
    names:
    - sst
    - thetao_0
    - thetao_5
    - ocean_sea_ice_fraction
    save_prediction_files: true
    save_monthly_files: true
aggregator:
  log_global_mean_time_series: true
